<style>
/* The client's workspace, laid out as app.trulyplaced.com is: the sidebar in the app's light grey, a white page, white cards with
   a hairline and a soft shadow, figures in near-black, TrulyPlaced blue for progress and where you are. */
:root{--side:252px}
html,body{height:100%}
body{background:#fff}
.ws{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh;   /* the sidebar's column runs the full height of the page */
  background:linear-gradient(90deg,#fafafa 0,#fafafa calc(var(--side) - 1px),#ececec calc(var(--side) - 1px),#ececec var(--side),transparent var(--side))}
.sb{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:16px 12px 14px}
.sb .brand{padding:6px 10px 22px;font-size:17px}
.sb .brand svg{width:30px;height:30px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;min-height:40px;padding:0 12px;border-radius:8px;color:#525252;text-decoration:none;font-weight:400;font-size:15px;transition:background-color .15s,color .15s}
.nav a svg{width:18px;height:18px;flex:none}
.nav a:hover{background:rgba(0,0,0,.03);color:#171717}
.nav a.on{background:rgba(0,0,0,.06);color:#171717;font-weight:500}
.nav a.on svg{color:var(--blue)}
.nav a em{margin-left:auto;font-style:normal;font-size:12px;font-weight:500;line-height:20px;color:#fff;background:#171717;border-radius:999px;padding:0 7px}
.sb .grow{flex:1}
.plancard{border:1px solid var(--edge);border-radius:14px;padding:14px;margin-bottom:10px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.plancard .pn{display:flex;align-items:center;justify-content:space-between;gap:8px}
.plancard b{font-size:14px;font-weight:600;color:var(--ink)}
.plancard .lab{display:block;font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.plancard .prog{margin:10px 0 6px;height:4px}
.plancard small{font-size:12px;color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;border-radius:999px;padding:2px 9px;background:#ecfdf5;color:#047857}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:#10b981}
.tag.paused{background:#fffbeb;color:#b45309}.tag.paused::before{background:#f59e0b}
.tag.done{background:#f0f9ff;color:#0369a1}.tag.done::before{background:#0ea5e9}
.tag.archived{background:#f5f5f5;color:#737373}.tag.archived::before{background:#d4d4d4}
.sb-foot a,.sb-foot button{display:flex;align-items:center;gap:10px;width:100%;min-height:38px;padding:0 12px;color:#525252;text-decoration:none;font-size:14px;border-radius:8px;border:0;background:none;text-align:left;transition:background-color .15s,color .15s}
.sb-foot a:hover,.sb-foot button:hover{background:rgba(0,0,0,.03);color:#171717}
.sb-foot svg{width:18px;height:18px;flex:none}

.content{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;height:64px;background:rgba(255,255,255,.97);   /* no backdrop blur: a blurred sticky bar is re-rendered on every scroll frame */
  border-bottom:1px solid rgba(0,0,0,.06);display:flex;align-items:center;gap:12px;padding:0 28px}
.top h1{font-family:var(--ui-d);font-weight:600;font-size:17px;letter-spacing:-.015em;color:var(--ink);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .m-brand{display:none}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.who .nm{text-align:right;line-height:1.3;font-size:12.5px;color:var(--muted);min-width:0}
.who .nm b{display:block;color:var(--ink);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
.who .av{text-decoration:none}
.view{width:100%;max-width:1120px;margin:0 auto;padding:26px 28px 64px}
.hint{font-size:13px;color:var(--muted)}

/* ---------- My applications ---------- */
.greet{display:flex;align-items:flex-end;justify-content:space-between;gap:14px 20px;flex-wrap:wrap;margin-bottom:18px}
.greet h2{font-size:24px;font-weight:650;letter-spacing:-.022em}
.greet p{color:#525252;font-size:14px;margin-top:4px;max-width:60ch}
.badges{display:flex;gap:8px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:7px;min-height:32px;padding:0 13px;border-radius:999px;font-size:12.5px;font-weight:500;border:1px solid #e0e0e0;background:#fff;color:var(--ink)}
.badge svg{width:15px;height:15px;color:var(--blue)}
/* the progress: a white card - the count in near-black, a thin blue bar, and the app's ring */
.hero{position:relative;overflow:hidden;border-radius:20px;padding:26px 28px;color:var(--ink);display:flex;align-items:center;gap:28px;
  background:#fff;border:1px solid var(--edge);box-shadow:var(--sh-card)}
.hero>div:first-child{flex:1;min-width:0}
.hero .eyebrow{font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hero .big{font-family:var(--ui-d);font-weight:650;line-height:1.05;margin-top:8px;letter-spacing:-.03em}
.hero .big b{font-size:clamp(40px,5.6vw,56px);font-weight:650;font-variant-numeric:tabular-nums}
.hero .big span{font-size:clamp(15px,1.8vw,18px);font-weight:500;letter-spacing:-.01em;color:var(--muted)}
.hbar{height:6px;border-radius:99px;background:rgba(0,0,0,.06);overflow:hidden;margin-top:18px}
.hbar i{display:block;height:100%;border-radius:99px;background:var(--blue);transition:width .6s}
.hfoot{display:flex;gap:6px 18px;flex-wrap:wrap;margin-top:10px;font-size:13.5px;color:#525252}
.hfoot span+span::before{content:"·";margin-right:18px;color:var(--faint,#a3a3a3)}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--blue) calc(var(--p) * 1%),rgba(0,0,0,.06) 0);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 8px),#000 calc(100% - 7px));mask:radial-gradient(farthest-side,transparent calc(100% - 8px),#000 calc(100% - 7px))}
.ring span{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-size:12px;line-height:1.25;color:var(--muted)}
.ring b{display:block;font-family:var(--ui-d);font-size:28px;font-weight:650;letter-spacing:-.02em;color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:14px}
.kpi{background:#fff;border:1px solid var(--edge);border-radius:16px;padding:16px 18px;box-shadow:var(--sh-card)}
.kpi .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--bg);color:#525252;margin-bottom:12px}
.kpi .ic svg{width:17px;height:17px}
.kpi b{display:block;font-family:var(--ui-d);font-size:28px;font-weight:650;letter-spacing:-.02em;color:var(--ink);line-height:1.1;font-variant-numeric:tabular-nums}
.kpi>span:last-child{font-size:13px;color:var(--muted)}
.kskel{display:inline-block;width:46px;height:24px;border-radius:7px;background:linear-gradient(90deg,#ececee 0%,#f6f6f7 50%,#ececee 100%);background-size:200% 100%;animation:sk 1.2s linear infinite;vertical-align:middle}
.duo{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:14px;margin-top:14px}
.panel{background:#fff;border:1px solid var(--edge);border-radius:16px;padding:20px 22px;box-shadow:var(--sh-card)}
.panel h3{font-size:15px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.panel h3 small{font-family:var(--ui);font-weight:400;font-size:12.5px;letter-spacing:0;color:var(--muted)}
.chart{display:flex;align-items:stretch;gap:10px;height:168px;margin-top:16px}
.chart .b{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.chart .col{flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px}
.chart .n{font-size:11.5px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.chart .bar{width:100%;max-width:40px;border-radius:6px 6px 3px 3px;background:#dfe6fd;min-height:3px;transition:height .5s}
.chart .b.now .bar{background:var(--blue)}
.chart .b.now .n{color:var(--blue)}
.chart .l{font-size:11px;color:var(--muted);white-space:nowrap}
.chart .bar.sk{background:linear-gradient(90deg,#ececee 0%,#f6f6f7 50%,#ececee 100%);background-size:200% 100%;animation:sk 1.2s linear infinite}
.mix{display:flex;height:10px;border-radius:99px;overflow:hidden;background:rgba(0,0,0,.06);margin:16px 0 10px;gap:2px}
.mix i{display:block;height:100%}
.leg{display:grid;gap:2px}
.leg button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px 10px;border-radius:10px;font-size:13.5px;color:var(--ink);text-align:left;transition:background-color .15s}
.leg button:hover{background:rgba(0,0,0,.03)}
.leg button.on{background:rgba(0,0,0,.06)}
.leg .dot{width:8px;height:8px;border-radius:50%;flex:none}
.leg .c{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}
.leg .pc{width:42px;text-align:right;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.listhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:32px 0 0}
.listhead h2{font-size:18px;font-weight:650}
.listhead .ct{font-size:13px;color:var(--muted)}
.li .side .when{font-size:12.5px;color:var(--muted)}
.tl{list-style:none;display:grid;gap:14px;margin:16px 0 18px}
.tl li{display:flex;gap:14px;align-items:flex-start}
.tl .n{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:600;font-size:13px;background:var(--bg);color:var(--ink)}
.tl b{display:block;color:var(--ink);font-size:14.5px}
.tl p{font-size:13.5px;color:var(--muted);margin-top:1px}

/* ---------- one application ---------- */
.ahead{display:flex;gap:14px;align-items:flex-start}
.ahead h1{font-size:21px}
.ahead .m{font-size:13.5px;color:var(--muted);margin-top:3px}
.sent{display:flex;align-items:flex-start;gap:8px;margin:10px 0 0 48px;font-size:13px;line-height:1.45;color:var(--ok);font-weight:600}
.sent svg{width:15px;height:15px;flex:none;margin-top:1px}
.qa-ro{padding:10px 0;border-top:1px solid var(--line)}
.card h3 + .qa-ro{border-top:0}
.qa-ro b{display:block;font-size:13px;color:var(--ink)}
.qa-ro div{font-size:14px;white-space:pre-wrap}

/* ---------- settings ---------- */
.sgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.sgrid .wide{grid-column:1/-1}
.sgrid .panel p{font-size:13.5px}
.kv{display:grid;grid-template-columns:190px 1fr;gap:9px 16px;font-size:14px;margin-top:12px}
.kv dt{color:var(--muted)}
.kv dd{color:var(--ink);white-space:pre-wrap;min-width:0;overflow-wrap:anywhere}
.planbig{display:flex;align-items:center;gap:14px;margin-top:12px}
.planbig .pi{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--bg);color:var(--blue);flex:none}
.planbig .pi svg{width:21px;height:21px}
.planbig b{display:block;font-family:var(--ui-d);font-size:18px;font-weight:650;letter-spacing:-.02em;color:var(--ink)}
.planbig span{font-size:13px;color:var(--muted)}
.bonus{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13px}
.bonus b{color:var(--blue);font-weight:650;margin-right:6px}
.bonus small{color:var(--muted);margin-left:6px}
.pwf{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end;margin-top:14px}
.pwf .err{grid-column:1/-1}
.seeall{display:flex;justify-content:center;margin-top:18px}
.greet .ct{font-size:13px;color:var(--muted);align-self:flex-end}

/* ---------- Resume: the page in a frame on the left (in view while the right scrolls), how it's doing, its versions and the
   requests on the right; on a phone: how it's doing, the page, the versions, the requests ---------- */
.rgrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);grid-template-areas:"view sum" "view vers" "view req" "view .";grid-template-rows:auto auto auto 1fr;gap:14px;align-items:start}
.rview{grid-area:view;position:sticky;top:80px;display:flex;flex-direction:column;height:calc(100vh - 100px);min-height:560px;overflow:hidden;background:#fff;border:1px solid var(--edge);border-radius:16px;box-shadow:var(--sh-card)}
.rvhead{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.rvhead b{font-size:15px;font-weight:600;color:var(--ink)}
.rvhead .st{margin-left:6px;vertical-align:1px}
.rvhead small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.rframe{flex:1;min-height:0;background:var(--bg)}
.rframe iframe{display:block;width:100%;height:100%;border:0}
.rsum{grid-area:sum}.rvers{grid-area:vers}.rreq{grid-area:req}
.rstats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.rstats div{background:var(--bg);border-radius:12px;padding:12px 14px}
.rstats b{display:block;font-family:var(--ui-d);font-size:26px;font-weight:650;letter-spacing:-.02em;color:var(--ink);line-height:1.1;font-variant-numeric:tabular-nums}
.rstats span{font-size:12.5px;color:var(--muted)}
.rask{margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.rask b{display:block;font-size:14.5px;color:var(--ink)}
.rask p{font-size:13.5px;color:#525252;margin:3px 0 12px}
.rask small{display:block;text-align:center;font-size:12.5px;color:#b45309;margin-top:8px}
.vers{list-style:none;display:grid;gap:6px;margin-top:10px}
.vers button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;text-align:left;font:inherit;cursor:pointer;transition:border-color .15s,background-color .15s}
.vers button:hover{border-color:#cdcdcd}
.vers button.on{border-color:#171717;background:#fafafa}
.vers .vn{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--bg);font-size:12px;font-weight:600;color:var(--ink)}
.vers .vt{flex:1;min-width:0}
.vers .vt b{display:block;font-size:14px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vers .vt small{display:block;font-size:12px;color:var(--muted)}
.rql{list-style:none;display:grid;gap:10px;margin-top:10px}
.rql li{padding:12px 14px;border:1px solid var(--line);border-radius:12px}
.rqh{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.rqh b{font-size:14px;color:var(--ink)}
.rql p{font-size:13.5px;color:var(--body);margin-top:4px;white-space:pre-wrap;overflow-wrap:anywhere}
.rql small{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.rqr{margin-top:8px;padding:10px 12px;border-radius:10px;background:#ecfdf5;color:#065f46;font-size:13.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.rqr b{display:block;font-size:12px;font-weight:600;margin-bottom:2px}
.kinds{display:grid;gap:8px;margin-top:14px}
.kinds label{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid #e0e0e0;border-radius:12px;cursor:pointer;transition:border-color .15s,background-color .15s}
.kinds label:hover{border-color:#cdcdcd}
.kinds label:has(input:checked){border-color:#171717;background:#fafafa}
.kinds input{margin-top:3px;accent-color:#171717;flex:none}
.kinds b{display:block;font-size:14px;color:var(--ink);font-weight:600}
.kinds small{display:block;font-size:12.5px;color:var(--muted)}

/* ---------- Profile: the details the team applies with, a quick pick or a suggested answer where it helps ---------- */
.pfwrap{display:grid;gap:14px;max-width:880px}
.pfwrap .panel h3{display:block}
.pfwrap .hint{margin:3px 0 14px}
.pfgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.pfgrid .wide{grid-column:1/-1}
.pfgrid .field small{margin-top:-2px}
.qa{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) auto;gap:8px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}
.qa:first-child{border-top:0}
.qa .inp{min-height:42px}
.qa textarea.inp{padding:10px 12px;min-height:42px;resize:vertical}
.xb{width:36px;height:42px;border:0;border-radius:999px;background:none;display:grid;place-items:center;color:var(--muted);cursor:pointer}
.xb:hover{background:rgba(0,0,0,.05);color:#b91c1c}
.xb svg{width:16px;height:16px}
.picks.common{margin-top:12px}
.savebar{position:sticky;bottom:16px;z-index:10;display:flex;align-items:center;gap:12px;padding:10px 12px 10px 18px;background:rgba(255,255,255,.96);
  border:1px solid var(--edge);border-radius:16px;box-shadow:var(--sh-float)}
.savebar span{flex:1;font-size:13px;color:var(--muted)}
.savebar span.dirty{color:#b45309;font-weight:500}
.savebar span:empty::before{content:"Changes here are saved with Save changes";color:#a3a3a3}
.twa{display:none}

/* ---------- phone ---------- */
.tabbar{display:none}
@media (max-width:900px){
  .twa{display:grid;place-items:center;width:40px;height:40px;border-radius:999px;color:#525252;text-decoration:none}
  .twa:hover{background:rgba(0,0,0,.05);color:#171717}
  .twa svg{width:21px;height:21px}
  .rgrid{grid-template-columns:minmax(0,1fr);grid-template-areas:"sum" "view" "vers" "req";grid-template-rows:none}
  .rview{position:static;height:72vh;min-height:440px}
  .savebar{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
  .ws{display:block;background:none}
  .sb{display:none}
  .top{padding:0 16px;height:58px}
  .top .m-brand{display:flex}
  .top .m-brand svg{width:28px;height:28px}
  .top h1{display:none}
  .top .grow{flex:1}
  .who .nm{display:none}
  .view{padding:18px 16px calc(92px + env(safe-area-inset-bottom,0px))}
  .greet h2{font-size:21px}
  .hero{padding:20px;border-radius:20px;gap:16px}
  .ring{width:96px;height:96px}
  .ring b{font-size:21px}
  .ring span{font-size:11px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi{padding:14px}
  .kpi b{font-size:23px}
  .duo,.sgrid{grid-template-columns:minmax(0,1fr)}
  .chart{gap:6px}
  .chart .l{white-space:normal;text-align:center;line-height:1.15;font-size:10.5px}   /* "14 Sept" on two lines, so 8 weeks fit */
  .kv{grid-template-columns:1fr;gap:2px}
  .kv dd{margin-bottom:8px}
  .pwf{grid-template-columns:1fr}
  .sent{margin-left:0}
  .tools .seg{flex-wrap:nowrap;overflow-x:auto;max-width:100%;scrollbar-width:none}   /* the five filters stay on one line */
  .tools .seg::-webkit-scrollbar{display:none}
  .tools .seg button{flex:none;padding:0 11px}
  .li .side .when{display:none}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.97);
    border-top:1px solid rgba(0,0,0,.06);box-shadow:0 -1px 12px rgba(0,0,0,.04);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}

<script>
(function(){

var SV = 'viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"';
var IC = {

};
// what a client can ask the team about their resume (sql/supabase-client-workspace.sql)
var KINDS = [['no_interviews', 'I’m not getting interviews', 'Applications are going out, but no calls back'], ['wrong', 'Something on it is wrong', 'A date, a title, a detail that isn’t right'],
  ['change', 'I’d like something changed', 'Something to add, take out or say differently'], ['other', 'Something else', 'Anything else about your resume']];
var KLABEL = {no_interviews:'Not getting interviews', wrong:'Something on it is wrong', change:'A change to make', other:'Something else'};   // as the history says it
var STS = [['applied', 'Applied', '#10b981'], ['interview', 'Interview', '#0ea5e9'], ['offer', 'Offer', '#047857'], ['rejected', 'Not selected', '#d4d4d4'], ['closed', 'Closed', '#e5e5e5']];   // the status pills' own dots
var FILTERS = [['all', 'All'], ['applied', 'Applied'], ['interview', 'Interview'], ['offer', 'Offer'], ['rejected', 'Not selected']];

$('#sideFoot').innerHTML = '<a href="' + esc(WA) + '" target="_blank" rel="noopener">' + I.wa + 'WhatsApp your team</a><a href="mailto:' + esc(MAIL) + '">' + I.mail + 'Support</a>' +
  '<button type="button" data-act="out">' + I.out + 'Sign out</button>';
$('#twa').href = WA; $('#twa').innerHTML = I.wa;   // a phone: WhatsApp in the top bar (the tab bar holds the five sections)

TP.client().then(function(c){ SB = c; return TP.session(); }).then(function(s){
  if(!s){ TP.toLogin(); return; }
  var md = s.user.user_metadata || {};
  ME = {id:s.user.id, email:String(s.user.email || '').toLowerCase(), name:md.full_name || md.name || ''};
  who();
  return Promise.all([q(SB.from('clients').select('*').eq('id', ME.id).maybeSingle()), q(SB.from('client_progress').select('*').eq('client_id', ME.id).maybeSingle())]).then(function(rs){
    CL = rs[0]; PROG = rs[1] || {};
    if(!CL) return notClient();
    who(); render(); loadStats();
  });
}).catch(function(e){ V.innerHTML = '<div class="note bad">' + esc(TP.errText(e)) + ' <a href="/login.html">Sign in again</a></div>'; });

function notClient(){
  // this browser remembered them as a client (the job board sends clients here): forget that, so the job board opens again
  var a = TP.lsGet('tp_acct', null); if(a && a.id === ME.id && a.portal && a.portal.client){ a.portal.client = false; TP.lsSet('tp_acct', a); }
  $('#nav').innerHTML = ''; $('#tabbar').innerHTML = '';
  TP.whoami().catch(function(){ return {}; }).then(function(w){
    V.innerHTML = '<div class="empty">' + I.lock + '<h3>This page is for TrulyPlaced clients</h3><p>You’re signed in as <b>' + esc(ME.email) + '</b>, which isn’t a client account yet. ' +
      'If you’ve just joined, use the email you gave us — or message us and we’ll sort it out.</p><div class="row" style="justify-content:center">' +
      (w.team ? '<a class="btn pri" href="/team.html">Open the team portal</a>' : '<a class="btn pri" href="/#pricing">See plans</a><a class="btn" href="/app.html">Free job board</a>') +
      '<button class="btn" type="button" data-act="out">Sign out</button></div></div>';
  });
}

/* ---------- where we are ---------- */
// the sections: Dashboard (anything else), Applications and one application, Resume, Profile, Settings
var PAGES = {'#applications':'apps', '#resume':'resume', '#profile':'profile', '#settings':'settings'};
function view(){ return /^#app=[0-9a-f-]{36}$/i.test(location.hash) ? 'app' : PAGES[location.hash] || 'home'; }
function appId(){ var m = /^#app=([0-9a-f-]{36})$/i.exec(location.hash); return m ? m[1].toLowerCase() : null; }
function go(h){
  // leaving the Profile with changes not saved: ask first
  if(view() === 'profile' && pfDirty()) return TP.confirmBox('Leave without saving?', 'Your changes on this page aren’t saved yet.', 'Leave without saving', true, {cancel:'Keep editing'}).then(function(ok){ if(ok){ PFOFF = true; go(h); PFOFF = false; } });
  history.pushState(null, '', location.pathname + (h === '#' ? '' : h)); render(); window.scrollTo(0, 0);
}
window.addEventListener('popstate', function(){ if(CL) render(); });
document.addEventListener('click', function(e){
  var a = e.target.closest && e.target.closest('a[data-go]');
  if(!a || !CL || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
  e.preventDefault(); var h = a.getAttribute('href'); go(h.indexOf('#') > -1 ? h.slice(h.indexOf('#')) : '');
});
function render(){
  chrome();
  var v = view();
  if(v === 'app') return vApp(appId());
  if(v === 'apps') return vApps();
  if(v === 'resume') return vResume();
  if(v === 'profile') return vProfile();
  if(v === 'settings') return vSettings();
  vHome();
}
var TITLES = {home:'Dashboard', apps:'Applications', app:'Application', resume:'Your resume', profile:'Profile', settings:'Settings'};
function planName(){ var t = (CL && (CL.plan_package || CL.plan_total)) || 0; return PLAN[t] || (t ? 'Custom plan' : 'Your plan'); }   // named by the package; a bonus comes on top
// extra applications the owners added on top of the package (a referral bonus, say): plan_total = package + extras
function bonus(){ var ex = CL ? (CL.plan_total || 0) - (CL.plan_package || 0) : 0; return CL && CL.plan_package && ex > 0 ? ex : 0; }
function planLine(){ var tot = CL.plan_total || 0, ex = bonus(); return tot ? (ex ? (tot - ex).toLocaleString() + ' + ' + ex.toLocaleString() + ' bonus applications' : tot.toLocaleString() + ' applications') : ''; }
function statusTag(){ var s = (CL && CL.status) || 'active'; return '<span class="tag ' + esc(s) + '">' + ({active:'Active', paused:'Paused', done:'Complete', archived:'Closed'}[s] || esc(s)) + '</span>'; }
function chrome(){   // the sidebar, the phone tab bar, the page title and the plan card
  var v = view(), cur = v === 'app' ? 'apps' : v;
  var items = [['home', 'Dashboard', IC.dash, '#'], ['apps', 'Applications', IC.apps, '#applications'], ['resume', 'Resume', IC.res, '#resume'], ['profile', 'Profile', IC.user, '#profile'], ['settings', 'Settings', IC.set, '#settings']];
  var link = function(n, tab){ return '<a href="' + n[3] + '" data-go class="' + (cur === n[0] ? 'on' : '') + '"' + (cur === n[0] ? ' aria-current="page"' : '') + '>' + n[2] + '<span>' + n[1] + '</span>' +
    (!tab && n[0] === 'apps' && PROG && PROG.done ? '<em>' + PROG.done.toLocaleString() + '</em>' : '') + '</a>'; };
  $('#nav').innerHTML = items.map(function(n){ return link(n); }).join('');
  $('#tabbar').innerHTML = items.map(function(n){ return link(n, true); }).join('');
  $('#pageTitle').textContent = TITLES[v] || 'Dashboard';
  var done = PROG.done || 0, tot = CL.plan_total || 0, pct = tot ? Math.min(100, Math.round(done / tot * 100)) : 0, pc = $('#planCard');
  pc.hidden = false;

    (tot ? '<div class="prog"><i style="width:' + pct + '%"></i></div><small>' + done.toLocaleString() + ' of ' + tot.toLocaleString() + ' applications sent' + (bonus() ? ' · ' + bonus().toLocaleString() + ' bonus included' : '') + '</small>' : '<small>Your plan details are on the way.</small>');
}
function who(){
  var name = (CL && CL.full_name) || ME.name || '';
  $('#who').innerHTML = '<div class="nm"><b>' + esc(name || ME.email) + '</b>' + (name ? esc(ME.email) : '') + '</div>' +
    '<a class="av" href="#profile" data-go title="Your profile" aria-label="Your profile">' + esc(TP.initials(name, ME.email)) + '</a>';
}

/* ---------- Dashboard: the progress, the figures and the two charts ---------- */
function vHome(){
  document.title = 'Dashboard | TrulyPlaced';
  var done = PROG.done || 0, tot = CL.plan_total || 0, pct = tot ? Math.min(100, Math.round(done / tot * 100)) : 0, first = String(CL.full_name || '').split(' ')[0];

    : CL.status === 'paused' ? 'Your plan is paused — message us when you’d like us to start again.'
    : (CL.status === 'done' || (tot && done >= tot)) ? 'Your plan is complete. Thank you for trusting us with your search.'

  V.innerHTML =
    '<div class="greet"><div><h2>' + hello + (first ? ', ' + esc(first) : '') + '</h2><p>' + line + '</p></div>' +
      '<div class="badges"><span class="badge">' + IC.plan + esc(planName()) + (tot ? ' · ' + planLine() : '') + '</span></div></div>' +
    '<section class="hero" aria-label="Your progress"><div>' +
      '<div class="eyebrow">Your progress</div>' +
      '<div class="big"><b>' + done.toLocaleString() + '</b> <span>' + (tot ? 'of ' + tot.toLocaleString() + ' applications sent' : 'applications sent') + '</span></div>' +
      (tot ? '<div class="hbar"><i style="width:' + pct + '%"></i></div><div class="hfoot"><span>' + (done >= tot ? 'Plan complete' : (tot - done).toLocaleString() + ' to go') + '</span>' +

    '</div>' + (tot ? '<div class="ring" style="--p:' + pct + '" aria-hidden="true"><span><b>' + pct + '%</b>complete</span></div>' : '') + '</section>' +
    '<div class="kpis" id="kpis">' + kpisHTML() + '</div>' +
    (done ? '<div class="duo"><section class="panel"><h3>Applications per week <small>last 8 weeks</small></h3><div id="wk">' + weeksHTML() + '</div></section>' +
        '<section class="panel"><h3>Where they stand <small>' + done.toLocaleString() + ' sent</small></h3><div id="mix">' + mixHTML() + '</div></section></div>' +
      '<div class="seeall"><a class="btn" href="#applications" data-go>See all ' + done.toLocaleString() + ' application' + (done === 1 ? '' : 's') + I.chev + '</a></div>'
     : onboardingHTML());
}

/* ---------- Applications: every one sent, newest first, with search and the status filters ---------- */
function vApps(){
  document.title = 'Applications | TrulyPlaced';
  var done = PROG.done || 0;
  V.innerHTML = '<div class="greet" id="listTop"><div><h2>Applications</h2><p>' + (done ? 'Everything we’ve sent for you, newest first. Open one to see the job, your resume as sent and the company’s confirmation.' : 'Your first applications are on the way — each appears here the moment it’s sent.') +
      '</p></div><span class="ct" id="alc"></span></div>' +
    (done ? '<div class="tools"><input class="inp" id="aq" type="search" placeholder="Search role or company" value="' + esc(F.q) + '" autocomplete="off" aria-label="Search your applications">' +
        '<div class="seg" id="af">' + FILTERS.map(function(f){ return '<button type="button" data-f="' + f[0] + '" class="' + (F.f === f[0] ? 'on' : '') + '">' + f[1] + '</button>'; }).join('') + '</div></div>' +
      '<div id="al"><div class="skel"></div><div class="skel"></div></div>'
     : '<div class="empty">' + IC.apps + '<h3>Nothing sent yet</h3><p>We start applying as soon as your resume is ready. You’ll see every application here, with exactly what was sent.</p></div>');
  if(!done) return;
  var t; $('#aq').addEventListener('input', function(e){ clearTimeout(t); t = setTimeout(function(){ F.q = e.target.value; F.n = 50; loadList(); }, 250); });
  $('#af').addEventListener('click', function(e){ var b = e.target.closest('[data-f]'); if(b) setFilter(b.getAttribute('data-f')); });
  loadList();
}
function kpisHTML(){
  var k = [[IC.send, PROG.today || 0, 'Sent today', ''], [IC.cal, PROG.week || 0, 'Last 7 days', ''], [IC.phone, PROG.interviews || 0, 'Interviews', 'v'], [IC.star, STATS ? (STERR ? '–' : STATS.offer || 0) : null, 'Offers', 'g']];
  return k.map(function(x){ return '<div class="kpi ' + x[3] + '"><span class="ic">' + x[0] + '</span><b>' + (x[1] == null ? '<i class="kskel"></i>' : typeof x[1] === 'number' ? x[1].toLocaleString() : esc(x[1])) + '</b><span>' + x[2] + '</span></div>'; }).join('');
}
var NOLOAD = '<p class="hint" style="margin-top:12px">This didn’t load just now — refresh the page to try again.</p>';
function weeksHTML(){
  if(STERR) return NOLOAD;
  if(!WEEKS){ var s = ''; for(var i = 0; i < 8; i++) s += '<div class="b"><div class="col"><div class="bar sk" style="height:' + (20 + i * 8) + '%"></div></div><span class="l">&nbsp;</span></div>'; return '<div class="chart">' + s + '</div>'; }
  var max = Math.max.apply(null, WEEKS.map(function(w){ return w.n; }).concat([1]));
  return '<div class="chart" role="img" aria-label="Applications sent each week for the last 8 weeks">' + WEEKS.map(function(w, i){
    var now = i === WEEKS.length - 1, d = w.start.toLocaleDateString('en-GB', {day:'numeric', month:'short'});
    return '<div class="b' + (now ? ' now' : '') + '" title="' + w.n + ' sent in the week of ' + esc(d) + '"><div class="col"><span class="n">' + w.n + '</span><div class="bar" style="height:' + Math.max(2, Math.round(w.n / max * 82)) + '%"></div></div>' +
      '<span class="l">' + (now ? 'This week' : esc(d)) + '</span></div>';
  }).join('') + '</div>';
}
function mixHTML(){
  if(STERR) return NOLOAD;
  if(!STATS) return '<div class="mix"><i class="kskel" style="width:100%;height:100%;border-radius:0"></i></div><div class="skel" style="height:150px"></div>';
  var all = STS.reduce(function(n, s){ return n + (STATS[s[0]] || 0); }, 0);
  if(!all) return '<p class="hint" style="margin-top:12px">Each application’s status shows here as companies reply.</p>';
  var rows = STS.filter(function(s){ return s[0] !== 'closed' || STATS.closed; });
  return '<div class="mix" role="img" aria-label="' + esc(rows.map(function(s){ return (STATS[s[0]] || 0) + ' ' + s[1].toLowerCase(); }).join(', ')) + '">' +
      STS.map(function(s){ var n = STATS[s[0]] || 0; return n ? '<i style="width:' + (n / all * 100).toFixed(2) + '%;background:' + s[2] + '"></i>' : ''; }).join('') + '</div>' +
    '<div class="leg">' + rows.map(function(s){ var n = STATS[s[0]] || 0;
      return '<button type="button" data-leg="' + s[0] + '" class="' + (F.f === s[0] ? 'on' : '') + '"><span class="dot" style="background:' + s[2] + '"></span>' + s[1] + '<span class="c">' + n.toLocaleString() + '</span><span class="pc">' + Math.round(n / all * 100) + '%</span></button>';
    }).join('') + '</div>';
}
function onboardingHTML(){
  return '<section class="panel" style="margin-top:14px"><h3>What happens next</h3><ol class="tl">' +
    '<li><span class="n">1</span><div><b>Your resume</b><p>We rebuild it for the roles you’re targeting — about 5 business days.</p></div></li>' +
    '<li><span class="n">2</span><div><b>Applications, every business day</b><p>We apply to matched roles, with your resume tailored to each one.</p></div></li>' +
    '<li><span class="n">3</span><div><b>Everything, right here</b><p>Each application appears the moment it’s sent — the job, the resume we sent and the company’s confirmation.</p></div></li></ol>' +
    '<div class="row"><a class="btn pri" href="' + esc(WA) + '" target="_blank" rel="noopener">' + I.wa + 'WhatsApp your team</a><a class="btn" href="#settings" data-go>Check your details</a></div></section>';
}
function setFilter(f){
  F.f = f; F.n = 50;
  $$('#af button').forEach(function(x){ x.classList.toggle('on', x.getAttribute('data-f') === f); });

// counts for the KPIs and the two charts: small HEAD requests, so they're exact however many applications there are
function weekStarts(){ var d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); var out = []; for(var i = 7; i >= 0; i--){ var s = new Date(d); s.setDate(s.getDate() - i * 7); out.push(s); } return out; }
function paintStats(){
  if(view() !== 'home') return;
  var k = $('#kpis'), w = $('#wk'), m = $('#mix');
  if(k) k.innerHTML = kpisHTML(); if(w) w.innerHTML = weeksHTML(); if(m) m.innerHTML = mixHTML();
}
function loadStats(){
  if(!(PROG.done > 0)){ STATS = {}; WEEKS = []; return paintStats(); }
  var count = function(qb){ return qb.then(function(r){ if(r.error) throw r.error; return r.count || 0; }); };
  var base = function(){ return SB.from('applications').select('id', {count:'exact', head:true}).eq('client_id', ME.id).neq('status', 'draft'); };
  var ws = weekStarts();
  var jobs = STS.map(function(s){ return count(base().eq('status', s[0])); }).concat(ws.map(function(s){ var e = new Date(s); e.setDate(e.getDate() + 7); return count(base().gte('applied_at', s.toISOString()).lt('applied_at', e.toISOString())); }));
  Promise.all(jobs).then(function(n){
    STATS = {}; STS.forEach(function(s, i){ STATS[s[0]] = n[i]; });
    WEEKS = ws.map(function(s, i){ return {start:s, n:n[STS.length + i]}; });
    STERR = false;
  }, function(){ STATS = {}; WEEKS = []; STERR = true; }).then(paintStats);
}
var LSEQ = 0;
function loadList(){
  var box = $('#al'), seq = ++LSEQ;
  var sq = SB.from('applications').select('id,status,title,company,location,applied_at,status_at', {count:'exact'}).eq('client_id', ME.id).neq('status', 'draft');
  if(F.f !== 'all') sq = sq.eq('status', F.f);
  var qq = F.q.trim().replace(/[,()*%"\\]/g, ' ').replace(/\s+/g, ' ').trim();
  if(qq) sq = sq.or('title.ilike.*' + qq + '*,company.ilike.*' + qq + '*');
  sq.order('applied_at', {ascending:false}).range(0, F.n).then(function(r){
    if(r.error) throw r.error;
    if(seq !== LSEQ || $('#al') !== box) return;   // a newer search, or the page moved on
    var rows = r.data || [], more = rows.length > F.n, c = $('#alc'); rows = rows.slice(0, F.n);
    if(c) c.textContent = r.count != null ? (F.f === 'all' && !qq ? r.count.toLocaleString() + ' sent' : r.count.toLocaleString() + ' found') : '';
    if(!rows.length){
      box.innerHTML = '<div class="empty"><h3>Nothing here</h3><p>' + (qq ? 'No application matches “' + esc(qq) + '”.' : 'No applications with this status yet.') + '</p></div>';
      return;
    }
    box.innerHTML = '<div class="list">' + rows.map(function(a){
      return '<a class="li" href="#app=' + esc(a.id) + '" data-go>' + TP.logo(a.company) + '<div class="main"><div class="t">' + esc(a.title || 'Role') + '</div><div class="m">' + esc([a.company, a.location].filter(Boolean).join(' · ')) + '</div></div>' +
        '<div class="side"><span class="when">' + esc(TP.fmtDate(a.applied_at)) + '</span>' + TP.statusChip(a.status) + '</div></a>';
    }).join('') + '</div>' + (more ? '<div class="row" style="justify-content:center;margin-top:14px"><button class="btn" type="button" data-act="more">Show more</button></div>' : '');
  }).catch(function(e){ if(seq === LSEQ && $('#al') === box) box.innerHTML = '<div class="note bad">' + esc(TP.errText(e)) + '</div>'; });
}

   The page itself is the editor's read-only view in a frame (editor.html?client=…&resume=…&view=1), as the team sees it. ---------- */
function loadRes(){
  return Promise.all([
    q(SB.from('client_resumes').select('id,name,is_default,created_at,updated_at').eq('client_id', ME.id).order('created_at', {ascending:true})),
    q(SB.from('applications').select('base_resume_id,status').eq('client_id', ME.id).neq('status', 'draft').limit(5000)),
    // the requests need sql/supabase-client-workspace.sql: until it has run there's no list, and Ask goes to WhatsApp
    SB.from('resume_requests').select('id,resume_id,kind,message,status,reply,created_at,done_at').eq('client_id', ME.id).order('created_at', {ascending:false}).limit(30)
      .then(function(r){ return r.error ? null : (r.data || []); }, function(){ return null; })
  ]).then(function(rs){
    var use = {};
    (rs[1] || []).forEach(function(a){ if(!a.base_resume_id) return; var u = use[a.base_resume_id] = use[a.base_resume_id] || {n:0, iv:0};
      u.n++; if(a.status === 'interview' || a.status === 'offer') u.iv++; });
    var list = rs[0] || []; list.forEach(function(r, i){ r.v = i + 1; r.use = use[r.id] || {n:0, iv:0}; });
    RES = {list:list, reqs:rs[2]};
  });
}
function inUse(){ var L = (RES && RES.list) || []; return L.filter(function(r){ return r.is_default; })[0] || L[L.length - 1] || null; }
function vResume(){
  document.title = 'Your resume | TrulyPlaced';

function resHead(pdf){

        (tot ? '<div class="prog" style="margin-top:14px"><i style="width:' + Math.min(100, Math.round(done / tot * 100)) + '%"></i></div>' : '') + '<div id="bonusL"></div></section>' +
      '<section class="panel"><h3>Need a hand?</h3><p>Your team replies on WhatsApp, usually within the hour on business days.</p><div class="row" style="margin-top:12px">' +
        '<a class="btn pri" href="' + esc(WA) + '" target="_blank" rel="noopener">' + I.wa + 'WhatsApp us</a><a class="btn" href="mailto:' + esc(MAIL) + '">' + I.mail + 'Email</a></div></section>' +
      '<section class="panel wide"><h3>The details we apply with</h3><p class="hint" style="margin:4px 0 12px">Your contact details, work authorization, the jobs you want and your standard answers are on your Profile — keep them up to date there.</p>' +
        '<a class="btn" href="#profile" data-go>' + IC.user + 'Open your profile</a></section>' +
      '<section class="panel wide"><h3>Sign-in &amp; security</h3><dl class="kv"><dt>You sign in with</dt><dd>' + esc(ME.email) + '</dd></dl>' +
        '<form class="pwf" id="pwF" autocomplete="off" novalidate><div class="field"><label for="pw1">New password</label><input id="pw1" type="password" minlength="8" autocomplete="new-password" required></div>' +
        '<div class="field"><label for="pw2">Type it again</label><input id="pw2" type="password" minlength="8" autocomplete="new-password" required></div>' +
        '<button class="btn pri" type="submit" id="pwGo">Change password</button><p class="err" id="pwErr" hidden></p></form>' +
        '<div class="row" style="margin-top:16px;border-top:1px solid var(--line);padding-top:14px"><span class="fine grow">Signing out here keeps your account and everything we’ve sent.</span><button class="btn" type="button" data-act="out">' + I.out + 'Sign out</button></div></section>' +
    '</div>';
  loadBonus();
  $('#pwF').addEventListener('submit', function(e){
    e.preventDefault();
    var a = $('#pw1').value, b = $('#pw2').value, err = $('#pwErr'), go = $('#pwGo');
    err.hidden = true;
    if(a.length < 8){ err.textContent = 'Use at least 8 characters.'; err.hidden = false; return; }
    if(a !== b){ err.textContent = 'The two passwords don’t match.'; err.hidden = false; return; }
    go.classList.add('busy'); go.disabled = true;
    SB.auth.updateUser({password:a}).then(function(r){ if(r.error) throw r.error; $('#pwF').reset(); TP.toast('Password changed'); })
      .catch(function(x){ err.textContent = TP.errText(x); err.hidden = false; })
      .then(function(){ go.classList.remove('busy'); go.disabled = false; });
  });
}

// the extra applications on top of the package, each with its reason (the owners add them; a client reads their own)
function loadBonus(){
  if(!$('#bonusL') || !bonus()) return;
  q(SB.from('plan_adjustments').select('delta,reason,at,undone_at').eq('client_id', ME.id).order('at', {ascending:true}).limit(50)).then(function(rows){
    rows = (rows || []).filter(function(a){ return !a.undone_at; }); var b = $('#bonusL'); if(!b || !rows.length) return;
    b.innerHTML = '<ul class="bonus">' + rows.map(function(a){ return '<li><b>' + (a.delta > 0 ? '+' : '') + a.delta.toLocaleString() + '</b>' + esc(a.reason) + '<small>' + esc(TP.fmtDate(a.at)) + '</small></li>'; }).join('') + '</ul>';
  }, function(){});
}

document.addEventListener('click', function(e){
  var b = e.target.closest && e.target.closest('[data-act],[data-leg],[data-ver]'); if(!b) return;
  if(b.hasAttribute('data-leg')){ F.f = b.getAttribute('data-leg'); F.q = ''; F.n = 50; go('#applications'); return; }   // the Dashboard's breakdown opens that list
  if(b.hasAttribute('data-ver')){ RV = b.getAttribute('data-ver'); drawRes(); return; }
  var act = b.getAttribute('data-act');
  if(act === 'out') return TP.signOut();
  if(act === 'more'){ F.n += 50; loadList(); }
  if(act === 'ask') askModal();
  if(act === 'pdf'){ var fw = $('#rvF'); try{ if(fw && fw.contentWindow && fw.contentWindow.downloadPDF){ fw.contentWindow.downloadPDF(); return; } }catch(x){} TP.toast('One moment — the resume is still opening'); }
  if(act === 'pfsave') pfSave(b);
  if(act === 'qaadd'){ $('#pfQA').insertAdjacentHTML('beforeend', qaRow({q:'', a:''})); $('#pfQA .qa:last-child [data-qa=q]').focus(); pfMark(); }
  if(act === 'qacommon'){
    var qq = b.getAttribute('data-q'), form = {}; PFF.forEach(function(k){ var f = $('#pf_' + k); form[k] = f ? f.value.trim() : CL[k]; });
    $('#pfQA').insertAdjacentHTML('beforeend', qaRow({q:qq, a:TP.suggestAnswer(qq, form)})); b.remove();
    var a = $('#pfQA .qa:last-child [data-qa=a]'); a.focus(); a.select(); pfMark();
  }
  if(act === 'qadel'){ b.closest('.qa').remove(); $('#pfCommon').innerHTML = commonHTML(); pfMark(); }
});
})();
</script>
</body>
</html>
