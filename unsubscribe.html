<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Email preferences | TrulyPlaced</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0938d5">
<link rel="icon" href="/email-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@700&display=swap" rel="stylesheet">
<style>
:root{--blue:#0938d5;--blue-d:#072ca8;--ink:#121a33;--body:#4b5473;--muted:#737b9c;--line:#e7e9f2;--bg:#f2f4fa;--ok:#0a7f46;--ok-soft:#e6f6ee;--bad:#be123c;color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:var(--bg);color:var(--body);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.55;display:flex;flex-direction:column;align-items:center;padding:40px 16px}
a{color:var(--blue)}
.brand{display:flex;align-items:center;gap:9px;font:700 18px Poppins,Inter,sans-serif;color:var(--ink);text-decoration:none;margin-bottom:22px}
.brand img{width:32px;height:32px;border-radius:8px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:32px 28px;max-width:460px;width:100%;text-align:center;box-shadow:0 18px 50px -30px rgba(18,26,51,.35)}
.ic{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;margin:0 auto 16px;background:var(--ok-soft);color:var(--ok)}
.ic svg{width:28px;height:28px}
.ic.wait{background:#eef2ff;color:var(--blue)}
.ic.bad{background:#ffe9ee;color:var(--bad)}
h1{font:700 22px/1.3 Poppins,Inter,sans-serif;color:var(--ink)}
p{margin-top:8px}
.who{font-weight:600;color:var(--ink)}
.acts{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink);font:600 15px Inter,sans-serif;text-decoration:none;cursor:pointer}
.btn:hover{border-color:var(--blue)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.pri:hover{background:var(--blue-d)}
.btn[disabled]{opacity:.6;cursor:default}
.fine{font-size:12.5px;color:var(--muted);margin-top:18px}
.spin{width:26px;height:26px;border-radius:50%;border:3px solid #dbe3ff;border-top-color:var(--blue);animation:r .8s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<a class="brand" href="/"><img src="/email-logo.png" alt="">TrulyPlaced</a>
<main class="card" id="card" aria-live="polite">
  <div class="ic wait"><span class="spin"></span></div>
  <h1>Updating your email settings…</h1>
</main>
<p class="fine" style="text-align:center">RepoReserve Technologies Private Limited · Nizamabad, Telangana, India · <a href="/privacy.html">Privacy</a></p>
<script>
(function(){
  var URL = 'https://yubgrhxdhofnynfocpef.supabase.co', KEY = 'sb_publishable_1CHFJ4-tBN42ThTgDqgvpg_xcVjzpg5';   // public key, same as the job board
  var card = document.getElementById('card');
  var tok = (location.search.match(/[?&]t=([0-9a-f-]{36})/i) || [])[1];
  var OK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
  var MAIL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>';
  var X = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 8v5M12 16.5v.5"/><circle cx="12" cy="12" r="9"/></svg>';
  function esc(s){ return String(s || '').replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function call(resub){
    return fetch(URL + '/rest/v1/rpc/email_unsubscribe', {method:'POST', headers:{'Content-Type':'application/json', apikey:KEY, Authorization:'Bearer ' + KEY},
      body:JSON.stringify({tok:tok, resubscribe:!!resub})}).then(function(r){ if(!r.ok) throw r.status; return r.json(); });
  }
  function show(state, who){
    if(state === 'off') card.innerHTML = '<div class="ic">' + OK + '</div><h1>You’re unsubscribed</h1>' +
      '<p>' + (who ? '<span class="who">' + esc(who) + '</span> won’t get' : 'You won’t get') + ' the daily job email any more.</p>' +
      '<div class="acts"><button class="btn" type="button" id="re">Changed your mind? Resubscribe</button><a class="btn pri" href="/app.html#jobs">Browse jobs</a></div>' +
      '<p class="fine">Want fewer, better-matched roles instead? <a href="/app.html#settings">Change your role or location</a>.</p>';
    if(state === 'on') card.innerHTML = '<div class="ic">' + MAIL + '</div><h1>You’re back on the list</h1>' +
      '<p>' + (who ? '<span class="who">' + esc(who) + '</span> will' : 'You’ll') + ' get new matching roles every morning.</p>' +
      '<div class="acts"><button class="btn" type="button" id="un">Unsubscribe again</button><a class="btn pri" href="/app.html#jobs">Browse jobs</a></div>';
    if(state === 'bad') card.innerHTML = '<div class="ic bad">' + X + '</div><h1>This link didn’t work</h1>' +
      '<p>It may be incomplete — copy the whole link from the email. Or switch daily emails off in your settings.</p>' +
      '<div class="acts"><a class="btn pri" href="/app.html#settings">Open my settings</a></div>' +
      '<p class="fine">Or reply to any of our emails with “unsubscribe”, or write to <a href="mailto:hello@trulyplaced.com">hello@trulyplaced.com</a>.</p>';
    var re = document.getElementById('re'), un = document.getElementById('un');
    if(re) re.onclick = function(){ re.disabled = true; call(true).then(function(w){ show(w ? 'on' : 'bad', w); }, function(){ show('bad'); }); };
    if(un) un.onclick = function(){ un.disabled = true; call(false).then(function(w){ show(w ? 'off' : 'bad', w); }, function(){ show('bad'); }); };
  }
  if(!tok){ show('bad'); return; }
  call(false).then(function(who){ show(who ? 'off' : 'bad', who); }, function(){ show('bad'); });
})();
</script>
</body>
</html>
