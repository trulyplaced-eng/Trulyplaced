<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Resume Editor | TrulyPlaced</title>
<meta name="description" content="Edit your resume with AI suggestions, tailor it to a job, and download a clean PDF.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0938d5">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='116' fill='%230938d5'/%3E%3Cpath d='M256 410C168 314 138 278 138 206 138 142 191 94 256 94s118 48 118 112c0 72-30 108-118 204z' fill='%23fff'/%3E%3Cpath d='M205 200l37 36 76-88' fill='none' stroke='%230938d5' stroke-width='30' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://yubgrhxdhofnynfocpef.supabase.co" crossorigin>
<link rel="preload" as="script" href="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<style id="pageCss">@page{size:letter;margin:0}</style>
<style id="sheetCss"></style>
<style>
:root{--blue:#0938d5;--blue-d:#072ca8;--blue-soft:#eef2ff;--blue-line:#cfd9ff;--ink:#121a33;--body:#4b5473;--muted:#737b9c;
  --line:#e7e9f2;--bg:#f2f4fa;--ok:#0a7f46;--ok-soft:#e6f6ee;--warn:#b45309;--warn-soft:#fff4e0;--bad:#be123c;--bad-soft:#ffe9ee;
  --vio:#6d28d9;--vio-soft:#f3eeff;--panel:420px;--top:56px;color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--body);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:var(--blue)}
[hidden]{display:none!important}
svg{flex:none;width:18px;height:18px}
::selection{background:#c7d2fe}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:40;height:var(--top);background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 14px}
.backb{display:inline-flex;align-items:center;gap:4px;height:34px;padding:0 12px 0 8px;border-radius:999px;border:1px solid var(--line);color:var(--ink);font-weight:600;font-size:13px;text-decoration:none;white-space:nowrap}
.backb:hover{border-color:var(--blue-line);background:var(--blue-soft)}
.brand{display:inline-flex;align-items:center;gap:7px;color:var(--ink);font:700 15px Poppins,Inter,sans-serif;text-decoration:none}
.brand img{width:24px;height:24px;border-radius:6px}
.wkon{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px 0 4px;border-radius:999px;background:var(--vio-soft);color:var(--vio);font-size:12.5px;font-weight:600;white-space:nowrap}
.wkon i{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font:700 10.5px Inter,sans-serif;color:#fff;font-style:normal}
.wkon small{font-weight:500;opacity:.75;text-transform:uppercase;letter-spacing:.06em;font-size:10px}
.rname{height:34px;min-width:120px;max-width:280px;padding:0 10px;border:1px solid transparent;border-radius:8px;font-weight:600;color:var(--ink);background:transparent}
.rname:hover{border-color:var(--line)}.rname:focus{outline:none;border-color:var(--blue);background:#fff}
.sp{flex:1}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.status i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.status.busy i{background:var(--warn);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.tbtns{display:flex;align-items:center;gap:6px}
.ib{width:34px;height:34px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--body);position:relative}
.ib:hover{background:var(--bg);color:var(--ink)}.ib:disabled{opacity:.35;cursor:default}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 13px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:600;font-size:13px;text-decoration:none;white-space:nowrap;transition:.15s}
.btn:hover{border-color:#c9cee0;background:#fafbff}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}.btn.pri:hover{background:var(--blue-d)}
.btn.ai{background:linear-gradient(90deg,#4f46e5,#7c3aed);border-color:transparent;color:#fff}.btn.ai:hover{filter:brightness(1.08)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px}
.btn.wide{width:100%}
.btn.ghost{border-color:transparent;background:transparent}.btn.ghost:hover{background:var(--bg)}
.btn.danger{color:var(--bad)}.btn.danger:hover{background:var(--bad-soft);border-color:#f3c3cf}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:16px;height:16px}
.dd{position:relative}
.menu{position:absolute;right:0;top:40px;z-index:50;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 50px -14px rgba(18,26,51,.35);padding:6px;width:320px}
.menu button{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:10px;border-radius:9px}
.menu button:hover{background:var(--bg)}
.menu button b{display:block;color:var(--ink);font-size:13.5px}.menu button small{display:block;color:var(--muted);font-size:12px;line-height:1.4}
.menu svg{width:20px;height:20px;color:var(--blue);margin-top:2px}
[data-tip]{position:relative}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:11.5px;font-weight:500;padding:4px 8px;border-radius:6px;white-space:nowrap;z-index:60;pointer-events:none}

/* ---------- screens ---------- */
.center{max-width:560px;margin:48px auto;padding:0 16px}
.center.wide{max-width:1180px;margin-top:24px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:0 10px 40px -20px rgba(18,26,51,.25)}
.card h1{font:700 22px Poppins,Inter,sans-serif;color:var(--ink);line-height:1.25;margin-bottom:8px}
.card h2{font:700 17px Poppins,Inter,sans-serif;color:var(--ink);margin-bottom:6px}
.card p{color:var(--body)}
.card ul{list-style:none;margin-top:16px;display:grid;gap:8px;font-size:14px}
.card li{display:flex;gap:10px;align-items:flex-start;color:var(--ink)}
.card li svg{color:var(--ok);margin-top:2px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;height:46px;margin-top:18px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:600;text-decoration:none}
.gbtn svg{width:20px;height:20px}
.drop{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:18px;padding:30px 20px;border:2px dashed var(--blue-line);border-radius:14px;background:var(--blue-soft);cursor:pointer;text-align:center;color:var(--body)}
.drop:hover,.drop.over{border-color:var(--blue);background:#e4eaff}
.drop svg{width:28px;height:28px;color:var(--blue)}
.drop b{color:var(--ink);font-size:15px}.drop span{font-size:12.5px;color:var(--muted)}
.or{display:flex;align-items:center;gap:10px;margin:14px 0 0;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.loading{display:flex;align-items:center;justify-content:center;gap:12px;padding:80px 20px;color:var(--muted)}
.spin{width:18px;height:18px;border:2.5px solid var(--blue-line);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 16px 0;padding:10px 14px;background:var(--warn-soft);border:1px solid #f6d9a8;border-radius:12px;color:var(--ink);font-size:13.5px}
.banner .sp{flex:1}
.fine{font-size:12.5px;color:var(--muted);line-height:1.5}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}

/* ---------- scan check screen ---------- */
.sv{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.sv-c{border:1px solid var(--line);border-radius:12px;padding:12px 14px;max-height:62vh;overflow:auto;background:#fff;text-align:left}
.sv-c h4{font:700 12px Inter,sans-serif;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:8px;position:sticky;top:-12px;background:#fff;padding:4px 0}
.sv-c pre{white-space:pre-wrap;font:12.5px/1.55 Inter,sans-serif;color:var(--body);margin:0}
.sv-h{display:flex;flex-direction:column;gap:2px;margin-bottom:10px;font-size:13px;color:var(--body)}.sv-h b{font-size:16px;color:var(--ink)}
.sv-s{margin-bottom:10px;font-size:12.5px;line-height:1.5;color:var(--ink)}
.sv-s h5{font:700 11.5px Inter,sans-serif;text-transform:uppercase;letter-spacing:.05em;color:var(--blue);border-bottom:1px solid var(--line);padding-bottom:3px;margin-bottom:5px}
.sv-e{margin-bottom:7px}.sv-e>div:first-child{display:flex;justify-content:space-between;gap:10px}.sv-e i{font-style:normal;color:var(--muted);white-space:nowrap}
.sv-s ul{margin:3px 0 0 16px}.sv-s p{margin:0 0 3px}
.snf{font-style:normal;font-size:10.5px;font-weight:700;background:var(--warn-soft);color:var(--warn);border-radius:5px;padding:0 5px;margin-left:3px;cursor:help}
.snw{color:var(--warn)}
.sv-a{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

/* ---------- layout ---------- */
.wrap{display:grid;grid-template-columns:minmax(0,1fr) var(--panel);min-height:calc(100vh - var(--top))}
.stage{padding:16px 24px 40px;min-width:0;display:flex;flex-direction:column;align-items:center}
.doctabs{display:flex;align-items:center;gap:4px;margin-bottom:12px;width:100%;max-width:880px}
.doctabs button{height:32px;padding:0 14px;border-radius:999px;font-weight:600;font-size:13px;color:var(--body)}
.doctabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(18,26,51,.15)}
.doctabs .pages{margin-left:auto;font-size:12.5px;color:var(--muted)}
.doctabs .pages.warn{color:var(--warn);font-weight:600}
.frame{position:relative;width:100%;max-width:880px;min-height:400px;overflow:hidden;overflow:clip;overflow-clip-margin:36px}   /* the page is laid out at paper size and scaled down: never let it widen the screen */
.sheetwrap{position:relative;transform-origin:top left}
.sheet{background:#fff;box-shadow:0 12px 40px -16px rgba(18,26,51,.35),0 0 0 1px var(--line);position:relative;overflow:visible;min-height:1056px}
.breaks{position:absolute;inset:0;pointer-events:none}
.brk{position:absolute;left:-12px;right:-12px;border-top:2px dashed #e11d48;opacity:.6}
.brk::after{content:attr(data-n);position:absolute;right:0;top:3px;font:600 10px Inter,sans-serif;color:#e11d48;background:#fff;padding:1px 5px;border-radius:4px}
.sheet [data-path]{cursor:text;border-radius:2px;transition:background .15s}
.sheet [data-path]:hover{background:#fff6cc}
.sheet .sel{outline:2px solid var(--blue);outline-offset:1px;background:#e8edff!important}
.sheet .hl{background:#fff2b8}

/* ---------- panel ---------- */
.panel{background:#fff;border-left:1px solid var(--line);position:sticky;top:var(--top);height:calc(100vh - var(--top));display:flex;flex-direction:column;min-width:0}
.ptabs{display:flex;gap:2px;padding:10px 12px 0;border-bottom:1px solid var(--line);background:#fff}
.ptabs button{flex:1;height:36px;border-radius:8px 8px 0 0;font-weight:600;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.ptabs button:hover{color:var(--ink);background:var(--bg)}
.ptabs button.on{color:var(--blue);border-bottom-color:var(--blue)}
.pbody{flex:1;overflow:auto;padding:14px 14px 60px;scroll-behavior:smooth}
.pc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px 14px;margin-bottom:10px}
.pc.on{border-color:var(--blue-line);box-shadow:0 0 0 3px var(--blue-soft)}
.pch{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.pch h3{font:700 13px Inter,sans-serif;color:var(--ink);flex:1;min-width:0;text-transform:uppercase;letter-spacing:.05em}
.pch input.ttl{flex:1;min-width:0;height:28px;border:1px solid transparent;border-radius:6px;padding:0 6px;font-weight:700;color:var(--ink);background:transparent;text-transform:uppercase;letter-spacing:.05em;font-size:13px}
.pch input.ttl:hover{border-color:var(--line)}.pch input.ttl:focus{outline:none;border-color:var(--blue);background:#fff;text-transform:none;letter-spacing:0}
.pch .mini{display:flex;gap:2px}
.mb{width:26px;height:26px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.mb:hover{background:var(--bg);color:var(--ink)}.mb.del:hover{background:var(--bad-soft);color:var(--bad)}
.mb svg{width:15px;height:15px}
.mb:disabled{opacity:.3;cursor:default}
.lbl{display:block;font-size:11.5px;font-weight:600;color:var(--muted);margin:8px 0 3px;text-transform:uppercase;letter-spacing:.04em}
.in,.ta{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff;color:var(--ink);font-size:13.5px;line-height:1.4}
.in{height:34px}
.ta{resize:vertical;min-height:60px;display:block}
.in:focus,.ta:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.in::placeholder,.ta::placeholder{color:#a4abc4}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g2 .lbl{margin-top:8px}
.entry{border:1px solid var(--line);border-radius:10px;padding:10px 12px 12px;margin-top:10px;background:#fbfbfe}
.entry.on{border-color:var(--blue-line);background:#fff}
.eh{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.eh b{flex:1;min-width:0;font-size:13px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dwarn{display:inline-block;font:700 10.5px Inter,sans-serif;color:var(--bad);background:var(--bad-soft);border-radius:5px;padding:1px 6px;margin-top:4px}
#pbody .bl{list-style:none;margin-top:6px;display:grid;gap:4px}
#pbody .bl li{display:flex;gap:4px;align-items:flex-start}
#pbody .bl li .ta{min-height:34px;padding:6px 8px;font-size:13px}
#pbody .bl li .mini{display:flex;flex-direction:column;gap:0;padding-top:2px}
.addl{display:inline-flex;align-items:center;gap:4px;margin-top:8px;font-size:12.5px;font-weight:600;color:var(--blue);padding:4px 6px;border-radius:6px}
.addl:hover{background:var(--blue-soft)}
.addl svg{width:14px;height:14px}
.row{display:flex;gap:6px;align-items:center;margin-top:6px}
.row .in{flex:1;min-width:0}
.row .in.lab{flex:0 0 110px}
.addsec{display:block;width:100%;padding:12px;border:2px dashed var(--line);border-radius:12px;color:var(--blue);font-weight:600;text-align:center;margin-top:4px}
.addsec:hover{border-color:var(--blue-line);background:var(--blue-soft)}
.secmenu{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.secmenu button{padding:9px 10px;border:1px solid var(--line);border-radius:9px;text-align:left;font-weight:600;font-size:13px;color:var(--ink)}
.secmenu button:hover{border-color:var(--blue-line);background:var(--blue-soft)}
.hint{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.45}
.hint.warn{color:var(--warn)}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink);padding:5px 0}
.chk input{width:16px;height:16px;accent-color:var(--blue)}

/* ---------- format panel ---------- */
.fh{font:700 11px Inter,sans-serif;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:16px 0 6px}
.fh:first-child{margin-top:4px}
.fr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;font-size:13.5px;color:var(--ink)}
.fr>span:first-child{color:var(--body)}
.fr select{height:32px;border:1px solid var(--line);border-radius:8px;padding:0 8px;background:#fff;max-width:180px;font-size:13px}
.fr .val{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12.5px;min-width:44px;text-align:right}
.seg{display:inline-flex;background:var(--bg);border-radius:8px;padding:2px}
.seg button{height:28px;min-width:34px;padding:0 10px;border-radius:6px;font-weight:600;font-size:12.5px;color:var(--body)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(18,26,51,.15)}
.seg button svg{width:15px;height:15px}
.sl{display:block;padding:2px 0 8px}
.sl .fr{padding:4px 0 2px}
input[type=range]{width:100%;accent-color:var(--blue);height:22px}
.sw{position:relative;width:36px;height:20px;border-radius:999px;background:#cfd3e2;transition:.15s;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw.on{background:var(--blue)}.sw.on::after{left:18px}
.tpl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.tpl button{border:1px solid var(--line);border-radius:10px;padding:8px;text-align:left;display:flex;gap:10px;align-items:center}
.tpl button.on{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.tpl button svg{width:38px;height:50px;border:1px solid var(--line);border-radius:3px;background:#fff}
.tpl b{display:block;font-size:12.5px;color:var(--ink)}.tpl small{display:block;font-size:11px;color:var(--muted);line-height:1.3}
.dots{display:flex;gap:6px}
.dots button{width:24px;height:24px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.dots button.on{box-shadow:0 0 0 2px var(--blue)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:4px 10px;border-radius:999px;border:1px solid var(--line);font-size:12px;color:var(--ink);background:#fff;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips button.off{text-decoration:line-through;color:var(--muted);background:var(--bg)}
.fitbox{margin-top:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fbfbfe}
.fitbox p{font-size:12px;color:var(--muted);margin-top:4px}

/* ---------- check panel ---------- */
.score{display:flex;align-items:center;gap:14px;padding:4px 0 10px}
.ring{--v:0;--c:var(--blue);width:70px;height:70px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--v)*1%),#e9ebf3 0);display:grid;place-items:center;flex:none}
.ring span{width:54px;height:54px;border-radius:50%;background:#fff;display:grid;place-items:center;font:700 20px Poppins,Inter,sans-serif;color:var(--ink)}
.score b{display:block;font-size:14px;color:var(--ink)}.score p{font-size:12.5px;color:var(--body);line-height:1.45;margin-top:2px}
.ck{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line);font-size:12.5px}
.ck .pt{flex:none;min-width:40px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.ck .pt.full{color:var(--ok)}.ck .pt.zero{color:var(--bad)}
.ck b{display:block;color:var(--ink);font-size:12.5px}.ck small{color:var(--muted);display:block;line-height:1.4}
.iss{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px;background:#fff}
.iss.done{opacity:.6}
.sev{display:inline-block;font:700 10px Inter,sans-serif;text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:999px;margin-bottom:4px}
.sev.high{background:var(--bad-soft);color:var(--bad)}.sev.medium{background:var(--warn-soft);color:var(--warn)}.sev.low{background:var(--blue-soft);color:var(--blue)}
.iss p{font-size:13px;color:var(--ink);line-height:1.45}
.iss q{display:block;font-style:italic;color:var(--muted);font-size:12.5px;margin:4px 0;quotes:"“" "”"}
.iss .fix{font-size:12.5px;color:var(--ink);background:var(--ok-soft);border-radius:8px;padding:7px 9px;margin:6px 0;line-height:1.45}
.iss .fix b{color:var(--ok);font-size:11px;text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:2px}
.iss .acts{margin-top:8px;gap:6px}

.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;z-index:90;background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:13.5px;display:flex;gap:14px;align-items:center;pointer-events:none;transition:.2s;max-width:calc(100vw - 32px)}

.toast button{color:#c7d2fe;font-weight:700}

/* ---------- read-only (sent application) ---------- */
.ro .rocard{margin:0 0 12px;padding:12px 14px;border-radius:12px;background:var(--ok-soft);color:var(--ink);font-size:13px;line-height:1.5}

.embed .top .backb,.embed .top .brand{display:none}

}

  .panel{position:static;height:auto;border-left:0}

  body.m-preview .panel{display:none}

}

@media print{
  body{background:#fff}

}

<script>
var BUL = '•●▪◦‣∙·*–—\\-➢➤►✓✔◆■□○';
var BUL_RX = new RegExp('^\\s*[' + BUL + ']\\s*');

function readPDF(buf){
  return pdfjsLib.getDocument({data:buf}).promise.then(function(pdf){
    var jobs = [];
    for(var i=1;i<=pdf.numPages;i++) jobs.push(pdf.getPage(i).then(readPage));
    return Promise.all(jobs).then(function(pages){ return {pdf:pdf, pages:pages}; });
  });
}
function readPage(page){
  var vp = page.getViewport({scale:1});
  return Promise.all([page.getTextContent(), page.getOperatorList()]).then(function(r){
    var tc = r[0], ops = r[1], O = pdfjsLib.OPS, big = 0, small = 0;
    ops.fnArray.forEach(function(f, i){
      if(f === O.paintImageXObject || f === O.paintInlineImageXObject || f === O.paintImageXObjectRepeat){
        var a = ops.argsArray[i] || [], w = +a[1] || 0, h = +a[2] || 0;
        if(f === O.paintInlineImageXObject && a[0]){ w = a[0].width || 0; h = a[0].height || 0; }
        if(w >= 90 && h >= 90) big++; else small++;
      }
    });
    var items = tc.items.filter(function(it){ return typeof it.str === 'string' && it.str.length; }).map(function(it){
      var t = pdfjsLib.Util.transform(vp.transform, it.transform);
      var fh = Math.hypot(t[2], t[3]) || Math.abs(it.height) || 10;
      return {str:it.str, x:t[4], y:t[5] - fh*0.82, w:Math.abs(it.width) || it.str.length*fh*0.5, h:fh};
    });
    return {page:page, w:vp.width, h:vp.height, items:items, big:big, small:small, lines:buildLines(items, vp.width)};
  });
}
/* group text into visual lines, then split each line where there is a wide horizontal gap */
function buildLines(items, W){
  var its = items.filter(function(i){ return i.str.trim(); }).sort(function(a,b){ return (a.y + a.h/2) - (b.y + b.h/2) || a.x - b.x; });

/* ---------- word-level diff, so people see exactly what changed ---------- */
const toks = (t) => String(t || '').match(/\[[^\]]{0,60}\]|\S+/g) || [];

    else if (L[i + 1][j] >= L[i][j + 1]) { o.push('<del>' + esc(A[i]) + '</del>'); i++; }
    else { nw.push('<ins>' + esc(B[j]) + '</ins>'); j++; }

    const tmp = document.createElement('div'); tmp.innerHTML = scanView(D, W); const flags = tmp.querySelectorAll('.snf').length;
    $('#start').innerHTML = '<div class="card scan"><h1>Check what Claude read</h1><p>' + esc(scanCounts(D)) + '. Everything is copied word for word — nothing is reworded. ' +
      (flags ? '<b class="snw">' + flags + ' place' + (flags === 1 ? '' : 's') + ' marked <em class="snf">check</em></b> use words we couldn’t find in the file: compare them with the original before you go on.' : 'Every word matches the file.') + '</p>' +
      '<div class="sv"><div class="sv-c"><h4>Original file</h4><pre>' + esc(text) + '</pre></div><div class="sv-c"><h4>What Claude read</h4>' + scanView(D, W) + '</div></div>' +
      '<div class="sv-a"><button class="btn pri" type="button" id="scOk">Looks right — open it</button><button class="btn" type="button" id="scAgain">Read it again</button><button class="btn" type="button" id="scQuick">Use the quick reader instead</button></div></div>';
    show('start'); $('#start').classList.add('wide');
    $('#scOk').onclick = () => { $('#start').classList.remove('wide'); SRC = src; startDoc(D); toast('Resume read by Claude — give the page one more look as you edit'); };
    $('#scAgain').onclick = () => { $('#start').classList.remove('wide'); scanFlow(src, lines, fresh); };
    $('#scQuick').onclick = () => { $('#start').classList.remove('wide'); quick(); };
  }).catch((e) => {
    $('#start').innerHTML = '<div class="card"><h1>Claude couldn’t read this resume</h1><p>' + esc(SCAN_ERR[e] || 'Something went wrong. Try again in a minute.') + '</p>' +
      '<div class="sv-a"><button class="btn pri" type="button" id="scAgain">Try again</button><button class="btn" type="button" id="scQuick">Use the quick reader instead</button></div>' +
      '<p class="hint" style="margin-top:12px">The quick reader works on this device without AI. It can put things in the wrong section on unusual layouts, so check every section.</p></div>';
    show('start'); $('#scAgain').onclick = () => scanFlow(src, lines, fresh); $('#scQuick').onclick = quick;
  });
}

/* =====================================================================
   Events and start-up.
   ===================================================================== */
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-a]');
  const dl = $('#dlMenu'); if (dl && !dl.hidden && !e.target.closest('#dlWrap')) dl.hidden = true;
  if (!e.target.closest('#selbar') && !$('#selbar').hidden && !(t && /^sel-/.test(t.getAttribute('data-a') || ''))) { if (!selFrom()) hideSel(); }
  if (!t) return;
  const a = t.getAttribute('data-a'), v = t.getAttribute('data-v');
  if (a === 'goto') e.preventDefault();
  switch (a) {
    case 'undo': return undo();
    case 'redo': return redo();
    case 'ptab': PTAB = v; renderPanel(); $('#pbody').scrollTop = 0; return;
    case 'doc': return setDocTab(v);
    case 'mob': return setMobile(v);
    case 'dl-menu': dl.hidden = !dl.hidden; return;
    case 'dl-pdf': dl.hidden = true; return downloadPDF();
    case 'dl-doc': dl.hidden = true; return downloadDoc();
    case 'blank': return startDoc(starterDoc());
    case 'upload': return $('#fileIn').click();
    case 'newsrc': $('#banner').hidden = true; if (NEWSRC) fromSource(NEWSRC, true); return;
    case 'keep': $('#banner').hidden = true; if (DOC && NEWSRC) { DOC.meta.srcAt = NEWSRC.at; persist(); } return;
    case 'goto': return lightOnPage(v);
    case 'rubric': { const r = $('#rubric'); if (r) r.hidden = !r.hidden; return; }
    case 'review': return runReview();
    case 'iss-fix': return issueFix(+v);
    case 'iss-show': return issueShow(+v);
    case 'iss-skip': return issueSkip(+v);
    case 'sum-ai': return improveSummary(v);
    case 'cv-write': return writeCover();
    case 'sel-run': return selRun(v);
    case 'sel-ok': return selAccept();
    case 'sel-no': return hideSel();
    case 'v-save': return saveVersion('Saved by hand', true).then((ok) => toast(ok ? 'Version saved' : 'Couldn’t save — check your connection'));
    case 'v-restore': return restoreVersion(+v);
  }
  if (!DOC) return;
  if (editAction(a, v, t) || formatAction(a, v, t) || optAction(a, v, t)) return;
});
document.addEventListener('submit', (e) => { if (e.target.matches('[data-a=sel-ask]')) { e.preventDefault(); selRun('custom'); } });
document.addEventListener('input', (e) => { if (e.target.closest('#pbody')) { onFieldInput(e); onRangeInput(e); } if (e.target.id === 'rname' && DOC) { DOC.meta.srcName = e.target.value.trim(); changed('rname'); } });
document.addEventListener('change', (e) => { if (e.target.closest('#pbody')) { onRangeChange(e); onSelectChange(e); } if (e.target.closest('.rsk')) countRows(); });
document.addEventListener('focusin', (e) => { if (e.target.closest('#pbody')) onFieldFocus(e); });
document.addEventListener('keydown', (e) => {
  const mod = e.ctrlKey || e.metaKey;
  if (mod && !e.altKey && (e.key === 'z' || e.key === 'Z') && DOC && !e.target.closest('[contenteditable]')) { if (e.target.matches('input,textarea') && !e.shiftKey && HTYPING) { /* let the field's own undo run first */ } else { e.preventDefault(); e.shiftKey ? redo() : undo(); return; } }
  if (mod && (e.key === 'y' || e.key === 'Y') && DOC) { e.preventDefault(); redo(); return; }
  if (mod && (e.key === 's' || e.key === 'S') && DOC) { e.preventDefault(); sync(); toast('Saved'); return; }
  if (e.key === 'Escape') { hideSel(); const dl = $('#dlMenu'); if (dl) dl.hidden = true; if (!$('#modal').hidden) { if (OPT && OPT.rows && $('#rAll')) finishOptimise(); else if (!$('.om.run')) modalClose(); } return; }
  if (e.target.closest('#pbody')) onFieldKey(e);
});
document.addEventListener('paste', (e) => { if (e.target.closest('#pbody')) onFieldPaste(e); });
document.addEventListener('mouseup', () => setTimeout(selCheck, 10));
document.addEventListener('keyup', (e) => { if (e.shiftKey || /^Arrow|^Shift/.test(e.key)) setTimeout(selCheck, 10); });
document.addEventListener('mousedown', (e) => { if (e.target.closest('#selbar') && !e.target.matches('input')) e.preventDefault(); });   // keep the text selected while using the bar
$('#sheet').addEventListener('click', (e) => { const el = e.target.closest('[data-path]'); if (el && DOC && !selFrom()) jumpTo(el.getAttribute('data-path')); });
$('#fileIn').addEventListener('change', (e) => { if (e.target.files[0]) readUpload(e.target.files[0]); e.target.value = ''; });
document.addEventListener('visibilitychange', () => { if (document.hidden && DOC && TEAM && TEAM_DIRTY) teamSync(); });
boot();
