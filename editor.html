<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Resume Editor | TrulyPlaced</title>
<meta name="description" content="Edit your resume with AI suggestions, tailor it to a job, and download a clean PDF.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0938d5">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='116' fill='%230938d5'/%3E%3Cpath d='M256 410C168 314 138 278 138 206 138 142 191 94 256 94s118 48 118 112c0 72-30 108-118 204z' fill='%23fff'/%3E%3Cpath d='M205 200l37 36 76-88' fill='none' stroke='%230938d5' stroke-width='30' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://yubgrhxdhofnynfocpef.supabase.co" crossorigin>
<link rel="preload" as="script" href="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<style id="pageCss">@page{size:letter;margin:.5in}</style>
<style>
:root{--blue:#0938d5;--blue-d:#072ca8;--blue-soft:#eef2ff;--blue-line:#cfd9ff;--ink:#121a33;--body:#4b5473;--muted:#737b9c;
  --line:#e7e9f2;--bg:#f2f4fa;--ok:#0a7f46;--ok-soft:#e6f6ee;--warn:#b45309;--warn-soft:#fff4e0;--bad:#be123c;--bad-soft:#ffe9ee;
  --vio:#6d28d9;--vio-soft:#f3eeff;color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--body);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue)}
[hidden]{display:none!important}
svg{flex:none}

/* ---------- app chrome ---------- */
.top{position:sticky;top:0;z-index:40;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:10px 18px;min-height:58px}
.brand{display:flex;align-items:center;gap:9px;font:700 16px Poppins,Inter,sans-serif;color:var(--ink);text-decoration:none}
.brand img{width:28px;height:28px;border-radius:8px}
.tabs{display:flex;background:var(--bg);border-radius:10px;padding:3px;gap:2px}
.tabs button{border:0;background:none;padding:6px 14px;border-radius:8px;font-weight:600;font-size:13.5px;color:var(--body)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(18,26,51,.14)}
.top .sp{flex:1}
.status{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.status i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.status.busy i{background:var(--warn)}
.toplink{font-size:13.5px;font-weight:600;text-decoration:none;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:600;font-size:14px;text-decoration:none;transition:.15s}
.btn:hover{border-color:var(--blue-line);background:#fafbff}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.pri:hover{background:var(--blue-d)}
.btn.ai{background:linear-gradient(135deg,#6d28d9,#0938d5);border:0;color:#fff}
.btn.ai:hover{filter:brightness(1.08)}
.btn.sm{min-height:32px;padding:0 11px;font-size:13px;border-radius:8px}
.btn.wide{width:100%}
.btn svg{width:17px;height:17px}
.btn[disabled]{opacity:.55;cursor:default}

.wrap{display:grid;grid-template-columns:minmax(0,1fr) 352px;min-height:calc(100vh - 58px)}
.canvas{min-width:0;padding:14px 20px 80px;position:relative}
.tb{position:sticky;top:68px;z-index:30;display:flex;justify-content:flex-end;max-width:816px;margin:0 auto 12px;pointer-events:none}
.tbi{pointer-events:auto;display:flex;align-items:center;gap:2px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px;box-shadow:0 6px 20px -10px rgba(18,26,51,.25);flex-wrap:wrap}
.tbi button{height:36px;min-width:36px;border:0;background:none;border-radius:8px;display:grid;place-items:center;color:var(--body);position:relative}
.tbi button:hover,.tbi button.on{background:var(--bg);color:var(--ink)}
.tbi button[disabled]{opacity:.3;cursor:default;background:none}
.tbi button svg{width:18px;height:18px}
.tbi .dv{width:1px;height:22px;background:var(--line);margin:0 3px}
.tbi .dl{display:flex;gap:6px;padding:0 12px;background:var(--blue);color:#fff;font-weight:600;font-size:13.5px}
.tbi .dl:hover{background:var(--blue-d);color:#fff}
.tbi [data-tip]:hover::after{content:attr(data-tip);position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:11.5px;font-weight:500;padding:3px 8px;border-radius:6px;white-space:nowrap;pointer-events:none;z-index:5}
.pop{position:absolute;z-index:35;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 50px -14px rgba(18,26,51,.35);padding:14px;width:300px;max-width:calc(100vw - 32px);max-height:min(76vh,640px);overflow:auto}
.pop h4{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:14px 0 7px;display:flex;justify-content:space-between}
.pop h4:first-child{margin-top:0}
.pop h4 span{text-transform:none;letter-spacing:0;color:var(--ink);font-weight:600}
.pop select{width:100%;height:38px;border:1px solid var(--line);border-radius:9px;padding:0 10px;background:#fff}
.pop input[type=range]{width:100%;accent-color:var(--blue)}
.so{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:9px;padding:5px 6px 5px 8px;margin-bottom:5px;background:#fff;font-size:13.5px;color:var(--ink)}
.so.drag{opacity:.4}.so.over{border-color:var(--blue)}
.so .grip{cursor:grab;color:#b3b9cf;letter-spacing:-2px;font-weight:700;user-select:none}
.so .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.so.off .nm{color:#a3a9c0;text-decoration:line-through}
.so button{border:0;background:none;width:26px;height:26px;border-radius:6px;color:var(--muted);display:grid;place-items:center}
.so button:hover{background:var(--bg);color:var(--ink)}
.so button svg{width:15px;height:15px}
.seg{display:flex;background:var(--bg);border-radius:9px;padding:3px}
.seg button{flex:1;border:0;background:none;border-radius:7px;padding:6px;font-size:13px;font-weight:600;color:var(--body)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(18,26,51,.12)}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.sw button.on{box-shadow:0 0 0 2px var(--ink)}
.lays{display:grid;gap:8px}
.lay{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:11px;padding:8px;background:#fff;text-align:left}
.lay.on{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.lay svg{width:54px;height:70px;border:1px solid var(--line);border-radius:4px;background:#fff}
.lay b{display:block;color:var(--ink);font-size:14px}.lay span{font-size:12.5px;color:var(--muted)}
.chk{display:flex;gap:10px;align-items:center;padding:7px 4px;font-size:14px;color:var(--ink);cursor:pointer}
.chk input{width:17px;height:17px;accent-color:var(--blue)}
.dlo{display:flex;gap:12px;align-items:flex-start;width:100%;border:1px solid var(--line);border-radius:11px;padding:11px;background:#fff;text-align:left;margin-bottom:8px}
.dlo:hover{border-color:var(--blue)}
.dlo svg{width:22px;height:22px;color:var(--blue);margin-top:1px}
.dlo b{display:block;color:var(--ink)}.dlo span{font-size:12.5px;color:var(--muted)}

/* ---------- the page ---------- */
.stage{position:relative;display:flex;justify-content:center}
.pane{display:none;justify-content:center;width:100%}
.pane.on{display:flex}
.paper{--pw:816px;--ph:1056px;--mg:.5in;--fs:10.5pt;--lh:1.2;--ff:"Times New Roman",Times,serif;--al:left;--ac:#0938d5;
  position:relative;flex:none;width:var(--pw);min-height:var(--ph);padding:var(--mg);background:#fff;color:#111;font-family:var(--ff);font-size:var(--fs);line-height:var(--lh);text-align:var(--al);
  box-shadow:0 1px 3px rgba(18,26,51,.08),0 16px 44px -16px rgba(18,26,51,.22);border-radius:2px;overflow-wrap:break-word}
.paper [contenteditable]{outline:none;border-radius:2px;transition:background .12s}
.paper [contenteditable]:hover{background:rgba(9,56,213,.045)}
.paper [contenteditable]:focus{background:rgba(9,56,213,.07);box-shadow:0 0 0 1px rgba(9,56,213,.35)}
.paper [contenteditable]:empty::before{content:attr(data-ph);color:#a1a7bd;font-style:italic}
.paper .en:not(:hover):not(:focus-within) .er [contenteditable]:empty::before{content:none}
.paper .ph-h{text-align:center;position:relative}
.paper .ph-h h1{font-size:2em;line-height:1.15;font-weight:700}
.paper .ph-h .hlt{font-size:1.08em;margin-top:.05em}
.paper .ph-h .hlt.hlx{background:#fff2b8;box-shadow:0 0 0 2px #fff2b8}
.paper .ct{margin-top:.2em;font-size:.95em}
.paper .ct .sep{margin:0 .4em;color:#555}
.paper .ct .pref{font-style:italic}
.paper .ps{margin-top:.6em;position:relative}
.paper .ps>h2{font-size:1.1em;font-weight:700;text-transform:uppercase;border-bottom:1px solid #111;margin-bottom:.3em;line-height:1.3;letter-spacing:.01em}
.paper .en{position:relative;margin-top:.35em}
.paper .en:first-of-type{margin-top:0}
.paper .er{display:flex;justify-content:space-between;align-items:baseline;gap:1em}
.paper .er .l{flex:1;min-width:0}
.paper .er .r{flex:none;text-align:right;max-width:45%}
.paper .er1 .l,.paper .er1 .r{font-weight:700}
.paper .er2{font-style:italic}
.paper .en:not(:hover):not(:focus-within)>.er2.opt{display:none}
.paper .bl{padding-left:1.3em;margin:.12em 0 0}
.paper .bl li{margin:.06em 0;padding-left:.15em}
.paper .bl li>span{display:inline}
.paper .sk>div{margin:.06em 0}
.paper .sk b{font-weight:700}
.paper .sum{text-align:var(--al)}
.paper mark{color:inherit;border-radius:2px}
.paper mark.ph{background:#fff0b3;box-shadow:0 0 0 1px #f3d36b}
.paper mark.add{background:#fde9a8;box-shadow:0 0 0 1px #f0c445}
.paper .prt{display:none}
/* layouts */
.paper.L-classic .ph-h h1{font-size:2.35em;font-variant:small-caps;letter-spacing:.02em;font-weight:700}
.paper.L-classic .ps>h2{font-variant:small-caps;text-transform:none;font-size:1.28em;font-weight:600;letter-spacing:.02em}
.paper.L-classic .er1 .r{font-weight:400}
.paper.L-classic .er2 .r{font-style:italic}
.paper.L-modern .ph-h{text-align:left}
.paper.L-modern .ph-h h1{color:var(--ac);font-size:2.15em;letter-spacing:-.01em}
.paper.L-modern .ps>h2{color:var(--ac);letter-spacing:.1em;font-size:.95em;border-bottom:2px solid var(--ac);padding-bottom:.1em}
.paper.L-modern .er1 .r{font-weight:600;color:#4a4f60}
.paper.L-modern .er2{color:#3c4150}
/* cover letter */
.paper .cv-date{margin-top:1.6em}
.paper .cv-to{margin-top:1em;white-space:pre-wrap}
.paper .cv-body{margin-top:1em;white-space:pre-wrap;min-height:20em;text-align:var(--al)}
/* on-page tools (never printed) */
.nopr{font-family:Inter,sans-serif;line-height:1.3}
.etools,.stools{position:absolute;right:0;top:-1.7em;display:none;gap:4px;z-index:4;font-size:12px;text-align:left}
.stools{top:-.2em;right:0}
.en:hover>.etools,.en:focus-within>.etools,.ps:hover>.stools,.ps:focus-within>.stools,.ph-h:hover>.stools{display:flex}
.etools button,.stools button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 10px;font:600 11.5px Inter,sans-serif;color:var(--body);box-shadow:0 2px 8px -3px rgba(18,26,51,.25);white-space:nowrap}
.etools button:hover,.stools button:hover{border-color:var(--blue);color:var(--blue)}
.etools .ai,.stools .ai{color:var(--vio);border-color:#ddd0ff;background:#faf7ff}
.pbrk{position:absolute;left:-14px;right:-14px;border-top:1.5px dashed #c3c9de;pointer-events:none;z-index:2}
.pbrk span{position:absolute;right:16px;top:-10px;background:var(--bg);font:600 10.5px Inter,sans-serif;color:#7d84a3;padding:1px 7px;border-radius:99px;border:1px solid #d9deec}
/* suggestions */
.sug{display:grid;grid-template-columns:1fr 1fr;gap:.6em;margin:.3em 0 .25em;font-size:.97em}
.sug .o,.sug .n,.msug .mo,.msug .mn{border-radius:6px;padding:.45em .7em}
.sug .o,.msug .mo{background:#fff2f2;border:1px solid #f2b9b9}
.sug .n,.msug .mn{background:#ebf8f0;border:1px solid #a7dbbb}
.sug,.msug{font-family:var(--ff);line-height:var(--lh)}
.sug b.k{display:block;font:700 11px Inter,sans-serif;color:#b42318;margin-bottom:.2em}
.sug .n b.k{color:#0a7f46}
.sug ul{padding-left:1.15em}
.sug li{margin:.08em 0}
.sug [contenteditable]{outline:none}
.sug [contenteditable]:focus{background:#fff}
.sacts{grid-column:1/-1;display:flex;gap:6px;align-items:center;flex-wrap:wrap;font:12px Inter,sans-serif;margin-top:.1em}
.sacts .ok,.sacts .no{border:0;border-radius:6px;padding:5px 13px;font:600 12px Inter,sans-serif}
.sacts .ok{background:#0a7f46;color:#fff}.sacts .ok:hover{background:#086b3b}
.sacts .no{background:#e6e8ef;color:#333}.sacts .no:hover{background:#d9dce6}
.sacts .hint{color:#8a6a00;font-size:11.5px}
.sacts .busy{color:#b77800;font-weight:600}
.msug{list-style:none;margin:.25em 0 .3em -1.3em;display:grid;gap:.3em}
.msug .mo{text-decoration:line-through;text-decoration-color:rgba(180,35,24,.45);color:#5b2b2b}
.shim{display:grid;gap:.45em;padding:.3em 0}
.shim i{display:block;height:.75em;border-radius:4px;background:linear-gradient(90deg,#d5eedd 0,#f1fbf4 40%,#d5eedd 80%);background-size:300% 100%;animation:sh 1.2s linear infinite}
.shim i:nth-child(2n){width:86%}
@keyframes sh{to{background-position:-150% 0}}
/* bullet toolbar */
#btb{position:absolute;z-index:25;display:flex;gap:2px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:2px;box-shadow:0 6px 18px -8px rgba(18,26,51,.35)}
#btb button{width:30px;height:28px;border:0;background:none;border-radius:6px;display:grid;place-items:center;color:var(--body)}
#btb button:hover{background:var(--bg)}
#btb .add{color:var(--ok)}#btb .del{color:var(--bad)}#btb .ai{color:var(--vio)}
#btb svg{width:16px;height:16px}
#bmenu{position:absolute;z-index:26;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px -10px rgba(18,26,51,.35);padding:4px;min-width:210px}
#bmenu button{display:flex;gap:9px;align-items:center;width:100%;border:0;background:none;padding:8px 10px;border-radius:7px;text-align:left;font-size:13.5px;color:var(--ink)}
#bmenu button:hover{background:var(--bg)}
#bmenu svg{width:18px;height:18px;color:var(--vio)}
#bmenu small{display:block;color:var(--muted);font-size:11.5px}

/* ---------- side panel ---------- */
.side{background:#fff;border-left:1px solid var(--line);padding:18px 18px 40px;position:sticky;top:58px;height:calc(100vh - 58px);overflow:auto}
.side h3{font:600 15px Poppins,Inter,sans-serif;color:var(--ink);margin:22px 0 8px}
.side .fine{font-size:12.5px;color:var(--muted);line-height:1.5}
.score{display:flex;gap:14px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:14px}
.ring{--v:0;--c:#be123c;flex:none;width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--v)*1%),#eef0f6 0);transition:--v .4s}
.ring span{width:58px;height:58px;border-radius:50%;background:#fff;display:grid;place-items:center;font:700 20px Poppins,Inter,sans-serif;color:var(--ink)}
.score b{display:block;color:var(--ink);font-size:15px}
.score p{font-size:12.5px;color:var(--muted);margin-top:2px}
.score .up{color:var(--ok);font-weight:700}
.pend{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--ok-soft);color:#075a33;border-radius:12px;padding:10px 12px;margin-top:12px;font-size:13px;font-weight:600}
.pend .sp{flex:1}
.ainote{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.45}
.tips{display:flex;flex-direction:column;gap:8px}
.tip{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start}
.tip .dot{flex:none;width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--warn)}
.tip.hi .dot{background:var(--bad)}.tip.ok .dot{background:var(--ok)}
.tip .tx{flex:1;min-width:0}
.tip b{display:block;color:var(--ink);font-size:13.5px;line-height:1.35}
.tip p{font-size:12.5px;color:var(--muted);margin-top:2px}
.tip .btn{margin-top:7px}
.alldone{display:flex;gap:10px;align-items:center;background:var(--ok-soft);color:#075a33;border-radius:12px;padding:11px 12px;font-size:13.5px;font-weight:600}
.job{border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.job .jt{display:flex;gap:8px;align-items:flex-start}
.job .jt b{flex:1;color:var(--ink);font-size:13.5px;line-height:1.35}
.job .jt button{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:0 2px}
.jm{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:13px}
.jm .bar{flex:1;height:7px;border-radius:9px;background:#eef0f6;overflow:hidden}
.jm .bar i{display:block;height:100%;border-radius:9px;background:var(--blue)}
.kws{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.kw{border:1px dashed #c8cee2;background:#fff;border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600;color:var(--ink)}
.kw:hover{border-color:var(--blue);color:var(--blue);border-style:solid}
.kw.have{border:1px solid #b8e2c8;background:var(--ok-soft);color:#075a33;cursor:default}
.side textarea{width:100%;min-height:96px;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:13.5px;resize:vertical}
.side input[type=text]{width:100%;height:40px;border:1px solid var(--line);border-radius:10px;padding:0 11px;font-size:14px}
.side label.f{display:block;font-size:12.5px;font-weight:600;color:var(--ink);margin:10px 0 5px}
.callc{border-radius:14px;padding:15px 16px;background:linear-gradient(135deg,#0a31bd,#0938d5);color:#fff;margin-top:22px}
.callc b{font:600 15px Poppins,Inter,sans-serif;display:block;line-height:1.35;color:#fff}
.callc p{font-size:13px;color:rgba(255,255,255,.88);margin-top:4px}
.callc .btn{margin-top:10px;background:#fff;color:var(--blue);border-color:#fff}
.sidefoot{margin-top:22px;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px;font-size:13px}
.sidefoot button{border:0;background:none;color:var(--blue);text-align:left;padding:3px 0;font-weight:600}

/* ---------- start / gate / banners ---------- */
.center{max-width:560px;margin:48px auto;padding:0 16px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:0 12px 40px -24px rgba(18,26,51,.3)}
.card h1{font:700 23px Poppins,Inter,sans-serif;color:var(--ink);line-height:1.25}
.card>p{margin-top:6px}
.card ul{list-style:none;margin-top:16px;display:grid;gap:8px;font-size:14px}
.card li{display:flex;gap:10px}
.card li svg{width:18px;height:18px;color:var(--ok);margin-top:2px}
.drop{margin-top:18px;border:2px dashed var(--blue-line);border-radius:14px;padding:26px;text-align:center;background:#fafbff;cursor:pointer;transition:.15s}
.drop:hover,.drop.over{border-color:var(--blue);background:var(--blue-soft)}
.drop svg{width:30px;height:30px;color:var(--blue)}
.drop b{display:block;color:var(--ink);margin-top:6px}
.drop span{font-size:13px;color:var(--muted)}
.gbtn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:52px;margin-top:20px;border:1px solid #d8dce8;border-radius:12px;background:#fff;color:var(--ink);font:600 15px Inter,sans-serif;text-decoration:none}
.gbtn:hover{border-color:var(--blue)}
.gbtn svg{width:20px;height:20px}
.or{display:flex;align-items:center;gap:10px;margin:16px 0 0;font-size:12.5px;color:var(--muted)}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.loading{display:flex;gap:12px;align-items:center;justify-content:center;padding:60px 16px;color:var(--muted)}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--blue-soft);border-top-color:var(--blue);animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.banner{max-width:816px;margin:0 auto 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--blue-soft);border:1px solid var(--blue-line);color:var(--ink);border-radius:12px;padding:10px 14px;font-size:13.5px}
.banner .sp{flex:1;min-width:160px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:90;transition:.2s;display:flex;gap:12px;align-items:center;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast button{border:0;background:none;color:#9db4ff;font-weight:700}
.modal{position:fixed;inset:0;z-index:80;background:rgba(18,26,51,.45);display:grid;place-items:center;padding:16px}
.modal .card{max-width:440px;width:100%}
.modal h2{font:700 19px Poppins,Inter,sans-serif;color:var(--ink)}
.modal p{margin-top:6px}
.modal .acts{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}

/* ---------- embedded next to a job (inside the job board) ---------- */
.tbtabs{display:none}
body.embed{background:#eef1f8}
body.embed .top,body.embed .side,body.embed .status{display:none!important}
body.embed .wrap{grid-template-columns:1fr;min-height:100vh}
body.embed .canvas{padding:10px 14px 70px}
body.embed .tb{top:8px;justify-content:space-between;max-width:none;gap:10px}
body.embed .tbtabs{display:flex;pointer-events:auto;background:#fff;border:1px solid var(--line);box-shadow:0 6px 20px -10px rgba(18,26,51,.25);align-self:flex-start}
body.embed .banner{max-width:none}
.tbi .optb{display:flex;gap:6px;padding:0 12px;background:linear-gradient(135deg,#6d28d9,#0938d5);color:#fff;font-weight:600;font-size:13.5px}
.tbi .optb:hover{color:#fff;filter:brightness(1.1);background:linear-gradient(135deg,#6d28d9,#0938d5)}
@media (max-width:760px){.tbi .dl span,.tbi .optb span{display:none}.tbi .optb,.tbi .dl{padding:0 10px}}
/* changed lines stay highlighted until you edit them */
.paper .hl{background:#fff2b8;box-shadow:0 0 0 2px #fff2b8;border-radius:2px;animation:hlIn .9s ease}
.paper li.b.hl{box-shadow:-.35em 0 0 #fff2b8,0 0 0 2px #fff2b8}
@keyframes hlIn{from{background:#ffd84d;box-shadow:0 0 0 2px #ffd84d}}
/* cover letter bar */
.cvcol{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
.cvbar{width:100%;max-width:816px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 10px;box-shadow:0 6px 20px -14px rgba(18,26,51,.3)}
.cvbar input{height:36px;border:1px solid var(--line);border-radius:9px;padding:0 10px;font-size:13.5px;min-width:0;flex:1 1 140px}
.cvbar span{font-size:13px;color:var(--muted)}
.cvbar .btn{flex:none}
.paper .cv-wait{color:#8a91ad;font-family:Inter,sans-serif;font-size:13px}
.paper .cv-wait b{display:flex;gap:8px;align-items:center;color:var(--vio);margin-bottom:12px}
.wpill{position:fixed;right:18px;bottom:18px;z-index:70;display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:13.5px;color:var(--ink);box-shadow:0 14px 34px -14px rgba(18,26,51,.4)}
.wpill .spin{width:16px;height:16px;border-width:2px}
/* add-section picker */
.adds{display:grid;gap:6px}
.addb{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;background:#fff;padding:9px 11px;font-size:14px;color:var(--ink);text-align:left}
.addb:hover{border-color:var(--blue);background:#fafbff}
.addb svg{width:17px;height:17px;color:#d4a017}
.addb.new svg{color:var(--blue)}
/* optimise flow */
.modal{animation:mFade .18s ease}
.modal>*{animation:mIn .26s cubic-bezier(.2,.9,.3,1.15)}
@keyframes mFade{from{opacity:0}}
@keyframes mIn{from{opacity:0;transform:translateY(10px) scale(.97)}}
.om{position:relative;background:#fff;border-radius:18px;box-shadow:0 30px 80px -20px rgba(10,16,38,.5);width:100%;color:var(--body)}
.om .mx{position:absolute;right:12px;top:12px;width:34px;height:34px;border:0;background:none;border-radius:9px;color:var(--muted);display:grid;place-items:center}
.om .mx:hover{background:var(--bg);color:var(--ink)}
.om .mx svg{width:18px;height:18px}
.om h2{font:700 22px Poppins,Inter,sans-serif;color:var(--ink);letter-spacing:-.01em}
.omsub{font-size:13.5px;color:var(--muted);margin-top:4px}
.omsub b{color:var(--ink)}
.om-pick{max-width:470px;padding:26px 26px 22px;text-align:center}
.orows{margin-top:16px;text-align:left;border-top:1px solid var(--line)}
.orow{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:12px 2px;font-size:15px;color:var(--ink)}
.orow .pill{font-size:12.5px;font-weight:600;border-radius:999px;padding:4px 11px;background:var(--bg);color:var(--muted);transition:.15s}
.orow.on .pill{background:#ddf6e8;color:#0a7f46}
.orow:hover .pill{box-shadow:0 0 0 1px #bfe8d0}
.omlbl{display:block;text-align:left;font-weight:600;color:var(--ink);font-size:13.5px;margin:16px 0 6px}
.omlbl span{color:var(--muted);font-weight:500}
.om textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13.5px;resize:vertical;min-height:72px}
.om textarea:focus,.cvbar input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.omgo{margin-top:16px;background:var(--ink);color:#fff;border-color:var(--ink);border-radius:999px;padding:0 26px;min-height:44px}
.omgo:hover{background:#000;border-color:#000}
.om-run{max-width:440px;padding:30px 28px 26px;text-align:center}
.orbit{width:64px;height:64px;margin:0 auto 14px;border-radius:50%;background:conic-gradient(from 0deg,#6d28d9,#0938d5,#22c1ee,#6d28d9);animation:rot 1.1s linear infinite;display:grid;place-items:center}
.orbit span{width:52px;height:52px;border-radius:50%;background:#fff}
.steps{list-style:none;text-align:left;margin:20px auto 0;display:grid;gap:10px;max-width:330px;font-size:14px}
.steps li{display:flex;gap:10px;align-items:center;color:var(--muted);transition:color .2s}
.steps li i{width:20px;height:20px;border-radius:50%;border:2px solid #d8dcea;flex:none;position:relative;transition:.25s}
.steps li.ok{color:var(--ink)}
.steps li.ok i{background:#0a7f46;border-color:#0a7f46}
.steps li.ok i::after{content:"";position:absolute;left:5px;top:2px;width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.om-run .fine{margin-top:16px;font-size:12.5px;color:var(--muted)}
.om-res{max-width:940px;display:flex;flex-direction:column;max-height:min(88vh,900px)}
.omh{padding:24px 26px 12px}
.omb{overflow:auto;padding:4px 26px 16px;display:grid;gap:14px}
.omf{display:flex;gap:10px;align-items:center;justify-content:flex-end;padding:14px 26px;border-top:1px solid var(--line)}
.omf #omCount{flex:1;font-size:13px;color:var(--muted)}
.btn.grn{background:#0a7f46;border-color:#0a7f46;color:#fff}
.btn.grn:hover{background:#086b3b}
.btn.grn[disabled]{background:#e4f5ec;border-color:#e4f5ec;color:#0a7f46;opacity:1}
.rc{border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.rc h3{font-size:14px;font-weight:600;color:var(--ink);padding-bottom:10px;border-bottom:1px solid #f0f1f6;margin-bottom:10px}
.rh{display:grid;grid-template-columns:1fr 1fr;gap:12px;font:700 11px Inter,sans-serif;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.rh .k1{color:#c03535}.rh .k2{color:#0a7f46}
.rr{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px;animation:rIn .35s ease both;animation-delay:var(--d)}
@keyframes rIn{from{opacity:0;transform:translateY(6px)}}
.ro,.rn{border-radius:10px;padding:10px 12px 10px 24px;font-size:13.5px;line-height:1.55;position:relative}
.ro::before,.rn>span::before{content:"•";position:absolute;left:11px;top:9px}
.ro{background:#fff3f3;border:1px solid #f6caca;color:#9b2c2c}
.rn{background:#f1fbf5;border:1px solid #bfe6cf;color:#155f37;display:flex;flex-direction:column;gap:6px;transition:.25s}
.rn>span{outline:none}
.rn>span:focus{background:#fff;border-radius:4px;box-shadow:0 0 0 2px #bfe6cf}
.rn small{font-size:11.5px;color:#5f7a6b}
.rb{display:flex;gap:6px;justify-content:flex-end;margin-top:auto}
.rb button{width:30px;height:26px;border:0;border-radius:7px;color:#fff;font-weight:700;display:grid;place-items:center;transition:transform .12s}
.rb button:hover{transform:translateY(-1px)}
.rb .ok{background:#0a7f46}.rb .no{background:#e04848}
.rb .st{font-size:12px;font-weight:700;color:#0a7f46;display:flex;align-items:center;gap:5px}
.rr.acc .rn{background:#e2f6ea;border-color:#86cfa4}
.rr.rej .rn{opacity:.45}
.rr.rej .ro{background:#fff;border-color:#e4e6ee;color:var(--ink)}
.rr.rej .rb .st{color:var(--muted)}
.rdone{display:flex;flex-direction:column;align-items:center;gap:4px;padding:18px 0 10px;text-align:center}
.rdone span{width:38px;height:38px;border-radius:50%;background:#e2f6ea;display:grid;place-items:center;font-size:17px;margin-bottom:4px}
.rdone b{color:var(--ink);font-size:14.5px}
.rdone small{color:var(--muted);font-size:12.5px}
.rnote{font-size:13px;color:var(--muted);margin-bottom:10px}
.rsk{display:flex;flex-wrap:wrap;gap:8px}
.rsk label{display:flex;gap:7px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:6px 12px 6px 9px;font-size:13.5px;font-weight:600;color:var(--ink);cursor:pointer;transition:.15s}
.rsk input{accent-color:#0a7f46;width:15px;height:15px}
.rsk label:has(input:checked){background:#e2f6ea;border-color:#86cfa4;color:#0a5c33}
.omjd{text-align:left;margin-top:14px}
@media (max-width:640px){
  .rr,.rh{grid-template-columns:1fr}
  .rh .k2{display:none}
  .omh,.omb,.omf{padding-left:16px;padding-right:16px}
  .om-pick{padding:22px 18px 18px}
}

@media (max-width:1060px){
  .wrap{grid-template-columns:1fr}
  .side{position:static;height:auto;border-left:0;border-top:1px solid var(--line)}
}
@media (max-width:640px){
  .top{gap:8px;padding:8px 12px}
  .brand span,.toplink.hide-m{display:none}
  .status{display:none}
  .canvas{padding:10px 12px 60px}
  .tb{top:62px}
  .tabs button{padding:6px 10px}
  .tbi .dl span{display:none}
  .tbi .dl{padding:0 10px}
}

@media print{
  html,body{background:#fff!important}
  .top,.side,.tb,.pop,#btb,#bmenu,.nopr,.banner,.toast,.modal,.pbrk,#gate,#start{display:none!important}
  .wrap,.canvas,.stage{display:block!important;padding:0!important;margin:0!important;background:#fff!important}
  .pane.on{display:block!important}
  .pane:not(.on){display:none!important}
  .paper{box-shadow:none!important;width:auto!important;min-height:0!important;padding:0!important;zoom:1!important;border-radius:0}
  .paper .prt{display:block!important}
  .paper li.prt{display:list-item!important}
  .paper mark{background:none!important;box-shadow:none!important}
  .paper [contenteditable]:empty,.paper .opt{display:none!important}
  .paper [contenteditable]{box-shadow:none!important;background:none!important}
  .paper .hl,.paper li.b.hl{background:none!important;box-shadow:none!important}
  .paper .en,.paper .bl li{break-inside:avoid}
  .paper .ps>h2{break-after:avoid}
}
</style>

'use strict';
/* =====================================================================
   TrulyPlaced resume editor.
