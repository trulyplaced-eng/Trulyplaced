name: Update job listings

on:
  schedule:
    - cron: '17 */3 * * *'   # every 3 hours
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-jobs
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch every company's job board
        run: python .github/scripts/update_jobs.py
      - name: Save jobs.json
        run: |
          git config user.name "TrulyPlaced bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs.json
          git diff --cached --quiet || (git commit -m "Update job listings" && git push)
