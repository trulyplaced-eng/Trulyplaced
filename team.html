<link rel="stylesheet" href="/portal.css?v=2026-10-28.1">
<style>
/* The shell, laid out like the job board app (app.trulyplaced.com): a left sidebar with the sections, the clients open in
   this browser tab, the client you're working on with their progress, and you. Phones get a top bar and a tab bar. */
:root{--side:248px}
.ph{display:none}
.ws{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh}
.sb{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;background:#fafafa;border-right:1px solid rgba(0,0,0,.06);overflow-y:auto;scrollbar-width:thin}
.sb .brand{height:64px;padding:0 20px}
.nav{display:flex;flex-direction:column;gap:2px;padding:0 12px}
.nav a{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:8px;color:#525252;text-decoration:none;font-size:15px;line-height:1.35;min-width:0}
.nav a svg{width:18px;height:18px;flex:none}
.nav a span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav a:hover{background:rgba(0,0,0,.03);color:#171717}
.nav a.on{background:rgba(0,0,0,.06);color:#171717;font-weight:500}
.nav a.on svg{color:var(--blue)}
.nav a em{font-style:normal;font-size:12px;font-weight:500;line-height:20px;min-width:20px;text-align:center;color:#fff;background:#171717;border-radius:999px;padding:0 6px}
/* the clients open in this browser tab, under Clients */
.otabs{display:flex;flex-direction:column;gap:1px;margin:2px 0 6px 21px;padding-left:9px;border-left:1px solid rgba(0,0,0,.08)}
.otab{display:flex;align-items:center;gap:8px;min-height:32px;padding:0 4px 0 10px;border-radius:8px;font-size:13.5px;color:#525252;text-decoration:none;min-width:0}
.otab:hover{background:rgba(0,0,0,.03);color:#171717}
.otab.on{background:rgba(0,0,0,.06);color:#171717;font-weight:500}
.otab i{width:8px;height:8px;border-radius:50%;flex:none}
.otab span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.otab button{width:24px;height:24px;flex:none;border:0;background:none;border-radius:6px;display:grid;place-items:center;color:var(--muted);opacity:0}
.otab:hover button,.otab.on button,.otab button:focus-visible{opacity:1}
.otab button:hover{background:rgba(0,0,0,.06);color:var(--ink)}
.otab button svg{width:12px;height:12px}
.otab.add{gap:6px;color:var(--blue);font-weight:500}
/* the client you're working on: who, their sections and, at the bottom, their progress */
#cbar{flex:1;display:flex;flex-direction:column;min-height:0}
.cbar{flex:1;display:flex;flex-direction:column;margin-top:12px;padding-top:14px;border-top:1px solid rgba(0,0,0,.06)}
.cb1{padding:0 14px 10px 20px}
.cb1 .lab{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--client)}
.cbw{display:flex;align-items:center;gap:10px;margin-top:6px;min-width:0}
.cbw .av{width:34px;height:34px;font-size:12.5px}
.cbw .who{flex:1;min-width:0;line-height:1.3}
.cbw .nm{font-weight:600;font-size:14.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cbw .nm .st{margin-left:4px;font-size:10.5px;padding:1px 7px}
.cbw small{display:block;font-size:12px;color:#737373;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cbw .icb{width:32px;height:32px}
.cbar .grow{flex:1;min-height:12px}
.pgcard{border-top:1px solid rgba(0,0,0,.06);padding:14px 20px 16px}
.pgcard .lab{display:block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#737373}
.pgcard .pg{margin-top:2px;font-size:12px;color:#737373}
.pgcard .pg b{font-size:24px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.pgcard .prog{height:4px;margin-top:8px;background:rgba(0,0,0,.06)}
/* you */
.me{flex:none;display:flex;align-items:center;gap:10px;padding:12px 12px 12px 16px;border-top:1px solid rgba(0,0,0,.06);min-width:0}
.me .mw{flex:1;min-width:0;line-height:1.3}
.me .mw b{display:block;font-size:14px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me .mw small{display:block;font-size:12px;color:#737373;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me .icb{width:32px;height:32px}
/* the page, with a title line saying whose page it is */
.content{min-width:0}
.content .wrap{padding-top:28px}
.phead{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 14px;margin-bottom:16px}
.phead h1{font-size:24px}
.pfor{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;color:var(--muted)}
.pfor i{width:9px;height:9px;border-radius:50%;flex:none}
.pfor b{color:var(--ink);font-weight:600}
.top,.tabbar{display:none}

/* client list */
.crow .pgc{flex:none;width:170px}
.crow .pgc b{font-size:13px;color:var(--ink)}
.crow .pgc .m{font-size:12px}
.crow .td{flex:none;width:88px;text-align:right;font-size:12.5px;color:var(--muted)}
.crow .td b{display:block;color:var(--ink);font-size:14px}
.crow .td.zero b{color:var(--warn)}
.chev{width:18px;height:18px;color:#b3b9cf;flex:none}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-family:Poppins;font-size:21px;color:var(--ink);line-height:1.2}
.stat span{font-size:12.5px;color:var(--muted)}

/* application page */
.ahead{display:flex;gap:14px;align-items:flex-start}
.ahead h2{font-size:21px}
.ahead .m{font-size:13.5px;color:var(--muted);margin-top:3px}
.step{display:flex;gap:12px;align-items:flex-start}
.step .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--blue-soft);color:var(--blue);font-weight:700;font-size:13px;display:grid;place-items:center;margin-top:1px}
.step .n.ok{background:var(--ok-soft);color:var(--ok)}
.step .bd{flex:1;min-width:0}
.qa{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) auto;gap:8px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}
.qa:first-child{border-top:0}
.qa textarea.inp{min-height:44px;padding:10px 12px}
.qa .ic{display:flex;gap:4px}
.icb{width:36px;height:36px;border:1px solid var(--line);border-radius:9px;background:#fff;display:grid;place-items:center;color:var(--muted);flex:none}
.icb:hover{color:var(--ink);border-color:#cdd3e6}
.icb svg{width:16px;height:16px}
.qa-ro{padding:10px 0;border-top:1px solid var(--line)}
.qa-ro:first-child{border-top:0}
.qa-ro b{display:block;font-size:13px;color:var(--ink)}
.qa-ro div{font-size:14px;white-space:pre-wrap}
.drop{border:2px dashed #cfd6ea;border-radius:14px;padding:18px;text-align:center;background:#fbfcff;cursor:pointer;font-size:13.5px}
.drop.over{border-color:var(--blue);background:var(--blue-soft)}
.drop svg{width:26px;height:26px;color:var(--blue)}
.drop b{display:block;color:var(--ink);margin-top:4px}
.drop img{max-height:220px;border-radius:10px;border:1px solid var(--line);margin-top:8px}
.saved{font-size:12px;color:var(--muted)}
.hist{display:grid;gap:0}
.hi{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:13.5px}
.hi:first-child{border-top:0}
.hi .dot{flex:none;width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--blue-line)}
.hi .dot.app_applied{background:var(--blue)}
.hi .dot.app_status{background:var(--violet)}
.hi .dot.note{background:var(--warn)}
.hi .dot.client_created,.hi .dot.invite_sent{background:var(--ok)}
.hi .dot.app_deleted,.hi .dot.resume_deleted{background:var(--bad)}
.hi .tx{flex:1;min-width:0}
.hi .tx b{color:var(--ink);font-weight:600}
.hi .tx small{display:block;color:var(--muted);font-size:12px}
.jbrow .side .btn{min-width:84px}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--bg);color:var(--body);margin-left:6px}
.sticky-save{position:sticky;bottom:0;background:linear-gradient(180deg,rgba(246,247,252,0),var(--bg) 30%);padding:16px 0 4px;display:flex;gap:10px;justify-content:flex-end;align-items:center}
.lock{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ok);font-weight:600}
.lock svg{width:14px;height:14px}
.kbd{font-size:11.5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:#fff}

/* Apply from links: the paste box, the list, the "next from your list" bar */
#lkIn{min-height:44px;height:44px;resize:none;overflow-y:hidden;padding:11px 12px;line-height:20px}
.lkbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:16px 0 10px}
.lkbar .grow{flex:1;min-width:180px}
.lkbar b{color:var(--ink);font-size:14.5px}
.lkbar .prog{margin-top:6px;max-width:300px}
.lkrow .side{gap:8px}
.lkrow .m.ok{color:var(--ok)}
.lkrow .m.warn{color:var(--warn)}
.lkrow .m.err{color:var(--bad)}
.lkrow .logo.wait{background:#eef0f6}
.lkneed{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 4px;max-width:560px}
.lkneed .inp{min-height:36px;font-size:13.5px;padding:0 10px}
.lkrow.skip{padding-top:9px;padding-bottom:9px}
.lkrow.skip .t{font-weight:500;color:var(--body)}
.lkskip{margin-top:14px}
.lkskip > .fine{margin-bottom:6px}
.lknext{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.lknext .grow{flex:1;min-width:200px}
.spin{display:inline-block;flex:none;width:16px;height:16px;border-radius:50%;border:2px solid;border-color:var(--blue) var(--blue) transparent transparent;animation:spin .7s linear infinite}

@media (max-width:900px){
  .crow .pgc{width:120px}
  .crow .td{display:none}
  .stats{grid-template-columns:repeat(2,1fr)}
  /* phones and small tablets: no sidebar; a top bar with the client, and their sections along the bottom */
  .ws{display:block}
  .sb{display:none}
  .top{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:30;height:56px;padding:0 10px 0 14px;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .top .brand svg{width:28px;height:28px}
  .top .tcl{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font-size:14.5px}
  .top .tcl b{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .top .grow{flex:1}
  .top .icb{width:36px;height:36px}
  .content .wrap{padding-top:16px;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  .phead h1{font-size:20px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));background:rgba(255,255,255,.97);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line)}
  .tabbar a{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;font-weight:600;color:var(--muted);text-decoration:none;border-radius:10px}
  .tabbar a span{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tabbar a.on{color:var(--ink)}
  .tabbar a.on svg{color:var(--blue)}
  .tabbar svg{width:22px;height:22px}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .sticky-save{bottom:calc(64px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:760px){
  .crow .pgc{width:92px}
  .crow .pgc .m{display:none}
  .qa{grid-template-columns:1fr}
  .qa .ic{justify-content:flex-end}
  .ahead{flex-wrap:wrap}
  .ahead > .row{width:100%}
  .ahead h2{font-size:18px}
  .ph{display:block}
  .pc{display:none!important}
  .lkneed{grid-template-columns:1fr}
  .lkrow .side .st{display:none}
}
</style>
</head>
<body>
<div class="ws">
  <aside class="sb" aria-label="Team portal">
    <a class="brand" href="/team.html" data-go><svg viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="116" fill="#0938d5"/><path d="M256 410C168 314 138 278 138 206 138 142 191 94 256 94s118 48 118 112c0 72-30 108-118 204z" fill="#fff"/><path d="M205 200l37 36 76-88" fill="none" stroke="#0938d5" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/></svg><span>TrulyPlaced<small>Team</small></span></a>
    <nav class="nav" id="pnav" aria-label="Main"></nav>
    <div id="cbar"></div>
    <div class="me" id="me"></div>
  </aside>
  <div class="content">
    <header class="top" id="top"></header>
    <main class="wrap"><div id="phead"></div><div id="view"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div></main>
  </div>
</div>
<nav class="tabbar" id="tabbar" aria-label="Sections"></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="modalRoot"></div>
<input type="file" id="fileIn" hidden>
<script src="/portal.js?v=2026-10-28.1"></script>
<script>
(function(){
"use strict";
var $ = TP.$, $$ = TP.$$, esc = TP.esc, I = TP.I, q = TP.q;
var J = {
  profile:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',
  resume:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg>',
  jobs:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',
  apps:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/></svg>',
  act:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>',
  link:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>',
  star:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></svg>',
  swap:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4 3 8l4 4"/><path d="M3 8h13a4 4 0 0 1 4 4"/><path d="m17 20 4-4-4-4"/><path d="M21 16H8a4 4 0 0 1-4-4"/></svg>'
};
var SB = null, ME = null, TEAMROWS = [], LIST = null, C = null, R = {}, GEN = 0, BOARD = null, BOARDP = null;
var V = $('#view');
var UUID = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
var TABS = [['profile', 'Profile', J.profile], ['resumes', 'Resumes', J.resume], ['jobs', 'Jobs', J.jobs], ['applications', 'Applications', J.apps], ['activity', 'Activity', J.act]];
var COMMON_Q = ['Are you legally authorized to work in the United States?', 'Will you now or in the future require visa sponsorship (e.g. H-1B)?',
  'Are you willing to relocate?', 'What are your salary expectations?', 'When can you start?', 'LinkedIn profile', 'How did you hear about this job?',
  'Gender (voluntary)', 'Race / ethnicity (voluntary)', 'Veteran status (voluntary)', 'Disability status (voluntary)'];

/* =====================================================================
   start: signed in? on the team?
   ===================================================================== */
TP.client().then(function(c){ SB = c; return TP.session(); }).then(function(s){
  if(!s){ TP.toLogin(); return null; }
  ME = {id:s.user.id, email:String(s.user.email || '').toLowerCase()};
  return TP.whoami().then(function(w){
    if(!w || !w.team) return notTeam(w || {});
    ME.owner = !!w.owner;
    loadTeamNames().then(function(){ $('#me').innerHTML = meHTML(); });   // your name in the sidebar
    render();
  });
}).catch(function(e){ V.innerHTML = errBox(e, true); });

function notTeam(w){
  $('#me').innerHTML = meHTML();
  V.innerHTML = '<div class="empty">' + I.lock + '<h3>For the TrulyPlaced team</h3><p>You’re signed in as <b>' + esc(ME.email) + '</b>, which isn’t on the team list. ' +
    'Ask the owner to add you, then sign in again.</p><div class="row" style="justify-content:center">' +
    (w.client ? '<a class="btn pri" href="/portal.html">Go to my dashboard</a>' : '<a class="btn" href="/app.html">Job board</a>') +
    '<button class="btn" type="button" data-act="out">Sign out</button></div></div>';
}
function meHTML(){   // you, at the bottom of the sidebar
  var t = TEAMROWS.filter(function(x){ return x.email === ME.email; })[0] || {};
  return '<span class="av sm" style="background:' + TP.hue(ME.email) + '">' + esc(TP.initials(t.full_name, ME.email)) + '</span><span class="mw" title="' + esc(ME.email) + '"><b>' + esc(t.full_name || ME.email.split('@')[0]) + '</b>' +
    '<small>' + (ME.owner ? 'Owner' : 'Team member') + ' · ' + esc(ME.email) + '</small></span><button class="icb" type="button" data-act="out" title="Sign out">' + I.out + '<span class="sr">Sign out</span></button>';
}
function errBox(e, top){
  return '<div class="note bad">' + esc(TP.errText(e)) + (top ? ' <a href="/login.html">Sign in again</a>' : ' <button class="btn sm" type="button" data-act="retry">Try again</button>') + '</div>';
}
function loadTeamNames(){ return q(SB.from('team_members').select('email,full_name,role,active')).then(function(r){ TEAMROWS = r || []; }, function(){}); }
function who(email){
  if(!email || email === 'system') return 'TrulyPlaced';
  var t = TEAMROWS.filter(function(x){ return x.email === email; })[0];
  return (t && t.full_name) || email.split('@')[0];
}

/* =====================================================================
   pages and links. The client is in the address (?client=…), so each browser tab keeps its own client.
   ===================================================================== */
function route(){
  var p = new URLSearchParams(location.search), h = location.hash.replace(/^#/, ''), r = {client:null, tab:'applications', app:null, page:null};
  var c = p.get('client');
  if(c && UUID.test(c)) r.client = c.toLowerCase();
  if(!r.client){ r.page = h === 'team' ? 'team' : 'clients'; return r; }
  var m = /^app=([0-9a-f-]{36})$/i.exec(h);
  if(m) r.app = m[1].toLowerCase();
  else if(TABS.some(function(t){ return t[0] === h; })) r.tab = h;
  return r;
}
function cUrl(id, hash){ return '/team.html?client=' + encodeURIComponent(id) + (hash ? '#' + hash : ''); }
function go(url, replace){ history[replace ? 'replaceState' : 'pushState'](null, '', url); render(); window.scrollTo(0, 0); }
window.addEventListener('popstate', render);
document.addEventListener('click', function(e){
  var a = e.target.closest && e.target.closest('a[data-go]');
  if(!a || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;   // Ctrl/middle click: a new browser tab
  e.preventDefault(); go(a.getAttribute('href'));

/* a pasted link: the big job boards are read here; any other page by our job-info server function */
function parseLink(raw){
  var u; try{ u = new URL(String(raw).trim()); }catch(e){ return null; }
  if(!/^https?:$/.test(u.protocol)) return null;
  var h = u.hostname.toLowerCase().replace(/^www\./, ''), seg = u.pathname.split('/').filter(Boolean);
  var it = {raw:String(raw).trim(), url:canonUrl(raw), host:h};
  it.canon = it.url !== TP.cleanUrl(raw);   // a LinkedIn or Indeed link, tidied to the job's own page
  var at = function(src, board, id){ return Object.assign(it, {src:src, board:board, id:id, key:src + ':' + board + ':' + id}); };
  if(h === 'boards.greenhouse.io' || h === 'job-boards.greenhouse.io'){

/* ---------- Apply from links: many links at once ----------

// every web address in a paste: one per line, or a whole WhatsApp message or email

    var m = /https?:\/\/\S+/i.exec(w), bare = !m && /^[(<\["']*((?:www\.)?(?:[a-z0-9-]+\.)+[a-z]{2,}\/\S*)/i.exec(w);

    if(kind === 'res' && !/\.(pdf|docx)$/i.test(f.name || '')) return TP.toast('Choose the PDF or Word file you uploaded');

    else el.innerHTML = I.doc + '<b>' + esc(f.name) + '</b><span class="fine">' + Math.round(f.size / 1024) + ' KB · click to change</span>';
    el.classList.add('has');

  el._take = take;
  el.addEventListener('click', function(){ var fi = $('#fileIn'); fi.accept = accept; fi.onchange = function(){ take(fi.files[0]); fi.value = ''; }; fi.click(); });

  ['dragleave', 'drop'].forEach(function(ev){ el.addEventListener(ev, function(e){ e.preventDefault(); el.classList.remove('over'); }); });

}

      '<div class="field"><label for="tmE">Email</label><input id="tmE" type="email" required autocomplete="off"></div><div class="field"><label for="tmN">Name</label><input id="tmN" autocomplete="off"></div>' +
      '<div class="field"><label for="tmR">Role</label><select id="tmR"><option value="member">Member</option><option value="owner">Owner</option></select></div></div>' +
      '<label class="check"><input type="checkbox" id="tmI" checked> If they don’t have a TrulyPlaced login yet, email them a link to set a password</label>' +
      '<div class="row end"><button class="btn pri" type="submit" id="tmGo">Add to the team</button></div></form></div>' : '') +
    '<div class="list" id="tmL" style="margin-top:16px"><div class="skel"></div></div></div>';
  if(ME.owner) $('#tmF').addEventListener('submit', function(e){
    e.preventDefault();
    var email = $('#tmE').value.trim().toLowerCase(), name = $('#tmN').value.trim(), role = $('#tmR').value, b = $('#tmGo');
    if(!/^\S+@\S+\.\S+$/.test(email)) return TP.toast('Check the email address');
    b.disabled = true; b.classList.add('busy');
    var p = $('#tmI').checked ? TP.fn('client-accounts', {action:'invite_member', email:email, full_name:name, role:role})
      : q(SB.from('team_members').upsert({email:email, full_name:name || null, role:role, active:true}, {onConflict:'email'}));
    p.then(function(r){ TP.toast(r && r.emailed ? 'Added. We emailed ' + email + ' a link to set a password' : 'Added to the team'); loadTeamNames().then(vTeam); })
     .catch(function(e2){ b.disabled = false; b.classList.remove('busy'); TP.toast(TP.errText(e2)); });
  });
  loadTeamNames().then(drawTeam);
}
function drawTeam(){
  var rows = TEAMROWS.slice().sort(function(a, b){ return (b.active - a.active) || (a.role === 'owner' ? -1 : b.role === 'owner' ? 1 : 0) || a.email.localeCompare(b.email); });
  $('#tmL').innerHTML = rows.map(function(t){
    return '<div class="li"><span class="av sm" style="background:' + TP.hue(t.email) + '">' + esc(TP.initials(t.full_name, t.email)) + '</span><div class="main"><div class="t">' + esc(t.full_name || t.email.split('@')[0]) + (t.email === ME.email ? ' <span class="tag">you</span>' : '') + '</div><div class="m">' + esc(t.email) + '</div></div>' +
      '<div class="side">' + (t.active ? '' : '<span class="st paused">Off</span>') + (t.role === 'owner' ? '<span class="st applied">Owner</span>' : '<span class="st">Member</span>') +
      (ME.owner ? '<button class="icb" type="button" data-act="tmmenu" data-email="' + esc(t.email) + '" title="Change">⋯</button>' : '') + '</div></div>';
  }).join('') || '<p class="fine" style="padding:14px">No one yet.</p>';
}
function teamMenu(email){
  var t = TEAMROWS.filter(function(x){ return x.email === email; })[0]; if(!t) return;
  var m = TP.modal('<h2>' + esc(t.full_name || t.email) + '</h2><p>' + esc(t.email) + '</p><div class="stack" style="margin-top:14px">' +
    '<button class="btn" type="button" data-v="role">' + (t.role === 'owner' ? 'Make them a member' : 'Make them an owner') + '</button>' +
    '<button class="btn" type="button" data-v="active">' + (t.active ? 'Turn off their access (keeps their history)' : 'Turn their access back on') + '</button>' +
    '<button class="btn bad" type="button" data-v="del">Remove from the team</button><p class="fine">There must always be at least one owner.</p></div>');
  m.addEventListener('click', function(e){
    var b = e.target.closest('[data-v]'); if(!b) return;
    var v = b.getAttribute('data-v');
    var p = v === 'role' ? q(SB.from('team_members').update({role:t.role === 'owner' ? 'member' : 'owner'}).eq('email', email))
      : v === 'active' ? q(SB.from('team_members').update({active:!t.active}).eq('email', email))
      : q(SB.from('team_members').delete().eq('email', email));
    p.then(function(){ TP.closeModal(); TP.toast('Updated'); loadTeamNames().then(drawTeam); }, function(e2){ TP.toast(TP.errText(e2)); });
  });
}

/* =====================================================================
   buttons
   ===================================================================== */
document.addEventListener('click', function(e){
  var b = e.target.closest && e.target.closest('[data-act]'); if(!b) return;
  var act = b.getAttribute('data-act');
  switch(act){
    case 'out': return TP.signOut();
    case 'retry': return location.reload();
    case 'newclient': return newClient();
    case 'switch': return switcher();
    case 'closetab':
      e.preventDefault(); e.stopPropagation();
      var id = b.getAttribute('data-id'); TP.ssSet('tp_open_clients', openList().filter(function(x){ return x.id !== id; }));
      if(R.client === id) go('/team.html'); else drawOpenTabs();
      return;
    case 'pfsave': return saveProfile();
    case 'qaadd': $('#pfQA').insertAdjacentHTML('beforeend', qaRow({})); $$('#pfQA [data-qa=q]').pop().focus(); return;
    case 'qacommon': $('#pfQA').insertAdjacentHTML('beforeend', qaRow({q:b.getAttribute('data-q')})); b.remove(); $$('#pfQA [data-qa=a]').pop().focus(); return;
    case 'qaadd2': $('#apQA').insertAdjacentHTML('beforeend', qaRow({})); $$('#apQA [data-qa=q]').pop().focus(); return;
    case 'qacopy': var row = b.closest('.qa'); return TP.copy($('[data-qa=a]', row).value, 'Answer');
    case 'qadel': var r2 = b.closest('.qa'), inApp = !!r2.closest('#apQA'); r2.remove(); if(inApp) draftChanged(); return;
    case 'resend':
      b.disabled = true; b.classList.add('busy');
      return TP.fn('client-accounts', {action:'resend', client_id:C.id}).then(function(){ b.classList.remove('busy'); TP.toast('Set-password email sent to ' + C.row.email); },
        function(e2){ b.disabled = false; b.classList.remove('busy'); TP.toast(TP.errText(e2)); });
    case 'newresume': return newResume();
    case 'resmenu': return resumeMenu(b.getAttribute('data-id'));
    case 'jbstart': return startFromBoard(b.getAttribute('data-key'), b);
    case 'jbmore': JB.n += 40; return drawBoard();
    case 'lkstart': return lkStart(b);
    case 'lkclear': return lkClear();
    case 'lkdel': return lkDel(b.getAttribute('data-id'));
    case 'lkopt': return lkOptimise();
    case 'lkretry': return lkRetry(b.getAttribute('data-id'));
    case 'apmore': AP.n += 50; return loadApps();
    case 'acmore': return loadActivity(C, +b.getAttribute('data-n'));
    case 'cpresume': return TP.copy(A.resume_text || (((C.resumes || []).filter(function(r){ return r.id === A.base_resume_id; })[0] || {}).text) || '', 'Resume text');
    case 'cpcover': return TP.copy($('#apCL').value, 'Cover letter');
    case 'toeditor': saveDraft(); return;   // the link opens the editor in its own tab
    case 'markapplied': return saveDraft().then(function(){ markApplied(b); });
    case 'deldraft':
      return TP.confirmBox('Delete this draft?', 'Nothing was sent, so nothing else changes. The deletion is kept in the history.', 'Delete draft', true).then(function(ok){
        if(!ok) return;
        draftDirty = false;
        q(SB.from('applications').delete().eq('id', A.id).eq('status', 'draft')).then(function(){ C.idx = null; refreshProgress(); TP.toast('Draft deleted'); go(cUrl(C.id, 'applications'), true); }, function(e2){ TP.toast(TP.errText(e2)); });
      });
    case 'delsent':
      return TP.confirmBox('Delete this sent application?', 'Only for one marked by mistake. It comes off ' + C.row.full_name + '’s count and dashboard. The history keeps a note that it was deleted.', 'Delete it', true).then(function(ok){
        if(!ok) return;
        q(SB.from('applications').delete().eq('id', A.id).select('id')).then(function(r){ if(!r || !r.length) throw {message:'Only the owner can delete a sent application.'}; C.idx = null; refreshProgress(); TP.toast('Deleted'); go(cUrl(C.id, 'applications'), true); }, function(e2){ TP.toast(TP.errText(e2)); });
      });
    case 'addmissing': return addMissing(b);
    case 'note':
      var t = $('#nt').value.trim(); if(!t) return;
      b.disabled = true;
      return q(SB.from('client_activity').insert({client_id:C.id, kind:'note', summary:t})).then(function(){ b.disabled = false; $('#nt').value = ''; TP.toast('Note saved'); loadActivity(C, 100); },
        function(e2){ b.disabled = false; TP.toast(TP.errText(e2)); });
    case 'tmmenu': return teamMenu(b.getAttribute('data-email'));
  }
});
})();
</script>
