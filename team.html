/* =====================================================================
   My day: what you sent today and this week, who still needs an application today, and the clients you worked on —
   your own page, like the coach page on Scout Better. "You" comes from the activity log, so it's exactly what you did.
   ===================================================================== */
function istDay(back){ var d = new Date(Date.now() + 330 * 60000); d.setUTCHours(0, 0, 0, 0); return new Date(d.getTime() - 330 * 60000 - (back || 0) * 864e5); }   // midnight in India, N days back
function istWeek(){ return istDay((new Date(Date.now() + 330 * 60000).getUTCDay() + 6) % 7); }   // this Monday
/* ---------- Applications: a month of work (sql/supabase-apps-month.sql's apps_month). On My day your own; on Operations the
   whole team or one employee. The month's figures, each day's applications split by client (hover a day: who got how many),
   then By client and By status. A month is India time; sent counts the month it was sent, interviews the month it first moved
   to Interview or Offer, applied by mistake the month it was marked. ---------- */
var AM = {m:'', emp:'', client:'', st:'all', n:10, team:false, data:{}};
var AM_COL = ['#0938d5', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#0ea5e9', '#ec4899', '#84cc16', '#f97316', '#14b8a6', '#6366f1', '#a16207', '#64748b', '#be123c', '#0f766e', '#7c3aed'];
var AM_ST = [['all', 'All'], ['applied', 'Applied'], ['interview', 'Interview'], ['offer', 'Offer'], ['rejected', 'Not selected'], ['closed', 'Closed'], ['withdrawn', 'Withdrawn']];
function amNow(){ var d = new Date(Date.now() + 330 * 60000); return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0'); }
function amShift(m, k){ var d = new Date(Date.UTC(+m.slice(0, 4), +m.slice(5, 7) - 1 + k, 1)); return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0'); }
function amMonth(m){
  var y = +m.slice(0, 4), mo = +m.slice(5, 7) - 1;
  return {from:new Date(Date.UTC(y, mo, 1) - 330 * 60000), to:new Date(Date.UTC(y, mo + 1, 1) - 330 * 60000), y:y, mo:mo,
          days:new Date(Date.UTC(y, mo + 1, 0)).getUTCDate(), label:new Date(Date.UTC(y, mo, 1)).toLocaleDateString('en-GB', {month:'long', year:'numeric', timeZone:'UTC'})};
}
function amStart(team){
  var box = $('#amBox'); if(!box) return;
  if(!AM.m) AM.m = amNow();
  if(AM.team !== team){ AM.team = team; AM.client = ''; AM.st = 'all'; AM.emp = ''; }
  var emps = TEAMROWS.slice().sort(function(a, b){ return String(a.full_name || a.email).localeCompare(String(b.full_name || b.email)); });
  box.innerHTML = '<div class="wkhead amhead"><h2>Applications</h2>' +
      (team ? '<label class="sr" for="amE">Whose work</label><select id="amE"><option value="">The whole team</option>' + emps.map(function(t){ return '<option value="' + esc(t.email) + '"' + (AM.emp === t.email ? ' selected' : '') + '>' + esc(t.full_name || t.email) + '</option>'; }).join('') + '</select>' : '') +
      '<div class="ammon" role="group" aria-label="Month"><button class="btn sm ghost" type="button" data-am="-1" aria-label="Previous month">‹</button><b id="amM" aria-live="polite"></b><button class="btn sm ghost" type="button" data-am="1" aria-label="Next month">›</button></div></div>' +
    '<div id="amFil"></div><div class="stats s4" id="amS"></div>' +
    '<div class="card"><div class="ch"><h3>Sent each day, by client</h3><span class="fine">Hover a day to see how many went to each client</span></div><div id="amC"><div class="skel" style="height:190px"></div></div></div>' +
    '<div class="card flush"><div class="ch"><h3>By client</h3><span class="fine">Pick one to see only theirs</span></div><div class="tbl amcl" id="amL"><div class="skel"></div></div></div>' +
    '<div class="card flush"><div class="ch"><h3>By status</h3><div class="seg sm" id="amF" role="group" aria-label="Status"></div></div><div class="tbl amtl" id="amT"><div class="skel"></div></div></div>';
  box.addEventListener('click', function(e){
    var b = e.target.closest('[data-am]');
    if(b){ var m = amShift(AM.m, +b.getAttribute('data-am')); if(m > amNow()) return; AM.m = m; AM.n = 10; return amLoad(); }
    var c = e.target.closest('[data-amc]');
    if(c && !e.target.closest('a[href]')){ var id = c.getAttribute('data-amc'); AM.client = AM.client === id ? '' : id; AM.n = 10; return amDraw(); }
    if(e.target.closest('[data-amx]')){ AM.client = ''; return amDraw(); }
    var st = e.target.closest('[data-ams]'); if(st){ AM.st = st.getAttribute('data-ams'); AM.n = 10; return amDraw(); }
    if(e.target.closest('[data-ammore]')){ AM.n += 25; return amDraw(); }
  });
  box.addEventListener('keydown', function(e){ var c = e.target.closest('[data-amc]'); if(c && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); c.click(); } });
  var es = $('#amE'); if(es) es.addEventListener('change', function(){ AM.emp = es.value; AM.client = ''; AM.n = 10; amLoad(); });
  amLoad();
}
function amKey(){ return AM.m + '|' + (AM.team ? AM.emp : ME.email); }
function amLoad(){
  var key = amKey(), M = amMonth(AM.m);
  amDraw();   // what was loaded last for this month shows at once

function wrRange(){

  var planSel = ME.owner ? '<div class="field"><label for="ncP">Plan</label><select id="ncP"><option value="">Not set yet</option>' + TP.CONFIG.PLANS.map(function(n){ return '<option value="' + n + '">' + n + ' applications</option>'; }).join('') + '<option value="custom">Other number…</option></select></div>' +
      '<div class="field" id="ncPCw" hidden><label for="ncPC">Number of applications</label><input id="ncPC" type="number" min="1" max="100000" inputmode="numeric"></div>'
    : '<p class="fine">The owner sets the plan (250, 500 or 1000 applications) on the client’s Profile tab.</p>';
  var m = TP.modal('<h2>New client</h2><p>We’ll create their login and email them a link to set a password. Nothing else is sent.</p>' +
    '<form id="ncF" class="stack" style="margin-top:16px" novalidate>' +
      '<div class="field"><label for="ncN">Full name</label><input id="ncN" required autocomplete="off" placeholder="e.g. Priya Sharma"></div>' +
      '<div class="field"><label for="ncE">Email</label><input id="ncE" required placeholder="the email they’ll sign in with"' + TP.sg('email') + '></div>' +
      '<div class="field"><label for="ncPh">Phone / WhatsApp <span class="muted">(optional)</span></label><input id="ncPh" placeholder="e.g. +1 201 555 0147"' + TP.sg('phone') + '></div>' +
      planSel + (ME.owner ? '<div class="field"><label for="ncA">Employee <span class="muted">(optional)</span></label>' + assignSel('', '', 'ncA').replace(' data-asg=""', '') + '</div>' : '') + '<p class="err" id="ncErr" hidden></p>' +
      '<div class="acts"><button class="btn" type="button" data-mclose="1">Cancel</button><button class="btn pri" type="submit" id="ncGo">Check and continue</button></div></form>' +
    '<div id="ncRev" hidden></div>', false, {keep:true});
  if(ME.owner) $('#ncP').addEventListener('change', function(e){ $('#ncPCw').hidden = e.target.value !== 'custom'; });
  if(pre.name){ $('#ncN').value = pre.name; $('#ncE').value = pre.email || ''; $('#ncPh').value = pre.phone || ''; if(ME.owner && pre.plan && TP.CONFIG.PLANS.indexOf(pre.plan) > -1) $('#ncP').value = String(pre.plan); }   // from a lead (Make them a client)
  $('#ncF', m).addEventListener('submit', function(e){
    e.preventDefault();
    var name = $('#ncN').value.trim().replace(/\s+/g, ' '), email = $('#ncE').value.trim().toLowerCase(), phone = $('#ncPh').value.trim(), err = $('#ncErr'), go2 = $('#ncGo');
    var pv = ME.owner ? $('#ncP').value : '', plan = pv === 'custom' ? +$('#ncPC').value : +pv;
    err.hidden = false;
    if(!name){ err.textContent = 'Add their name.'; return; }
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){ err.textContent = 'Check the email address.'; return; }
    if(pv === 'custom' && !(plan >= 1 && plan <= 100000)){ err.textContent = 'Type the number of applications in their plan.'; return; }
    err.hidden = true;
    // before anything is created: the same person may already be a client
    TP.busy(go2, loadList()).then(function(L){ ncReview(m, {name:name, email:email, phone:phone, plan:plan || null, emp:ME.owner ? $('#ncA').value : '', onMade:pre.onMade}, L.rows); }, function(e2){ err.hidden = false; err.textContent = TP.errText(e2); });
  });
}
function ncReview(m, n, rows){
  var key = function(s){ return String(s || '').toLowerCase().replace(/\s+/g, ' ').trim(); };
  var same = rows.filter(function(c){ return c.email === n.email; })[0];
  var named = rows.filter(function(c){ return c !== same && key(c.full_name) === key(n.name); });
  var phoned = digits(n.phone).length >= 7 ? rows.filter(function(c){ return c !== same && named.indexOf(c) < 0 && digits(c.phone) === digits(n.phone); }) : [];
  var who = function(c){ return '<a href="' + esc(cUrl(c.id, 'profile')) + '" data-go data-mclose="0" class="nclink">' + esc(c.full_name || c.email) + '</a> (' + esc(c.email) + ')'; };
  var row = function(k, v, hint){ return '<div class="rv"><span>' + k + '</span><b>' + v + '</b>' + (hint ? '<small>' + hint + '</small>' : '') + '</div>'; };
  $('#ncF', m).hidden = true;
  var rv = $('#ncRev', m); rv.hidden = false;
  rv.innerHTML = '<h3 style="margin-top:14px">Check before we create the login</h3>' +
    '<div class="rvs">' + row('Name', esc(n.name)) + row('Login email', esc(n.email), 'They sign in with it, and it can’t be changed later.') +
      row('Phone', n.phone ? esc(n.phone) : '<span class="muted">—</span>') + (ME.owner ? row('Plan', n.plan ? n.plan + ' applications' : 'Not set yet') + row('Employee', n.emp ? esc(who(n.emp)) : 'Nobody yet', n.emp ? '' : 'Only the owners reach them until someone is assigned.') : '') + '</div>' +
    (same ? '<div class="note warn" style="margin-top:12px">' + who(same) + ' already uses this email. Nothing new is created — open them instead.</div>'
      : '<p class="fine" style="margin-top:12px">We’ll email <b>' + esc(n.email) + '</b> a link to set their password.</p>') +
    named.concat(phoned).map(function(c){ return '<div class="note warn" style="margin-top:8px">' + (named.indexOf(c) > -1 ? 'Another client has the same name: ' : 'Another client has this phone number: ') + who(c) + '. Check it isn’t the same person.</div>'; }).join('') +
    '<p class="err" id="ncErr2" hidden></p><div class="acts"><button class="btn" type="button" id="ncBack">Back to edit</button>' +
    (same ? '<a class="btn pri" href="' + esc(cUrl(same.id, 'profile')) + '" data-go data-mclose="0" id="ncOpen">Open ' + esc((same.full_name || same.email).split(' ')[0]) + '</a>'
      : '<button class="btn pri" type="button" id="ncMake">Create client and send email</button>') + '</div>';
  rv.addEventListener('click', function(e){ if(e.target.closest('[data-go][data-mclose="0"]')) TP.closeModal(); });
  $('#ncBack', m).onclick = function(){ rv.hidden = true; rv.innerHTML = ''; $('#ncF', m).hidden = false; $('#ncN', m).focus(); };
  var mk = $('#ncMake', m); if(!mk) return;
  mk.focus();
  mk.onclick = function(){
    var er = $('#ncErr2', m); er.hidden = true;
    TP.busy(mk, TP.fn('client-accounts', {action:'create_client', full_name:n.name, email:n.email, phone:n.phone, plan_total:n.plan})).then(function(r){
      TP.closeModal(); staleList();
      if(n.onMade && !r.already_client) n.onMade(r.client_id);
      if(n.emp && !r.already_client) rpc('assign_client', {p_client:r.client_id, p_employee:n.emp}).then(function(){ OPS = null; }, function(e3){ TP.toast('Client added, but not assigned: ' + TP.errText(e3)); });
      TP.toast(r.already_client ? 'They’re already a client — opening them' : 'Client added. Set-password email sent to ' + n.email);
      go(cUrl(r.client_id, 'profile'));
    }, function(e2){ er.hidden = false; er.textContent = e2 && e2.code === 'bad_email' ? 'Check the email address.' : TP.errText(e2); });
  };
}

  ready.then(function(){
    if(C !== c) return;   // switched to another client meanwhile
    rememberOpen(c.row); drawOpenTabs();
    var last = TP.ssGet('tp_last_tab', {}); last[c.id] = location.hash.replace(/^#/, ''); TP.ssSet('tp_last_tab', last);

    }).join('') + '</nav><div class="grow"></div>' +

      '<div class="prog' + (tot && done >= tot ? ' full' : '') + '"><i style="width:' + pct + '%"></i></div></div></div>';

    (sec ? '<div class="phead"><nav class="bc" aria-label="Where you are"><a href="/team.html#clients" data-go>Clients</a><i>/</i><span>' + esc(name) + '</span></nav><h1>' + esc(sec[1]) + '</h1></div>' : '');
  drawPhone(c);

}
function showTab(){

// after an application changed here (started, sent, a status, deleted…): the progress is read again — and, unless this
// tab is itself answering another tab (quiet), the other browser tabs on this client are told, so their Jobs list,
// Applications, Dashboard and progress follow at once (BC, below)
function refreshProgress(quiet){
  var c = C; if(!c) return Promise.resolve();
  staleList();
  if(!quiet && BC) try{ BC.postMessage({client:c.id, apps:true, app:R.app || null}); }catch(e){}
  return progOf(c.id).then(function(p){ if(C === c){ c.prog = p || {}; drawBar(); } }, function(){});
}
// the plan's progress (the team's work) and, beside it, the AI app's applications and the ones waiting for a hand (sql/supabase-app-link.sql)
function progOf(id){
  return Promise.all([q(SB.from('client_progress').select('*').eq('client_id', id).maybeSingle()), q(SB.from('client_ai_progress').select('*').eq('client_id', id).maybeSingle()).catch(function(){ return null; })])
    .then(function(rs){ return rs[0] ? Object.assign(rs[0], rs[1] || {}) : rs[0]; });
}

/* ---------- Dashboard: where this client stands — sent against the plan, what came back, and the weeks so far ----------
   Like the dashboard on Scout Better. Counted from the client's applications, so it always agrees with the Applications tab. */
var DB = {by:'week'};
function tDash(){
  var c = C;
  V.innerHTML = '<div class="stats" id="dbS">' + dashStats(c, null) + '</div>' +
    '<div class="card dchart"><div class="row" style="align-items:flex-start"><div class="grow"><h3>Applications sent</h3><p class="hint" id="dbH">&nbsp;</p></div>' +
      '<div class="seg" id="dbBy">' + [['month', 'Monthly'], ['week', 'Weekly'], ['day', 'Daily']].map(function(o){ return '<button type="button" data-by="' + o[0] + '" class="' + (DB.by === o[0] ? 'on' : '') + '">' + o[1] + '</button>'; }).join('') + '</div></div>' +
      '<div id="dbC"><div class="skel" style="height:190px"></div></div></div>' +
    '<div class="card"><div class="row"><h3 class="grow">Latest applications</h3><a class="btn sm" href="' + esc(cUrl(c.id, 'applications')) + '" data-go>All applications</a></div><div id="dbL" style="margin-top:8px"><div class="skel"></div></div></div>';
  $('#dbBy').addEventListener('click', function(e){ var b = e.target.closest('[data-by]'); if(!b) return; DB.by = b.getAttribute('data-by'); $$('#dbBy button').forEach(function(x){ x.classList.toggle('on', x === b); }); if(c.dash) dashChart(c); });
  if(c.dash) dashDraw(c);   // what was loaded last shows at once
  q(SB.from('applications').select('id,status,title,company,applied_at').eq('client_id', c.id).not('applied_at', 'is', null).neq('status', 'withdrawn').order('applied_at', {ascending:false}).limit(5000))
    .then(function(rows){ c.dash = rows || []; if(C === c && R.tab === 'dash' && !R.app) dashDraw(c); }, function(e){ if($('#dbC')) $('#dbC').innerHTML = errBox(e); });
}
function dashStats(c, rows){
  var p = c.prog || {}, tot = c.row.plan_total || 0, done = p.done || 0, n = function(s){ return rows ? rows.filter(function(a){ return a.status === s; }).length : '–'; };
  return [[done.toLocaleString() + (tot ? ' <span class="of">/ ' + tot.toLocaleString() + '</span>' : ''), tot ? 'sent · ' + Math.min(100, Math.round(done / tot * 100)) + '% of the plan' : 'sent · no plan set'],
    [p.today || 0, 'sent today'], [p.week || 0, 'sent in the last 7 days'], [rows ? n('interview') + n('offer') : '–', 'interviews and offers']]   // the four figures people act on; the rest is in the list and on Applications
    .map(function(s){ return '<div class="stat"><b>' + s[0] + '</b><span>' + s[1] + '</span></div>'; }).join('');
}
function dashDraw(c){
  $('#dbS').innerHTML = dashStats(c, c.dash);
  dashChart(c);
  var top = c.dash.slice(0, 6);
  $('#dbL').innerHTML = top.length ? '<div class="list">' + top.map(function(a){
    return '<a class="li" href="' + esc(cUrl(c.id, 'app=' + a.id)) + '" data-go><div class="main"><div class="t">' + esc(a.title || 'Role') + (a.company ? ' <span class="muted">at ' + esc(a.company) + '</span>' : '') + '</div>' +
      '<div class="m">Sent ' + esc(TP.fmtDate(a.applied_at)) + '</div></div>' + TP.statusChip(a.status) + '</a>';
  }).join('') + '</div>' : '<p class="fine">Nothing sent yet. Start one on the Jobs tab.</p>';
}
// one column per month (the last 12, India time), per week (the last 12, Monday to Sunday) or per day (the last 30): how many were sent
function dashChart(c){
  var mon = DB.by === 'month', week = DB.by === 'week', n = mon || week ? 12 : 30, start = mon ? istMonth(n - 1).getTime() : week ? istWeek().getTime() - (n - 1) * 7 * 864e5 : istDay(n - 1).getTime(), span = (week ? 7 : 1) * 864e5;
  var mi = function(t){ var d = new Date(t + 330 * 60000); return d.getUTCFullYear() * 12 + d.getUTCMonth(); }, m0 = mi(start);   // a month's number, in India
  var bins = []; for(var i = 0; i < n; i++) bins.push({from:mon ? istMonth(n - 1 - i).getTime() : start + i * span, n:0});
  c.dash.forEach(function(a){ var t = new Date(a.applied_at).getTime(), k = mon ? mi(t) - m0 : Math.floor((t - start) / span); if(k >= 0 && k < n) bins[k].n++; });
  var total = bins.reduce(function(s, b){ return s + b.n; }, 0), max = Math.max.apply(null, bins.map(function(b){ return b.n; }));
  var day = function(t){ return new Date(t + 330 * 60000).toLocaleDateString('en-GB', {day:'numeric', month:'short', timeZone:'UTC'}); };
  var mname = function(t, long){ return new Date(t + 330 * 60000).toLocaleDateString('en-GB', long ? {month:'long', year:'numeric', timeZone:'UTC'} : {month:'short', timeZone:'UTC'}); };
  var label = function(b){ return mon ? mname(b.from, true) : week ? 'Week of ' + day(b.from) : new Date(b.from + 330 * 60000).toLocaleDateString('en-GB', {weekday:'short', day:'numeric', month:'short', timeZone:'UTC'}); };
  var span2 = mon ? '12 months' : week ? '12 weeks' : '30 days', unitW = mon ? 'month' : week ? 'week' : 'day';
  $('#dbH').textContent = total ? total.toLocaleString() + ' sent in the last ' + span2 + ' · busiest ' + unitW + ': ' + max : 'Nothing sent in the last ' + span2 + ' yet.';
  // clean ticks (0, a whole middle and the top), drawn at the card's real width so the text never stretches
  var unit = max > 40 ? 20 : 10, top = max <= 4 ? 4 : Math.ceil(max / unit) * unit, W = Math.max(300, Math.round($('#dbC').clientWidth || 700)), H = 190, padL = 30, padB = 22, plotH = H - padB - 8, slot = (W - padL) / n, bw = Math.min(24, slot - 2);
  var y = function(v){ return 8 + plotH - v / top * plotH; };
  var svg = '<svg class="dbsvg" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc($('#dbH').textContent) + '">' +
    [0, top / 2, top].map(function(v){ return '<line x1="' + padL + '" x2="' + W + '" y1="' + y(v) + '" y2="' + y(v) + '" class="gl"/><text x="' + (padL - 6) + '" y="' + (y(v) + 4) + '" class="ax" text-anchor="end">' + v + '</text>'; }).join('') +
    bins.map(function(b, k){
      var x = padL + k * slot + (slot - bw) / 2, h = b.n ? Math.max(2, b.n / top * plotH) : 0, yt = 8 + plotH - h, r = Math.min(4, h);
      var bar = h ? '<path class="bar" d="M' + x + ' ' + (8 + plotH) + 'V' + (yt + r) + 'Q' + x + ' ' + yt + ' ' + (x + r) + ' ' + yt + 'H' + (x + bw - r) + 'Q' + (x + bw) + ' ' + yt + ' ' + (x + bw) + ' ' + (yt + r) + 'V' + (8 + plotH) + 'Z"/>' : '';
      var tick = (mon || (week ? k % 2 === 1 || k === n - 1 : k % 5 === 4 || k === n - 1)) ? '<text x="' + (x + bw / 2) + '" y="' + (H - 6) + '" class="ax" text-anchor="middle">' + esc(mon ? mname(b.from) : week ? day(b.from) : new Date(b.from + 330 * 60000).getUTCDate()) + '</text>' : '';
      return '<g class="col" tabindex="0" data-k="' + k + '"><rect class="hit" x="' + (padL + k * slot) + '" y="0" width="' + slot + '" height="' + (8 + plotH) + '"/>' + bar + '</g>' + tick;
    }).join('') + '</svg>';
  $('#dbC').innerHTML = '<div class="dbwrap">' + svg + '<div class="dbtip" id="dbTip" hidden><b></b><span></span></div></div>' +
    '<div class="sr"><table><caption>Applications sent per ' + unitW + '</caption><tbody>' + bins.map(function(b){ return '<tr><th>' + esc(label(b)) + '</th><td>' + b.n + '</td></tr>'; }).join('') + '</tbody></table></div>';
  // hover or focus a column: the value first, then when (written as text, never as markup)
  var tip = $('#dbTip'), wrap = $('#dbC .dbwrap');
  var show = function(g){
    var b = bins[+g.getAttribute('data-k')]; $$('#dbC .col.on').forEach(function(x){ x.classList.remove('on'); }); g.classList.add('on');
    tip.firstChild.textContent = b.n + ' sent'; tip.lastChild.textContent = label(b); tip.hidden = false;
    var r = g.getBoundingClientRect(), w = wrap.getBoundingClientRect();
    tip.style.left = Math.min(Math.max(0, r.left - w.left + r.width / 2 - tip.offsetWidth / 2), w.width - tip.offsetWidth) + 'px';
  };
  var hide = function(){ tip.hidden = true; $$('#dbC .col.on').forEach(function(x){ x.classList.remove('on'); }); };
  $$('#dbC .col').forEach(function(g){ g.addEventListener('pointerenter', function(){ show(g); }); g.addEventListener('focus', function(){ show(g); }); g.addEventListener('blur', hide); });
  wrap.addEventListener('pointerleave', hide);

  // the part whose heading has passed the top third is the one you're in; at the very bottom, the last part (it can't reach the top)
  var spy = function(){

var AP_SPLIT_KEY = 'tp_apsplit', AP_SPLIT_DEF = 0.42;
function apSplit(grid){
  var side = grid && $('.apside', grid); if(!side || grid.classList.contains('split')) return;
  var div = document.createElement('div');
  div.className = 'apdiv'; div.setAttribute('role', 'separator'); div.setAttribute('aria-orientation', 'vertical'); div.setAttribute('tabindex', '0');

  grid.insertBefore(div, side); grid.classList.add('split');
  var set = function(r){ r = Math.max(0.28, Math.min(0.66, r)); grid.style.setProperty('--apl', (r * 100).toFixed(2) + '%'); div.setAttribute('aria-valuenow', Math.round(r * 100)); return r; };
  var ratio = set(Number(TP.lsGet(AP_SPLIT_KEY, AP_SPLIT_DEF)) || AP_SPLIT_DEF);
  div.addEventListener('pointerdown', function(e){
    e.preventDefault(); div.setPointerCapture(e.pointerId); grid.classList.add('dragging');
    var box = grid.getBoundingClientRect();
    var move = function(ev){ ratio = set((ev.clientX - box.left) / box.width); };
    var up = function(){ grid.classList.remove('dragging'); div.removeEventListener('pointermove', move); div.removeEventListener('pointerup', up); TP.lsSet(AP_SPLIT_KEY, ratio); };
    div.addEventListener('pointermove', move); div.addEventListener('pointerup', up);

  div.addEventListener('dblclick', function(){ ratio = set(AP_SPLIT_DEF); TP.lsSet(AP_SPLIT_KEY, ratio); });

    (leads.length ? '<div class="card"><h3>Leads to call or follow up</h3><p class="hint">Calls today, and follow-ups that are due. <a href="/team.html#leads" data-go>All leads</a></p><div class="list">' + leads.sort(function(a, b){ return ldRank(a)[0] - ldRank(b)[0]; }).map(function(l){

      return '<a class="li" href="/team.html#leads" data-act="leadopen" data-id="' + esc(l.id) + '"><span class="av" style="background:' + TP.hue(l.id) + '">' + esc(TP.initials(l.full_name, l.email)) + '</span><div class="main"><div class="t">' + esc(l.full_name) + '</div><div class="m"><span class="ldnext ' + nx.cls + '">' + esc(nx.text) + '</span></div></div>' + ldPill(l.stage) + '</a>';
    }).join('') + '</div></div>' : '') + '</div>';
}
function mdCrmLoad(){
  Promise.all([loadTasks().catch(function(){}), ME.owner ? loadLeads().catch(function(){}) : null]).then(mdCrm);
}

/* =====================================================================
   keyboard: Ctrl+K switches client, / goes to the page's search
   ===================================================================== */
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape' && $('#meMenu')){ closeMeMenu(); var mb = $('[data-act=memenu]'); if(mb) mb.focus(); return; }
  if(!ME || ME.team === false || TP.isModal() || e.altKey) return;
  var a = document.activeElement, typing = a && (/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) || a.isContentEditable);
  if((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'k'){ e.preventDefault(); switcher(); return; }
  if(e.key === '/' && !typing && !e.ctrlKey && !e.metaKey){ var s = $('#cq') || $('#lq') || $('#apQ'); if(s){ e.preventDefault(); s.focus(); s.select(); } }
  if(e.key === '[' && !typing && !e.ctrlKey && !e.metaKey){ e.preventDefault(); sbToggle(); }   // the sidebar as an icon rail, and back
});

/* =====================================================================
   buttons
   ===================================================================== */
document.addEventListener('click', function(e){
  var b = e.target.closest && e.target.closest('[data-act]'); if(!b) return;
  var act = b.getAttribute('data-act');
  if(act !== 'memenu' && b.closest('#meMenu')) closeMeMenu();   // a choice in your menu closes it
  switch(act){
    case 'memenu': return meMenu(b);
    case 'jtab': return apTab(b.getAttribute('data-v'));
    case 'resmode': return setResMode(b.getAttribute('data-v'));   // the resume beside the job: Preview, or Edit right there
    case 'qcmd': {   // the panel's toolbar: the editor in the panel does it
      var qw = qkWin(), qm = $('#resMenu'); if(qm) qm.hidden = true;
      if(qw) try{ qw.quickCmd(b.getAttribute('data-v'), b.getAttribute('data-arg')); }catch(ex){}
      return;
    }
    case 'resmore': { var rm = $('#resMenu'); if(rm){ rm.hidden = !rm.hidden; b.setAttribute('aria-expanded', String(!rm.hidden)); } return; }
    case 'gocover':   // Cover Letter: the panel's own Cover Letter tab, right there (a sent one: its record below)
      if(A && A.status === 'draft') return tailorHere('cover');
      { var cv = $('#apCover'); if(!cv) return; cv.scrollIntoView({behavior:'smooth', block:'center'}); return; }
    case 'editjob': {   // the job's fields, in place of its reading view
      apTab('jd'); var je = $('#apJDedit'), jv = $('#apJDview'); if(je) je.hidden = false; if(jv) jv.hidden = true;
      var jt = $('#apT'); if(jt){ jt.scrollIntoView({behavior:'smooth', block:'center'}); setTimeout(function(){ jt.focus({preventScroll:true}); jt.select(); }, 350); } return;
    }
    case 'jdeditdone': { var je2 = $('#apJDedit'), jv2 = $('#apJDview'); saveDraft(); if(je2) je2.hidden = true; if(jv2){ jv2.hidden = false; jdView(); } return; }
    // the PDF of the resume in view: the editor's own download, from the preview; if it can't (not laid out yet), the editor opens
    case 'respdf': { var fw = $('#apFrame'); try{ if(fw && fw.contentWindow && fw.contentWindow.downloadPDF){ fw.contentWindow.downloadPDF(); return; } }catch(ex){} window.open(edUrl('app', A.id), 'tp-ed-' + A.id); return; }
    case 'apfit': delete AFIT[A.id]; try{ localStorage.removeItem('tp_fit_app_' + A.id); }catch(ex){} return appFitRun(A);
    case 'gomark': { var mb = $('[data-act=markapplied]'); if(!mb) return; var rec = $('#ckRec'); if(rec) rec.scrollIntoView({behavior:'smooth', block:'center'}); return markApplied(mb); }   // the header's Mark as applied: the record step, and the same checks
    case 'out': return TP.signOut();
    case 'retry': if(!ME) return location.reload(); if(C){ C.row = null; C.resumes = null; } staleList(); return render();   // only this page loads again; nothing typed elsewhere is touched
    case 'newclient': return newClient();
    case 'newlead': return leadOpen(null);
    case 'aurank': return auRank(b);
    case 'aulead': return auLead(b);
    case 'aufake': return auResolve(b, 'fake');
    case 'aufine': return auResolve(b, 'fine');
    case 'leadopen': e.preventDefault(); return (LD.rows ? Promise.resolve() : loadLeads()).then(function(){ leadOpen(b.getAttribute('data-id')); }, fail);
    case 'leadnote': return leadNote(b);
    case 'leaddel': return leadDelete(b.getAttribute('data-id'));
    case 'leadclient': return leadToClient(b.getAttribute('data-id'));
    case 'newtask': return newTask({lead:b.getAttribute('data-lead') || null, client:b.getAttribute('data-client') || null});
    case 'taskdone': return taskDone(b.getAttribute('data-id'));
    case 'taskdel': return taskDel(b.getAttribute('data-id'));
    case 'switch': return switcher();
    case 'sbtoggle': return sbToggle();
    case 'closetab':
      e.preventDefault(); e.stopPropagation();
      return closeTab(b.getAttribute('data-id'));
    case 'pfsave': return saveProfile();
    case 'factsconfirm': return factsConfirm(b);
    case 'qaadd': $('#pfQA').insertAdjacentHTML('beforeend', qaRow({})); $$('#pfQA [data-qa=q]').pop().focus(); return;
    case 'qacommon': {   // its answer suggested from what the Profile says now (typed but not saved yet included)
      var qq = b.getAttribute('data-q'), form = {}; PF.forEach(function(k){ var fl = $('#pf_' + k); form[k] = fl ? fl.value.trim() : C.row[k]; });
      $('#pfQA').insertAdjacentHTML('beforeend', qaRow({q:qq, a:TP.suggestAnswer(qq, form)})); b.remove();
      var na = $$('#pfQA [data-qa=a]').pop(); na.focus(); na.select(); pfMark(); return;
    }
    case 'qaadd2': $('#apQA').insertAdjacentHTML('beforeend', qaRow({})); $$('#apQA [data-qa=q]').pop().focus(); return;
    case 'qacopy': var row = b.closest('.qa'); return TP.copy($('[data-qa=a]', row).value, 'Answer');
    case 'qadel':
      // an answer taken out: Undo puts it back in the same place (on a draft both are saved straight away)
      var r2 = b.closest('.qa'), qbox = r2.parentNode, qnext = r2.nextSibling, inApp = !!r2.closest('#apQA'), had = $$('[data-qa]', r2).some(function(x){ return x.value.trim(); });
      // on the Profile, a common question taken out is offered again below
      var qaDone = function(){ if(inApp) return draftChanged(); pfMark(); var pc = $('#pfCommon'); if(pc && $('#pfQA')) pc.innerHTML = commonQ(readQA($('#pfQA'))); };
      r2.remove(); qaDone();
      if(had) TP.toast('Answer removed', {undo:function(){ if(!qbox.isConnected) return; qbox.insertBefore(r2, qnext && qnext.parentNode === qbox ? qnext : null); qaDone(); }});
      return;
    case 'resend': return resendInvite(b);
    case 'mbconnect': return mbConnect(C);
    case 'mbdone': return TP.busy(b, mbDone(C, false));
    case 'mbcheck': return mbCheck(C, b);
    case 'mbdisc': return mbDisc(C);
    case 'mbact': return mbAct(b);
    case 'newresume': return newResume();
    case 'rqanswer': return answerReq(b.getAttribute('data-id'));
    case 'resmenu': return resumeMenu(b.getAttribute('data-id'));
    case 'lkstart': return lkStart(b);
    case 'lkclear': return lkClear();
    case 'lkdel': return lkDel(b.getAttribute('data-id'));
    case 'lkopt': return lkOptimise();
    case 'runs': return runsPanel();
    case 'runcancel': return runAct('cancel', b.getAttribute('data-id'), b);
    case 'runretry': return runAct('retry', b.getAttribute('data-id'), b);
    case 'bgopt': { var bm = $('#resMenu'); if(bm) bm.hidden = true; return bgOpt(A, C); }
    case 'lkretry': return lkRetry(b.getAttribute('data-id'));
    case 'lkjd': return lkJd(b.getAttribute('data-id'));
    case 'shotmore': { var sd = $('#' + b.getAttribute('data-for')); if(sd && sd._pick) sd._pick(); return; }
    case 'shotdel': return shotDel(b.getAttribute('data-for'), +b.getAttribute('data-i'));
    case 'shotview': return shotView(b.getAttribute('data-for'), +b.getAttribute('data-i'));
    case 'lkopen': return lkOpened(b.getAttribute('data-id'));   // the link itself opens the tab; the list notes it
    case 'lkrestrict': return lkRestrict(b.getAttribute('data-id'));
    case 'rjlift': return rjLift(b.getAttribute('data-id'));
    case 'lksort': TP.lsSet('tp_lk_best', !lkBest()); return lkDraw();
    case 'lkfit': return lkFitRetry(b.getAttribute('data-id'));
    case 'apmore': AP.n += 50; return loadApps();
    case 'apsel': AP.sel = AP.sel ? null : {}; b.textContent = AP.sel ? 'Done selecting' : 'Select'; drawBulk(); return loadApps();
    case 'apcsv': return exportCsv(b);
    case 'bkstatus': return bulkStatus();
    case 'bkdel': return bulkDelete();
    case 'bkclear': AP.sel = {}; markPicked(); return drawBulk();
    case 'acmore': return loadActivity(C, +b.getAttribute('data-n'));
    case 'resprint': { var pm = $('#resMenu'), fp = $('#apFrame'); if(pm) pm.hidden = true; try{ if(fp && fp.contentWindow && fp.contentWindow.printPDF){ fp.contentWindow.printPDF(); return; } }catch(ex){} return window.open(edUrl('app', A.id), 'tp-ed-' + A.id); }   // the frame's own Print
    case 'cpresume': return TP.copy(A.resume_text || (((C.resumes || []).filter(function(r){ return r.id === A.base_resume_id; })[0] || {}).text) || '', 'Resume text');
    case 'cpcover': return TP.copy($('#apCL').value, 'Cover letter');
    case 'toeditor': {   // the link opens the editor in its own tab
      saveDraft(); if(resMode() !== 'edit') return;
      // being edited here: its last change is saved and the panel goes back to Preview first, so the full editor opens the latest
      // and the two never edit at once (the tab opens on the click itself, which pop-up blockers allow; the address follows)
      e.preventDefault(); var href = b.getAttribute('href'), tg = b.getAttribute('target'), w = window.open('', tg);
      setResMode('view').then(function(ok){
        if(!ok){ try{ if(w && w.location.href === 'about:blank') w.close(); }catch(ex){} return; }   // stayed in Edit (Claude still at it, or a change not saved): no second editor
        if(w) w.location.href = href; else window.open(href, tg);
      });
      return;
    }
    case 'tailor':   // the resume's own action (Tailor, Review suggestions, Edit resume), in the panel; a Ctrl/⌘/Shift-click opens the full editor
      if(e.metaKey || e.ctrlKey || e.shiftKey || e.altKey){ saveDraft(); return; }
      e.preventDefault(); return tailorHere(b.getAttribute('data-v'));
    case 'markapplied': return markApplied(b);
    case 'deldraft':
      var da = A, dc = C;
      return trashReady().then(function(kept){
        return TP.confirmBox('Delete this draft?', (da.title || 'Role') + (da.company ? ' at ' + da.company : '') + '. Nothing was sent, so nothing else changes.' +
          (kept ? ' It stays in Recently deleted for 30 days.' : ' This can’t be undone.'), 'Delete draft', true).then(function(ok){
          if(!ok) return;
          if(DS && DS.a === da){ DS.cur = null; DS.why = ''; clearTimeout(DS.retry); } bkDel('app_' + da.id);
          q(SB.from('applications').delete().eq('id', da.id).eq('status', 'draft').select('id')).then(function(r){
            if(!r || !r.length) throw {message:'It was already marked as applied, or deleted — refresh the page.'};
            tellAppEnded(da, 'removed');
            dc.idx = null; refreshProgress(); if(C === dc) go(cUrl(dc.id, 'applications'), true);
            TP.toast('Draft deleted', kept ? {undo:function(){ restoreItem(da.id).then(function(){ dc.idx = null; refreshProgress(); TP.toast('Draft restored'); if(C === dc) go(cUrl(dc.id, 'app=' + da.id)); }, fail); }} : null);
          }, fail);
        });
      });
    case 'delsent': return delSentApp(A, C);
    case 'unwithdraw': return unwithdrawApp(A, C);
    case 'mistake': return mistakeApp(A, C);
    case 'unmistake': return unmistakeApp(A, C);
    case 'aprow': return apRowMenu(b);
    case 'aprm': return apRowPick(b);
    case 'rdrestore':
      var rdId = +b.getAttribute('data-id'), rdKind = b.getAttribute('data-kind'), rdc = C;
      return TP.busy(b, q(SB.rpc('restore_deleted', {p_id:rdId}))).then(function(){
        rdc.idx = null; rdc.resumes = null; refreshProgress();
        TP.toast(rdKind === 'resume' ? 'Resume restored — it’s back on the Resumes tab' : 'Restored — it’s back in Applications');
        if(C === rdc && R.tab === 'activity' && !R.app){ loadDeleted(rdc); loadActivity(rdc, 100); }
      }, function(e2){ fail(e2); if(C === rdc) loadDeleted(rdc); });
    case 'archive': return archiveClient(b);
    case 'unarchive': return unarchiveClient(b);
    case 'addmissing': return addMissing(b);
    case 'note':
      var t = $('#nt').value.trim(), nc = C; if(!t) return $('#nt').focus();
      return TP.busy(b, q(SB.from('client_activity').insert({client_id:nc.id, kind:'note', summary:t}))).then(function(){ bkDel('note_' + nc.id); if($('#nt')) $('#nt').value = ''; $$('.rechint').forEach(function(x){ x.remove(); }); TP.toast('Note saved'); if(C === nc) loadActivity(nc, 100); }, fail);
    case 'appnote':
      var at = $('#anT').value.trim(), aa = A, ac = C; if(!at) return $('#anT').focus();
      return TP.busy(b, q(SB.from('client_activity').insert({client_id:ac.id, application_id:aa.id, kind:'note', summary:at}))).then(function(){
        bkDel('anote_' + aa.id); if($('#anT')) $('#anT').value = ''; $$('.rechint').forEach(function(x){ x.remove(); }); TP.toast('Note saved');
        q(SB.from('client_activity').select('*').eq('application_id', aa.id).order('at', {ascending:true})).then(function(rows){ if(A === aa && $('#apHist')) $('#apHist').innerHTML = (rows || []).map(histRow).join(''); }, function(){});
      }, fail);
    case 'tmmenu': return teamMenu(b.getAttribute('data-email'));
    case 'addextra': return addExtra();
    case 'undoextra': return undoExtra(+b.getAttribute('data-id'));
  }
});
})();
