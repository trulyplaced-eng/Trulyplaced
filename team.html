<style>
/* The shell, laid out like the job board app (app.trulyplaced.com): a left sidebar with the sections, the clients open in
   this browser tab, the client you're working on with their progress, and you. Phones get a top bar and a tab bar. */
:root{--side:248px}
.ph{display:none}
.ws{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh}
.sb{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;background:#fafafa;border-right:1px solid rgba(0,0,0,.06);overflow-y:auto;scrollbar-width:thin}
.sb .brand{height:64px;padding:0 20px}
.nav{display:flex;flex-direction:column;gap:2px;padding:0 12px}
.nav a{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:8px;color:#525252;text-decoration:none;font-size:15px;line-height:1.35;min-width:0}
.nav a svg{width:18px;height:18px;flex:none}
.nav a span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav a:hover{background:rgba(0,0,0,.03);color:#171717}
.nav a.on{background:rgba(0,0,0,.06);color:#171717;font-weight:500}
.nav a.on svg{color:var(--blue)}
.nav a em{font-style:normal;font-size:12px;font-weight:500;line-height:20px;min-width:20px;text-align:center;color:#fff;background:#171717;border-radius:999px;padding:0 6px}
/* the clients open in this browser tab, under Clients */
.otabs{display:flex;flex-direction:column;gap:1px;margin:2px 0 6px 21px;padding-left:9px;border-left:1px solid rgba(0,0,0,.08)}
.otab{display:flex;align-items:center;gap:8px;min-height:32px;padding:0 4px 0 10px;border-radius:8px;font-size:13.5px;color:#525252;text-decoration:none;min-width:0}
.otab:hover{background:rgba(0,0,0,.03);color:#171717}
.otab.on{background:rgba(0,0,0,.06);color:#171717;font-weight:500}
.otab i{width:8px;height:8px;border-radius:50%;flex:none}
.otab span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.otab button{width:24px;height:24px;flex:none;border:0;background:none;border-radius:6px;display:grid;place-items:center;color:var(--muted);opacity:0}
.otab:hover button,.otab.on button,.otab button:focus-visible{opacity:1}
.otab button:hover{background:rgba(0,0,0,.06);color:var(--ink)}
.otab button svg{width:12px;height:12px}
.otab.add{gap:6px;color:var(--blue);font-weight:500}
/* the client you're working on: who, their sections and, at the bottom, their progress */
#cbar{flex:1 0 auto;display:flex;flex-direction:column}   /* never shorter than what it holds: a short window scrolls the sidebar instead */
.cbar{flex:1;display:flex;flex-direction:column;margin-top:12px;padding-top:14px;border-top:1px solid rgba(0,0,0,.06)}
.cb1{padding:0 14px 10px 20px}
.cb1 .lab{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--client)}
.cbw{display:flex;align-items:center;gap:10px;margin-top:6px;min-width:0}
.cbw .av{width:34px;height:34px;font-size:12.5px}
.cbw .who{flex:1;min-width:0;line-height:1.3}
.cbw .nm{font-weight:600;font-size:14.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cbw .nm .st{margin-left:4px;font-size:10.5px;padding:1px 7px}
.cbw small{display:block;font-size:12px;color:#737373;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cbw .icb{width:32px;height:32px}
.cbar .grow{flex:1;min-height:12px}
.pgcard{border-top:1px solid rgba(0,0,0,.06);padding:14px 20px 16px}
.pgcard .lab{display:block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#737373}
.pgcard .pg{margin-top:2px;font-size:12px;color:#737373}
.pgcard .pg b{font-size:24px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.pgcard .prog{height:4px;margin-top:8px;background:rgba(0,0,0,.06)}
/* you */
.me{flex:none;display:flex;align-items:center;gap:10px;padding:12px 12px 12px 16px;border-top:1px solid rgba(0,0,0,.06);min-width:0}
.me .mw{flex:1;min-width:0;line-height:1.3}
.me .mw b{display:block;font-size:14px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me .mw small{display:block;font-size:12px;color:#737373;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me .icb{width:32px;height:32px}
/* the page, with a title line saying whose page it is */
.content{min-width:0}
.content .wrap{padding-top:28px}
.phead{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 14px;margin-bottom:16px}
.phead h1{font-size:24px}
.pfor{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;color:var(--muted)}
.pfor i{width:9px;height:9px;border-radius:50%;flex:none}
.pfor b{color:var(--ink);font-weight:600}
.top,.tabbar{display:none}

/* client list */
.crow .pgc{flex:none;width:170px}
.crow .pgc b{font-size:13px;color:var(--ink)}
.crow .pgc .m{font-size:12px}
.crow .td{flex:none;width:88px;text-align:right;font-size:12.5px;color:var(--muted)}
.crow .td b{display:block;color:var(--ink);font-size:14px}
.crow .td.zero b{color:var(--warn)}
.chev{width:18px;height:18px;color:#b3b9cf;flex:none}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stats.s4{grid-template-columns:repeat(4,1fr)}.aul{padding:0}.aurow{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1.4fr) minmax(0,1.3fr) 280px;gap:8px 22px;align-items:start;padding:14px 18px;border-bottom:1px solid var(--line)}.aurow:last-child{border-bottom:0}
.aurow .main{min-width:0}@media (max-width:900px){.aurow{grid-template-columns:1fr}}.aurow .t .st{margin-left:4px;vertical-align:1px}.aucon{min-width:0;overflow-wrap:anywhere;font-size:13.5px}.auuse{font-size:12px}
.auact{display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:flex-end}.btn.wa{background:#25D366;color:#fff;border-color:#25D366}.aurep{margin-bottom:12px}.aurep .ch{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.aurr{margin:10px 0 0;padding-left:18px;font-size:13.5px}
.stat b{display:block;font-family:Poppins;font-size:21px;color:var(--ink);line-height:1.2}
.stat span{font-size:12.5px;color:var(--muted)}

/* application page */
.ahead{display:flex;gap:14px;align-items:flex-start}
.ahead h2{font-size:21px}
.ahead .m{font-size:13.5px;color:var(--muted);margin-top:3px}
.step{display:flex;gap:12px;align-items:flex-start}
.step .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--blue-soft);color:var(--blue);font-weight:700;font-size:13px;display:grid;place-items:center;margin-top:1px}
.step .n.ok{background:var(--ok-soft);color:var(--ok)}
.step .bd{flex:1;min-width:0}
.qa{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) auto;gap:8px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}
.qa:first-child{border-top:0}
.qa textarea.inp{min-height:44px;padding:10px 12px}
.qa .ic{display:flex;gap:4px}
.icb{width:36px;height:36px;border:1px solid var(--line);border-radius:9px;background:#fff;display:grid;place-items:center;color:var(--muted);flex:none}
.icb:hover{color:var(--ink);border-color:#cdd3e6}
.icb svg{width:16px;height:16px}
.qa-ro{padding:10px 0;border-top:1px solid var(--line)}
.qa-ro:first-child{border-top:0}
.qa-ro b{display:block;font-size:13px;color:var(--ink)}
.qa-ro div{font-size:14px;white-space:pre-wrap}
.drop{border:2px dashed #cfd6ea;border-radius:14px;padding:18px;text-align:center;background:#fbfcff;cursor:pointer;font-size:13.5px}
.drop.over{border-color:var(--blue);background:var(--blue-soft)}
.drop svg{width:26px;height:26px;color:var(--blue)}
.drop b{display:block;color:var(--ink);margin-top:4px}
.drop img{max-height:220px;border-radius:10px;border:1px solid var(--line);margin-top:8px}
.saved{font-size:12px;color:var(--muted)}
.hist{display:grid;gap:0}
.hi{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:13.5px}
.hi:first-child{border-top:0}
.hi .dot{flex:none;width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--blue-line)}
.hi .dot.k-app_applied{background:var(--blue)}
.hi .dot.k-app_status{background:var(--violet)}
.hi .dot.k-app_failed{background:var(--bad)}.hi .dot.k-app_confirmed{background:var(--ok)}.hi .dot.k-assigned{background:#64748b}
.hi .dot.k-note{background:var(--warn)}
.hi .dot.k-client_created,.hi .dot.k-invite_sent,.hi .dot.k-app_restored,.hi .dot.k-resume_restored,.hi .dot.k-client_restored{background:var(--ok)}
.hi .dot.k-app_deleted,.hi .dot.k-resume_deleted,.hi .dot.k-client_archived{background:var(--bad)}
.hi .dot.k-resume_request{background:#f59e0b}.hi .dot.k-resume_request_done{background:var(--ok)}
.hi .tx{flex:1;min-width:0}
.hi .tx b{color:var(--ink);font-weight:600}
.hi .tx small{display:block;color:var(--muted);font-size:12px}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--bg);color:var(--body);margin-left:6px}
.sticky-save{position:sticky;bottom:0;background:linear-gradient(180deg,rgba(246,247,252,0),var(--bg) 30%);padding:16px 0 4px;display:flex;gap:10px;justify-content:flex-end;align-items:center}
.lock{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ok);font-weight:600}
.lock svg{width:14px;height:14px}
.kbd{font-size:11.5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:#fff}

/* (Apply from links, the list of jobs as cards and the job board are styled at the end of this sheet, in the app's look) */
.spin{display:inline-block;flex:none;width:16px;height:16px;border-radius:50%;border:2px solid #e5e5e5;border-top-color:#404040;animation:spin .7s linear infinite}

@media (max-width:900px){
  .crow .pgc{width:120px}
  .crow .td{display:none}
  .stats{grid-template-columns:repeat(2,1fr)}
  /* phones and small tablets: no sidebar; a top bar with the client, and their sections along the bottom */
  .ws{display:block}
  .sb{display:none}
  .top{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:30;height:56px;padding:0 10px 0 14px;background:rgba(255,255,255,.98);border-bottom:1px solid var(--line)}
  .top .brand svg{width:28px;height:28px}
  .top .tcl{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font-size:14.5px}
  .top .tcl b{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .top .grow{flex:1}
  .top .icb{width:36px;height:36px}
  .content .wrap{padding-top:16px;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  .phead h1{font-size:20px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));background:#fff;border-top:1px solid var(--line)}
  .tabbar a{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;font-weight:600;color:var(--muted);text-decoration:none;border-radius:10px}
  .tabbar a span{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tabbar a.on{color:var(--ink)}
  .tabbar a.on svg{color:var(--blue)}
  .tabbar svg{width:22px;height:22px}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .sticky-save{bottom:calc(64px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:760px){
  .crow .pgc{width:92px}
  .crow .pgc .m{display:none}
  .qa{grid-template-columns:1fr}
  .qa .ic{justify-content:flex-end}
  .ahead{flex-wrap:wrap}
  .ahead > .row{width:100%}
  .ahead h2{font-size:18px}
  .ph{display:block}
  .pc{display:none!important}
}
/* safeguards: the new-client check, a draft changed in two places, the team's day */
.rvs{margin-top:10px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.rv{display:grid;grid-template-columns:104px minmax(0,1fr);gap:2px 12px;padding:10px 14px;border-top:1px solid var(--line);font-size:14px}
.rv:first-child{border-top:0}
.rv span{color:var(--muted);font-size:13px}
.rv b{color:var(--ink);font-weight:600;overflow-wrap:anywhere}
.rv small{grid-column:2;font-size:12px;color:var(--warn)}
.clash{margin-top:14px}
.clash > b{display:block;color:var(--ink);font-size:14px;margin-bottom:6px}
.cv{border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;margin-top:6px;background:#fafbff}
.cv.mine{border-color:var(--blue-line);background:var(--blue-soft)}
.cv span{display:block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.cv p{white-space:pre-wrap;overflow-wrap:anywhere;max-height:120px;overflow:auto}
.saved.bad{color:var(--bad);font-weight:600}
.tday{font-size:12.5px;color:var(--muted);white-space:nowrap}
.tday b{color:var(--ink)}
.tday.zero b{color:var(--warn)}
.st.archived{background:#f4f5f9;color:#5b6280}
.archn{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.archn span{flex:1;min-width:200px;display:flex;align-items:center;gap:8px}
.archn svg{width:16px;height:16px;flex:none}
.rdlink{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-size:13px;font-weight:600;color:var(--muted);text-decoration:none}
.rdlink:hover{color:var(--ink)}
.rdlink svg{width:14px;height:14px}
.rdi{background:#eef0f6;color:var(--muted)}
.rec{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0}
.rec span{flex:1;min-width:220px}
.rechint{margin-top:6px;color:var(--warn)}
@media (max-width:760px){.rv{grid-template-columns:1fr}.rv small{grid-column:1}.tday{display:none}}
/* Profile: skills added or left out for jobs */
.skr.no .t{color:var(--muted);text-decoration:line-through}
/* Skills for jobs: the main resume's Skills lines, each skill a quiet chip */
.skb{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-top:1px solid var(--line)}.skb:first-of-type{border-top:0}
.skbl{flex:none;min-width:110px;font-size:12.5px;font-weight:600;color:var(--ink)}
.skbi{display:flex;flex-wrap:wrap;gap:5px}
.chip.ro{padding:0 9px;background:#f5f6f8;border-color:var(--line)}
@media (max-width:760px){.skb{flex-direction:column;gap:4px}}

/* =====================================================================
   The app's look (app.trulyplaced.com, its globals.css): a calm, Apple-like canvas. San Francisco on Apple devices and
   Inter elsewhere; near-black text and neutral greys; white cards with a hairline border and a soft layered shadow; pill
   buttons, the main one graphite; TrulyPlaced blue kept for the current item, key figures and focus; colour only where
   it means something (green done, amber needs you, red failed). Dense enough for a full day of work: tables with headings.
   ===================================================================== */
:root{--ui:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,"Segoe UI",system-ui,sans-serif;--ui-d:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,"Segoe UI",system-ui,sans-serif;
  --ink:#1d1d1f;--body:#404040;--muted:#737373;--faint:#a3a3a3;
  --line:#ebebeb;--line-2:#e0e0e0;--bg:#f5f5f7;--hover:#fafafa;--head:#fafafa;--blue-soft:#eef2fe;--blue-line:#dfe6fd;
  --sb-bg:#fafafa;--sb-line:#ececec;--sb-ink:#171717;--sb-text:#525252;--sb-muted:#737373;--sb-hover:rgba(0,0,0,.03);--sb-on:rgba(0,0,0,.06);--sb-ic:#737373;--sb-ic-on:#0938d5;
  --edge:rgba(0,0,0,.07);--sh-1:0 1px 2px rgba(0,0,0,.04);--sh-card:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.04);
  --sh-hover:0 2px 4px rgba(0,0,0,.05),0 12px 32px rgba(0,0,0,.07);--sh-float:0 1px 2px rgba(0,0,0,.04),0 10px 32px rgba(0,0,0,.1);
  --row:54px;--r:16px}
body{font-family:var(--ui);color:var(--body);background:#fff}
h1,h2,h3,.hello,.brand,.stat b,.mod h2,.ahead h2{font-family:var(--ui-d);letter-spacing:-.022em}
h1{font-weight:650}
/* sidebar */
.sb{background:var(--sb-bg);border-right:1px solid var(--sb-line)}
.sb .brand{color:var(--sb-ink);font-weight:600;font-size:16px}
.sb .brand small{color:var(--sb-muted);font-family:var(--ui)}
.nav a{color:var(--sb-text);font-size:15px;padding:8px 12px;border-radius:8px;transition:background-color .15s,color .15s}
.nav a svg{color:var(--sb-ic)}
.nav a:hover{background:var(--sb-hover);color:var(--sb-ink)}
.nav a.on{background:var(--sb-on);color:var(--sb-ink);font-weight:550}
.nav a.on svg{color:var(--sb-ic-on)}
.nav a em{background:var(--sb-ink);color:var(--sb-bg)}
.otabs{border-left-color:var(--sb-line)}
.otab{color:var(--sb-text)}
.otab:hover{background:var(--sb-hover);color:var(--sb-ink)}
.otab.on{background:var(--sb-on);color:var(--sb-ink)}
.otab button{color:var(--sb-muted)}
.otab button:hover{background:var(--sb-hover);color:var(--sb-ink)}
.otab.add{color:var(--sb-ic-on)}
.cbar,.pgcard,.me{border-top-color:var(--sb-line)}
.cb1 .lab,.pgcard .lab{color:var(--sb-muted);letter-spacing:.07em}
.cbw .nm,.me .mw b,.pgcard .pg b{color:var(--sb-ink)}
.cbw small,.me .mw small,.pgcard .pg{color:var(--sb-muted)}
.sb .icb{background:transparent;border-color:transparent;color:var(--sb-muted)}
.sb .icb:hover{color:var(--sb-ink);background:rgba(0,0,0,.05)}
.pgcard .prog{background:var(--sb-hover)}
/* page header: where you are, the title, its actions */
.content .wrap{max-width:1320px;padding:24px 32px 64px}
.bc{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);margin-bottom:4px;min-width:0;white-space:nowrap;overflow:hidden}
.bc a{color:var(--muted);text-decoration:none}
.bc a:hover{color:var(--ink);text-decoration:underline}
.bc i{font-style:normal;color:var(--faint)}
.bc span{color:var(--body);overflow:hidden;text-overflow:ellipsis}
.phead{display:block;margin-bottom:20px}
.phead h1,.pageh h1{font-size:24px;font-weight:650;color:var(--ink);letter-spacing:-.022em}
.pageh{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.pageh .grow{flex:1;min-width:200px}
.pageh .sub{font-size:14px;color:#525252;margin-top:4px}
/* controls: the app's three buttons, pill-shaped - graphite for the one main action, white with a hairline for the rest,
   quiet (no border) for the small ones; green only for Mark as applied, red only for what deletes */
.btn{min-height:36px;height:36px;padding:0 16px;border-radius:999px;font-size:14px;font-weight:500;gap:6px;color:#171717;background:#fff;border-color:#e0e0e0;box-shadow:none;
  transition:background-color .15s,border-color .15s,color .15s}
.btn:hover{border-color:#cdcdcd;background:#fafafa}
.btn svg{width:16px;height:16px}
.btn.pri{background:#171717;border-color:#171717;color:#fff;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.btn.pri:hover{background:#2b2b2b;border-color:#2b2b2b}
.btn.ok{background:#047857;border-color:#047857;color:#fff;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.btn.ok:hover{background:#065f46;border-color:#065f46}
.btn.sm{min-height:32px;height:32px;padding:0 14px;font-size:13px;border-radius:999px}
.btn.lg{min-height:44px;height:44px;padding:0 22px;font-size:15px;border-radius:999px}
.btn.ghost{box-shadow:none;background:none;border-color:transparent;color:#525252}
.btn.ghost:hover{background:rgba(0,0,0,.04);color:#171717}
.btn.bad{background:#fff;border-color:#fecaca;color:#b91c1c}
.btn.bad:hover{background:#fef2f2;border-color:#fca5a5}
.btn:not(.pri):not(.ok).busy::after{border-color:#404040 #404040 transparent transparent}
.icb{width:32px;height:32px;border-radius:999px;border-color:transparent;background:transparent;color:#737373;transition:background-color .15s,color .15s}
.icb:hover{background:rgba(0,0,0,.05);border-color:transparent;color:#171717}
.inp,.field input,.field select,.field textarea{min-height:38px;border-color:#e0e0e0;border-radius:10px;font-size:14px;color:var(--ink)}
.inp:focus,.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:#171717;box-shadow:0 0 0 3px rgba(0,0,0,.06)}
.field label,.lbl{font-size:13px;font-weight:500;color:#262626}
.seg{background:rgba(0,0,0,.05);border-radius:999px;padding:3px}
.seg button{min-height:30px;border-radius:999px;padding:0 13px;font-size:13px;font-weight:500;color:#525252}
.seg button:hover{color:#171717}
.seg button.on{background:#fff;color:#171717;box-shadow:0 1px 2px rgba(0,0,0,.08),0 1px 1px rgba(0,0,0,.04)}
.seg b{font-weight:500;color:var(--faint);margin-left:5px;font-variant-numeric:tabular-nums}
.seg button.on b{color:var(--muted)}
:focus-visible{outline-color:#2c55e3}
.tools{margin:0 0 14px}
.tools .inp{max-width:440px;min-height:36px}
/* cards, figures, notes: white on white, told apart by a hairline and a soft layered shadow */
.card{border-radius:16px;border-color:var(--edge);padding:20px 22px;box-shadow:var(--sh-card)}
.card + .card{margin-top:14px}
.card h3{font-size:15px;font-weight:600;color:var(--ink);letter-spacing:-.01em}
.card .hint{font-size:13px;color:var(--muted)}
.stats{gap:12px}
.stat{border-radius:16px;border-color:var(--edge);padding:16px 18px;box-shadow:var(--sh-card)}
.stat b{font-size:24px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat span{font-size:12.5px;color:var(--muted)}
.list{border-color:var(--edge);box-shadow:var(--sh-card)}
.card .list{box-shadow:none}
a.li:hover,button.li:hover{background:var(--hover)}
.note{border-radius:12px;border-color:transparent;background:var(--bg);color:#404040}
.note.warn{background:#fffbeb;color:#92400e;border-color:transparent}
.note.ok{background:#ecfdf5;color:#065f46;border-color:transparent}
.note.bad{background:#fef2f2;color:#991b1b;border-color:transparent}
.empty{border-radius:16px;border-color:rgba(0,0,0,.15)}
.empty svg{color:var(--faint);opacity:1}
.tag{border-radius:6px;background:#f5f5f5;color:#525252;font-weight:500}
/* a status: a quiet pill with a coloured dot (the app's StatusBadge) - the dot carries the meaning */
.st{border:0;border-radius:999px;font-size:12px;font-weight:500;padding:3px 10px;gap:6px;background:#f5f5f5;color:#525252}
.st::before{width:6px;height:6px;opacity:1;background:#a3a3a3}
.st.applied,.st.offer,.st.active,.st.done{background:#ecfdf5;color:#047857}
.st.applied::before,.st.offer::before,.st.active::before,.st.done::before{background:#10b981}
.st.interview{background:#f0f9ff;color:#0369a1}.st.interview::before{background:#0ea5e9}
.st.paused{background:#fffbeb;color:#b45309}.st.paused::before{background:#f59e0b}
.st.rejected,.st.closed,.st.archived,.st.withdrawn{background:#f5f5f5;color:#737373}
.st.rejected::before,.st.closed::before,.st.archived::before,.st.withdrawn::before{background:#d4d4d4}
.step .n{background:#fff;color:var(--ink);border:1px solid #e0e0e0;font-weight:600;font-size:12.5px}
.step .n.ok{background:#ecfdf5;color:#047857;border-color:transparent}
.ahead h2{font-size:20px;font-weight:650}
.mod-wrap{background:rgba(0,0,0,.32)}
.mod{border-radius:20px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 24px 64px rgba(0,0,0,.18)}
.mod h2{font-size:19px;font-weight:650}
.mod .x{border-radius:999px}
.mod .x:hover{background:rgba(0,0,0,.05)}
.toast{background:#1d1d1f;border-radius:14px;box-shadow:0 10px 32px rgba(0,0,0,.22)}
.toast .tbtn{background:rgba(255,255,255,.12);color:#fff;border-radius:999px}
.toast .tbtn:hover{background:rgba(255,255,255,.2)}
.prog{background:rgba(0,0,0,.06)}
.prog i{background:#0938d5}
.prog.full i{background:#10b981}
/* company logos: the app's CompanyLogo - a rounded square with a hairline ring; no logo found, its letter in grey */
.logo{border-radius:10px;background:#f5f5f5!important;color:#737373;font-weight:500}
.logo::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);pointer-events:none}
/* tables: a heading row, then one row per client / application / person */
.tbl{background:#fff;border:1px solid var(--edge);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh-card)}
.tbl .thead{display:grid;align-items:center;gap:14px;padding:0 16px;height:40px;background:var(--head);border-bottom:1px solid var(--line);
  font-size:11.5px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.tbl .thead button{border:0;background:none;font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit;display:inline-flex;align-items:center;gap:4px;padding:0;cursor:pointer}
.tbl .thead button:hover,.tbl .thead button.on{color:var(--ink)}
.tbl .thead button.on::after{content:"↓";font-size:11px}
.tbl .li{display:grid;align-items:center;gap:14px;min-height:var(--row);padding:8px 16px;border-top:1px solid rgba(0,0,0,.055)}
.tbl .thead + .li{border-top:0}
.tbl a.li:hover,.tbl .li:hover{background:var(--hover)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl .td{width:auto;text-align:left}
.tbl .td.num{text-align:right}
.tbl .td b{display:inline;font-size:14px}
.tbl .num b{font-weight:600;color:var(--ink)}
.tbl .m{font-size:12.5px}
.cwho{display:flex;align-items:center;gap:12px;min-width:0}
.cwho .av{width:32px;height:32px;font-size:12px}
.tbl.clients .thead,.tbl.clients .li{grid-template-columns:minmax(0,2.4fr) minmax(0,1.5fr) 64px 64px minmax(0,1.1fr) 92px 16px}
.tbl.clients .pgc{width:auto}
.pgl{display:flex;align-items:baseline;gap:6px;font-size:13px;color:var(--muted)}
.pgl b{font-size:13.5px;color:var(--ink);font-variant-numeric:tabular-nums}
.tbl.clients .prog{height:5px;margin-top:5px}
.tbl.clients .td.zero b{color:var(--warn)}
.tbl.apps .thead,.tbl.apps .li{grid-template-columns:minmax(0,2.6fr) minmax(0,1.3fr) 108px minmax(0,1.2fr) minmax(0,.9fr) 30px}
/* a row's ⋯ (Withdraw, Undo withdrawal, Delete) and its menu, laid over the page beside it */
.tbl.apps .amore{display:flex;justify-content:flex-end}
.amb{width:26px;height:26px;display:grid;place-items:center;border:0;border-radius:5px;background:none;color:var(--muted);cursor:pointer;padding:0}
.amb:hover,.amb[aria-expanded=true]{background:#eef0f3;color:var(--ink)}.amb svg{width:15px;height:15px}
.rmenu.aprm{position:fixed;right:auto;min-width:200px}
.rmenu button.bad{color:var(--bad,#b42318)}
.rmenu button svg{width:14px;height:14px}
/* the client's Gmail: the Profile card, and the employer's emails on an application */
.mbrow{display:flex;align-items:flex-start;gap:10px}
.mbrow .main{min-width:0}.mbrow .m{font-size:12.5px;color:var(--muted);margin-top:2px}
.mbdot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none;background:#16a34a}.mbdot.bad{background:#e5484d}
#apMail .card{margin-bottom:16px}
.mbcode{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 12px;margin-bottom:12px;border:1px solid #bfd0ff;border-radius:8px;background:#f3f6ff}
.mbcode span{font-size:12.5px;color:var(--muted)}.mbcode b{font:600 20px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em;color:var(--ink)}
.mbl{display:grid;gap:0}
.mbe{padding:10px 0;border-top:1px solid var(--line)}.mbe:first-child{border-top:0;padding-top:2px}
.mbh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}.mbh b{font-weight:600;font-size:13px}.mbh .m{font-size:12px;color:var(--muted)}
.mbs{margin-top:4px;font-size:13px;color:var(--ink)}
.mbe details{margin-top:4px}.mbe summary{font-size:12px;color:var(--muted);cursor:pointer}
.mbt{margin-top:4px;font-size:12.5px;color:var(--muted);white-space:pre-wrap}
.mba{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.mbo{font-size:12.5px;color:var(--muted)}.mbo.ok{color:#15803d;font-weight:500}
.mod button.wdmk{display:inline-block;width:auto;height:auto;min-height:0;margin-top:10px;padding:0;border:0;border-radius:0;background:none;box-shadow:none;font-size:12.5px;font-weight:500;color:var(--blue);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.mod button.wdmk:hover{background:none;color:#0a2fb0}
/* Operations → Applied by mistake */
.tbl.mkemp .thead,.tbl.mkemp .li{grid-template-columns:minmax(0,1fr) 100px 140px}
.tbl.mkemp .li.on{background:#f5f7ff}
.tbl.mkl .thead,.tbl.mkl .li{grid-template-columns:132px minmax(0,1fr) minmax(0,1fr) minmax(0,1.3fr) minmax(0,.9fr) minmax(0,.9fr) minmax(0,1.3fr) 104px}
.tbl.mkl .li .m{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:900px){ .card.flush > .tbl.mkl{overflow-x:auto} .tbl.mkl .thead{display:grid} .tbl.mkl .thead,.tbl.mkl .li{min-width:980px} }
.note.wdn{margin-top:10px;font-size:12.5px}
.arole{display:flex;align-items:center;gap:12px;min-width:0}
.arole .logo{width:30px;height:30px;border-radius:8px}
.adate{font-size:13px;color:var(--body);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.adate small{display:block;font-size:12px;color:var(--muted)}
.adate .stale{color:var(--warn);font-weight:500}
.tbl.team .thead,.tbl.team .li{grid-template-columns:minmax(0,2fr) minmax(150px,1fr) 90px 120px 32px}   /* Role fits a job title */
.tbl.team .side{display:contents}
/* pages line up under their title, the sidebar runs the full height, and Save sits in a floating bar */
.content .narrow{margin-left:0!important;margin-right:auto!important}
@media (min-width:901px){.ws{background:linear-gradient(90deg,var(--sb-bg) 0,var(--sb-bg) calc(var(--side) - 1px),var(--sb-line) calc(var(--side) - 1px),var(--sb-line) var(--side),transparent var(--side))}}
.sticky-save{position:sticky;bottom:16px;z-index:20;margin-top:14px;padding:10px 12px 10px 16px;background:rgba(255,255,255,.98);   /* no backdrop blur: it was re-blurred on every scroll frame */
  border:1px solid var(--edge);border-radius:16px;box-shadow:var(--sh-float)}
.sticky-save .saved{flex:1;font-size:13px}
.sticky-save .saved:empty::before{content:"Changes here are saved with Save changes";color:var(--faint)}
/* Activity: the history's filters beside its title */
.acbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.acbar h3{margin:0}
.acbar .grow{flex:1;min-width:10px}
.acbar .seg button{min-height:28px;padding:0 10px;font-size:12.5px}
.acbar .inp{width:auto;min-height:32px;font-size:13px}
/* Applications: the second row of filters, Select mode and its bar */
.apt2{margin-top:-4px}
.apt2 .grow{flex:1;min-width:0}
.apt2 .inp{flex:0 0 auto;width:auto;min-width:150px;max-width:none}
.apmine{align-items:center;font-size:13.5px;color:var(--body);white-space:nowrap}
.apmine input{margin-top:0}
.bulk{position:sticky;top:8px;z-index:15;display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 10px;padding:8px 10px 8px 16px;background:#fff;border:1px solid var(--edge);border-radius:16px;box-shadow:var(--sh-float)}
.bulk b{color:var(--ink);font-size:13.5px}
.bulk .grow{flex:1}
.tbl.apps.picking .thead,.tbl.apps.picking .li{grid-template-columns:22px minmax(0,2.6fr) minmax(0,1.3fr) 108px minmax(0,1.2fr) minmax(0,.9fr)}
.tbl.apps.picking .li{cursor:pointer;user-select:none}
.tbl.apps.picking .li.on{background:var(--blue-soft)}
.apick input,.tbl .thead input{width:16px;height:16px;accent-color:var(--blue);pointer-events:none}
.tbl .thead input{pointer-events:auto;cursor:pointer}
@media (max-width:760px){
  .tbl.apps.picking .li{grid-template-columns:22px minmax(0,1fr) auto;grid-template-areas:"pk role st" "pk date date"}
  .tbl.apps.picking .apick{grid-area:pk}
}
/* the search for a client, at the top of the sidebar */
.navsearch{display:flex;align-items:center;gap:10px;width:calc(100% - 24px);margin:2px 12px 10px;height:36px;padding:0 10px 0 12px;border:1px solid rgba(0,0,0,.08);border-radius:10px;background:#fff;color:var(--sb-muted);font-size:14px;text-align:left;transition:border-color .15s,color .15s}
.navsearch:hover{border-color:rgba(0,0,0,.16);color:var(--sb-text)}
.navsearch svg{width:15px;height:15px;flex:none}
.navsearch span{flex:1}
.navsearch kbd{font:500 11px var(--ui);color:var(--sb-muted);border:1px solid var(--sb-line);border-radius:5px;padding:1px 5px;background:var(--sb-bg)}
@media (max-width:900px){
  .content .wrap{padding:16px 16px calc(96px + env(safe-area-inset-bottom,0px))}
  .tbl.clients .td{display:block}
}
@media (max-width:760px){
  .btn{height:40px;min-height:40px}   /* thumb-sized on phones, as in the app */
  .btn.sm{height:36px;min-height:36px}
  .tbl .thead{display:none}
  .tbl.clients .li{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"who st" "pg today";row-gap:8px}
  .tbl.clients .cwho{grid-area:who}.tbl.clients .pgc{grid-area:pg;width:auto}.tbl.clients .ctoday{grid-area:today}.tbl.clients .cst{grid-area:st}
  .tbl.clients .cdrafts,.tbl.clients .clast,.tbl.clients .chev{display:none}
  .tbl.clients .ctoday::after{content:" today";font-size:12px;color:var(--muted)}
  .tbl.apps .li{grid-template-columns:minmax(0,1fr) auto 28px;grid-template-areas:"role st mo" "date date mo";row-gap:4px}.tbl.apps .amore{grid-area:mo;align-items:center}
  .tbl.apps .arole{grid-area:role}.tbl.apps .ast{grid-area:st}.tbl.apps .adate{grid-area:date;padding-left:42px}
  .tbl.apps .aloc,.tbl.apps .aby{display:none}
  .tbl.team .li{grid-template-columns:minmax(0,1fr) auto auto}
  .tbl.team .tm-acc,.tbl.team .tday{display:none}
  .pageh h1,.phead h1{font-size:20px}
}
/* a short window: nothing in the sidebar overlaps. It scrolls, you and Sign out stay in view at the bottom,
   and below 760px tall it's a little tighter so it usually all fits */
.me{position:sticky;bottom:0;z-index:2;background:var(--sb-bg)}
@media (max-height:760px){
  .sb .brand{height:52px}
  .navsearch{margin-bottom:6px}
  .nav a{padding-top:5px;padding-bottom:5px}
  .cbar{margin-top:8px;padding-top:10px}
  .pgcard{padding:10px 20px 12px}
  .pgcard .pg b{font-size:20px}
  .me{padding-top:9px;padding-bottom:9px}
}
/* ---------- like Scout Better: your menu, My day, a client's Dashboard, the Profile's sections, Main / Tailored resumes ---------- */
.mebtn{flex:1;min-width:0;display:flex;align-items:center;gap:10px;margin:-6px 0 -6px -8px;padding:6px 8px;border-radius:9px;background:none;border:0;text-align:left;cursor:pointer;color:inherit;font:inherit}
.mebtn:hover,.mebtn[aria-expanded=true]{background:var(--sb-on)}
.mebtn .mechev{width:14px;height:14px;flex:none;color:var(--sb-muted);transform:rotate(-90deg)}
.memenu{position:absolute;left:10px;right:10px;bottom:calc(100% + 6px);z-index:30;background:#fff;border:1px solid var(--edge);border-radius:14px;box-shadow:var(--sh-float);padding:6px}
.memenu [role=menuitem]{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;border:0;background:none;color:var(--ink);font:inherit;font-size:14px;text-align:left;text-decoration:none;cursor:pointer}
.memenu [role=menuitem]:hover,.memenu [role=menuitem]:focus-visible{background:var(--hover);outline:none}
.memenu [role=menuitem] svg{width:17px;height:17px;flex:none;color:var(--muted)}
.memenu small{display:block;font-size:12px;color:var(--muted);line-height:1.35}
.memenu [data-act=out]{border-top:1px solid var(--line);border-radius:0 0 8px 8px;margin-top:4px}
.stats.s5{grid-template-columns:repeat(5,minmax(0,1fr))}
.stats.s6{grid-template-columns:repeat(6,minmax(0,1fr))}
.stat .of{font-size:14px;color:var(--muted);font-weight:500}
.mdg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:start}
.mdg .card + .card{margin-top:0}
.mdg .list .li,.card .list .li{text-decoration:none;color:inherit}
.mdg .li .chev,.card .li .chev{width:16px;height:16px;color:var(--faint);flex:none}
.dbwrap{position:relative;margin-top:10px}
.dbsvg{display:block;max-width:100%;overflow:visible}
.dbsvg .gl{stroke:var(--line);stroke-width:1}
.dbsvg .ax{font:11px var(--ui);fill:var(--muted);font-variant-numeric:tabular-nums}
.dbsvg .bar{fill:#0938d5}
.dbsvg .hit{fill:transparent}
.dbsvg .col{cursor:default;outline:none}
.dbsvg .col.on .bar,.dbsvg .col:focus .bar{fill:#3d63e0}
.dbsvg .col:focus-visible .hit{fill:rgba(9,56,213,.06)}
.dbtip{position:absolute;top:-6px;pointer-events:none;background:#fff;border:1px solid var(--edge);border-radius:10px;padding:6px 10px;box-shadow:var(--sh-float);white-space:nowrap}
.dbtip b{display:block;font-size:14px;color:var(--ink);font-variant-numeric:tabular-nums}.dbtip span{font-size:12px;color:var(--muted)}
.pfwrap{display:grid;grid-template-columns:210px minmax(0,1fr);gap:24px;align-items:start}
.pfnav{position:sticky;top:16px;display:flex;flex-direction:column;gap:2px}
.pfnav button{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:9px;border:0;background:none;color:var(--body);font:inherit;font-size:14px;font-weight:550;cursor:pointer}
.pfnav button small{display:block;font-size:12px;font-weight:400;color:var(--muted);line-height:1.35;margin-top:1px}
.pfnav button:hover{background:var(--hover)}
.pfnav button.on{background:rgba(0,0,0,.06);color:var(--ink)}
.pfsec{scroll-margin-top:16px}
.pfsec + .pfsec{margin-top:28px}
.pfsec > h2{font-size:18px;font-weight:650;color:var(--ink);margin:0 0 12px}
.rsseg{display:inline-flex;margin-bottom:14px}
.rsseg b{margin-left:6px;font-weight:500;color:var(--muted)}
@media (max-width:1100px){.stats.s6{grid-template-columns:repeat(3,minmax(0,1fr))}.stats.s5{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:900px){
  .mdg{grid-template-columns:minmax(0,1fr)}
  .mdg .card + .card{margin-top:12px}
  .pfwrap{grid-template-columns:minmax(0,1fr);gap:10px}
  .pfnav{position:sticky;top:0;z-index:5;flex-direction:row;overflow-x:auto;background:#fff;padding:6px 0;margin:-6px 0 0}
  .pfnav button{width:auto;flex:none;white-space:nowrap;padding:7px 12px}
  .pfnav button small{display:none}
  .pfsec{scroll-margin-top:56px}
}
@media (max-width:760px){.stats.s6,.stats.s5{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* ---------- the application page's parts that stay: the status picker, card headings, the checklist steps, the drops ---------- */

.jc .fitp b{position:relative;font-size:12px;font-weight:600;color:var(--ink)}
.jc .fitp small{font-size:11px;font-weight:500;color:var(--muted);white-space:nowrap}
.jc .fitp.wait .fring svg{animation:ringspin 1s linear infinite}
.jc .fitp.wait .arc{stroke:#a3a3a3}
@keyframes ringspin{from{transform:rotate(-90deg)}to{transform:rotate(270deg)}}
/* the job match: a quiet chip, its dot green from 75%, grey from 50%, amber from 30%, red below */
.mscore{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:6px;background:#f5f5f5;color:#525252;font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums;cursor:default}
.mscore::before{content:"";width:6px;height:6px;border-radius:50%;background:#a3a3a3;margin-right:2px}
.mscore.hi::before{background:#10b981}.mscore.lo::before{background:#f59e0b}.mscore.min::before{background:#ef4444}
.mscore b{font-size:12px;font-weight:600;color:var(--ink)}
.mscore i{font-style:normal;color:var(--faint)}
.mscore small{font-size:12px;font-weight:400;color:#525252}
/* the card's actions: quiet text buttons, then its status (once started) and the main button */
.jcf{display:flex;align-items:center;gap:2px;margin-top:auto;padding-top:14px;min-width:0}
.jcf .sp{flex:1}
.jcf .btn{margin-left:6px}
.lkq{display:inline-flex;align-items:center;gap:3px;height:32px;padding:0 10px;border:0;border-radius:999px;background:none;font:inherit;font-size:13px;font-weight:500;color:#525252;text-decoration:none;cursor:pointer;white-space:nowrap;transition:background-color .15s,color .15s}
.jcf > .lkq:first-child{margin-left:-10px}
.lkq:hover{background:rgba(0,0,0,.04);color:#171717}
.lkq svg{width:14px;height:14px}
.jch > .fiterr{flex:none;margin:-4px -8px 0 0;height:30px;font-size:12.5px}
/* already started from the board or a link: a quiet pill with a dot */
.tag.dup{display:inline-flex;align-items:center;gap:6px;height:24px;margin:0;padding:0 10px;border-radius:999px;font-size:12px;font-weight:500;text-decoration:none;white-space:nowrap}
.tag.dup::before{content:"";width:6px;height:6px;border-radius:50%}
.tag.dup.draft{background:#fffbeb;color:#b45309}.tag.dup.draft::before{background:#f59e0b}
.tag.dup.sent{background:#ecfdf5;color:#047857}.tag.dup.sent::before{background:#10b981}
/* the job board: the app's Browse list */
/* links that weren't added, and the next one on an application page */
.lkskip{margin-top:20px}
.lkskip > .fine{margin-bottom:8px}
.lkrow.skip{padding-top:10px;padding-bottom:10px}
.lkrow.skip .t{font-weight:500;color:var(--body)}
.lknext{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.lknext .grow{flex:1;min-width:200px}
/* ---------- what clients ask about their resume: on their Resumes tab (Answer) and on My day; the tab's count turns amber ---------- */
.nav a em.wait{background:#f59e0b;color:#fff}
.rqcard{margin-bottom:14px;border-color:#fde68a;background:linear-gradient(180deg,#fffdf5,#fff 80px)}
.rqcard h3{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rqi{padding:12px 0;border-top:1px solid var(--line)}
.rqi:first-of-type{border-top:0}
.rqh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rqh b{font-size:14px;color:var(--ink)}
.rqh .grow{flex:1}
.rqi p{margin:4px 0 0;font-size:13.5px;color:var(--body);white-space:pre-wrap;overflow-wrap:anywhere}
.rqr{margin-top:8px;padding:10px 12px;border-radius:10px;background:#ecfdf5;color:#065f46;font-size:13.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.rqr b{display:block;font-size:12px;font-weight:600;margin-bottom:2px}
.rqdone{margin:0 0 14px;padding:0 16px;border:1px solid var(--edge);border-radius:14px;background:#fff}
.rqdone summary{padding:12px 0;font-size:13.5px;font-weight:500;color:var(--body);cursor:pointer}
.rqdone .rqi{border-top:1px solid var(--line)}
.mdreq{margin-bottom:12px;border-color:#fde68a}
.mdreq h3{display:flex;align-items:center;gap:10px}
@media (max-width:900px){ .lkgrid{grid-template-columns:minmax(0,1fr)} }
@media (max-width:760px){
  #lkF .btn{flex:1 1 100%}
  .jc{padding:16px 16px 10px}

  .lkbar .grow{flex-basis:100%}
  .lkneed{grid-template-columns:1fr}
}
/* the plan (Profile → Plan & account, the owners'): the package, the extra applications with their reasons, Take back */
.plansum{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:4px}
.plansum b{font-size:17px;font-weight:650;letter-spacing:-.01em}
.plansum small{color:var(--muted);font-size:13px}
.exh{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:18px}
.exh h4{font-size:14px;font-weight:600;margin:0}
.adjl{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;margin-top:10px;overflow:hidden}
.adj{display:flex;align-items:center;gap:12px;padding:10px 12px;border-top:1px solid var(--line)}
.adj:first-child{border-top:0}
.adj>b{min-width:48px;font-weight:650;color:var(--blue)}
.adj.off>b{color:var(--muted);text-decoration:line-through}
.adj.off .t{color:var(--muted)}
.adj .main{flex:1;min-width:0}
.adj .t{font-size:14px}
.adj .m{font-size:12px;color:var(--muted)}
/* an employee: the owners' controls never show (and the database refuses them anyway) */
body.emp [data-act=newclient],body.emp [data-act=archive],body.emp [data-act=unarchive],body.emp [data-act=addextra],body.emp [data-act=undoextra],body.emp [data-act=delsent]{display:none !important}
/* =====================================================================
   The TrulyPlaced workspace look: Linear's precision, Ramp's enterprise polish, Notion's calm. One type scale (Inter;
   22px page titles, 16px sections, 14px body, 12–13px supporting), charcoal ink with slate-grey support, TrulyPlaced blue
   for the one main action, the current item and focus; white surfaces on a faint grey workspace, told apart by hairlines
   rather than shadows; 6px controls, 8px panels, pills only for statuses and people. Dense enough for a full day's work.
   This block comes last in the sheet, so it wins over the older look above it.
   ===================================================================== */
:root{--ui:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;--ui-d:var(--ui);
  --ink:#1b1d24;--body:#3d4250;--muted:#6b7280;--faint:#9aa1ad;--line:#e6e8ec;--line-2:#d8dbe2;--bg:#f7f8fa;--hover:#f4f5f7;--head:#fafbfc;
  --blue:#0938d5;--blue-d:#0730ab;--blue-soft:#eef2fe;--blue-line:#cfdafc;--client:#0938d5;
  --sb-bg:#f7f8fa;--sb-line:#e6e8ec;--sb-ink:#1b1d24;--sb-text:#4b5160;--sb-muted:#7b828f;--sb-hover:rgba(15,23,42,.045);--sb-on:rgba(15,23,42,.075);--sb-ic:#7b828f;--sb-ic-on:#0938d5;
  --edge:#e6e8ec;--sh-1:none;--sh-card:none;--sh-hover:0 1px 3px rgba(16,24,40,.07);--sh-float:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.1);
  --row:44px;--r:8px;--rc:6px;--side:236px}
body{font-size:14px;line-height:1.5;color:var(--body);background:#fff}
h1,h2,h3,h4,.hello,.brand,.stat b,.mod h2,.ahead h2{font-family:var(--ui);letter-spacing:-.01em;color:var(--ink)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
a{color:var(--blue-d)}
/* ---- sidebar: brand, find, grouped sections, the client in hand, you ---- */
.sb .brand{height:54px;padding:0 16px;gap:9px;font-size:14.5px;font-weight:600}
.sb .brand svg{width:26px;height:26px}
.sb .brand small{font-size:10px;letter-spacing:.08em;margin-top:-2px}
.navsearch{height:30px;margin:0 12px 6px;padding:0 8px 0 10px;border-radius:var(--rc);border-color:var(--line-2);background:#fff;font-size:13px;color:var(--sb-muted)}
.navsearch kbd{font-size:10.5px;border-radius:4px;padding:0 4px}
.nav{padding:0 10px;gap:1px}
.nav a{min-height:30px;padding:5px 10px;border-radius:var(--rc);font-size:13.5px;gap:9px;line-height:1.3}
.nav a svg{width:16px;height:16px}
.nav a.on{font-weight:500}
.nav a em{font-size:11px;line-height:18px;min-width:18px;padding:0 5px;background:var(--line);color:var(--body);font-weight:500}
.nav a.on em{background:var(--blue-soft);color:var(--blue-d)}
.nav a em.wait{background:#f59e0b;color:#fff}
.ngl{padding:12px 10px 4px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.ngl:first-child{padding-top:4px}
.otabs{margin:1px 0 4px 19px;padding-left:8px;border-left-color:var(--line)}
.otab{min-height:28px;padding:0 4px 0 8px;font-size:13px;border-radius:var(--rc)}
.otab button{border-radius:4px}
.cbar{margin-top:8px;padding-top:10px}
.cb1{padding:0 12px 8px 16px}
.cb1 .lab,.pgcard .lab{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--faint)}
.cbw{margin-top:5px}
.cbw .av{width:30px;height:30px;font-size:11.5px}
.cbw .nm{font-size:13.5px}
.cbw small{font-size:12px}
.pgcard{padding:12px 16px 14px}
.pgcard .pg{font-size:12px}
.pgcard .pg b{font-size:20px;font-weight:600}
.pgcard .prog{height:3px}
.me{padding:10px 10px 10px 14px}
.me .mw b{font-size:13.5px;font-weight:500}
.me .mw small{font-size:12px}
.mebtn{border-radius:var(--rc)}
.memenu{border-radius:var(--r);box-shadow:var(--sh-float);border-color:var(--line)}
.memenu [role=menuitem]{font-size:13.5px;padding:7px 10px;border-radius:var(--rc)}
.memenu small{font-size:12px}
/* ---- the page: a quiet breadcrumb, a 22px title, its actions on the same line ---- */
.content .wrap{max-width:1280px;padding:20px 32px 56px}
.bc{font-size:12px;margin-bottom:6px}
.phead{margin-bottom:16px}
.phead h1,.pageh h1{font-size:22px;font-weight:600;letter-spacing:-.015em}
.pageh{margin-bottom:16px;align-items:center}
.pageh .sub,.sub{font-size:13px;color:var(--muted);margin-top:2px}
.jsech h2,.lkbar h2,.pfsec > h2{font-size:16px;font-weight:600;letter-spacing:-.01em}
.jsech .sub{font-size:13px}
/* ---- controls: 32px, 6px corners; the one main action in TrulyPlaced blue; green only for Mark as applied, red only for what deletes ---- */
.btn{height:32px;min-height:32px;padding:0 12px;border-radius:var(--rc);font-size:13px;font-weight:500;gap:6px;color:var(--ink);background:#fff;border-color:var(--line-2);box-shadow:0 1px 1px rgba(16,24,40,.03)}
.btn:hover{background:var(--hover);border-color:#c6cad3}
.btn svg{width:15px;height:15px}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 1px 2px rgba(9,56,213,.22)}
.btn.pri:hover{background:var(--blue-d);border-color:var(--blue-d)}
.btn.ok{background:#047857;border-color:#047857;color:#fff;box-shadow:0 1px 2px rgba(4,120,87,.2)}
.btn.ok:hover{background:#065f46;border-color:#065f46}
.btn.bad{background:#fff;border-color:#f3c3c3;color:#b91c1c;box-shadow:none}
.btn.bad:hover{background:#fef2f2;border-color:#f0a8a8}
.btn.ghost{box-shadow:none;border-color:transparent;background:none;color:var(--body)}
.btn.ghost:hover{background:var(--hover);color:var(--ink)}
.btn.sm{height:28px;min-height:28px;padding:0 10px;font-size:12.5px;border-radius:var(--rc)}
.btn.sm svg{width:14px;height:14px}
.btn.lg{height:36px;min-height:36px;padding:0 16px;font-size:14px;border-radius:var(--rc)}
.btn:not(.pri):not(.ok).busy::after{border-color:var(--body) var(--body) transparent transparent}
.lkbar .btn.on{background:var(--blue-soft);border-color:var(--blue-line);color:var(--blue-d)}
.icb{width:28px;height:28px;border-radius:var(--rc);color:var(--muted)}
.icb:hover{background:var(--hover);color:var(--ink)}
.icb svg{width:15px;height:15px}
.gbtn{border-radius:var(--rc);min-height:36px;font-size:14px}
.inp,.field input,.field select,.field textarea{min-height:32px;padding:0 10px;border-radius:var(--rc);border-color:var(--line-2);font-size:13.5px;color:var(--ink)}
.field textarea,textarea.inp{padding:8px 10px;min-height:88px;line-height:1.5}
.inp:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(9,56,213,.12)}
.field{gap:5px}
.field label,.lbl{font-size:12.5px;font-weight:500;color:var(--body)}
.field small{font-size:12px}
.field input[readonly]{background:var(--bg);color:var(--muted)}
.grid2,.grid3,.stack{gap:12px}
.check{font-size:13px;gap:8px}
.check input{width:15px;height:15px;margin-top:2px;accent-color:var(--blue)}
.tools{margin:0 0 12px;gap:8px}
.tools .inp{max-width:420px;min-height:32px}
.seg{background:var(--bg);border:1px solid var(--line);border-radius:var(--rc);padding:2px;gap:1px}
.seg button{min-height:26px;height:26px;padding:0 10px;border-radius:4px;font-size:12.5px;color:var(--body)}
.seg button:hover{color:var(--ink);background:rgba(15,23,42,.04)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 0 0 1px var(--line-2),0 1px 2px rgba(16,24,40,.06)}
.seg b{font-size:11.5px;margin-left:5px}
.acbar .seg button{min-height:24px;height:24px;padding:0 8px;font-size:12px}
.acbar .inp{min-height:28px;font-size:12.5px}
.picks{gap:5px}
.picks button{height:26px;padding:0 9px;border-radius:4px;font-size:12px;border-color:var(--line-2)}
.sgl{border-radius:var(--r);box-shadow:var(--sh-float);border-color:var(--line)}
.sgo{min-height:34px;border-radius:4px;font-size:13.5px}
.sgl .sgh{font-size:11px}
/* ---- panels, lists, tables: white, a hairline, 8px corners, no shadow; nothing nested in a frame of its own ---- */
.card{border-radius:var(--r);border-color:var(--line);padding:16px 20px;box-shadow:none}
.card + .card{margin-top:12px}
.card h3{font-size:14px;font-weight:600;letter-spacing:0;margin-bottom:2px}
.card .hint{font-size:12.5px;margin-bottom:10px}
.ch{margin-bottom:8px}
.ch .muted{font-size:12.5px}
.list,.tbl{border-radius:var(--r);border-color:var(--line);box-shadow:none}
.card .list{border:1px solid var(--line)}
.mdg .card + .card{margin-top:0}
.li{padding:10px 14px;gap:10px;border-top-color:var(--line)}
.li .t{font-size:13.5px;font-weight:500}
.li .m{font-size:12.5px}
a.li:hover,button.li:hover,.tbl a.li:hover,.tbl .li:hover{background:var(--hover)}
.tbl .thead{height:36px;padding:0 14px;background:#fff;border-bottom:1px solid var(--line);font-size:12px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted)}
/* long lists keep their column headings in view: the table no longer clips (so the heading can stick), its corners are drawn on the first and last rows instead */
.tbl{overflow:visible}
.tbl .thead{position:sticky;top:0;z-index:5;border-radius:var(--r) var(--r) 0 0}
.tbl.apps.picking .thead{top:56px}   /* under the Select bar, which sticks above it */
.tbl .li:last-child{border-radius:0 0 var(--r) var(--r)}
.tbl .li:first-child{border-radius:var(--r) var(--r) 0 0}
.tbl .thead + .li{border-radius:0}
.tbl .thead button.on::after{content:"↓";font-size:10px;color:var(--faint)}
.tbl .li{min-height:var(--row);padding:6px 14px;border-top-color:var(--line)}
.tbl .td b,.tbl .num b{font-size:13.5px}
.tbl .m{font-size:12.5px}
.cwho{gap:10px}
.cwho .av{width:28px;height:28px;font-size:11px}
.av{font-weight:600;letter-spacing:0}
.av.sm{width:26px;height:26px;font-size:10.5px}
.pgl{font-size:12.5px}.pgl b{font-size:13px}
.tbl.clients .prog{height:4px;margin-top:4px}
.chev{width:16px;height:16px;color:var(--faint)}
.arole .logo{width:28px;height:28px;border-radius:6px}
.adate{font-size:13px}.adate small{font-size:12px}
.logo{border-radius:8px;font-size:13px}
.logo img{padding:2px}
/* figures: one strip, told apart by hairlines - not a card each */
.stats,.stats.s5,.stats.s6{display:flex;gap:0;margin-bottom:16px;border:1px solid var(--line);border-radius:var(--r);background:#fff;overflow:hidden}
.stat{flex:1 1 0;min-width:0;border:0;border-left:1px solid var(--line);border-radius:0;padding:12px 16px 11px;box-shadow:none}
.stat:first-child{border-left:0}
.stat b{font-size:20px;font-weight:600;letter-spacing:-.01em;line-height:1.2;font-family:var(--ui)}
.stat span{font-size:12px;color:var(--muted)}
.stat .of{font-size:12.5px;font-weight:500}
/* statuses and tags: small, quiet pills whose dot carries the meaning */
.st{font-size:11.5px;padding:2px 8px;gap:5px;font-weight:500}
.st::before{width:5px;height:5px}
.cbw .nm .st{font-size:10px;padding:1px 6px}
.tag{border-radius:4px;font-size:11px;font-weight:500;padding:1px 6px}
.tag.dup{height:22px;padding:0 8px;font-size:11.5px}
.fitp,.mscore,.kchip,.jtag,.an .rs{border-radius:4px}
.mscore{height:22px;font-size:11.5px}.mscore b{font-size:11.5px}
.fitp{height:26px;line-height:26px;font-size:12px}.fitp b{font-size:13px}
.note{border-radius:var(--rc);font-size:13px;padding:10px 12px}
.empty{border-radius:var(--r);padding:36px 20px;border-color:var(--line-2)}
.empty h3{font-size:15px}
.empty p{font-size:13px}
.empty svg{width:32px;height:32px}
.skel{border-radius:var(--r);height:56px}
.rvs,.cv,.adjl,.jbreak,.rqdone{border-radius:var(--rc)}
.rv{font-size:13.5px;padding:9px 12px}.rv span{font-size:12.5px}
.drop{border-radius:var(--r);border-color:var(--line-2);background:var(--bg)}
.drop.sm{border-radius:var(--rc)}
.shot,.file{border-radius:var(--rc)}
pre.txt{border-radius:var(--rc);font-size:13px}
.hi{font-size:13px}
.hi .tx small{font-size:12px}
.dbtip{border-radius:var(--rc)}
.plansum b{font-size:16px}
/* tabs on the application page: an underline, not a pill group */
.jtabbar{background:none;border-radius:0;padding:0;gap:20px;margin:0 0 14px;border-bottom:1px solid var(--line)}
.jtabbar button{flex:0 0 auto;height:34px;border-radius:0;padding:0 2px;font-size:13.5px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.jtabbar button:hover{color:var(--ink)}
.jtabbar button[aria-selected=true]{background:none;box-shadow:none;color:var(--ink);border-bottom-color:var(--blue)}
.rsseg{margin-bottom:12px}
.pfnav button{font-size:13.5px;font-weight:500;padding:7px 10px;border-radius:var(--rc)}
.pfnav button small{font-size:12px}
.pfsec + .pfsec{margin-top:24px}
.pfsec > h2{margin-bottom:10px}
/* the application page */
.jcard{padding:18px 20px 16px}
.jcard .ahead .logo{width:48px;height:48px;border-radius:10px;font-size:18px}
.jcard .ahead .logo img{border-radius:10px}
.jcard .aht h2{font-size:18px;font-weight:600;letter-spacing:-.012em}
.jcard .jco{font-size:11.5px}
.jcard .ahm{font-size:12.5px;margin-top:6px}
.jfacts{font-size:12.5px;gap:10px 14px;margin-top:14px;padding-top:14px}
.jscore{margin-top:14px;padding-top:16px;gap:16px}
.jscore .ring{width:84px;height:84px}
.jscore .ring span{font-size:20px;font-weight:600}
.jscore .eyb{font-size:11.5px}
.jscore p{font-size:13px}
.jacts{gap:8px;margin-top:14px}
.jacts .btn{height:34px;min-height:34px;font-size:13.5px}
.jlinks a,.jlinks button{font-size:12.5px}
.apgrid{gap:16px}
.apmain{gap:12px}
.apside{border-radius:var(--r);box-shadow:none;border-color:var(--line)}
.reshd{padding:12px 14px}
.reshd .rh1 > b{font-size:13.5px}
.ckit .bd b{font-size:13px}
.ckit .bd small{font-size:12px}
.step .n{border-color:var(--line-2);font-size:12px}
.qa .inp,.qa textarea.inp{min-height:32px}
.stsel .inp{height:28px;min-height:28px;font-size:12.5px;border-radius:var(--rc)}
.sticky-save{border-radius:var(--r);box-shadow:var(--sh-float);border-color:var(--line);padding:8px 10px 8px 14px}

/* the resume takes the wider side, in Preview and in Edit alike, as the reference editor has it */
@media (min-width:1181px){.apgrid:has(.apside){grid-template-columns:minmax(0,.78fr) minmax(0,1.32fr)}}
@media (min-width:901px) and (max-width:1180px){.apgrid:has(.apside){grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr)}}
@media (max-width:900px){.reshd .rbtns > a.btn:not(.ghost){display:none}}   /* a phone: the resume's own action is in the bar at the bottom (.apbar) */
/* a dialog of the panel's editor, over the whole page (qkLift): its frame is laid over the window — see-through, with only the
   dialog and its backdrop drawn — until the dialog closes; the panel keeps its place behind */
.apside.lifted{z-index:2000}
.apside.lifted #apFrame{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;z-index:2000}
/* ---------- as the reference editor has them: the panel's header (Preview Mode · Change Resume; in Edit, Resume / Cover Letter
   and the toolbar) and the job description's reading view (About the Company, Job Overview, Missing / Matching Skills,
   Responsibilities…) ---------- */
.reshd:has(.rhp),.reshd:has(.rhe){padding:8px 12px;gap:6px}
.apside.editing .reshd{background:#fff}
.rhp{display:grid;gap:3px}
.rhp .pvm{font-size:11.5px;font-weight:500;color:#4f6bdc}
.rhp .rhpr,.rhe{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rhp .chres{display:inline-flex;align-items:center;gap:6px;min-width:0;max-width:100%;height:30px;padding:0 6px 0 11px;border:1px solid var(--line);border-radius:7px;background:#fff;
  box-shadow:0 1px 2px rgba(16,24,40,.05);font-size:12.5px;color:var(--ink);white-space:nowrap;overflow:hidden}
.rhp .chres b{font-weight:500;overflow:hidden;text-overflow:ellipsis}
.rhp .chres select{border:0;background:transparent;font:inherit;color:var(--ink);padding:0 4px;max-width:200px;cursor:pointer}
.rhp .chres select:focus{outline:none}
.rtools{display:inline-flex;align-items:center;gap:2px;margin-left:auto;padding:3px;border:1px solid var(--line);border-radius:8px;background:#fff}
.tbtn,.rtabs [role=tab],.rmenu button{border:0;background:none;padding:0;margin:0}   /* the portal's base leaves buttons to their own styles */
.tbtn{width:30px;height:28px;display:grid;place-items:center;border-radius:6px;color:#4b5563;transition:background .12s,color .12s}
.tbtn:hover{background:#f3f4f6;color:var(--ink)}.tbtn:disabled{opacity:.35;pointer-events:none}
.tbtn svg{width:16px;height:16px}
.tbtn.busy{color:var(--blue)}
.rtabs{display:inline-flex;gap:2px;padding:3px;border-radius:8px;background:#f1f2f4}
.rtabs [role=tab]{height:28px;padding:0 12px;border-radius:6px;font-size:13px;font-weight:500;color:#4b5563}
.rtabs [role=tab][aria-selected=true]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(16,24,40,.08),0 0 0 1px rgba(16,24,40,.04)}
.rmore{position:relative;display:inline-flex}
.rmenu{position:absolute;top:calc(100% + 6px);right:0;z-index:40;display:grid;min-width:210px;padding:5px;border:1px solid var(--line);border-radius:9px;background:#fff;box-shadow:0 1px 2px rgba(16,24,40,.06),0 12px 28px -10px rgba(16,24,40,.3)}
.rmenu[hidden]{display:none}
.rmenu a,.rmenu button{display:grid;grid-template-columns:18px 1fr;align-items:center;column-gap:8px;padding:7px 9px;border-radius:6px;font-size:13px;color:var(--ink);text-align:left;text-decoration:none}
.rmenu a:hover,.rmenu button:hover{background:#f3f4f6}
.rmenu svg{width:15px;height:15px;color:var(--muted)}
.rmenu small{grid-column:2;font-size:11.5px;color:var(--muted)}
.rmenu [aria-pressed=true]{color:var(--blue)}
.rnote2{display:flex;gap:6px;align-items:flex-start;margin:0;font-size:12px;color:var(--muted)}.rnote2 svg{width:14px;height:14px;flex:none;margin-top:1px;color:var(--blue)}
.jdv{display:grid;gap:18px}
.jds h4{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:15px;font-weight:600;color:var(--ink)}
.jds h4 svg{width:18px;height:18px;color:#4b5563}
.jds p{margin:0 0 6px 26px;font-size:13.5px;line-height:1.6;color:#4b5563}
.jdl{list-style:none;margin:0 0 0 26px;padding:0;display:grid;gap:8px}
.jdl li{display:grid;grid-template-columns:18px 1fr;gap:8px;font-size:13.5px;line-height:1.55;color:#4b5563}
.jdl svg{width:17px;height:17px;color:#16a34a;margin-top:1px}
.jdchips{display:flex;flex-wrap:wrap;gap:8px;margin-left:26px}
.jdchip{display:inline-flex;align-items:center;height:30px;padding:0 13px;border-radius:999px;font-size:13px}
.jdchip.miss{background:#fde4e4;color:#b42318}.jdchip.ok{background:#dcf5e6;color:#11704a}
.jds .fine{margin-left:26px}
.jde .jdeft{display:flex;justify-content:flex-end;margin-top:8px}
/* ---------- the Application page like for like with the reference: the job's card (the company under the title, a big green match
   ring, Score Breakdown in its own card, rounded actions), the full-width tabs, the skills chips, and the resume panel's header in
   white cards (Preview Mode, Change Resume, the download; in Edit the toolbar in its groups) ---------- */
.jcard .ahead .logo{width:64px;height:64px;border-radius:12px;font-size:22px}
.jcard .ahead .logo img{border-radius:12px}
.jcard .aht h2{font-size:18px;font-weight:700;letter-spacing:-.01em;color:#1b2a4e}
.jcard .jco{order:0;margin:4px 0 0;font-size:14.5px;font-weight:600;letter-spacing:0;text-transform:none;color:#1b2a4e}
.jtag{height:24px;padding:0 10px;border-radius:999px;font-size:12.5px;font-weight:600}
.jtag.ok{background:#dcf5e7;color:#15803d}.jtag.bad{background:#fde4e4;color:#b91c1c}
.jfacts{font-size:13.5px;color:#374151}
.jfacts svg{width:18px;height:18px;color:#4b5563}
.jscore{gap:22px;margin-top:16px;padding-top:20px}
.jscore .ring{width:116px;height:116px}
.jscore .ring circle{stroke-width:3.6}
.jscore .ring .trk{stroke:#e5e9f0}
.jscore .ring.hi .arc{stroke:#10b981}.jscore .ring.mid .arc{stroke:#f59e0b}.jscore .ring.lo .arc{stroke:#ef4444}
.jscore .ring span{font-size:22px;font-weight:700;color:#15803d}
.jscore .ring.mid span{color:#b45309}.jscore .ring.lo span{color:#b91c1c}.jscore.none .ring span{color:var(--muted)}
.jscore .eyb{font-size:15px;font-weight:800;letter-spacing:.01em;color:#111}
.jscore p{margin-top:6px;font-size:14px;line-height:1.65;color:#4b5563}
.jbreak{margin-top:16px;border:1px solid #e5e7eb;border-radius:14px;padding:0 18px;background:#fff;box-shadow:0 1px 3px rgba(16,24,40,.06)}
.jbreak summary{padding:17px 0;font-size:13.5px;font-weight:600;color:#374151}
.jbreak summary > span:first-child{display:inline-flex;align-items:center}
.jbreak .qhelp{display:inline-grid;margin-left:8px;color:#9ca3af;font-style:normal}.jbreak .qhelp svg{width:16px;height:16px}
.jbreak .bkw{display:inline-flex;align-items:center;gap:6px;margin-left:auto;margin-right:12px;font-size:12px;font-weight:500;color:var(--muted)}
.jbreak .bkw .spin{width:12px;height:12px;border-width:1.5px}
.jacts{gap:10px;margin-top:14px}
.jacts .btn{height:40px;min-height:40px;border-radius:12px;font-size:14px;font-weight:600}
.jacts .btn:not(.pri){background:#fff;border:1px solid #e5e7eb;color:#111827}
.jacts .btn:not(.pri):hover{background:#f9fafb;border-color:#d1d5db}
.jacts .btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.jacts .btn svg{width:17px;height:17px}
/* the job's tabs: one full-width segmented control */
.jtabbar{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;margin:0 0 18px;background:#f3f4f6;border:0;border-radius:10px}
.jtabbar button{height:38px;margin:0;padding:0;border:0;border-radius:8px;background:none;font-size:14.5px;font-weight:500;color:#6b7280}
.jtabbar button:hover{color:#111827}
.jtabbar button[aria-selected=true]{background:#fff;color:#111827;border:0;box-shadow:0 1px 3px rgba(16,24,40,.1),0 1px 2px rgba(16,24,40,.06)}
/* the skills: bigger chips with a shadow, a deeper colour on hover; Missing Skills' tag red, Matching Skills' green */
.jdchips{gap:10px}
.jdchip{height:34px;padding:0 16px;font-size:14px;box-shadow:0 1px 2px rgba(16,24,40,.1);transition:background .15s,color .15s,box-shadow .15s;cursor:default}
.jdchip.miss:hover{background:#fbc9c9;color:#991b1b;box-shadow:0 2px 6px rgba(185,28,28,.18)}
.jdchip.ok:hover{background:#bdeccf;color:#065f46;box-shadow:0 2px 6px rgba(4,120,87,.18)}
.jds.miss h4 svg{color:#dc2626}.jds.hit h4 svg{color:#16a34a}
/* the resume panel's header: white cards on the panel */
.reshd:has(.rhp),.reshd:has(.rhe){padding:10px 12px;gap:8px;background:#f3f4f6}
.apside.editing .reshd{background:#f3f4f6}
.rhp{gap:6px}
.rhp .pvm{justify-self:start;padding:3px 10px;border-radius:6px;background:#e3eafc;color:#2f55d4;font-size:12.5px;font-weight:500}
.rhp .rhpr{gap:8px}
.rhp .chres{height:36px;padding:0 10px 0 14px;border:0;border-radius:10px;background:#fff;box-shadow:0 1px 3px rgba(16,24,40,.12),0 1px 2px rgba(16,24,40,.06);font-size:13.5px}
.rtools{gap:2px;padding:4px;border:0;border-radius:10px;background:#fff;box-shadow:0 1px 3px rgba(16,24,40,.12),0 1px 2px rgba(16,24,40,.06)}
.rtools.rtpv + .rtools.rtpv{margin-left:0}
.rtools.rtpv:empty{display:none}.rtools.rtpv:empty + .rtools.rtpv{margin-left:auto}
.tbtn{width:36px;height:34px;border-radius:7px;color:#374151}
.tbtn svg{width:19px;height:19px}
.tbtn:disabled{opacity:1;color:#c3c7ce;pointer-events:none}
.tbtn.busy{color:#374151}   /* saving: dark, as unsaved; grey once it's saved */
.rtools .tdiv{flex:none;width:1px;height:22px;margin:0 4px;background:#e5e7eb}
.rtabs{padding:4px;border-radius:10px;background:#e7e9ed}
.rtabs [role=tab]{height:34px;padding:0 16px;border-radius:8px;font-size:14px}
.rmenu button{width:100%}
@media (max-width:900px){.jscore .ring{width:96px;height:96px}.jscore .ring span{font-size:19px}}
/* CRM: Leads and Tasks (colour only for meaning: due today blue, overdue red) */
.ldrow .side{gap:12px}
.ldnext{font-size:12.5px;color:var(--muted);white-space:nowrap}
.ldnext.due{color:#1d4ed8;font-weight:500}
.ldnext.late{color:#b91c1c;font-weight:500}
.ldnext.none{color:#9aa0aa}
.ldwho{font-size:12.5px;color:var(--muted);min-width:70px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ldacts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.ldhist{margin-top:20px;border-top:1px solid var(--line);padding-top:14px}
.ldhist h3{font-size:14px}
.ldnote{display:flex;gap:8px;align-items:flex-start;margin:8px 0 12px}
.ldnote textarea{flex:1;min-height:56px}
.ldh{display:grid;gap:10px;max-height:280px;overflow:auto}
.ldhi{display:flex;flex-direction:column;gap:2px;font-size:13px}
.ldhi b{font-weight:500;color:var(--ink)}
.ldhi.note b{font-weight:400;white-space:pre-wrap}
.ldhi span{font-size:12px;color:var(--muted)}
.ldfoot{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-top:14px}
.tkgrp{margin:18px 0 8px;font-size:13px;font-weight:600;color:var(--ink)}
.tkgrp:first-child{margin-top:0}
.tkgrp span{color:var(--muted);font-weight:500;margin-left:4px}
.tkgrp.late{color:#b91c1c}
.tk .tkck{width:20px;height:20px;border-radius:50%;border:1.5px solid #b8bdc7;background:#fff;display:grid;place-items:center;flex:none;cursor:pointer;padding:0;color:#fff}
.tk .tkck:hover{border-color:#16a34a}
.tk .tkck svg{width:12px;height:12px}
.tk.done .tkck{background:#16a34a;border-color:#16a34a}
.tk.done .t{text-decoration:line-through;color:var(--muted)}
.tk .m a{color:inherit;text-decoration:underline;text-decoration-color:rgba(0,0,0,.25)}
.tk .m .late{color:#b91c1c;font-weight:500}
.tk .m .due{color:#1d4ed8;font-weight:500}
.mdcrm{margin-bottom:16px}
@media (max-width:760px){ .ldrow .ldwho{display:none} .ldrow .side .st{display:none} }

/* ===== the work figures: My day's own work, Operations (sql/supabase-employee-work.sql) ===== */
.wkhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:20px 0 10px}
.wkhead h2{font-size:14px;font-weight:600;margin:0}
.wrbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wrbar .seg button{min-height:26px;padding:0 10px;font-size:12.5px}
.wrc{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.wrc input,.tlf select,.tlf input,.asel{height:28px;min-height:28px;padding:0 8px;font-size:12.5px;border:1px solid var(--line-2);border-radius:var(--rc);background:#fff;color:var(--ink)}
.tlf input[type=search]{width:190px}
.asel{max-width:100%;width:100%}
.tlf{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stat.bad b{color:#b91c1c}.stat.warn b{color:#b45309}
.st.failed{background:#fef2f2;color:#b91c1c}.st.failed::before{background:#ef4444}
.bad{color:#b91c1c}
small.bad{font-size:11.5px;font-weight:500}
.num{font-variant-numeric:tabular-nums;color:var(--ink)}
.card.flush{padding:0;overflow:hidden}
.card.flush > .ch{padding:10px 16px;margin:0;border-bottom:1px solid var(--line);min-height:46px}
.card.flush > .tbl{border:0;border-radius:0}
.card.flush .tbl .thead{background:var(--head)}
.wkx{overflow-x:auto}
button.li{width:100%;text-align:left;background:none;border:0;border-top:1px solid rgba(0,0,0,.055);font:inherit;color:inherit;cursor:pointer}
.tbl .thead + button.li{border-top:0}
.tbl .li.on{background:var(--blue-soft);box-shadow:inset 2px 0 0 var(--blue)}
.cwho.lnk{background:none;border:0;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer;display:flex;align-items:center;gap:10px;min-width:0}
.cwho.lnk:hover .t{text-decoration:underline}
.tbl .li .main,.tbl .li .t,.tbl .li .t2,.tbl .li .m{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl .li .main{display:flex;flex-direction:column}
.tbl .li .t2{color:var(--ink)}
.tbl.wkcl .thead,.tbl.wkcl .li{grid-template-columns:minmax(0,2fr) 64px 80px 70px minmax(96px,.9fr) 130px}
.tbl.wkcl.ep .thead,.tbl.wkcl.ep .li{grid-template-columns:minmax(0,1.8fr) 52px 56px 64px 76px 64px 80px 84px minmax(150px,1fr)}
.tbl.wktl .thead,.tbl.wktl .li{grid-template-columns:132px minmax(0,1fr) minmax(0,1fr) minmax(0,1.4fr) 150px minmax(0,1fr)}
.tbl.wktl.who .thead,.tbl.wktl.who .li{grid-template-columns:132px minmax(0,1fr) minmax(0,1fr) minmax(0,1.3fr) 90px 150px minmax(0,1fr)}
.tbl.wkemp .thead,.tbl.wkemp .li{grid-template-columns:minmax(0,1.8fr) 60px 56px 56px 70px minmax(120px,1.3fr) 70px 100px}
.tbl.occl .thead,.tbl.occl .li{grid-template-columns:minmax(0,1.5fr) 160px minmax(0,1fr) 92px 64px minmax(0,1.3fr) minmax(0,1.3fr) 96px}
.share{display:flex;align-items:center;gap:8px;min-width:0}
.share i{display:block;height:6px;border-radius:3px;background:var(--blue);min-width:2px;flex:none;max-width:calc(100% - 40px)}
.share b{font-weight:500;font-variant-numeric:tabular-nums;color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 4px 0 9px;border:1px solid var(--blue-line);background:var(--blue-soft);border-radius:999px;font-size:12px;color:var(--ink)}
.chip button{border:0;background:none;padding:2px;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.chip button svg{width:12px;height:12px}
.optabs{display:inline-flex}
.optabs a{display:inline-flex;align-items:center;min-height:26px;padding:0 12px;font-size:12.5px;font-weight:500;color:var(--muted);border-radius:calc(var(--rc) - 1px);text-decoration:none}
.optabs a.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg.sm button{min-height:24px;padding:0 9px;font-size:12px}
.wkch{font-size:12.5px;color:var(--muted);margin:0 0 6px}
.wksvg .b1{fill:var(--blue)}.wksvg .b2{fill:#a9b9ef}.wksvg .b3{fill:#ef4444}
.wksvg .col.on rect:not(.hit),.wksvg .col:focus rect:not(.hit){opacity:.85}
.wkkey{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
.wkkey i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.wkkey i.b1{background:var(--blue)}.wkkey i.b2{background:#a9b9ef}.wkkey i.b3{background:#ef4444}
.nrdot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#f59e0b;margin-left:6px;vertical-align:middle}
.apsub{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--muted)}
.apsub input{height:28px;padding:0 8px;font-size:12.5px;border:1px solid var(--line-2);border-radius:var(--rc);width:200px}
/* the Applications section: a month of work, by client (amHTML) */
.amhead .ammon{display:inline-flex;align-items:center;gap:4px;margin-left:auto}
.amhead .ammon b{min-width:118px;text-align:center;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.amhead .ammon .btn{width:26px;padding:0;justify-content:center;font-size:15px}
.amhead select{height:28px;font-size:12.5px;padding:0 8px;border:1px solid var(--line-2);border-radius:var(--rc);background:#fff}
.stats.s4{display:flex}
.amkey{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:8px}
.amkey button{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:2px 0;font:inherit;color:inherit;cursor:pointer}
.amkey button:hover,.amkey button.on{color:var(--ink)}.amkey button.off{opacity:.45}
.amkey i,.amtip i,.amcl .amdot{display:inline-block;width:9px;height:9px;border-radius:2px;flex:none}
.amkey b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.dbtip .amtip{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink);line-height:1.6}
.dbtip .amtip em{font-style:normal;font-weight:600;margin-left:auto;padding-left:14px;font-variant-numeric:tabular-nums}
.dbtip .amsub{display:block;margin-bottom:2px}
.tbl.amcl .thead,.tbl.amcl .li{grid-template-columns:minmax(0,2fr) 80px 90px 70px 120px 70px}
.tbl.amcl .li{cursor:pointer}.tbl.amcl .li.on{background:var(--blue-soft)}
.tbl.amcl .cn{display:flex;align-items:center;gap:8px;min-width:0}.tbl.amcl .cn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl.amtl .thead,.tbl.amtl .li{grid-template-columns:132px minmax(0,1fr) minmax(0,1.4fr) minmax(0,1fr) 110px}
.amfil{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin:-4px 0 12px}
@media (max-width:900px){
  .card.flush > .tbl.amcl,.card.flush > .tbl.amtl{overflow-x:auto}
  .tbl.amcl .thead,.tbl.amtl .thead{display:grid}
  .tbl.amcl .thead,.tbl.amcl .li{min-width:600px}
  .tbl.amtl .thead,.tbl.amtl .li{min-width:700px}
  .amhead .ammon{margin-left:0}
}
@media (max-width:900px){
  /* the wide tables scroll inside their card on a phone, headings included; the page itself never scrolls sideways */
  .card.flush > .tbl.wkcl,.card.flush > .tbl.wktl,.card.flush > .tbl.wkemp,.card.flush > .tbl.occl{overflow-x:auto}
  .tbl.wkcl .thead,.tbl.wktl .thead,.tbl.wkemp .thead,.tbl.occl .thead{display:grid}
  .tbl.wkcl .thead,.tbl.wkcl .li{min-width:620px}
  .tbl.wkcl.ep .thead,.tbl.wkcl.ep .li{min-width:860px}
  .tbl.wktl .thead,.tbl.wktl .li{min-width:820px}
  .tbl.wkemp .thead,.tbl.wkemp .li{min-width:760px}
  .tbl.occl .thead,.tbl.occl .li{min-width:960px}
  .wkhead{margin-top:16px}
  .tlf input[type=search]{width:100%}
}
/* background runs: the pill above your name, and its panel */
.runpill{display:block;margin:0 10px 8px}
.runpill[hidden]{display:none}
.runpill button{display:flex;align-items:center;gap:8px;width:100%;height:30px;padding:0 10px;border:1px solid var(--sb-line,rgba(255,255,255,.12));border-radius:6px;background:rgba(255,255,255,.06);color:var(--sb-ink,#e6e9f2);font:inherit;font-size:12.5px;cursor:pointer;text-align:left}
.runpill button:hover{background:rgba(255,255,255,.11)}
.runpill .spin{width:12px;height:12px;flex:none}
.runpill .rdot{width:8px;height:8px;border-radius:50%;background:#22c55e;flex:none}
body.sbmin .runpill span{display:none}
.rpanel{display:grid;gap:0;margin-top:10px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.rprow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.rprow:first-child{border-top:0}
.rprow .t{font-size:13px;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rprow .m{font-size:12px;color:var(--muted)}.rprow .m.err{color:var(--bad,#b42318)}.rprow .m.ok{color:#15803d}
.rprow .acts2{display:flex;gap:6px;grid-row:span 2;align-self:center}
/* phones: the sidebar is hidden, so a copy of the pill floats above the tab bar */
.runpill.rpm{display:none}
@media (max-width:900px){.runpill.rpm:not([hidden]){display:block;position:fixed;right:12px;bottom:76px;z-index:60;margin:0}.runpill.rpm button{width:auto;background:#0d1b3f;color:#fff;border-color:#0d1b3f;box-shadow:var(--sh-float)}body.sbmin .runpill.rpm span{display:inline}}
</style>

/* =====================================================================
   pages and links. The client is in the address (?client=…), so each browser tab keeps its own client.
   ===================================================================== */
function route(){
  var p = new URLSearchParams(location.search), h = location.hash.replace(/^#/, ''), r = {client:null, tab:'applications', app:null, page:null};
  var c = p.get('client');
  if(c && UUID.test(c)) r.client = c.toLowerCase();
  if(!r.client){   // the owners' home is Clients and the Team page is theirs; an employee's home is My day, with Clients at #clients
    var emp = !!ME && ME.owner === false, oe = /^ops\/emp=(.+)$/.exec(h);
    if(oe){ r.page = emp ? 'myday' : 'opsemp'; try{ r.emp = decodeURIComponent(oe[1]).toLowerCase(); }catch(e){ r.page = 'ops'; } return r; }   // one employee on Operations
    if(h === 'appusers' || h === 'appusers/reports'){ r.page = emp ? 'myday' : 'appusers'; r.sub = h === 'appusers/reports' ? 'reports' : ''; return r; }   // the AI app's users, the owners'
    r.page = h === 'team' || h === 'leads' || h === 'ops' || h === 'opsclients' || h === 'opsmistakes' ? (emp ? 'myday' : h) : h === 'tasks' ? 'tasks' : h === 'myday' || (emp && !h) ? 'myday' : 'clients';   // Leads, Operations and Team are the owners'
    return r;
  }
  var m = /^app=([0-9a-f-]{36})$/i.exec(h);
  if(m) r.app = m[1].toLowerCase();
  else if(TABS.some(function(t){ return t[0] === h; })) r.tab = h;
  return r;
}
function cUrl(id, hash){ return '/team.html?client=' + encodeURIComponent(id) + (hash ? '#' + hash : ''); }
// every move inside the page goes through here: a draft's last edits are saved first, and unsaved Profile changes or a
// half-written note are asked about. Resolves true once it has moved.
var HERE = location.href;
function go(url, replace){
  return leaveOK().then(function(ok){
    if(!ok) return false;
    history[replace ? 'replaceState' : 'pushState'](null, '', url); HERE = location.href; render(); window.scrollTo(0, 0);
    return true;
  });
}
window.addEventListener('popstate', function(){
  var to = location.pathname + location.search + location.hash;
  if(location.href === HERE) return;
  if(!askWhy()){ flushDraft(); HERE = location.href; render(); return; }
  history.pushState(null, '', HERE);   // back on the page with the unsaved work while we ask
  go(to);
});
// what can't be left without asking: Profile edits not saved, a note being written; Quick edit's last change is saved first

  if(pfDirty()) return 'profile';
  if(qkBusy()) return 'tailor';
  if(qkDirty()) return 'resume';

function loadList(force){
  if(LIST && !force && Date.now() - LIST.at < 60000) return Promise.resolve(LIST);

    q(SB.from('client_progress').select('*').limit(3000))
