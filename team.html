<style>
/* The shell, laid out like the job board app (app.trulyplaced.com): a left sidebar with the sections, the clients open in
   this browser tab, the client you're working on with their progress, and you. Phones get a top bar and a tab bar. */
:root{--side:248px}
.ph{display:none}
.ws{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh}
.sb{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;background:#fafafa;border-right:1px solid rgba(0,0,0,.06);overflow-y:auto;scrollbar-width:thin}
.sb .brand{height:64px;padding:0 20px}
.nav{display:flex;flex-direction:column;gap:2px;padding:0 12px}
.nav a{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:8px;color:#525252;text-decoration:none;font-size:15px;line-height:1.35;min-width:0}
.nav a svg{width:18px;height:18px;flex:none}
.nav a span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav a:hover{background:rgba(0,0,0,.03);color:#171717}
.nav a.on{background:rgba(0,0,0,.06);color:#171717;font-weight:500}
.nav a.on svg{color:var(--blue)}
.nav a em{font-style:normal;font-size:12px;font-weight:500;line-height:20px;min-width:20px;text-align:center;color:#fff;background:#171717;border-radius:999px;padding:0 6px}
/* the clients open in this browser tab, under Clients */
.otabs{display:flex;flex-direction:column;gap:1px;margin:2px 0 6px 21px;padding-left:9px;border-left:1px solid rgba(0,0,0,.08)}
.otab{display:flex;align-items:center;gap:8px;min-height:32px;padding:0 4px 0 10px;border-radius:8px;font-size:13.5px;color:#525252;text-decoration:none;min-width:0}
.otab:hover{background:rgba(0,0,0,.03);color:#171717}
.otab.on{background:rgba(0,0,0,.06);color:#171717;font-weight:500}
.otab i{width:8px;height:8px;border-radius:50%;flex:none}
.otab span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.otab button{width:24px;height:24px;flex:none;border:0;background:none;border-radius:6px;display:grid;place-items:center;color:var(--muted);opacity:0}
.otab:hover button,.otab.on button,.otab button:focus-visible{opacity:1}
.otab button:hover{background:rgba(0,0,0,.06);color:var(--ink)}
.otab button svg{width:12px;height:12px}
.otab.add{gap:6px;color:var(--blue);font-weight:500}
/* the client you're working on: who, their sections and, at the bottom, their progress */
#cbar{flex:1 0 auto;display:flex;flex-direction:column}   /* never shorter than what it holds: a short window scrolls the sidebar instead */
.cbar{flex:1;display:flex;flex-direction:column;margin-top:12px;padding-top:14px;border-top:1px solid rgba(0,0,0,.06)}
.cb1{padding:0 14px 10px 20px}
.cb1 .lab{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--client)}
.cbw{display:flex;align-items:center;gap:10px;margin-top:6px;min-width:0}
.cbw .av{width:34px;height:34px;font-size:12.5px}
.cbw .who{flex:1;min-width:0;line-height:1.3}
.cbw .nm{font-weight:600;font-size:14.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cbw .nm .st{margin-left:4px;font-size:10.5px;padding:1px 7px}
.cbw small{display:block;font-size:12px;color:#737373;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cbw .icb{width:32px;height:32px}
.cbar .grow{flex:1;min-height:12px}
.pgcard{border-top:1px solid rgba(0,0,0,.06);padding:14px 20px 16px}
.pgcard .lab{display:block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#737373}
.pgcard .pg{margin-top:2px;font-size:12px;color:#737373}
.pgcard .pg b{font-size:24px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.pgcard .prog{height:4px;margin-top:8px;background:rgba(0,0,0,.06)}
/* you */
.me{flex:none;display:flex;align-items:center;gap:10px;padding:12px 12px 12px 16px;border-top:1px solid rgba(0,0,0,.06);min-width:0}
.me .mw{flex:1;min-width:0;line-height:1.3}
.me .mw b{display:block;font-size:14px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me .mw small{display:block;font-size:12px;color:#737373;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me .icb{width:32px;height:32px}
/* the page, with a title line saying whose page it is */
.content{min-width:0}
.content .wrap{padding-top:28px}
.phead{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 14px;margin-bottom:16px}
.phead h1{font-size:24px}
.pfor{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;color:var(--muted)}
.pfor i{width:9px;height:9px;border-radius:50%;flex:none}
.pfor b{color:var(--ink);font-weight:600}
.top,.tabbar{display:none}

/* client list */
.crow .pgc{flex:none;width:170px}
.crow .pgc b{font-size:13px;color:var(--ink)}
.crow .pgc .m{font-size:12px}
.crow .td{flex:none;width:88px;text-align:right;font-size:12.5px;color:var(--muted)}
.crow .td b{display:block;color:var(--ink);font-size:14px}
.crow .td.zero b{color:var(--warn)}
.chev{width:18px;height:18px;color:#b3b9cf;flex:none}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-family:Poppins;font-size:21px;color:var(--ink);line-height:1.2}
.stat span{font-size:12.5px;color:var(--muted)}

/* application page */
.ahead{display:flex;gap:14px;align-items:flex-start}
.ahead h2{font-size:21px}
.ahead .m{font-size:13.5px;color:var(--muted);margin-top:3px}
.step{display:flex;gap:12px;align-items:flex-start}
.step .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--blue-soft);color:var(--blue);font-weight:700;font-size:13px;display:grid;place-items:center;margin-top:1px}
.step .n.ok{background:var(--ok-soft);color:var(--ok)}
.step .bd{flex:1;min-width:0}
.qa{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) auto;gap:8px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}
.qa:first-child{border-top:0}
.qa textarea.inp{min-height:44px;padding:10px 12px}
.qa .ic{display:flex;gap:4px}
.icb{width:36px;height:36px;border:1px solid var(--line);border-radius:9px;background:#fff;display:grid;place-items:center;color:var(--muted);flex:none}
.icb:hover{color:var(--ink);border-color:#cdd3e6}
.icb svg{width:16px;height:16px}
.qa-ro{padding:10px 0;border-top:1px solid var(--line)}
.qa-ro:first-child{border-top:0}
.qa-ro b{display:block;font-size:13px;color:var(--ink)}
.qa-ro div{font-size:14px;white-space:pre-wrap}
.drop{border:2px dashed #cfd6ea;border-radius:14px;padding:18px;text-align:center;background:#fbfcff;cursor:pointer;font-size:13.5px}
.drop.over{border-color:var(--blue);background:var(--blue-soft)}
.drop svg{width:26px;height:26px;color:var(--blue)}
.drop b{display:block;color:var(--ink);margin-top:4px}
.drop img{max-height:220px;border-radius:10px;border:1px solid var(--line);margin-top:8px}
.saved{font-size:12px;color:var(--muted)}
.hist{display:grid;gap:0}
.hi{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:13.5px}
.hi:first-child{border-top:0}
.hi .dot{flex:none;width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--blue-line)}
.hi .dot.k-app_applied{background:var(--blue)}
.hi .dot.k-app_status{background:var(--violet)}
.hi .dot.k-note{background:var(--warn)}
.hi .dot.k-client_created,.hi .dot.k-invite_sent,.hi .dot.k-app_restored,.hi .dot.k-resume_restored,.hi .dot.k-client_restored{background:var(--ok)}
.hi .dot.k-app_deleted,.hi .dot.k-resume_deleted,.hi .dot.k-client_archived{background:var(--bad)}
.hi .tx{flex:1;min-width:0}
.hi .tx b{color:var(--ink);font-weight:600}
.hi .tx small{display:block;color:var(--muted);font-size:12px}
.jbrow .side .btn{min-width:84px}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--bg);color:var(--body);margin-left:6px}
.sticky-save{position:sticky;bottom:0;background:linear-gradient(180deg,rgba(246,247,252,0),var(--bg) 30%);padding:16px 0 4px;display:flex;gap:10px;justify-content:flex-end;align-items:center}
.lock{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ok);font-weight:600}
.lock svg{width:14px;height:14px}
.kbd{font-size:11.5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:#fff}

/* Apply from links: the paste box, the list, the "next from your list" bar */
#lkIn{min-height:44px;height:44px;resize:none;overflow-y:hidden;padding:11px 12px;line-height:20px}
.lkbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:16px 0 10px}
.lkbar .grow{flex:1;min-width:180px}
.lkbar b{color:var(--ink);font-size:14.5px}
.lkbar .prog{margin-top:6px;max-width:300px}
.lkrow .side{gap:8px}
.lkrow .m.ok{color:var(--ok)}
.lkrow .m.warn{color:var(--warn)}
.lkrow .m.err{color:var(--bad)}
.lkrow .logo.wait{background:#eef0f6}
.lkneed{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 4px;max-width:560px}
.lkneed .inp{min-height:36px;font-size:13.5px;padding:0 10px}
.lkrow.skip{padding-top:9px;padding-bottom:9px}
.lkrow.skip .t{font-weight:500;color:var(--body)}
.lkskip{margin-top:14px}
.lkskip > .fine{margin-bottom:6px}
.lknext{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.lknext .grow{flex:1;min-width:200px}
.spin{display:inline-block;flex:none;width:16px;height:16px;border-radius:50%;border:2px solid;border-color:var(--blue) var(--blue) transparent transparent;animation:spin .7s linear infinite}

@media (max-width:900px){
  .crow .pgc{width:120px}
  .crow .td{display:none}
  .stats{grid-template-columns:repeat(2,1fr)}
  /* phones and small tablets: no sidebar; a top bar with the client, and their sections along the bottom */
  .ws{display:block}
  .sb{display:none}
  .top{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:30;height:56px;padding:0 10px 0 14px;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .top .brand svg{width:28px;height:28px}
  .top .tcl{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font-size:14.5px}
  .top .tcl b{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .top .grow{flex:1}
  .top .icb{width:36px;height:36px}
  .content .wrap{padding-top:16px;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  .phead h1{font-size:20px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));background:rgba(255,255,255,.97);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line)}
  .tabbar a{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;font-weight:600;color:var(--muted);text-decoration:none;border-radius:10px}
  .tabbar a span{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tabbar a.on{color:var(--ink)}
  .tabbar a.on svg{color:var(--blue)}
  .tabbar svg{width:22px;height:22px}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .sticky-save{bottom:calc(64px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:760px){
  .crow .pgc{width:92px}
  .crow .pgc .m{display:none}
  .qa{grid-template-columns:1fr}
  .qa .ic{justify-content:flex-end}
  .ahead{flex-wrap:wrap}
  .ahead > .row{width:100%}
  .ahead h2{font-size:18px}
  .ph{display:block}
  .pc{display:none!important}
  .lkneed{grid-template-columns:1fr}
  .lkrow .side .st{display:none}
}
/* safeguards: the new-client check, a draft changed in two places, the team's day */
.rvs{margin-top:10px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.rv{display:grid;grid-template-columns:104px minmax(0,1fr);gap:2px 12px;padding:10px 14px;border-top:1px solid var(--line);font-size:14px}
.rv:first-child{border-top:0}
.rv span{color:var(--muted);font-size:13px}
.rv b{color:var(--ink);font-weight:600;overflow-wrap:anywhere}
.rv small{grid-column:2;font-size:12px;color:var(--warn)}
.clash{margin-top:14px}
.clash > b{display:block;color:var(--ink);font-size:14px;margin-bottom:6px}
.cv{border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;margin-top:6px;background:#fafbff}
.cv.mine{border-color:var(--blue-line);background:var(--blue-soft)}
.cv span{display:block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.cv p{white-space:pre-wrap;overflow-wrap:anywhere;max-height:120px;overflow:auto}
.saved.bad{color:var(--bad);font-weight:600}
.tday{font-size:12.5px;color:var(--muted);white-space:nowrap}
.tday b{color:var(--ink)}
.tday.zero b{color:var(--warn)}
.st.archived{background:#f4f5f9;color:#5b6280}
.archn{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.archn span{flex:1;min-width:200px;display:flex;align-items:center;gap:8px}
.archn svg{width:16px;height:16px;flex:none}
.rdlink{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-size:13px;font-weight:600;color:var(--muted);text-decoration:none}
.rdlink:hover{color:var(--ink)}
.rdlink svg{width:14px;height:14px}
.rdi{background:#eef0f6;color:var(--muted)}
.rec{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0}
.rec span{flex:1;min-width:220px}
.rechint{margin-top:6px;color:var(--warn)}
@media (max-width:760px){.rv{grid-template-columns:1fr}.rv small{grid-column:1}.tday{display:none}}
/* Profile: skills added or left out for jobs */
.skr.no .t{color:var(--muted);text-decoration:line-through}
.skadd{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr) minmax(0,1.6fr) auto;gap:8px;margin-top:12px}
@media (max-width:760px){.skadd{grid-template-columns:1fr}}

/* =====================================================================
   The Workspace look: calm, light and dense enough for a full day of work — the same as the resume editor and
   app.trulyplaced.com. One typeface (Geist), neutral greys, hairline borders, tables with headings.
   ===================================================================== */
:root{--ui:Geist,Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;--ink:#0d0f14;--body:#3b3f4b;--muted:#6b7080;--faint:#a3a7b3;
  --line:#e6e8ec;--line-2:#d6d9e0;--bg:#f5f6f8;--hover:#f7f8fa;--head:#fafbfc;--blue-soft:#eef1fd;--blue-line:#d2dbfa;
  --sb-bg:#fbfbfc;--sb-line:#eceef1;--sb-ink:#0d0f14;--sb-text:#4a4f5c;--sb-muted:#8a8f9c;--sb-hover:rgba(13,15,20,.04);--sb-on:rgba(13,15,20,.065);--sb-ic:#8a8f9c;--sb-ic-on:var(--blue);
  --sh-1:0 1px 2px rgba(13,15,20,.05);--row:54px;--r:10px}
  --sb-bg:#0f172a;--sb-line:rgba(255,255,255,.08);--sb-ink:#fff;--sb-text:#c3cbdb;--sb-muted:#7f8aa3;--sb-hover:rgba(255,255,255,.06);--sb-on:rgba(255,255,255,.1);--sb-ic:#7f8aa3;--sb-ic-on:#8fb0ff;--row:46px}
body{font-family:var(--ui);font-size:14px;color:var(--body);background:var(--bg)}
h1,h2,h3,.hello,.brand,.stat b,.mod h2,.ahead h2{font-family:var(--ui);letter-spacing:-.012em}
/* sidebar */
.sb{background:var(--sb-bg);border-right:1px solid var(--sb-line)}
.sb .brand{color:var(--sb-ink);font-weight:600;font-size:16px}
.sb .brand small{color:var(--sb-muted);font-family:var(--ui)}
.nav a{color:var(--sb-text);font-size:14px;padding:7px 10px;border-radius:7px}
.nav a svg{color:var(--sb-ic)}
.nav a:hover{background:var(--sb-hover);color:var(--sb-ink)}
.nav a.on{background:var(--sb-on);color:var(--sb-ink);font-weight:550}
.nav a.on svg{color:var(--sb-ic-on)}
.nav a em{background:var(--sb-ink);color:var(--sb-bg)}
.otabs{border-left-color:var(--sb-line)}
.otab{color:var(--sb-text)}
.otab:hover{background:var(--sb-hover);color:var(--sb-ink)}
.otab.on{background:var(--sb-on);color:var(--sb-ink)}
.otab button{color:var(--sb-muted)}
.otab button:hover{background:var(--sb-hover);color:var(--sb-ink)}
.otab.add{color:var(--sb-ic-on)}
.cbar,.pgcard,.me{border-top-color:var(--sb-line)}
.cb1 .lab,.pgcard .lab{color:var(--sb-muted);letter-spacing:.07em}
.cbw .nm,.me .mw b,.pgcard .pg b{color:var(--sb-ink)}
.cbw small,.me .mw small,.pgcard .pg{color:var(--sb-muted)}
.sb .icb{background:transparent;border-color:var(--sb-line);color:var(--sb-text)}
.sb .icb:hover{color:var(--sb-ink);border-color:var(--sb-muted)}
.pgcard .prog{background:var(--sb-hover)}
/* page header: where you are, the title, its actions */
.content .wrap{max-width:1320px;padding:24px 32px 64px}
.bc{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);margin-bottom:4px;min-width:0;white-space:nowrap;overflow:hidden}
.bc a{color:var(--muted);text-decoration:none}
.bc a:hover{color:var(--ink);text-decoration:underline}
.bc i{font-style:normal;color:var(--faint)}
.bc span{color:var(--body);overflow:hidden;text-overflow:ellipsis}
.phead{display:block;margin-bottom:18px}
.phead h1,.pageh h1{font-size:22px;font-weight:600;color:var(--ink)}
.pageh{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.pageh .grow{flex:1;min-width:200px}
.pageh .sub{font-size:13px;color:var(--muted);margin-top:3px}
/* controls */
.btn{min-height:34px;height:34px;padding:0 14px;border-radius:8px;font-size:13.5px;font-weight:550;border-color:var(--line-2);box-shadow:var(--sh-1)}
.btn:hover{border-color:#c4c8d2;background:#fbfbfc}
.btn.pri{box-shadow:0 1px 2px rgba(9,56,213,.22)}
.btn.pri:hover{background:var(--blue-d)}
.btn.ok:hover{filter:brightness(.95)}
.btn.sm{min-height:30px;height:30px;padding:0 10px;font-size:13px;border-radius:7px}
.btn.lg{min-height:42px;height:42px;padding:0 18px;font-size:14px;border-radius:9px}
.btn.ghost{box-shadow:none;background:none;border-color:transparent}
.btn.ghost:hover{background:var(--hover)}
.btn.bad{background:#fff;border-color:#f1c4cf}

<script>
(function(){

  link:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>',
  star:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></svg>',
  swap:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4 3 8l4 4"/><path d="M3 8h13a4 4 0 0 1 4 4"/><path d="m17 20 4-4-4-4"/><path d="M21 16H8a4 4 0 0 1-4-4"/></svg>'
};
var SB = null, ME = null, TEAMROWS = [], LIST = null, C = null, R = {}, GEN = 0, BOARD = null, BOARDP = null;

var TABS = [['profile', 'Profile', J.profile], ['resumes', 'Resumes', J.resume], ['jobs', 'Jobs', J.jobs], ['applications', 'Applications', J.apps], ['activity', 'Activity', J.act]];
var COMMON_Q = ['Are you legally authorized to work in the United States?', 'Will you now or in the future require visa sponsorship (e.g. H-1B)?',
  'Are you willing to relocate?', 'What are your salary expectations?', 'When can you start?', 'LinkedIn profile', 'How did you hear about this job?',
  'Gender (voluntary)', 'Race / ethnicity (voluntary)', 'Veteran status (voluntary)', 'Disability status (voluntary)'];

/* =====================================================================
   start: signed in? on the team?
   ===================================================================== */
TP.client().then(function(c){ SB = c; return TP.session(); }).then(function(s){
  if(!s){ TP.toLogin(); return null; }
  ME = {id:s.user.id, email:String(s.user.email || '').toLowerCase()};
  // the client list as last seen in this browser tab shows at once (marked out of date, so it's asked for again)
  var kept = TP.ssGet('tp_cache_list', null); if(kept && kept.me === ME.id && Array.isArray(kept.rows)) LIST = {rows:kept.rows, prog:kept.prog || {}, at:0};
  // while the team check runs, this page's data is already on its way (what a non-member could read is only their own)
  var r0 = route(), names = loadTeamNames(); trashReady();
  if(r0.client) clientData(r0.client).catch(function(){}); else if(r0.page === 'clients') loadList().catch(function(){});
  return TP.whoami().then(function(w){
    if(!w || !w.team){ ME.team = false; return notTeam(w || {}); }
    ME.owner = !!w.owner;
    names.then(function(){ $('#me').innerHTML = meHTML(); });   // your name in the sidebar
    render();
  });
}).catch(function(e){ V.innerHTML = errBox(e, true); });

function notTeam(w){
  $('#me').innerHTML = meHTML();
  V.innerHTML = '<div class="empty">' + I.lock + '<h3>For the TrulyPlaced team</h3><p>You’re signed in as <b>' + esc(ME.email) + '</b>, which isn’t on the team list. ' +
    'Ask the owner to add you, then sign in again.</p><div class="row" style="justify-content:center">' +
    (w.client ? '<a class="btn pri" href="/portal.html">Go to my dashboard</a>' : '<a class="btn" href="/app.html">Job board</a>') +
    '<button class="btn" type="button" data-act="out">Sign out</button></div></div>';
}
function meHTML(){   // you, at the bottom of the sidebar
  var t = TEAMROWS.filter(function(x){ return x.email === ME.email; })[0] || {};
  return '<span class="av sm" style="background:' + TP.hue(ME.email) + '">' + esc(TP.initials(t.full_name, ME.email)) + '</span><span class="mw" title="' + esc(ME.email) + '"><b>' + esc(t.full_name || ME.email.split('@')[0]) + '</b>' +
    '<small>' + (ME.owner ? 'Owner' : 'Team member') + ' · ' + esc(ME.email) + '</small></span><button class="icb" type="button" data-act="out" title="Sign out">' + I.out + '<span class="sr">Sign out</span></button>';
}
function errBox(e, top){
  return '<div class="note bad">' + esc(TP.errText(e)) + (top ? ' <a href="/login.html">Sign in again</a>' : ' <button class="btn sm" type="button" data-act="retry">Try again</button>') + '</div>';
}
function loadTeamNames(){ return q(SB.from('team_members').select('email,full_name,role,active')).then(function(r){ TEAMROWS = r || []; }, function(){}); }
function who(email){
  if(!email || email === 'system') return 'TrulyPlaced';
  var t = TEAMROWS.filter(function(x){ return x.email === email; })[0];
  return (t && t.full_name) || email.split('@')[0];
}

/* =====================================================================
   pages and links. The client is in the address (?client=…), so each browser tab keeps its own client.
   ===================================================================== */
function route(){
  var p = new URLSearchParams(location.search), h = location.hash.replace(/^#/, ''), r = {client:null, tab:'applications', app:null, page:null};
  var c = p.get('client');
  if(c && UUID.test(c)) r.client = c.toLowerCase();
  if(!r.client){ r.page = h === 'team' ? 'team' : 'clients'; return r; }
  var m = /^app=([0-9a-f-]{36})$/i.exec(h);
  if(m) r.app = m[1].toLowerCase();
  else if(TABS.some(function(t){ return t[0] === h; })) r.tab = h;
  return r;
}
function cUrl(id, hash){ return '/team.html?client=' + encodeURIComponent(id) + (hash ? '#' + hash : ''); }
// every move inside the page goes through here: a draft's last edits are saved first, and unsaved Profile changes or a
// half-written note are asked about. Resolves true once it has moved.
var HERE = location.href;
function go(url, replace){
  return leaveOK().then(function(ok){
    if(!ok) return false;
    history[replace ? 'replaceState' : 'pushState'](null, '', url); HERE = location.href; render(); window.scrollTo(0, 0);
    return true;
  });
}
window.addEventListener('popstate', function(){
  var to = location.pathname + location.search + location.hash;
  if(location.href === HERE) return;
  if(!askWhy()){ flushDraft(); HERE = location.href; render(); return; }
  history.pushState(null, '', HERE);   // back on the page with the unsaved work while we ask
  go(to);
});
// what can't be left without asking: Profile edits not saved, a note being written
function askWhy(){
  if(pfDirty()) return 'profile';
  var n = $('#nt') || $('#anT'); return n && n.value.trim() ? 'note' : '';
}
function leaveOK(){
  return flushDraft().then(function(saved){
    if(!saved) return TP.confirmBox('Leave this page?', 'A draft’s latest changes haven’t saved yet (' + (DS && DS.why || 'no connection') + '). They keep trying in the background while this browser tab is open.', 'Leave anyway', true);
    var w = askWhy();
    if(w === 'profile') return pfAsk();
    if(w === 'note') return TP.confirmBox('Discard your note?', 'It hasn’t been saved.', 'Discard note', true, {cancel:'Keep writing'}).then(function(ok){
      if(ok){ if(C) bkDel('note_' + C.id); if(A) bkDel('anote_' + A.id); }
      return ok;
    });
    return true;
  });
}
document.addEventListener('click', function(e){
  var a = e.target.closest && e.target.closest('a[data-go]');
  if(!a || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;   // Ctrl/middle click: a new browser tab
  var act = e.target.closest('[data-act]'); if(act && a.contains(act) && act !== a){ e.preventDefault(); return; }   // a button inside a link (an open tab's ×) does its own thing
  e.preventDefault(); go(a.getAttribute('href'));
});
// a page that fails to draw shows what went wrong and Try again, never a blank screen
function render(){
  try{ draw(); }

}

  var cl = R.page === 'clients', tm = R.page === 'team';

  var items = c ? TABS.map(function(t){ return [cUrl(c.id, t[0]), t[1], t[2], R.tab === t[0]]; })

function setTitle(t, c){

  if(LISTP && Date.now() - LISTP.at < 3000) return LISTP.p;   // one already on its way (asked for while signing in)

    return LIST;

/* ---------- local backups: what was typed but isn't saved yet survives a crash, a refresh or a closed tab ----------

var BK = 'tp_unsaved_';
function bkSet(key, v){ try{ localStorage.setItem(BK + key, JSON.stringify({at:Date.now(), v:v})); }catch(e){} }
function bkGet(key){ try{ var x = JSON.parse(localStorage.getItem(BK + key) || 'null'); if(x && x.at > Date.now() - 14 * 864e5) return x; localStorage.removeItem(BK + key); }catch(e){} return null; }
function bkDel(key){ try{ localStorage.removeItem(BK + key); }catch(e){} }
function bkBar(id, what, when, fields){
  return '<div class="note warn rec" id="' + id + '"><span><b>' + what + ' from ' + esc(TP.ago(when)) + ' weren’t saved</b> — the page closed before they were. ' + esc(fields) + '</span>' +

// JSON with its keys in one order: the database hands back {"a","q"} for what was saved as {"q","a"}
function stable(v){
  if(Array.isArray(v)) return '[' + v.map(stable).join(',') + ']';
  if(v && typeof v === 'object') return '{' + Object.keys(v).sort().map(function(k){ return JSON.stringify(k) + ':' + stable(v[k]); }).join(',') + '}';
  return JSON.stringify(v === undefined ? null : v);
}

  m.addEventListener('click', function(e){
    var b = e.target.closest('[data-v]'); if(!b) return;
    var v = b.getAttribute('data-v'), last = t.role === 'owner' && t.active && !owners && v !== 'role' || (v === 'role' && t.role === 'owner' && !owners);
    if(last && (v !== 'active' || t.active)) return TP.toast('Keep at least one owner: make someone else an owner first');
    var conf = v === 'role' ? (t.role === 'owner'
          ? ['Make ' + nm + ' a member?', me ? 'You won’t be able to manage the team, set plans or delete sent applications any more.' : 'They keep every client, but can’t manage the team, set plans or delete sent applications.', 'Make a member', me]
          : ['Make ' + nm + ' an owner?', 'Owners can add and remove people, set clients’ plans and delete sent applications.', 'Make an owner', false])
      : v === 'active' ? (t.active
          ? ['Turn off ' + (me ? 'your own' : nm + '’s') + ' access?', me ? 'You’ll be locked out of the team portal straight away.' : 'They can’t use the team portal until it’s turned back on. Everything they did stays in the history.', 'Turn off access', true]
          : ['Turn ' + nm + '’s access back on?', 'They can use the team portal again.', 'Turn on', false])
      : ['Remove ' + (me ? 'yourself' : nm) + ' from the team?', me ? 'You’ll lose access to the team portal straight away.' : 'They lose access straight away. Their name stays on everything they did.', 'Remove', true];
    TP.confirmBox(conf[0], conf[1], conf[2], conf[3] || v === 'del', me && v !== 'role' ? {type:t.email} : {}).then(function(ok){
      if(!ok) return;
      var p = v === 'role' ? q(SB.from('team_members').update({role:t.role === 'owner' ? 'member' : 'owner'}).eq('email', email))
        : v === 'active' ? q(SB.from('team_members').update({active:!t.active}).eq('email', email))
        : q(SB.from('team_members').delete().eq('email', email));
      p.then(function(){ TP.toast('Updated'); if(me && v !== 'role') return location.reload(); loadTeamNames().then(function(){ if(me && v === 'role') ME.owner = t.role !== 'owner'; vTeam(); }); }, fail);
    });
  });
}

/* =====================================================================
   keyboard: Ctrl+K switches client, / goes to the page's search
   ===================================================================== */
document.addEventListener('keydown', function(e){
  if(!ME || ME.team === false || TP.isModal() || e.altKey) return;
  var a = document.activeElement, typing = a && (/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) || a.isContentEditable);
  if((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'k'){ e.preventDefault(); switcher(); return; }
  if(e.key === '/' && !typing && !e.ctrlKey && !e.metaKey){ var s = $('#cq') || $('#apQ') || $('#jbQ'); if(s){ e.preventDefault(); s.focus(); s.select(); } }
});

/* =====================================================================
   buttons
   ===================================================================== */
document.addEventListener('click', function(e){
  var b = e.target.closest && e.target.closest('[data-act]'); if(!b) return;
  var act = b.getAttribute('data-act');
  switch(act){
    case 'out': return TP.signOut();
    case 'retry': if(!ME) return location.reload(); if(C){ C.row = null; C.resumes = null; } staleList(); return render();   // only this page loads again; nothing typed elsewhere is touched
    case 'newclient': return newClient();
    case 'switch': return switcher();
    case 'closetab':
      e.preventDefault(); e.stopPropagation();
      return closeTab(b.getAttribute('data-id'));
    case 'pfsave': return saveProfile();
    case 'qaadd': $('#pfQA').insertAdjacentHTML('beforeend', qaRow({})); $$('#pfQA [data-qa=q]').pop().focus(); return;
    case 'skadd':
      var skn = $('#pfSkN').value.trim(); if(!skn) return $('#pfSkN').focus();
      C.skEdit = (C.skEdit || []).filter(function(x){ return x.skill.toLowerCase() !== skn.toLowerCase(); });
      C.skEdit.push({skill:skn, has:true, where:$('#pfSkW').value.trim(), key:'', note:$('#pfSkT').value.trim(), by:ME.email, at:new Date().toISOString()});
      $('#pfSk').innerHTML = skRows(); $('#pfSkN').value = $('#pfSkW').value = $('#pfSkT').value = ''; pfMark(); return;
    case 'skdel':
      var si = +b.getAttribute('data-i'), sk = C.skEdit[si], skc = C; if(!sk) return;
      C.skEdit.splice(si, 1); $('#pfSk').innerHTML = skRows(); pfMark();
      return TP.toast('Removed ' + sk.skill + ' — Save changes to keep it that way', {undo:function(){ if(C !== skc || !$('#pfSk')) return; C.skEdit.splice(Math.min(si, C.skEdit.length), 0, sk); $('#pfSk').innerHTML = skRows(); pfMark(); }});
    case 'qacommon': $('#pfQA').insertAdjacentHTML('beforeend', qaRow({q:b.getAttribute('data-q')})); b.remove(); $$('#pfQA [data-qa=a]').pop().focus(); return;
    case 'qaadd2': $('#apQA').insertAdjacentHTML('beforeend', qaRow({})); $$('#apQA [data-qa=q]').pop().focus(); return;
    case 'qacopy': var row = b.closest('.qa'); return TP.copy($('[data-qa=a]', row).value, 'Answer');
    case 'qadel':
      // an answer taken out: Undo puts it back in the same place (on a draft both are saved straight away)
      var r2 = b.closest('.qa'), qbox = r2.parentNode, qnext = r2.nextSibling, inApp = !!r2.closest('#apQA'), had = $$('[data-qa]', r2).some(function(x){ return x.value.trim(); });
      r2.remove(); if(inApp) draftChanged(); else pfMark();
      if(had) TP.toast('Answer removed', {undo:function(){ if(!qbox.isConnected) return; qbox.insertBefore(r2, qnext && qnext.parentNode === qbox ? qnext : null); if(inApp) draftChanged(); else pfMark(); }});
      return;
    case 'resend': return resendInvite(b);
    case 'newresume': return newResume();
    case 'resmenu': return resumeMenu(b.getAttribute('data-id'));
    case 'jbstart': return startFromBoard(b.getAttribute('data-key'), b);
    case 'jbmore': JB.n += 40; return drawBoard();
    case 'lkstart': return lkStart(b);
    case 'lkclear': return lkClear();
    case 'lkdel': return lkDel(b.getAttribute('data-id'));
    case 'lkopt': return lkOptimise();
    case 'lkretry': return lkRetry(b.getAttribute('data-id'));
    case 'apmore': AP.n += 50; return loadApps();
    case 'apsel': AP.sel = AP.sel ? null : {}; b.textContent = AP.sel ? 'Done selecting' : 'Select'; drawBulk(); return loadApps();
    case 'apcsv': return exportCsv(b);
    case 'bkstatus': return bulkStatus();
    case 'bkdel': return bulkDelete();
    case 'bkclear': AP.sel = {}; markPicked(); return drawBulk();
    case 'acmore': return loadActivity(C, +b.getAttribute('data-n'));
    case 'cpresume': return TP.copy(A.resume_text || (((C.resumes || []).filter(function(r){ return r.id === A.base_resume_id; })[0] || {}).text) || '', 'Resume text');
    case 'cpcover': return TP.copy($('#apCL').value, 'Cover letter');
    case 'toeditor': saveDraft(); return;   // the link opens the editor in its own tab
    case 'markapplied': return markApplied(b);
    case 'deldraft':
      var da = A, dc = C;
      return trashReady().then(function(kept){
        return TP.confirmBox('Delete this draft?', (da.title || 'Role') + (da.company ? ' at ' + da.company : '') + '. Nothing was sent, so nothing else changes.' +
          (kept ? ' It stays in Recently deleted for 30 days.' : ' This can’t be undone.'), 'Delete draft', true).then(function(ok){
          if(!ok) return;
          if(DS && DS.a === da){ DS.cur = null; DS.why = ''; clearTimeout(DS.retry); } bkDel('app_' + da.id);
          q(SB.from('applications').delete().eq('id', da.id).eq('status', 'draft').select('id')).then(function(r){
            if(!r || !r.length) throw {message:'It was already marked as applied, or deleted — refresh the page.'};
            dc.idx = null; refreshProgress(); if(C === dc) go(cUrl(dc.id, 'applications'), true);
            TP.toast('Draft deleted', kept ? {undo:function(){ restoreItem(da.id).then(function(){ dc.idx = null; refreshProgress(); TP.toast('Draft restored'); if(C === dc) go(cUrl(dc.id, 'app=' + da.id)); }, fail); }} : null);
          }, fail);
        });
      });
    case 'delsent':
      var sa = A, sc = C;
      return trashReady().then(function(kept){
        return TP.confirmBox('Delete this sent application?', 'Only for one marked by mistake. It comes off ' + sc.row.full_name + '’s count and dashboard. ' +
          (kept ? 'It stays in Recently deleted for 30 days, and only the owner can restore it.' : 'This can’t be undone.'), 'Delete it', true, {type:sa.company || 'delete'}).then(function(ok){
          if(!ok) return;
          q(SB.from('applications').delete().eq('id', sa.id).select('id')).then(function(r){
            if(!r || !r.length) throw {message:'Only the owner can delete a sent application.'};
            sc.idx = null; refreshProgress(); if(C === sc) go(cUrl(sc.id, 'applications'), true);
            TP.toast('Deleted', kept ? {undo:function(){ restoreItem(sa.id).then(function(){ sc.idx = null; refreshProgress(); TP.toast('Restored'); if(C === sc) go(cUrl(sc.id, 'app=' + sa.id)); }, fail); }} : null);
          }, fail);
        });
      });
    case 'rdrestore':
      var rdId = +b.getAttribute('data-id'), rdKind = b.getAttribute('data-kind'), rdc = C;
      return TP.busy(b, q(SB.rpc('restore_deleted', {p_id:rdId}))).then(function(){
        rdc.idx = null; rdc.resumes = null; refreshProgress();
        TP.toast(rdKind === 'resume' ? 'Resume restored — it’s back on the Resumes tab' : 'Restored — it’s back in Applications');
        if(C === rdc && R.tab === 'activity' && !R.app){ loadDeleted(rdc); loadActivity(rdc, 100); }
      }, function(e2){ fail(e2); if(C === rdc) loadDeleted(rdc); });
    case 'archive': return archiveClient(b);
    case 'unarchive': return unarchiveClient(b);
    case 'addmissing': return addMissing(b);
    case 'note':
      var t = $('#nt').value.trim(), nc = C; if(!t) return $('#nt').focus();
      return TP.busy(b, q(SB.from('client_activity').insert({client_id:nc.id, kind:'note', summary:t}))).then(function(){ bkDel('note_' + nc.id); if($('#nt')) $('#nt').value = ''; $$('.rechint').forEach(function(x){ x.remove(); }); TP.toast('Note saved'); if(C === nc) loadActivity(nc, 100); }, fail);
    case 'appnote':
      var at = $('#anT').value.trim(), aa = A, ac = C; if(!at) return $('#anT').focus();
      return TP.busy(b, q(SB.from('client_activity').insert({client_id:ac.id, application_id:aa.id, kind:'note', summary:at}))).then(function(){
        bkDel('anote_' + aa.id); if($('#anT')) $('#anT').value = ''; $$('.rechint').forEach(function(x){ x.remove(); }); TP.toast('Note saved');
        q(SB.from('client_activity').select('*').eq('application_id', aa.id).order('at', {ascending:true})).then(function(rows){ if(A === aa && $('#apHist')) $('#apHist').innerHTML = (rows || []).map(histRow).join(''); }, function(){});
      }, fail);
    case 'tmmenu': return teamMenu(b.getAttribute('data-email'));
  }
});
})();
</script>
