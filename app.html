<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TrulyPlaced Jobs | Fresh roles, matched to your resume</title>
<meta name="description" content="Fresh roles from top US companies, updated live. See how your resume matches each one — free.">
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#0938d5">
<link rel="canonical" href="https://trulyplaced.com/app.html">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='116' fill='%230938d5'/%3E%3Cpath d='M256 410C168 314 138 278 138 206 138 142 191 94 256 94s118 48 118 112c0 72-30 108-118 204z' fill='%23fff'/%3E%3Cpath d='M205 200l37 36 76-88' fill='none' stroke='%230938d5' stroke-width='30' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet"></noscript>
<style>
:root{--blue:#0938d5;--blue-d:#072ca8;--blue-soft:#eef2ff;--blue-line:#cfd9ff;--ink:#121a33;--body:#4b5473;
  --muted:#737b9c;--line:#e7e9f2;--bg:#f6f7fc;--card:#fff;--ok:#0a7f46;--ok-soft:#e6f6ee;--warn:#b45309;
  --warn-soft:#fef3e2;--bad:#be123c;--bad-soft:#ffe8ed;--side:248px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--body);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue)}
img{max-width:100%}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100%}
.side{position:sticky;top:0;height:100vh;background:#fff;border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:20px 14px 16px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);padding:4px 8px 18px;
  font-family:Poppins;font-weight:700;font-size:18px;letter-spacing:-.01em}
.brand svg{width:32px;height:32px;flex:none}
.brand small{display:block;font-family:Inter;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.06em;
  text-transform:uppercase;margin-top:-2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:10px;color:var(--body);
  text-decoration:none;font-weight:500;font-size:14.5px}
.nav a svg{width:20px;height:20px;flex:none;opacity:.85}
.nav a:hover{background:var(--bg);color:var(--ink)}
.nav a.on{background:var(--blue-soft);color:var(--blue);font-weight:600}
.nav a.on svg{opacity:1}
.side .grow{flex:1}
.tired{border:1px solid var(--blue-line);background:linear-gradient(160deg,#f2f5ff,#fff);border-radius:14px;
  padding:14px;margin-bottom:10px}
.tired b{display:block;color:var(--ink);font-size:14px}
.tired p{font-size:12.5px;margin:4px 0 10px;line-height:1.45}
.tired button{width:100%;min-height:40px;border:0;border-radius:9px;background:var(--blue);color:#fff;font-weight:600;font-size:13.5px}
.side-foot a{display:flex;align-items:center;gap:10px;min-height:40px;padding:0 12px;color:var(--muted);
  text-decoration:none;font-size:13.5px;border-radius:9px}
.side-foot a:hover{background:var(--bg);color:var(--ink)}
.side-foot svg{width:18px;height:18px}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;height:64px;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 24px}
.top h1{font-family:Poppins;font-weight:600;font-size:17px;color:var(--ink);flex:1;min-width:0;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.top .m-brand{display:none}
.invite{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:10px;
  border:1px solid var(--blue-line);background:var(--blue-soft);color:var(--blue);font-weight:600;font-size:13.5px;white-space:nowrap}
.invite svg{width:17px;height:17px}
.who{display:flex;align-items:center;gap:10px}
.av{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:14px;
  color:#fff;background:var(--blue);overflow:hidden;border:0;text-decoration:none}
.av img{width:100%;height:100%;object-fit:cover}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:11px;
  border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:600;font-size:14px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:#cdd3e6}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 10px 22px -14px rgba(9,56,213,.8)}
.btn.pri:hover{background:var(--blue-d)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:9px}
.btn svg{width:17px;height:17px;flex:none}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.view{padding:24px;max-width:1180px;width:100%;margin:0 auto}

.demo{background:#fff8e6;border-bottom:1px solid #f3e0b0;color:#7a5200;font-size:13px;padding:8px 24px;text-align:center}

/* ---------- jobs ---------- */
.search{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--blue-line);border-radius:14px;
  padding:0 16px;min-height:52px;box-shadow:0 8px 24px -20px rgba(9,56,213,.6)}
.search svg{width:20px;height:20px;color:var(--blue);flex:none}
.search input{border:0;outline:0;flex:1;min-width:0;font-size:15px;background:none;min-height:48px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.sel{position:relative}
.sel select{appearance:none;-webkit-appearance:none;min-height:40px;padding:0 34px 0 13px;border-radius:10px;
  border:1px solid var(--line);background:#fff;font-size:13.5px;font-weight:500;color:var(--ink);max-width:100%}
.sel::after{content:"";position:absolute;right:13px;top:50%;width:7px;height:7px;border-right:2px solid var(--muted);
  border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.meta-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:18px 2px 10px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.meta-row b{color:var(--ink)}
.jlist{display:flex;flex-direction:column;gap:10px}
.job{display:flex;gap:14px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:14px;
  padding:16px 18px;text-align:left;width:100%;transition:border-color .15s,box-shadow .15s}
.job:hover{border-color:#cdd3e6;box-shadow:0 10px 26px -22px rgba(18,26,51,.5)}
.logo{position:relative;overflow:hidden;width:44px;height:44px;border-radius:11px;flex:none;display:grid;place-items:center;color:#fff;
  font-family:Poppins;font-weight:700;font-size:17px}
.job .body{flex:1;min-width:0}
.job .t{font-weight:600;color:var(--ink);font-size:15.5px;line-height:1.35}
.job .c{font-size:13.5px;color:var(--body);margin-top:1px}
.tags{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:9px;font-size:12.5px;color:var(--muted)}
.tags span{display:inline-flex;align-items:center;gap:5px}
.tags svg{width:14px;height:14px;opacity:.8}
.fresh{color:var(--ok)!important;font-weight:600}
.job .side-act{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:none}
.bm{width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--muted)}
.bm svg{width:18px;height:18px}
.bm.on{color:var(--blue);border-color:var(--blue-line);background:var(--blue-soft)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;
  background:var(--bg);color:var(--body);border:1px solid var(--line)}
.pill.remote{background:#eaf7f0;border-color:#c6e9d6;color:#08643a}
.empty{text-align:center;padding:56px 20px;background:#fff;border:1px dashed #d6dbea;border-radius:16px}
.empty svg{width:40px;height:40px;color:var(--blue);opacity:.7}
.empty h3{font-family:Poppins;color:var(--ink);font-size:18px;margin-top:12px}
.empty p{max-width:44ch;margin:6px auto 16px;font-size:14px}
.more{display:flex;justify-content:center;margin-top:16px}
.skel{height:92px;border-radius:14px;background:linear-gradient(90deg,#eef0f6 0%,#f7f8fc 50%,#eef0f6 100%);
  background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.loading-note{font-size:13px;color:var(--muted);margin:14px 2px}

.logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;padding:16%}
.logo.has-img{box-shadow:inset 0 0 0 1px var(--line)}
.logo.has-img img{border-radius:inherit}
/* ---------- drawer (job detail) ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,16,38,.42);z-index:60;opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);background:#fff;z-index:61;display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .25s cubic-bezier(.4,0,.2,1);box-shadow:-30px 0 60px -30px rgba(10,16,38,.45)}
.drawer.on{transform:none}
.dr-top{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dr-top .x{width:42px;height:42px;border:0;background:none;border-radius:10px;display:grid;place-items:center;color:var(--body)}
.dr-top .x:hover{background:var(--bg)}
.dr-top .x svg{width:20px;height:20px}
.dr-top span{font-weight:600;color:var(--ink);flex:1}
.dr-body{overflow-y:auto;flex:1;padding:22px 24px 40px}
.jd-head{display:flex;gap:16px;align-items:flex-start}
.jd-head .logo{width:56px;height:56px;font-size:22px;border-radius:13px}
.jd-head h2{font-family:Poppins;font-weight:700;color:var(--ink);font-size:21px;line-height:1.25;letter-spacing:-.01em}
.jd-head .co{font-weight:600;color:var(--body);margin-top:2px}
.jd-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 20px;margin-top:18px;font-size:13.5px}
.jd-grid div{display:flex;gap:8px;align-items:flex-start;min-width:0}
.jd-grid svg{width:16px;height:16px;flex:none;margin-top:2px;color:var(--muted)}
.jd-acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.card{border:1px solid var(--line);border-radius:16px;background:#fff;padding:20px}
.match{margin-top:22px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.ring{position:relative;width:104px;height:104px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;font-family:Poppins;font-weight:800;font-size:26px;color:var(--ink)}
.match .txt{flex:1;min-width:220px}
.match h3{font-family:Poppins;font-size:16.5px;color:var(--ink)}
.match p{font-size:13.5px;margin-top:4px}
.brk{margin-top:14px;display:grid;gap:8px;width:100%}
.brk .r{display:grid;grid-template-columns:130px 1fr 44px;gap:10px;align-items:center;font-size:13px}
.brk .tr{display:block;height:6px;border-radius:9px;background:#eef0f7;overflow:hidden}
.brk .fi{display:block;height:100%;border-radius:9px}
.skills{margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:16px;width:100%}
.skills h4{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;font-weight:500;padding:5px 10px;border-radius:7px}
.chip.h{background:var(--ok-soft);color:#065f3c}
.chip.m{background:var(--bad-soft);color:#9f1239}
.chip.n{background:var(--bg);color:var(--body);border:1px solid var(--line)}
.upsell{margin-top:16px;border-radius:16px;padding:20px;background:linear-gradient(135deg,#0a31bd,#0938d5);color:#fff;
  display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.upsell .tx{flex:1;min-width:220px}
.upsell b{font-family:Poppins;font-size:16px;display:block}
.upsell p{font-size:13.5px;color:rgba(255,255,255,.85);margin-top:4px}
.upsell .btn{background:#fff;color:var(--blue);border-color:#fff}
.desc{margin-top:26px;color:#33395a;font-size:14.5px;line-height:1.7}
.desc h3{font-family:Poppins;color:var(--ink);font-size:16px;margin-bottom:6px}
.desc h4{color:var(--ink);font-size:14.5px;margin:18px 0 6px}
.desc p{margin:0 0 10px}
.desc ul{margin:0 0 12px 20px}
.desc li{margin-bottom:5px}

/* ---------- dashboard ---------- */
.hello{font-family:Poppins;font-weight:700;color:var(--ink);font-size:22px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:14px;margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:20px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}
.stat .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue)}
.stat .ic svg{width:19px;height:19px}
.stat .n{font-family:Poppins;font-weight:800;font-size:28px;color:var(--ink);margin-top:10px;line-height:1}
.stat .l{font-size:13px;margin-top:4px}
.sec{margin-top:26px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.sec-h h2{font-family:Poppins;font-weight:600;color:var(--ink);font-size:17px}
.trk{display:flex;flex-direction:column;gap:8px}
.trow{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.trow .logo{width:38px;height:38px;font-size:15px;border-radius:9px}
.trow .i{flex:1;min-width:0}
.trow .i b{display:block;color:var(--ink);font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .i span{font-size:12.5px;color:var(--muted)}
.trow select{min-height:36px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:0 8px;font-size:13px}
.trow .rm{width:36px;height:36px;border:0;background:none;color:var(--muted);border-radius:8px;display:grid;place-items:center}
.trow .rm:hover{background:var(--bad-soft);color:var(--bad)}
.trow .rm svg{width:16px;height:16px}
.chart{display:flex;align-items:flex-end;gap:8px;height:120px;padding:10px 4px 0}
.chart .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.chart .bar{width:100%;max-width:34px;border-radius:6px 6px 2px 2px;background:var(--blue);min-height:2px}
.chart .b span{font-size:11px;color:var(--muted)}

/* ---------- resume ---------- */
.drop{border:2px dashed #cdd4ea;border-radius:16px;padding:36px 20px;text-align:center;background:#fbfcff;cursor:pointer}
.drop:hover,.drop.over{border-color:var(--blue);background:#f4f7ff}
.drop svg{width:34px;height:34px;color:var(--blue)}
.drop b{display:block;color:var(--ink);margin-top:10px;font-size:15px}
.drop span{font-size:13px;color:var(--muted)}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}
.kv div{background:var(--bg);border-radius:12px;padding:14px}
.kv b{display:block;font-family:Poppins;color:var(--ink);font-size:20px}
.kv span{font-size:12.5px;color:var(--muted)}
.toggle{display:flex;align-items:flex-start;gap:12px;cursor:pointer}
.toggle input{position:absolute;opacity:0;pointer-events:none}
.sw{width:42px;height:24px;border-radius:99px;background:#d6dbea;position:relative;flex:none;transition:.2s;margin-top:1px}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;
  transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle input:checked + .sw{background:var(--ok)}
.toggle input:checked + .sw::after{transform:translateX(18px)}
.toggle input:focus-visible + .sw{outline:2px solid var(--blue);outline-offset:2px}
.toggle b{display:block;color:var(--ink);font-size:14px}
.toggle small{display:block;font-size:12.5px;color:var(--muted)}

/* ---------- admin: add jobs ---------- */
.adm textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.5;background:#fff;resize:vertical}
.adm textarea:focus,.adm select:focus{outline:2px solid var(--blue);outline-offset:-1px;border-color:transparent}
.adm .flabel{display:block;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:8px}
.adm .field select{min-height:44px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:#fff;font-size:14px}
.adm .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:8px}
.adm .grid3 .wide{grid-column:1/-1}
.aprev{display:flex;flex-direction:column;gap:12px}
.aitem{border:1px solid var(--line);border-radius:14px;padding:16px;background:#fff;display:flex;flex-direction:column;gap:8px}
.aitem.off{opacity:.55}
.aitem .ah{display:flex;gap:10px;align-items:flex-start}
.aitem .ah .logo{width:36px;height:36px;font-size:13px;border-radius:9px;flex:none}
.aitem .ah .ai{flex:1;min-width:0}
.aitem .ah b{display:block;color:var(--ink);font-size:14.5px;line-height:1.35;word-break:break-word}
.aitem .ah small{display:block;font-size:12.5px;color:var(--muted);word-break:break-all}
.aitem .ah label{display:flex;gap:6px;align-items:center;font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;min-height:32px;flex:none}
.astat{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;width:max-content;max-width:100%}
.astat.ok{background:var(--ok-soft);color:var(--ok)}.astat.warn{background:var(--warn-soft);color:var(--warn)}.astat.bad{background:var(--bad-soft);color:var(--bad)}.astat.info{background:var(--blue-soft);color:var(--blue)}
.alist{display:flex;flex-direction:column;margin-top:8px}
.arow{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.arow:first-child{border-top:0}
.arow .logo{width:34px;height:34px;font-size:12px;border-radius:9px;flex:none}
.arow .i{flex:1;min-width:0}
.arow .i b{display:block;color:var(--ink);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow .i span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow .rm{border:0;background:none;color:var(--muted);width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:none}
.arow .rm:hover{background:var(--bad-soft);color:var(--bad)}
.arow .rm svg{width:18px;height:18px}
.arow a.lk{font-size:13px;font-weight:600;flex:none}
.cnt{font-family:Inter;font-weight:600;font-size:12.5px;color:var(--muted);margin-left:6px}
.pill.team{background:#fff7e6;border-color:#f6d9a6;color:#8a5300}
.pill.team svg{width:12px;height:12px}
.dco .pill.team{margin-left:8px;vertical-align:1px}
@media (max-width:720px){.adm .grid3{grid-template-columns:1fr}}

/* ---------- reading a resume ---------- */
.reading{position:relative;display:flex;gap:14px;align-items:center;background:#fff;border:1px solid var(--blue-line);border-radius:16px;padding:20px 22px;overflow:hidden}
.reading b{display:block;color:var(--ink);font-size:15px;word-break:break-word}
.reading span{display:block;font-size:13px;color:var(--muted)}
.rspin{flex:none;width:26px;height:26px;border-radius:50%;border:3px solid var(--blue-soft);border-top-color:var(--blue);animation:rsp .8s linear infinite}
@keyframes rsp{to{transform:rotate(360deg)}}
.rbar{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--blue-soft)}
.rbar i{position:absolute;inset:0 auto 0 0;width:35%;background:var(--blue);border-radius:3px;animation:rbr 1.3s ease-in-out infinite}
@keyframes rbr{0%{left:-35%}100%{left:100%}}
@media (prefers-reduced-motion:reduce){.rspin,.rbar i{animation-duration:3s}}
.nav a,.tabbar a,.btn,.fab{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.btn:active,.fab:active{transform:scale(.97)}


/* ---------- settings ---------- */
.set{display:grid;grid-template-columns:220px 1fr;gap:20px;align-items:start}
.set-nav{display:flex;flex-direction:column;gap:4px;position:sticky;top:84px}
.set-nav a{display:flex;align-items:center;min-height:42px;padding:0 12px;border-radius:9px;text-decoration:none;color:var(--body);font-size:14px}
.set-nav a:hover{background:#fff}
.stack{display:flex;flex-direction:column;gap:14px}
.prof{display:flex;gap:16px;align-items:center}
.prof .av{width:64px;height:64px;font-size:24px;border-radius:16px}
.prof b{display:block;font-family:Poppins;color:var(--ink);font-size:18px}
.prof span{font-size:13.5px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--ink)}
.field input{min-height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:#fff;font-size:14px}
.field input:focus{outline:2px solid var(--blue);outline-offset:-1px;border-color:transparent}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.danger{border-color:#f6c9d3}
.danger h3{color:var(--bad)}
.card h3{font-family:Poppins;font-size:15.5px;color:var(--ink);margin-bottom:4px}
.card > p{font-size:13.5px;margin-bottom:14px}
.copyrow{display:flex;gap:8px}
.copyrow input{flex:1;min-width:0;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--bg);font-size:13px}

/* ---------- modal ---------- */
.mod-wrap{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;background:rgba(10,16,38,.5)}
.mod{background:#fff;border-radius:20px;width:min(460px,100%);max-height:calc(100vh - 32px);overflow-y:auto;padding:28px;position:relative;
  box-shadow:0 30px 70px -20px rgba(10,16,38,.5)}
.mod.wide{width:min(620px,100%)}
.mod .x{position:absolute;top:12px;right:12px;width:40px;height:40px;border:0;background:none;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.mod .x:hover{background:var(--bg)}
.mod .x svg{width:19px;height:19px}
.mod h2{font-family:Poppins;font-weight:700;color:var(--ink);font-size:21px;letter-spacing:-.01em;padding-right:30px}
.mod > p{font-size:14px;margin-top:8px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:50px;border:1px solid #d8dce8;
  border-radius:12px;background:#fff;font-weight:600;color:#1f1f1f;font-size:15px;margin-top:20px}
.gbtn:hover{background:#f8f9fc}
.gbtn svg{width:20px;height:20px}
.fine{font-size:12px;color:var(--muted);margin-top:14px;line-height:1.5}
.bul{list-style:none;margin-top:16px;display:grid;gap:9px}
.bul li{display:flex;gap:10px;font-size:14px;align-items:flex-start}
.bul svg{width:18px;height:18px;color:var(--ok);flex:none;margin-top:1px}
.skip{display:block;text-align:center;margin-top:12px;font-size:13px;color:var(--muted)}
textarea.post{width:100%;min-height:260px;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:13.5px;line-height:1.55;margin-top:14px;resize:vertical}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;z-index:90;background:var(--ink);color:#fff;
  padding:12px 18px;border-radius:12px;font-size:14px;font-weight:500;transition:.25s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- smart search + view switch ---------- */
.search.smart{border:1.5px solid transparent;background:linear-gradient(#fff,#fff) padding-box,linear-gradient(90deg,#0938d5,#7c3aed 55%,#0a7f46) border-box}
.search.smart svg:first-of-type{color:#7c3aed}
.search.smart svg:last-of-type{color:var(--muted);width:18px;height:18px}
.qchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center;font-size:12.5px}
.qchips:empty{display:none}
.qchips .ql{display:inline-flex;gap:5px;align-items:center;color:var(--muted);font-weight:600;margin-right:2px}
.qchips .ql svg{width:14px;height:14px;color:#7c3aed}
.qc{background:#f3f0ff;color:#4c1d95;border:1px solid #e3dbff;border-radius:999px;padding:3px 10px;font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;background:#fff;padding:3px;margin-left:auto}
.seg button{display:inline-flex;align-items:center;gap:6px;border:0;background:none;min-height:34px;padding:0 12px;border-radius:7px;font-size:13px;font-weight:600;color:var(--body)}
.seg button svg{width:16px;height:16px}
.seg button.on{background:var(--blue-soft);color:var(--blue)}
.lnk{border:0;background:none;color:var(--blue);font-weight:600;font-size:inherit;padding:0;display:inline-flex;align-items:center;gap:5px;cursor:pointer;min-height:28px}
.lnk svg{width:14px;height:14px}
.pill.mp{background:#fff;border-color:currentColor}

/* ---------- swipe deck ---------- */
.deckwrap{display:flex;flex-direction:column;align-items:center}
.deck{position:relative;width:100%;max-width:580px}
.dcard{background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 22px 44px -32px rgba(18,26,51,.5);position:relative;overflow:hidden;min-width:0}
.dcard.back{position:absolute;inset:0;transform:translateY(12px) scale(.96);opacity:.55;pointer-events:none;z-index:0}
.dcard.front{z-index:1;touch-action:pan-y;transition:transform .24s ease,opacity .24s ease;cursor:grab;user-select:none;-webkit-user-select:none}
.dcard.front.dragging{transition:none;cursor:grabbing}
.stamp{position:absolute;top:24px;z-index:3;font-family:Poppins;font-weight:800;font-size:28px;letter-spacing:.08em;text-transform:uppercase;padding:2px 14px;border:4px solid;border-radius:10px;opacity:0;pointer-events:none;background:rgba(255,255,255,.85)}
.stamp.st-pass{right:20px;color:#be123c;border-color:#be123c;transform:rotate(12deg)}
.stamp.st-save{left:20px;color:#0a7f46;border-color:#0a7f46;transform:rotate(-12deg)}
.dh{display:flex;gap:16px;align-items:center}
.dhx{min-width:0}
.logo.lg{width:64px;height:64px;border-radius:16px;font-size:26px}
.dco{font-size:14px;color:var(--body);font-weight:600}
.dt{font-family:Poppins;font-weight:700;font-size:20px;line-height:1.25;color:var(--ink);margin-top:2px;text-wrap:balance}
.dt a{color:inherit;text-decoration:none}
.dt a:hover{color:var(--blue)}
.ms{margin-top:20px}
.msl{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.msl b{font-size:15px;letter-spacing:0}
.msl em,.msl .lnk{font-style:normal;text-transform:none;letter-spacing:0;font-size:12.5px}
.msb{height:8px;border-radius:99px;background:#eceef5;margin-top:8px;overflow:hidden}
.msb i{display:block;height:100%;border-radius:99px;transition:width .4s}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:16px 18px;margin-top:20px}
.mgi{min-width:0}
.mlbl{display:block;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.mv{display:flex;gap:7px;align-items:flex-start;margin-top:5px;color:var(--ink);font-size:14.5px;line-height:1.35}
.mv svg{width:16px;height:16px;flex:none;color:var(--muted);margin-top:2px}
.mv span{min-width:0;overflow-wrap:anywhere}
.sal{background:var(--ok);color:#fff;border-radius:7px;padding:1px 9px;font-weight:600;font-size:13.5px}
.sal.nd{background:#eef0f6;color:var(--body);font-weight:500}
.dpost{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.dcard .mlbl{margin-top:16px}
.dov{margin-top:6px;font-size:14.5px;color:#33395a;line-height:1.55}
.chip.y{background:#fdf6e3;border:1px solid #f1dc9f;color:#6e4a00}
.dcard .chips{margin-top:8px}
.seemore{display:inline-block;margin-top:16px;font-size:13.5px;font-weight:600;color:var(--blue);text-decoration:none}
.skl{display:block;height:12px;border-radius:6px;background:linear-gradient(90deg,#eef0f6,#f7f8fc,#eef0f6);background-size:200% 100%;animation:sh 1.2s infinite;margin-top:7px}
.skl.s{width:55%}
.dacts{display:flex;justify-content:center;align-items:flex-end;gap:30px;margin-top:22px}
.da{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.da.ap{color:var(--blue)}
.dbtn{border:0;border-radius:50%;display:grid;place-items:center;width:62px;height:62px;transition:transform .15s}
.dbtn:hover{transform:translateY(-2px)}
.dbtn:active{transform:scale(.93)}
.dbtn svg{width:24px;height:24px}
.dbtn.pass{background:#e9ebf2;color:#5b637f}
.dbtn.apply{background:var(--blue);color:#fff;width:78px;height:78px;box-shadow:0 14px 26px -12px rgba(9,56,213,.75)}
.dbtn.apply svg{width:28px;height:28px}
.dbtn.save{background:var(--ok);color:#fff;box-shadow:0 12px 22px -12px rgba(10,127,70,.75)}
.dfoot{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px 16px;margin-top:14px;font-size:12.5px;color:var(--muted);text-align:center}
.dfoot .hint{flex-basis:100%}

/* ---------- floating resume button ---------- */
.fab{position:fixed;right:24px;bottom:24px;z-index:70;display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:0 22px;border-radius:999px;border:0;background:#1d2b6b;color:#fff;font-weight:600;font-size:14.5px;box-shadow:0 18px 34px -14px rgba(10,16,38,.65)}
.fab:hover{background:#15205a}
.fab svg{width:19px;height:19px}

/* ---------- job detail v2 ---------- */
.dr-body{padding-bottom:110px}
.jd-head{align-items:flex-start}
.jdh{flex:1;min-width:0}
.jd-head .logo.lg{width:64px;height:64px}
.pd{font-size:13px;color:var(--muted);margin-top:6px}
.jd-head .bm{flex:none}
.jd-meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 18px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line);font-size:13.5px;color:var(--ink)}
.jd-meta div{display:flex;gap:8px;align-items:flex-start;min-width:0}
.jd-meta svg{width:17px;height:17px;flex:none;color:var(--muted);margin-top:1px}
.jd-meta span{min-width:0;overflow-wrap:anywhere}
#matchBox{margin-top:20px}
#matchBox .card.match{margin-top:0}
.mrow{display:flex;gap:20px;align-items:center}
.mrow .txt{min-width:0}
.mrow .ring .v{font-size:24px}
.lbl2{font-family:Poppins;font-weight:700;font-size:14px;letter-spacing:.03em;text-transform:uppercase;color:var(--ink)}
.mrow p{font-size:14px;margin-top:4px}
.sbd{border:1px solid var(--line);border-radius:14px;margin-top:16px;background:#fff}
.sbd summary{list-style:none;display:flex;align-items:center;gap:8px;min-height:50px;padding:0 16px;cursor:pointer;font-size:14px;color:var(--ink);font-weight:500}
.sbd summary::-webkit-details-marker{display:none}
.sbd summary .chev{margin-left:auto;width:18px;height:18px;color:var(--muted);transition:transform .2s}
.sbd[open] summary .chev{transform:rotate(180deg)}
.qm{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--muted);color:var(--muted);font-size:11px;font-weight:700;display:grid;place-items:center}
.sbd .brk{padding:0 16px;margin-top:4px}
.sbd .fine{padding:0 16px 14px}
.jd-apply{display:flex;gap:10px;margin-top:14px}
.jd-apply .btn.out{flex:1;border-radius:999px;min-height:48px}
.jd-apply .btn:not(.out){border-radius:999px;min-height:48px}
.navy{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;border-radius:16px;background:#14205a;color:rgba(255,255,255,.85);padding:16px 18px;margin-top:14px;font-size:13.5px;line-height:1.45}
.navy:hover{background:#0f1a4d}
.navy b{display:block;font-size:14.5px;color:#fff;margin-bottom:2px}
.navy svg{width:26px;height:26px;flex:none;color:#fff}
.navy .chevr{width:20px;height:20px;margin-left:auto}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:#f1f3f8;border-radius:12px;padding:4px;margin-top:22px}
.tabs button{border:0;background:none;min-height:44px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px -4px rgba(18,26,51,.35)}
#jdPane{margin-top:6px}
.dsec{margin-top:22px}
.dsec h4{display:flex;align-items:center;gap:10px;font-family:Poppins;font-weight:600;font-size:16px;color:var(--ink)}
.dsec h4 svg{width:20px;height:20px;flex:none}
.dsec h4.bad svg{color:var(--bad)}
.dsec h4.good svg{color:var(--ok)}
.dsb{padding-left:30px;margin-top:8px}
.dsec > .fine{padding-left:30px}
.dsb p{font-size:14.5px;color:#33395a;line-height:1.65;margin:0 0 10px}
.dsb h5{font-size:14px;color:var(--ink);margin:14px 0 8px}
.ticks{list-style:none;display:grid;gap:10px;margin:4px 0 12px}
.ticks li{display:flex;gap:12px;font-size:14.5px;color:#33395a;line-height:1.55}
.ticks svg{width:20px;height:20px;flex:none;color:var(--ok);margin-top:1px}
.chip.m,.chip.h{border-radius:999px;padding:6px 13px;font-size:13px}
.chip.h svg,.chip.wk svg{width:13px;height:13px;vertical-align:-2px;margin-right:4px}
.chip.wk{background:#fff4d9;color:#7a4a00;border-radius:999px;padding:6px 13px;font-size:13px}
.tblwrap{overflow-x:auto;margin-top:12px}
.anat{width:100%;border-collapse:collapse;font-size:13.5px;min-width:300px}
.anat th,.anat td{padding:12px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
.anat thead th{font-weight:500;color:var(--muted);font-size:13px;background:#fff}
.anat tbody th{font-weight:600;color:var(--ink);white-space:nowrap}
.anat tbody th span{margin-right:6px}
.anat tbody th svg{width:17px;height:17px;vertical-align:-4px}
.anat tr.ok{background:#effaf3}.anat tr.no{background:#fff0f2}.anat tr.warn{background:#fffaeb}.anat tr.na{background:#f8f9fc}
.anat tr.ok th svg{color:var(--ok)}.anat tr.no th svg{color:var(--bad)}.anat tr.warn th svg{color:#c27c00}.anat tr.na th svg{color:#a3a9c2}
.anat td{color:#33395a;overflow-wrap:anywhere}
.anat .nf{color:var(--muted);font-style:italic}
.anat.anat2 td{width:72%}
.anh{font-family:Poppins;font-size:17px;color:var(--ink);margin:28px 0 0}
.rtext{white-space:pre-wrap;font:13px/1.6 Inter,sans-serif;color:#33395a;background:var(--bg);border-radius:12px;padding:14px;margin-top:14px;max-height:55vh;overflow:auto}
.empty.slim{padding:32px 18px;margin-top:16px}

/* ---------- mobile ---------- */
.tabbar{display:none}
@media(max-width:980px){
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .set{grid-template-columns:1fr}.set-nav{display:none}
}
@media(max-width:820px){
  .fab{right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));min-height:48px;padding:0 18px;font-size:14px}
  .toast{bottom:calc(140px + env(safe-area-inset-bottom,0px))}
  .dcard{padding:20px 18px;border-radius:20px}
  .logo.lg{width:56px;height:56px;font-size:22px}
  .dt{font-size:18px}
  .dacts{gap:22px}
  .jd-meta{grid-template-columns:1fr 1fr}
  .mrow{gap:14px}
  .mrow .ring{transform:scale(.9);transform-origin:left center}
  .dsb,.dsec > .fine{padding-left:0}
  .anat th,.anat td{padding:10px 7px;font-size:12.5px}
  .anat tbody th{white-space:normal}
  .seg span{display:none}
  .seg button{padding:0 10px}
  .hide-s{display:none}
  .app{grid-template-columns:1fr}
  .side{display:none}
  .top{padding:0 16px;padding-top:env(safe-area-inset-top,0px);height:calc(60px + env(safe-area-inset-top,0px))}
  .top .m-brand{display:flex;padding:0}
  .top h1{display:none}
  .top .m-brand{flex:1}
  .invite .lbl{display:none}
  .view{padding:16px 16px 96px}
  .demo{padding:8px 16px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom,0px)}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:60px;
    text-decoration:none;color:var(--muted);font-size:11px;font-weight:600}
  .tabbar a svg{width:21px;height:21px}
  .tabbar a.on{color:var(--blue)}
  .job{padding:14px}
  .job .side-act .btn{display:none}
  .dr-body{padding:18px 16px 40px}
  .jd-grid{grid-template-columns:1fr}
  .skills{grid-template-columns:1fr}
  .brk .r{grid-template-columns:104px 1fr 40px}
  .kv{grid-template-columns:1fr 1fr}
  .two{grid-template-columns:1fr}
  .cgrid{grid-template-columns:1fr}
  .mod{padding:24px 20px}
}
@media(max-width:400px){.stats{gap:8px}.stat{padding:14px}.stat .n{font-size:24px}}
</style>
</head>

    if(p.mode){ var mo = modeOf(j); if(p.mode === 'On-site' ? (mo === 'Remote' || mo === 'Hybrid') : mo !== p.mode) return false; }

    if(p.state && !(new RegExp(',\\s*' + p.state + '\\b').test(j.location) || loc.indexOf(p.stateName) > -1)) return false;

    return true;
  });

    out = out.map(function(j){ return [j, titleFit(j.title, target) || 0]; })
             .sort(function(a,b){ return b[1]-a[1] || b[0].posted-a[0].posted; }).map(function(x){ return x[0]; });
  }

function bindSwipe(el){
  if(!el) return;
  el.addEventListener('pointerdown', function(ev){
    if(ev.pointerType === 'mouse' && ev.button !== 0) return;
    if(ev.target.closest('a,button,select,input')) return;
    drag = {x:ev.clientX, y:ev.clientY, dx:0, id:ev.pointerId, moved:false};
  });
  el.addEventListener('pointermove', function(ev){
    if(!drag || ev.pointerId !== drag.id) return;
    var dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
    if(!drag.moved){
      if(Math.abs(dx) < 10) return;
      if(Math.abs(dy) > Math.abs(dx)){ drag = null; return; }
      drag.moved = true; el.classList.add('dragging');
      try{ el.setPointerCapture(ev.pointerId); }catch(_){}
    }
    drag.dx = dx;
    el.style.transform = 'translateX('+dx+'px) rotate('+(dx/22)+'deg)';
    el.querySelector('.stamp.st-pass').style.opacity = Math.min(1, Math.max(0, -dx/120));
    el.querySelector('.stamp.st-save').style.opacity = Math.min(1, Math.max(0, dx/120));
  });
  function end(ev, cancel){
    if(!drag || ev.pointerId !== drag.id) return;
    var dx = drag.dx, moved = drag.moved; drag = null;
    el.classList.remove('dragging');
    if(!moved) return;
    if(!cancel && dx > 120) return deckAct('save');
    if(!cancel && dx < -120) return deckAct('pass');
    resetCard(el);
  }
  el.addEventListener('pointerup', function(ev){ end(ev, false); });
  el.addEventListener('pointercancel', function(ev){ end(ev, true); });
}

/* ---- Job Analysis: the posting vs the resume, line by line ---- */
function resumeProfile(rt){
  var lines = String(rt).split(/\n+/).map(function(l){ return l.replace(/\s+/g,' ').trim(); }).filter(Boolean);
  var P = {title:'', domain:'', sub:'', location:'', years: yearsIn(rt)};
  for(var i=0;i<Math.min(lines.length, 30) && !P.title;i++){
    var l = lines[i];
    if(l.length > 90 || /@|https?:|www\.|\d{3}[\s.)-]\d{3}/.test(l) || /:/.test(l) || l.split(' ').length > 10) continue;
    var tx = taxonomy(l);
    if(tx[0] !== 'Other'){ P.title = l.split(/\s[|•·]\s|\s[–—-]\s|,\s/)[0].replace(/\b(19|20)\d{2}\b.*$/,'').trim(); P.domain = tx[0]; P.sub = tx[1]; }
  }
  if(!P.title){   // PDFs without line breaks: earliest role phrase in the top of the resume
    var head = String(rt).slice(0, 1200).toLowerCase(), best = null;
    TAX.forEach(function(t){ var m = t[2].exec(head); if(m && (!best || m.index < best.i)) best = {i:m.index, t:t}; });
    if(best){ P.title = best.t[1]; P.domain = best.t[0]; P.sub = best.t[1]; }
  }
  var top = lines.slice(0, 15).join('  ');
  var lm = new RegExp('\\b([A-Z][a-zA-Z.]+(?: [A-Z][a-zA-Z.]+){0,2}),\\s*(' + US_ST + '|ON|BC|QC|AB|India|USA|United States|Canada|UK|United Kingdom|Australia|NSW|VIC)\\b').exec(top);
  if(lm) P.location = lm[0];
  else if(/\bremote\b/i.test(top)) P.location = 'Remote';
  return P;
}
function locMatch(job, rl){
  var a = rl.toLowerCase(), b = job.location.toLowerCase();
  if(a === 'remote') return modeOf(job) === 'Remote';
  var city = a.split(',')[0].trim();
  if(city && b.indexOf(city) > -1) return true;
  if(modeOf(job) === 'Remote'){ var ra = regions(rl, null, false); return ra.some(function(r){ return job.reg.indexOf(r) > -1; }); }
  return false;
}
function summaryCheck(rt, job, e){
  var m = /(professional summary|career summary|summary|profile|objective|about me)\s*:?\s*\n?([\s\S]{40,700}?)(?=\n\s*\n|\n(?:experience|work experience|professional experience|education|skills|projects)\b|$)/i.exec(rt);
  if(!m) return {ok:false, msg:'We couldn’t find a summary section. Two or three lines at the top, written for this kind of role, help a recruiter see the fit in seconds.'};
  var s = m[2].toLowerCase();
  var sk = e.skills.filter(function(x){ return s.indexOf(x.toLowerCase()) > -1; });
  var tw = titleTokens(job.title).filter(function(w){ return s.indexOf(w) > -1; });
  if(sk.length >= 2 || (tw.length && sk.length >= 1)) return {ok:true, msg:'Your summary already speaks to this role' + (sk.length ? ' — it mentions ' + sk.slice(0, 3).join(', ') : '') + '.'};
  var want = e.skills.filter(function(x){ return sk.indexOf(x) < 0; }).slice(0, 3);
  return {ok:false, msg:'Your current summary doesn’t clearly show your fit for this job' + (want.length ? '. If they’re true of you, mention ' + want.join(', ') + ' and the kind of work this posting describes' : '') + '.'};
}
function paneAna(job){
  var rt = state.user && resumeText();
  if(!rt) return '<div class="empty slim">'+I.resume+'<h3>Compare this job with your resume</h3><p>See, line by line, how your title, field, experience, location and skills line up with what this posting asks for.</p>'+

  var e = ENR[job.key];
  if(!e) return '<div class="skel" style="height:220px"></div>';

  var R = resumeProfile(rt), rows = [];
  var tf = R.title ? titleFit(job.title, R.title) : null;
  rows.push(['Title', job.title, R.title || '', R.title ? ((R.sub === job.sub && job.sub !== 'Other') || tf >= .75 ? 1 : 0) : null]);
  rows.push(['Domain', job.domain, R.domain || '', R.domain ? (R.domain === job.domain ? 1 : 0) : null]);

  var t1 = '<div class="tblwrap"><table class="anat"><thead><tr><th scope="col"><span class="sr">Check</span></th><th scope="col">Job requirement</th><th scope="col">Your resume</th></tr></thead><tbody>'+
    rows.map(function(r){

    }).join('')+'</tbody></table></div>';
  var m = match(job, e.text, rt, state.profile && state.profile.target_role), sm = summaryCheck(rt, job, e), tot = m.hit.length + m.miss.length;

/* ---------- Add jobs (team only): paste links found while searching; they go live for everyone ---------- */
var ADP = [];
var JOB_SITES = /(^|\.)(linkedin\.com|indeed\.com|glassdoor\.[a-z.]+|ziprecruiter\.com|wellfound\.com|angel\.co|monster\.com|dice\.com|simplyhired\.com|builtin\.com|google\.com|naukri\.com|joinhandshake\.com|workatastartup\.com|ycombinator\.com|otta\.com|welcometothejungle\.com|careerbuilder\.com|levels\.fyi)$/;
var ATS_SITES = /(^|\.)(icims\.com|taleo\.net|successfactors\.com|smartrecruiters\.com|workable\.com|bamboohr\.com|jobvite\.com|recruitee\.com|breezy\.hr|teamtailor\.com|personio\.de|rippling\.com|paylocity\.com|ultipro\.com|dayforcehcm\.com|oraclecloud\.com|adp\.com|myworkdayjobs\.com|myworkdaysite\.com)$/;
var UUIDRX = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
function slugName(s){ return title1(String(s||'').replace(/[-_.]+/g, ' ').trim()); }
function cleanDomain(d){ return String(d||'').trim().toLowerCase().replace(/^https?:\/\//,'').replace(/^www\./,'').split(/[\/?#]/)[0]; }
function cleanLink(u){
  ['utm_source','utm_medium','utm_campaign','utm_term','utm_content','trk','trackingId','refId','gh_src','lever-source','lever-origin','source','src','ref','referrer'].forEach(function(k){ u.searchParams.delete(k); });
  u.hash = '';
  return u.toString();
}
function guessFromUrl(u, h, seg){
  var g = {company:'', domain:'', title:''}, wd = /^([a-z0-9-]+)\.wd\d+\.myworkday(jobs|site)\.com$/.exec(h);
  if(wd) g.company = slugName(wd[1]);
  else if(ATS_SITES.test(h)){
    var sub = h.split('.')[0], first = seg[0] || '';
    var name = /^(careers|jobs|apply|www|recruiting|hcm|workforcenow|jobs2)$/.test(sub) ? first : sub;
    if(name && !/\d{3,}/.test(name) && name.length < 40) g.company = slugName(name);
  } else if(!JOB_SITES.test(h)){
    var parts = h.split('.'), base = parts.length > 2 && /^(co|com|org|net|ac|gov)$/.test(parts[parts.length-2]) ? parts.slice(-3) : parts.slice(-2);
    g.domain = base.join('.'); g.company = slugName(base[0]);
  }
  for(var i = seg.length - 1; i >= 0; i--){       // the job title is usually the last readable slug in the path
    var w = seg[i].replace(/\.(html?|aspx?|php)$/i,'').replace(/[_+]/g,'-');
    if(!/[a-z]{3,}-[a-z]{2,}/i.test(w) || /^(job|jobs|careers|apply|view|details|position|en-us|en-gb)$/i.test(w)) continue;
    w = w.replace(/(-[a-z]{0,4}\d[\w]*)+$/i, '');
    var at = /^(.+?)-at-(.+)$/i.exec(w);            // linkedin style: senior-data-analyst-at-acme
    if(at){ g.title = slugName(at[1]); if(!g.company) g.company = slugName(at[2]); }
    else g.title = slugName(w);
    break;
  }
  return g;
}
function parseLink(raw){
  var u; try{ u = new URL(String(raw).trim()); }catch(e){ return null; }
  if(!/^https?:$/.test(u.protocol)) return null;
  var h = u.hostname.toLowerCase().replace(/^www\./,''), seg = u.pathname.split('/').filter(Boolean).map(function(x){ try{ return decodeURIComponent(x); }catch(e){ return x; } });
  var it = {raw:String(raw).trim(), url:cleanLink(u)};
  if(h === 'boards.greenhouse.io' || h === 'job-boards.greenhouse.io'){
    var gb = u.searchParams.get('for'), gt = u.searchParams.get('token') || u.searchParams.get('gh_jid');
    if(seg[0] === 'embed' && gb) return Object.assign(it, gt ? {src:'gh', board:gb, id:gt, kind:'job'} : {src:'gh', board:gb, kind:'board'});
    if(seg[0] && seg[0] !== 'embed'){
      var gid = seg[1] === 'jobs' && /^\d+$/.test(seg[2]||'') ? seg[2] : u.searchParams.get('gh_jid');
      return Object.assign(it, gid ? {src:'gh', board:seg[0], id:gid, kind:'job'} : {src:'gh', board:seg[0], kind:'board'});
    }
  }
  if(h === 'jobs.lever.co' && seg[0]) return Object.assign(it, seg[1] && UUIDRX.test(seg[1]) ? {src:'lever', board:seg[0], id:seg[1], kind:'job'} : {src:'lever', board:seg[0], kind:'board'});
  if(h === 'jobs.ashbyhq.com' && seg[0]) return Object.assign(it, seg[1] && UUIDRX.test(seg[1]) ? {src:'ashby', board:seg[0], id:seg[1], kind:'job'} : {src:'ashby', board:seg[0], kind:'board'});
  var g = guessFromUrl(u, h, seg);
  return Object.assign(it, {src:'custom', kind:'job', host:h, title:g.title, company:g.company, domain:g.domain});
}
function teamHas(it){
  return TEAM.all && TEAM.all.some(function(r){ return r.url === it.url || (it.id && r.src === it.src && r.board === it.board && r.ext_id === it.id) || (it.kind === 'board' && r.kind === 'board' && r.src === it.src && r.board === it.board); });
}
function resolveLink(it){
  var known = CONFIG.COMPANIES.concat(TEAM.boards).filter(function(c){ return c.src === it.src && c.board === it.board; })[0];
  if(known){ it.company = it.company || known.name; it.domain = it.domain || known.domain; }
  function done(state, msg){ it.state = state; it.msg = msg; it.on = state === 'ok' || state === 'warn'; return it; }
  if(teamHas(it)) return Promise.resolve(done('skip', 'Already added by the team'));
  if(it.src === 'custom'){
    return Promise.resolve(done('warn', JOB_SITES.test(it.host) ? 'We can’t read this site automatically — type the details below' : 'Check the details below — they were guessed from the link'));
  }
  if(it.kind === 'board'){
    if(CONFIG.COMPANIES.some(function(c){ return c.src === it.src && c.board === it.board; })) return Promise.resolve(done('skip', 'Already on the job board — every role here is listed'));
    it.url = {gh:'https://job-boards.greenhouse.io/', lever:'https://jobs.lever.co/', ashby:'https://jobs.ashbyhq.com/'}[it.src] + encodeURIComponent(it.board);
    return fetchT(URLS[it.src](it.board), 20000).then(function(d){
      if(it.src === 'gh' && d.jobs && d.jobs[0] && d.jobs[0].company_name) it.company = it.company || d.jobs[0].company_name;
      it.company = it.company || slugName(it.board);
      var n = NORM[it.src]({src:it.src, board:it.board, name:it.company, domain:it.domain || ''}, d).length;
      it.count = n;
      return n ? done('ok', n + ' open role' + (n === 1 ? '' : 's') + ' found — all will be listed and kept up to date')
               : done('warn', 'No open roles right now — they’ll appear when the company posts some');
    }, function(){ return done('bad', 'Couldn’t open this careers board — check the link'); });
  }
  var key = it.src + ':' + it.board + ':' + it.id;
  function onBoard(){ return findJob(key) ? ' · already listed, this marks it “Picked by our team”' : ''; }
  if(it.src === 'gh'){
    return fetchT('https://boards-api.greenhouse.io/v1/boards/' + encodeURIComponent(it.board) + '/jobs/' + it.id, 15000).then(function(d){
      it.title = d.title; it.company = it.company || d.company_name || slugName(it.board);
      it.location = (d.location && d.location.name) || ''; it.posted = Date.parse(d.first_published || d.updated_at) || 0;
      if(d.absolute_url){ it.url = d.absolute_url; var ah = cleanDomain(d.absolute_url); if(!it.domain && !/greenhouse\.io$/.test(ah)) it.domain = ah.replace(/^(careers|jobs)\./,''); }
      return done('ok', 'Found on Greenhouse' + onBoard());
    }, function(){ return done('bad', 'This job is closed or the link is wrong'); });
  }
  if(it.src === 'lever'){
    return fetchT('https://api.lever.co/v0/postings/' + encodeURIComponent(it.board) + '/' + it.id, 15000).then(function(x){
      var cat = x.categories || {};
      it.title = x.text; it.company = it.company || slugName(it.board);
      it.location = (cat.allLocations && cat.allLocations.join(' · ')) || cat.location || '';
      it.posted = x.createdAt || 0; it.url = x.hostedUrl || it.url;
      it.mode = {remote:'Remote', hybrid:'Hybrid', onsite:'On-site'}[String(x.workplaceType||'').toLowerCase()] || '';
      return done('ok', 'Found on Lever' + onBoard());
    }, function(){ return done('bad', 'This job is closed or the link is wrong'); });
  }
  return fetchT(URLS.ashby(it.board), 20000).then(function(d){
    var x = (d.jobs || []).filter(function(j){ return j.id === it.id; })[0];
    if(!x) return done('bad', 'This job is closed or the link is wrong');
    it.title = x.title; it.company = it.company || slugName(it.board);
    it.location = x.location || ''; it.posted = Date.parse(x.publishedAt) || 0; it.url = x.jobUrl || it.url;
    it.mode = {Remote:'Remote', Hybrid:'Hybrid', OnSite:'On-site', Onsite:'On-site'}[x.workplaceType] || (x.isRemote ? 'Remote' : '');
    return done('ok', 'Found on Ashby' + onBoard());
  }, function(){ return done('bad', 'Couldn’t open this job — check the link'); });
}

function adminSave(){
  var rows = [], missing = 0;
  ADP.forEach(function(it){
    if(!it.on) return;
    var title = String(it.title||'').trim(), company = String(it.company||'').trim(), loc = String(it.location||'').trim();
    if(it.kind === 'job' && (!title || !company || !loc)){ missing++; return; }
    rows.push({kind:it.kind, url:it.url, src:it.src, board:it.board || null, ext_id:it.id || null,
      title:it.kind === 'job' ? title : null, company:company || slugName(it.board), location:it.kind === 'job' ? loc : null,
      work_mode:it.mode || null, salary:String(it.salary||'').trim() || null, domain:cleanDomain(it.domain) || null,
      description:String(it.description||'').trim() || null,
      posted_at:new Date(it.posted || Date.now()).toISOString()});
  });
  if(missing){ toast('Add a title, company and location for ' + missing + ' link' + (missing === 1 ? '' : 's')); return; }
  if(!rows.length){ toast('Tick at least one link to add'); return; }
  var b = $('#adSave'); if(b){ b.disabled = true; b.textContent = 'Adding…'; }
  var save = LIVE
    ? Promise.all(rows.map(function(r){ return sb.from('custom_jobs').insert(r).then(function(x){ return x.error ? (x.error.code === '23505' ? 'dup' : x.error) : 'ok'; }, function(e){ return e; }); }))
    : Promise.resolve(rows.map(function(r){
        var list = lsGet('tp_team_demo', []);
        if(list.some(function(x){ return x.url === r.url; })) return 'dup';
        list.unshift(Object.assign({id:'d' + Math.random().toString(36).slice(2, 10), active:true, created_at:new Date().toISOString(), added_by:state.user && state.user.email}, r));
        lsSet('tp_team_demo', list); return 'ok';
      }));
  save.then(function(res){
    var ok = res.filter(function(x){ return x === 'ok'; }).length, dup = res.filter(function(x){ return x === 'dup'; }).length;
    var err = res.filter(function(x){ return x !== 'ok' && x !== 'dup'; })[0];
    if(err && !ok){ toast(teamErr(err)); drawAdminPrev(); return; }
    toast((ok ? 'Added ' + ok + ' — live on the job board now' : 'Nothing new to add') + (dup ? ' · ' + dup + ' already there' : '') + (err ? ' · some failed, try them again' : ''));
    ADP = []; var ta = $('#adIn'); if(ta) ta.value = '';

document.addEventListener('click', function(e){
  var t = e.target.closest('[data-act],[data-job],[data-save],[data-apply],[data-share],[data-untrack],[data-copy],[data-copypost],[data-adrm]');

      lsDel('tp_resume_local');

      $$('[data-save="'+CSS.escape(j.key)+'"]').forEach(function(b){

function applyTo(key, after){
  var job = findJob(key); if(!job) return;
  var url = (DESC[key] && DESC[key].apply) || job.url;
  var go = function(){
    window.open(url, '_blank', 'noopener');
    var cur = state.tracked.filter(function(t){ return t.job_key === key; })[0];
    if(!cur || cur.status === 'saved') store.track(job, 'applied').then(function(){ toast('Marked as applied — update it from your dashboard'); });
    if(after) after();
  };
  if(!CONFIG.REQUIRE_SIGNIN_TO_APPLY || state.user) return go();
  pendingSkip = url;
  requireSignIn('Sign in to apply and track this role', go);
}

(function(){
  var m = /[?&]ref=([^&#]+)/.exec(location.search);
  if(m){ ssSet('tp_ref', decodeURIComponent(m[1])); history.replaceState(null, '', location.pathname + location.hash); }
})();
// trulyplaced.com/app.html#signin — the "Sign in" button on the main site
var wantSignIn = location.hash === '#signin';
if(wantSignIn) history.replaceState(null, '', location.pathname + location.search + '#dashboard');
render();
store.init().then(function(){
  state.ready = true; render();
  if(state.user) warmReaders();
  if(wantSignIn && !state.user){ pendingSkip = null; openSignIn('Sign in to TrulyPlaced'); }
});
loadJobs().then(function(){ if(route.name === 'jobs'){ drawList(); } if(route.job){ drawerKey = null; openJob(route.job); } });

})();
</script>
