<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TrulyPlaced Jobs | Fresh roles, matched to your resume</title>
<meta name="description" content="Fresh roles from top US companies, updated live. See how your resume matches each one — free.">
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#0938d5">
<link rel="canonical" href="https://trulyplaced.com/app.html">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='116' fill='%230938d5'/%3E%3Cpath d='M256 410C168 314 138 278 138 206 138 142 191 94 256 94s118 48 118 112c0 72-30 108-118 204z' fill='%23fff'/%3E%3Cpath d='M205 200l37 36 76-88' fill='none' stroke='%230938d5' stroke-width='30' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#0938d5;--blue-d:#072ca8;--blue-soft:#eef2ff;--blue-line:#cfd9ff;--ink:#121a33;--body:#4b5473;
  --muted:#737b9c;--line:#e7e9f2;--bg:#f6f7fc;--card:#fff;--ok:#0a7f46;--ok-soft:#e6f6ee;--warn:#b45309;
  --warn-soft:#fef3e2;--bad:#be123c;--bad-soft:#ffe8ed;--side:248px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--body);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue)}
img{max-width:100%}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100%}
.side{position:sticky;top:0;height:100vh;background:#fff;border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:20px 14px 16px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);padding:4px 8px 18px;
  font-family:Poppins;font-weight:700;font-size:18px;letter-spacing:-.01em}
.brand svg{width:32px;height:32px;flex:none}
.brand small{display:block;font-family:Inter;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.06em;
  text-transform:uppercase;margin-top:-2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:10px;color:var(--body);
  text-decoration:none;font-weight:500;font-size:14.5px}
.nav a svg{width:20px;height:20px;flex:none;opacity:.85}
.nav a:hover{background:var(--bg);color:var(--ink)}
.nav a.on{background:var(--blue-soft);color:var(--blue);font-weight:600}
.nav a.on svg{opacity:1}
.side .grow{flex:1}
.tired{border:1px solid var(--blue-line);background:linear-gradient(160deg,#f2f5ff,#fff);border-radius:14px;
  padding:14px;margin-bottom:10px}
.tired b{display:block;color:var(--ink);font-size:14px}
.tired p{font-size:12.5px;margin:4px 0 10px;line-height:1.45}
.tired button{width:100%;min-height:40px;border:0;border-radius:9px;background:var(--blue);color:#fff;font-weight:600;font-size:13.5px}
.side-foot a{display:flex;align-items:center;gap:10px;min-height:40px;padding:0 12px;color:var(--muted);
  text-decoration:none;font-size:13.5px;border-radius:9px}
.side-foot a:hover{background:var(--bg);color:var(--ink)}
.side-foot svg{width:18px;height:18px}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;height:64px;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 24px}
.top h1{font-family:Poppins;font-weight:600;font-size:17px;color:var(--ink);flex:1;min-width:0;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.top .m-brand{display:none}
.invite{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:10px;
  border:1px solid var(--blue-line);background:var(--blue-soft);color:var(--blue);font-weight:600;font-size:13.5px;white-space:nowrap}
.invite svg{width:17px;height:17px}
.who{display:flex;align-items:center;gap:10px}
.av{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:14px;
  color:#fff;background:var(--blue);overflow:hidden;border:0;text-decoration:none}
.av img{width:100%;height:100%;object-fit:cover}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:11px;
  border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:600;font-size:14px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:#cdd3e6}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 10px 22px -14px rgba(9,56,213,.8)}
.btn.pri:hover{background:var(--blue-d)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:9px}
.btn svg{width:17px;height:17px;flex:none}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.view{padding:24px;max-width:1180px;width:100%;margin:0 auto}

.demo{background:#fff8e6;border-bottom:1px solid #f3e0b0;color:#7a5200;font-size:13px;padding:8px 24px;text-align:center}

/* ---------- jobs ---------- */
.search{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--blue-line);border-radius:14px;
  padding:0 16px;min-height:52px;box-shadow:0 8px 24px -20px rgba(9,56,213,.6)}
.search svg{width:20px;height:20px;color:var(--blue);flex:none}
.search input{border:0;outline:0;flex:1;min-width:0;font-size:15px;background:none;min-height:48px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.sel{position:relative}
.sel select{appearance:none;-webkit-appearance:none;min-height:40px;padding:0 34px 0 13px;border-radius:10px;
  border:1px solid var(--line);background:#fff;font-size:13.5px;font-weight:500;color:var(--ink);max-width:100%}
.sel::after{content:"";position:absolute;right:13px;top:50%;width:7px;height:7px;border-right:2px solid var(--muted);
  border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.meta-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:18px 2px 10px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.meta-row b{color:var(--ink)}
.jlist{display:flex;flex-direction:column;gap:10px}
.job{display:flex;gap:14px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:14px;
  padding:16px 18px;text-align:left;width:100%;transition:border-color .15s,box-shadow .15s}
.job:hover{border-color:#cdd3e6;box-shadow:0 10px 26px -22px rgba(18,26,51,.5)}
.logo{width:44px;height:44px;border-radius:11px;flex:none;display:grid;place-items:center;color:#fff;
  font-family:Poppins;font-weight:700;font-size:17px}
.job .body{flex:1;min-width:0}
.job .t{font-weight:600;color:var(--ink);font-size:15.5px;line-height:1.35}
.job .c{font-size:13.5px;color:var(--body);margin-top:1px}
.tags{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:9px;font-size:12.5px;color:var(--muted)}
.tags span{display:inline-flex;align-items:center;gap:5px}
.tags svg{width:14px;height:14px;opacity:.8}
.fresh{color:var(--ok)!important;font-weight:600}
.job .side-act{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:none}
.bm{width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--muted)}
.bm svg{width:18px;height:18px}
.bm.on{color:var(--blue);border-color:var(--blue-line);background:var(--blue-soft)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;
  background:var(--bg);color:var(--body);border:1px solid var(--line)}
.pill.remote{background:#eaf7f0;border-color:#c6e9d6;color:#08643a}
.empty{text-align:center;padding:56px 20px;background:#fff;border:1px dashed #d6dbea;border-radius:16px}
.empty svg{width:40px;height:40px;color:var(--blue);opacity:.7}
.empty h3{font-family:Poppins;color:var(--ink);font-size:18px;margin-top:12px}
.empty p{max-width:44ch;margin:6px auto 16px;font-size:14px}
.more{display:flex;justify-content:center;margin-top:16px}
.skel{height:92px;border-radius:14px;background:linear-gradient(90deg,#eef0f6 0%,#f7f8fc 50%,#eef0f6 100%);
  background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.loading-note{font-size:13px;color:var(--muted);margin:14px 2px}

/* ---------- drawer (job detail) ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,16,38,.42);z-index:60;opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);background:#fff;z-index:61;display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .25s cubic-bezier(.4,0,.2,1);box-shadow:-30px 0 60px -30px rgba(10,16,38,.45)}
.drawer.on{transform:none}
.dr-top{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dr-top .x{width:42px;height:42px;border:0;background:none;border-radius:10px;display:grid;place-items:center;color:var(--body)}
.dr-top .x:hover{background:var(--bg)}
.dr-top .x svg{width:20px;height:20px}
.dr-top span{font-weight:600;color:var(--ink);flex:1}
.dr-body{overflow-y:auto;flex:1;padding:22px 24px 40px}
.jd-head{display:flex;gap:16px;align-items:flex-start}
.jd-head .logo{width:56px;height:56px;font-size:22px;border-radius:13px}
.jd-head h2{font-family:Poppins;font-weight:700;color:var(--ink);font-size:21px;line-height:1.25;letter-spacing:-.01em}
.jd-head .co{font-weight:600;color:var(--body);margin-top:2px}
.jd-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 20px;margin-top:18px;font-size:13.5px}
.jd-grid div{display:flex;gap:8px;align-items:flex-start;min-width:0}
.jd-grid svg{width:16px;height:16px;flex:none;margin-top:2px;color:var(--muted)}
.jd-acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.card{border:1px solid var(--line);border-radius:16px;background:#fff;padding:20px}
.match{margin-top:22px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.ring{position:relative;width:104px;height:104px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;font-family:Poppins;font-weight:800;font-size:26px;color:var(--ink)}
.match .txt{flex:1;min-width:220px}
.match h3{font-family:Poppins;font-size:16.5px;color:var(--ink)}
.match p{font-size:13.5px;margin-top:4px}
.brk{margin-top:14px;display:grid;gap:8px;width:100%}
.brk .r{display:grid;grid-template-columns:130px 1fr 44px;gap:10px;align-items:center;font-size:13px}
.brk .tr{display:block;height:6px;border-radius:9px;background:#eef0f7;overflow:hidden}
.brk .fi{display:block;height:100%;border-radius:9px}
.skills{margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:16px;width:100%}
.skills h4{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;font-weight:500;padding:5px 10px;border-radius:7px}
.chip.h{background:var(--ok-soft);color:#065f3c}
.chip.m{background:var(--bad-soft);color:#9f1239}
.chip.n{background:var(--bg);color:var(--body);border:1px solid var(--line)}
.upsell{margin-top:16px;border-radius:16px;padding:20px;background:linear-gradient(135deg,#0a31bd,#0938d5);color:#fff;
  display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.upsell .tx{flex:1;min-width:220px}
.upsell b{font-family:Poppins;font-size:16px;display:block}
.upsell p{font-size:13.5px;color:rgba(255,255,255,.85);margin-top:4px}
.upsell .btn{background:#fff;color:var(--blue);border-color:#fff}
.desc{margin-top:26px;color:#33395a;font-size:14.5px;line-height:1.7}
.desc h3{font-family:Poppins;color:var(--ink);font-size:16px;margin-bottom:6px}
.desc h4{color:var(--ink);font-size:14.5px;margin:18px 0 6px}
.desc p{margin:0 0 10px}
.desc ul{margin:0 0 12px 20px}
.desc li{margin-bottom:5px}

/* ---------- dashboard ---------- */
.hello{font-family:Poppins;font-weight:700;color:var(--ink);font-size:22px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:14px;margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:20px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}
.stat .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue)}
.stat .ic svg{width:19px;height:19px}
.stat .n{font-family:Poppins;font-weight:800;font-size:28px;color:var(--ink);margin-top:10px;line-height:1}
.stat .l{font-size:13px;margin-top:4px}
.sec{margin-top:26px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.sec-h h2{font-family:Poppins;font-weight:600;color:var(--ink);font-size:17px}
.trk{display:flex;flex-direction:column;gap:8px}
.trow{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.trow .logo{width:38px;height:38px;font-size:15px;border-radius:9px}
.trow .i{flex:1;min-width:0}
.trow .i b{display:block;color:var(--ink);font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .i span{font-size:12.5px;color:var(--muted)}
.trow select{min-height:36px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:0 8px;font-size:13px}
.trow .rm{width:36px;height:36px;border:0;background:none;color:var(--muted);border-radius:8px;display:grid;place-items:center}
.trow .rm:hover{background:var(--bad-soft);color:var(--bad)}
.trow .rm svg{width:16px;height:16px}
.chart{display:flex;align-items:flex-end;gap:8px;height:120px;padding:10px 4px 0}
.chart .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.chart .bar{width:100%;max-width:34px;border-radius:6px 6px 2px 2px;background:var(--blue);min-height:2px}
.chart .b span{font-size:11px;color:var(--muted)}

/* ---------- resume ---------- */
.drop{border:2px dashed #cdd4ea;border-radius:16px;padding:36px 20px;text-align:center;background:#fbfcff;cursor:pointer}
.drop:hover,.drop.over{border-color:var(--blue);background:#f4f7ff}
.drop svg{width:34px;height:34px;color:var(--blue)}
.drop b{display:block;color:var(--ink);margin-top:10px;font-size:15px}
.drop span{font-size:13px;color:var(--muted)}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}
.kv div{background:var(--bg);border-radius:12px;padding:14px}
.kv b{display:block;font-family:Poppins;color:var(--ink);font-size:20px}
.kv span{font-size:12.5px;color:var(--muted)}
.toggle{display:flex;align-items:flex-start;gap:12px;cursor:pointer}
.toggle input{position:absolute;opacity:0;pointer-events:none}
.sw{width:42px;height:24px;border-radius:99px;background:#d6dbea;position:relative;flex:none;transition:.2s;margin-top:1px}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;
  transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle input:checked + .sw{background:var(--ok)}
.toggle input:checked + .sw::after{transform:translateX(18px)}
.toggle input:focus-visible + .sw{outline:2px solid var(--blue);outline-offset:2px}
.toggle b{display:block;color:var(--ink);font-size:14px}
.toggle small{display:block;font-size:12.5px;color:var(--muted)}

/* ---------- communities ---------- */
.cgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.comm{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.comm .h{display:flex;gap:10px;align-items:center}
.comm .h .logo{width:38px;height:38px;font-size:13px;border-radius:9px}
.comm .h b{color:var(--ink);font-size:14.5px;line-height:1.3}
.comm .tags{margin-top:0}
.comm .f{display:flex;justify-content:space-between;align-items:center;margin-top:auto;gap:8px}
.comm .f span{font-size:12.5px;color:var(--muted)}

/* ---------- settings ---------- */
.set{display:grid;grid-template-columns:220px 1fr;gap:20px;align-items:start}
.set-nav{display:flex;flex-direction:column;gap:4px;position:sticky;top:84px}
.set-nav a{display:flex;align-items:center;min-height:42px;padding:0 12px;border-radius:9px;text-decoration:none;color:var(--body);font-size:14px}
.set-nav a:hover{background:#fff}
.stack{display:flex;flex-direction:column;gap:14px}
.prof{display:flex;gap:16px;align-items:center}
.prof .av{width:64px;height:64px;font-size:24px;border-radius:16px}
.prof b{display:block;font-family:Poppins;color:var(--ink);font-size:18px}
.prof span{font-size:13.5px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--ink)}
.field input{min-height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:#fff;font-size:14px}
.field input:focus{outline:2px solid var(--blue);outline-offset:-1px;border-color:transparent}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.danger{border-color:#f6c9d3}
.danger h3{color:var(--bad)}
.card h3{font-family:Poppins;font-size:15.5px;color:var(--ink);margin-bottom:4px}
.card > p{font-size:13.5px;margin-bottom:14px}
.copyrow{display:flex;gap:8px}
.copyrow input{flex:1;min-width:0;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--bg);font-size:13px}

/* ---------- modal ---------- */
.mod-wrap{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;background:rgba(10,16,38,.5)}
.mod{background:#fff;border-radius:20px;width:min(460px,100%);max-height:calc(100vh - 32px);overflow-y:auto;padding:28px;position:relative;
  box-shadow:0 30px 70px -20px rgba(10,16,38,.5)}
.mod.wide{width:min(620px,100%)}
.mod .x{position:absolute;top:12px;right:12px;width:40px;height:40px;border:0;background:none;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.mod .x:hover{background:var(--bg)}
.mod .x svg{width:19px;height:19px}
.mod h2{font-family:Poppins;font-weight:700;color:var(--ink);font-size:21px;letter-spacing:-.01em;padding-right:30px}
.mod > p{font-size:14px;margin-top:8px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:50px;border:1px solid #d8dce8;
  border-radius:12px;background:#fff;font-weight:600;color:#1f1f1f;font-size:15px;margin-top:20px}
.gbtn:hover{background:#f8f9fc}
.gbtn svg{width:20px;height:20px}
.fine{font-size:12px;color:var(--muted);margin-top:14px;line-height:1.5}
.bul{list-style:none;margin-top:16px;display:grid;gap:9px}
.bul li{display:flex;gap:10px;font-size:14px;align-items:flex-start}
.bul svg{width:18px;height:18px;color:var(--ok);flex:none;margin-top:1px}
.skip{display:block;text-align:center;margin-top:12px;font-size:13px;color:var(--muted)}
textarea.post{width:100%;min-height:260px;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:13.5px;line-height:1.55;margin-top:14px;resize:vertical}

/* =====================================================================
   store — Supabase when configured, this browser otherwise
   ===================================================================== */
var sb = null;
var state = { user:null, profile:null, tracked:[], ready:false };

function loadScript(src){
  return new Promise(function(res, rej){ var s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); });
}

var store = {
  init: function(){
    if(!LIVE){
      $('#demoBar').hidden = false;
      var d = lsGet('tp_app_v1', null);
      if(d && d.user){ state.user=d.user; state.profile=d.profile||{}; state.tracked=d.tracked||[]; }
      return Promise.resolve();
    }
    return loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js').then(function(){
      sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY, {auth:{flowType:'pkce', persistSession:true, detectSessionInUrl:true}});
      sb.auth.onAuthStateChange(function(ev, session){
        if(ev === 'SIGNED_IN' && session && (!state.user || state.user.id !== session.user.id)){ afterSignIn(session.user); }
        if(ev === 'SIGNED_OUT'){ state.user=null; state.profile=null; state.tracked=[]; render(); }
      });
      return sb.auth.getSession();
    }).then(function(r){
      // tidy the ?code= left behind by the Google redirect
      if(location.search.indexOf('code=') > -1) history.replaceState(null, '', location.pathname + location.hash);
      var s = r && r.data && r.data.session;
      if(s) return afterSignIn(s.user, true);
    }).catch(function(){
      toast('Sign-in is unavailable right now — browsing still works');
    });
  },
  saveLocal: function(){ if(!LIVE) lsSet('tp_app_v1', {user:state.user, profile:state.profile, tracked:state.tracked}); },
  signIn: function(){
    ssSet('tp_after', location.hash || '#jobs');
    if(!LIVE){
      var u = {id:'local-'+Math.random().toString(36).slice(2,10), email:'you@example.com', name:'Preview user', avatar:'', created:Date.now()};
      return afterSignIn(u);
    }
    return sb.auth.signInWithOAuth({provider:'google', options:{redirectTo: CONFIG.SITE.replace(/\/$/,'') + '/app.html'}});
  },
  signOut: function(){
    if(!LIVE){ state.user=null; state.profile=null; state.tracked=[]; lsSet('tp_app_v1', null); render(); return Promise.resolve(); }
    return sb.auth.signOut();
  },
  saveProfile: function(patch){
    state.profile = Object.assign({}, state.profile, patch);
    if(!LIVE){ store.saveLocal(); return Promise.resolve(); }
    var row = Object.assign({id:state.user.id}, patch);
    return sb.from('profiles').upsert(row, {onConflict:'id'}).then(function(r){ if(r.error) toast('Couldn’t save — try again'); });
  },
  track: function(job, status){
    var now = new Date().toISOString();
    var cur = state.tracked.filter(function(t){ return t.job_key === job.key; })[0];
    var row = {job_key:job.key, title:job.title, company:job.company, location:job.location, url:job.url, status:status, updated_at:now,
               applied_at: status === 'applied' ? now : (cur && cur.applied_at) || null};
    state.tracked = [row].concat(state.tracked.filter(function(t){ return t.job_key !== job.key; }));
    if(!LIVE){ store.saveLocal(); return Promise.resolve(); }
    return sb.from('tracked_jobs').upsert(Object.assign({user_id:state.user.id}, row), {onConflict:'user_id,job_key'});
  },
  untrack: function(key){
    state.tracked = state.tracked.filter(function(t){ return t.job_key !== key; });
    if(!LIVE){ store.saveLocal(); return Promise.resolve(); }
    return sb.from('tracked_jobs').delete().eq('user_id', state.user.id).eq('job_key', key);
  },
  deleteAccount: function(){
    if(!LIVE){ lsSet('tp_app_v1', null); state.user=null; state.profile=null; state.tracked=[]; return Promise.resolve(); }
    return sb.rpc('delete_my_account').then(function(r){
      if(r.error) throw r.error;
      return sb.auth.signOut();
    });
  }
};

function afterSignIn(u, silent){
  var meta = u.user_metadata || {};
  state.user = {
    id: u.id, email: u.email,
    name: u.name || meta.full_name || meta.name || (u.email||'').split('@')[0],
    avatar: u.avatar || meta.avatar_url || meta.picture || '',
    created: u.created || Date.parse(u.created_at) || Date.now()
  };
  var ref = ssGet('tp_ref', null);
  var load = LIVE

function htmlToBlocks(html){

  var out = [], nodes = doc.body.querySelectorAll('h1,h2,h3,h4,h5,p,li');

    var t = n.textContent.replace(/\s+/g,' ').trim(); if(!t) return;
    out.push({k: n.tagName === 'LI' ? 'li' : /^H/.test(n.tagName) ? 'h' : 'p', t:t});

}

    if(/^[•\-\*·▪◦]\s*/.test(l)) return {k:'li', t:l.replace(/^[•\-\*·▪◦]\s*/,'')};

    if(F.region === 'ours'){ if(!j.reg.some(function(r){ return r==='US'||r==='CA'||r==='UK'||r==='AU'; })) return false; }

    if(F.cat && j.cat !== F.cat) return false;
    if(F.lvl && j.lvl !== F.lvl) return false;
    if(j.posted && (now - j.posted)/864e5 > maxAge) return false;
    if(q && (j.title + ' ' + j.company + ' ' + j.location + ' ' + j.dept).toLowerCase().indexOf(q) < 0) return false;

  });

}

function ring(score, size){

    '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="10" stroke-linecap="round" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+(C*(1-score/100)).toFixed(1)+'"/></svg>'+

      '<div class="two"><div class="field"><label for="sRole">Target role</label><input id="sRole" value="'+esc(p.target_role||'')+'" placeholder="e.g. Data Analyst"></div>'+
      '<div class="field"><label for="sLoc">Location</label><input id="sLoc" value="'+esc(p.target_location||'')+'" placeholder="e.g. New York or Remote US"></div></div>'+
      '<div class="jd-acts"><button class="btn pri" type="button" data-act="saveprefs">Save</button></div></div>'+
    '<div class="card"><h3>Email</h3><p>We only email you if you switch this on. Every email has a one-click unsubscribe.</p>'+
      '<label class="toggle"><input type="checkbox" id="sMail"'+(p.marketing_consent?' checked':'')+'><span class="sw"></span><span><b>Weekly fresh roles & job-search tips</b><small>New openings that match your target role, once a week.</small></span></label></div>'+
    '<div class="card"><h3>Invite a friend</h3><p>'+(CONFIG.REFERRAL_REWARD ? esc(CONFIG.REFERRAL_REWARD) : 'Know someone job hunting? Send them your link.')+'</p>'+
      '<div class="copyrow"><input readonly value="'+esc(ref)+'" aria-label="Your invite link"><button class="btn" type="button" data-copy="'+esc(ref)+'">Copy</button></div></div>'+
    '<div class="card"><h3>Sign out</h3><p>You can sign back in with Google any time.</p><button class="btn" type="button" data-act="signout">Sign out</button></div>'+
    '<div class="card danger"><h3>Delete my account</h3><p>Permanently deletes your profile, resume and tracked jobs. This can’t be undone.</p>'+
      '<div id="delWrap"><button class="btn" type="button" data-act="delask">'+I.trash+'Delete account</button></div></div>'+
  '</div>';
  $('#sMail').addEventListener('change', function(e){
    store.saveProfile({marketing_consent:e.target.checked, consent_at:new Date().toISOString()}).then(function(){ toast(e.target.checked ? 'You’ll get weekly roles' : 'Unsubscribed'); });
  });
}

/* =====================================================================
   modals
   ===================================================================== */
function modal(html, wide){
  $('#modalRoot').innerHTML = '<div class="mod-wrap" data-act="mclose"><div class="mod '+(wide?'wide':'')+'" role="dialog" aria-modal="true">'+
    '<button class="x" type="button" data-act="mclose" aria-label="Close">'+I.x+'</button>'+html+'</div></div>';
  var f = $('#modalRoot .mod input, #modalRoot .mod button:not(.x)'); if(f) f.focus();
}
function closeModal(){ $('#modalRoot').innerHTML = ''; }
function openSignIn(why){
  modal('<h2>'+esc(why || 'Sign in to TrulyPlaced Jobs')+'</h2><p>Free. Takes five seconds.</p>'+
    '<ul class="bul"><li>'+I.check+'See how your resume matches every role</li><li>'+I.check+'Save jobs and track every application</li><li>'+I.check+'Fresh roles from top US companies, updated live</li></ul>'+
    '<button class="gbtn" type="button" data-act="google">'+I.g+(LIVE?'Continue with Google':'Continue (preview mode)')+'</button>'+
    '<p class="fine">By continuing you agree to our <a href="/terms.html">Terms</a> and <a href="/privacy.html">Privacy Policy</a>. We never post to your accounts or read your email.</p>'+
    (pendingSkip ? '<a class="skip" href="'+esc(pendingSkip)+'" target="_blank" rel="noopener" data-act="mclose">Continue to the company site without signing in</a>' : ''));
}
var pendingSkip = null;
function openOnboarding(){
  var p = state.profile || {};
  modal('<h2>Welcome'+(state.user.name?', '+esc(state.user.name.split(' ')[0]):'')+'</h2><p>Two quick questions so we can show you the right roles.</p>'+
    '<div class="stack" style="margin-top:18px">'+
      '<div class="field"><label for="oRole">What role are you looking for?</label><input id="oRole" value="'+esc(p.target_role||'')+'" placeholder="e.g. Data Analyst"></div>'+
      '<div class="field"><label for="oLoc">Where?</label><input id="oLoc" value="'+esc(p.target_location||'')+'" placeholder="e.g. New York, Remote US, Toronto"></div>'+
      '<label class="toggle"><input type="checkbox" id="oMail"'+(p.marketing_consent?' checked':'')+'><span class="sw"></span><span><b>Email me fresh matching roles weekly</b><small>Optional. Unsubscribe any time.</small></span></label>'+
      '<button class="btn pri" type="button" data-act="onbsave" style="width:100%">Show me jobs</button>'+
    '</div>');
}
function openUpsell(){
  modal('<h2>Tired of applying?</h2><p>Hand the job hunt to a recruiter. You focus on interviews.</p>'+
    '<ul class="bul"><li>'+I.check+'Your resume rebuilt by a recruiter, then tailored to every role</li><li>'+I.check+'25–30 matched applications submitted every business day</li><li>'+I.check+'Roles found within 1–4 days of posting</li><li>'+I.check+'Proof of every application, tracked live</li></ul>'+
    '<div class="stack" style="margin-top:20px"><a class="btn pri" href="'+esc(CONFIG.PRICING)+'">See plans — from $299</a><a class="btn" href="'+esc(CONFIG.BOOK_CALL)+'" target="_blank" rel="noopener">Book a free 30-min call</a></div>'+
    '<p class="fine">No guarantees of interviews or offers — we commit to the work, not outcomes we don’t control. <a href="/refunds.html">Refund policy</a>.</p>');
}
function openInvite(){
  if(!state.user){ requireSignIn('Sign in to get your invite link', openInvite); return; }
  var ref = CONFIG.SITE.replace(/\/$/,'') + '/app.html?ref=' + encodeURIComponent(state.user.id);
  modal('<h2>Invite a friend</h2><p>'+(CONFIG.REFERRAL_REWARD ? esc(CONFIG.REFERRAL_REWARD) : 'Share TrulyPlaced Jobs with someone who’s job hunting.')+'</p>'+
    '<div class="copyrow" style="margin-top:18px"><input readonly value="'+esc(ref)+'" aria-label="Invite link"><button class="btn pri" type="button" data-copy="'+esc(ref)+'">Copy</button></div>');
}
function openPost(){
  var picks = state.tracked.slice(0, 5);
  var nums = ['1️⃣','2️⃣','3️⃣','4️⃣','5️⃣'];
  var base = CONFIG.SITE.replace(/\/$/,'') + '/app.html#job=';
  var role = (state.profile && state.profile.target_role) || 'new';
  var txt = '🚀 Fresh ' + role + ' roles just opened up\n\nThese listings won’t stay up for long. Tag a friend who keeps saying “I’ll apply tomorrow.”\n\n' +
    picks.map(function(t, i){ return nums[i] + ' ' + t.title + ' — ' + t.company + (t.location ? ' (📍 ' + String(t.location).split('·')[0].trim() + ')' : '') + '\n🔗 ' + base + encodeURIComponent(t.job_key); }).join('\n\n') +
    '\n\n💡 See how your resume matches each one — free at trulyplaced.com\n\n📌 Follow for fresh roles every week.';
  modal('<h2>Share as a LinkedIn post</h2><p>Your first five saved roles, formatted to post. Each link opens the role on TrulyPlaced.</p>'+
    '<textarea class="post" id="postTxt">'+esc(txt)+'</textarea>'+
    '<div class="jd-acts"><button class="btn pri" type="button" data-copypost="1">Copy post</button></div>', true);
}

/* =====================================================================
   events
   ===================================================================== */
document.addEventListener('click', function(e){
  var t = e.target.closest('[data-act],[data-job],[data-save],[data-apply],[data-share],[data-untrack],[data-copy],[data-copypost],[data-notify],[data-join]');
  if(!t) return;
  var a = t.getAttribute('data-act');
  if(t.hasAttribute('data-save')){ e.stopPropagation(); return toggleSave(t.getAttribute('data-save')); }
  if(t.hasAttribute('data-job') && !a){ location.hash = 'job=' + encodeURIComponent(t.getAttribute('data-job')); return; }
  if(t.hasAttribute('data-apply')) return applyTo(t.getAttribute('data-apply'));
  if(t.hasAttribute('data-share')){ return copy(CONFIG.SITE.replace(/\/$/,'') + '/app.html#job=' + encodeURIComponent(t.getAttribute('data-share'))); }
  if(t.hasAttribute('data-untrack')){ store.untrack(t.getAttribute('data-untrack')).then(function(){ render(); toast('Removed'); }); return; }
  if(t.hasAttribute('data-copy')){ return copy(t.getAttribute('data-copy')); }
  if(t.hasAttribute('data-copypost')){ var ta = $('#postTxt'); ta.select(); return copy(ta.value); }
  if(t.hasAttribute('data-notify')){
    var n = t.getAttribute('data-notify');
    return requireSignIn('Sign in to join ' + n, function(){
      var cur = (state.profile && state.profile.community_interest) || [];
      if(cur.indexOf(n) < 0) cur = cur.concat([n]);
      store.saveProfile({community_interest:cur}).then(function(){ toast('We’ll let you know when it opens'); render(); });
    });
  }
  if(t.hasAttribute('data-join')){ if(!state.user){ e.preventDefault(); requireSignIn('Sign in to join', function(){ window.open(t.href, '_blank', 'noopener'); }); } return; }
  switch(a){
    case 'signin': pendingSkip = null; return openSignIn();
    case 'google': closeModal(); return store.signIn();
    case 'mclose': if(e.target === t || t.classList.contains('x') || t.classList.contains('skip')) closeModal(); return;
    case 'close': history.pushState(null, '', '#' + (route.name || 'jobs')); return closeDrawer();
    case 'upsell': return openUpsell();
    case 'invite': return openInvite();
    case 'post': return openPost();
    case 'more': shown += 30; return drawList();
    case 'reload': JOBS = []; jobsPromise = null; loadJobs(true).then(function(){ drawList(); }); return vJobs($('#view'));
    case 'clearf': F = {q:'', region:'ours', cat:'', lvl:'', age:'any', sort:'new'}; lsSet('tp_filters', F); return vJobs($('#view'));
    case 'upload': return requireSignIn('Sign in to add your resume', function(){ $('#fileIn').click(); });
    case 'rmresume':
      lsSet('tp_resume_local', null);
      return store.saveProfile({resume_text:null, resume_name:null}).then(function(){ toast('Resume removed'); render(); });
    case 'saveprefs':
      return store.saveProfile({target_role:$('#sRole').value.trim(), target_location:$('#sLoc').value.trim()}).then(function(){ toast('Saved'); });
    case 'onbsave':
      var patch = {target_role:$('#oRole').value.trim(), target_location:$('#oLoc').value.trim(), marketing_consent:$('#oMail').checked, onboarded:true};
      if(patch.marketing_consent) patch.consent_at = new Date().toISOString();
      if(patch.target_role && F.sort === 'new'){ F.sort = 'fit'; lsSet('tp_filters', F); }
      return store.saveProfile(patch).then(function(){ closeModal(); render(); });
    case 'signout': return store.signOut().then(function(){ location.hash = 'jobs'; toast('Signed out'); });
    case 'delask':
      $('#delWrap').innerHTML = '<p style="font-size:13.5px;margin-bottom:10px"><b>Are you sure?</b> Everything is deleted immediately.</p><div class="jd-acts" style="margin-top:0"><button class="btn" type="button" data-act="delno">Keep my account</button><button class="btn pri" type="button" data-act="delyes" style="background:var(--bad);border-color:var(--bad)">Yes, delete everything</button></div>';
      return;
    case 'delno': return render();
    case 'delyes':
      return store.deleteAccount().then(function(){ lsSet('tp_resume_local', null); location.hash = 'jobs'; render(); toast('Your account has been deleted'); })
        .catch(function(){ toast('Couldn’t delete — email hello@trulyplaced.com and we’ll do it'); });
  }
});
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape'){ if($('#modalRoot').innerHTML) closeModal(); else if(drawerKey){ history.pushState(null,'','#'+route.name); closeDrawer(); } }
  if((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.job')){ e.preventDefault(); e.target.click(); }
});
document.addEventListener('change', function(e){
  var k = e.target.getAttribute && e.target.getAttribute('data-status');
  if(!k) return;
  var t = state.tracked.filter(function(x){ return x.job_key === k; })[0];
  store.track({key:k, title:t.title, company:t.company, location:t.location, url:t.url}, e.target.value).then(function(){ toast('Updated'); vDashboard($('#view')); });
});

function toggleSave(key){
  var job = findJob(key) || state.tracked.filter(function(t){ return t.job_key === key; })[0];
  if(!job) return;
  requireSignIn('Sign in to save jobs', function(){
    var j = job.key ? job : {key:job.job_key, title:job.title, company:job.company, location:job.location, url:job.url};
    (isTracked(j.key) ? store.untrack(j.key) : store.track(j, 'saved')).then(function(){
      toast(isTracked(j.key) ? 'Saved to your dashboard' : 'Removed');
      $$('[data-save="'+CSS.escape(j.key)+'"]').forEach(function(b){
        var on = isTracked(j.key);
        b.classList.toggle('on', on);
        b.innerHTML = (on ? I.bmf : I.bm) + (b.classList.contains('bm') ? '' : (on ? 'Saved' : 'Save'));
      });
    });
  });
}
function applyTo(key){
  var job = findJob(key); if(!job) return;
  var url = (DESC[key] && DESC[key].apply) || job.url;
  var go = function(){
    window.open(url, '_blank', 'noopener');
    var cur = state.tracked.filter(function(t){ return t.job_key === key; })[0];
    if(!cur || cur.status === 'saved') store.track(job, 'applied').then(function(){ toast('Marked as applied — update it from your dashboard'); });
  };
  if(!CONFIG.REQUIRE_SIGNIN_TO_APPLY || state.user) return go();
  pendingSkip = url;
  requireSignIn('Sign in to apply and track this role', go);
}

/* =====================================================================
   boot
   ===================================================================== */
(function(){
  var m = /[?&]ref=([^&#]+)/.exec(location.search);
  if(m){ ssSet('tp_ref', decodeURIComponent(m[1])); history.replaceState(null, '', location.pathname + location.hash); }
})();
// trulyplaced.com/app.html#signin — the "Sign in" button on the main site
var wantSignIn = location.hash === '#signin';
if(wantSignIn) history.replaceState(null, '', location.pathname + location.search + '#dashboard');
render();
store.init().then(function(){
  state.ready = true; render();
  if(wantSignIn && !state.user){ pendingSkip = null; openSignIn('Sign in to TrulyPlaced'); }
});
loadJobs().then(function(){ if(route.name === 'jobs'){ drawList(); } if(route.job){ drawerKey = null; openJob(route.job); } });

})();
</script>
