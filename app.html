<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TrulyPlaced Jobs | Fresh roles, matched to your resume</title>
<meta name="description" content="Fresh roles from top US companies, updated live. See how your resume matches each one — free.">
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#0938d5">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet"></noscript>
<style>
:root{--blue:#0938d5;--blue-d:#072ca8;--blue-soft:#eef2ff;--blue-line:#cfd9ff;--ink:#121a33;--body:#4b5473;
  --muted:#737b9c;--line:#e7e9f2;--bg:#f6f7fc;--card:#fff;--ok:#0a7f46;--ok-soft:#e6f6ee;--warn:#b45309;
  --warn-soft:#fef3e2;--bad:#be123c;--bad-soft:#ffe8ed;--side:248px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--body);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue)}
img{max-width:100%}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100%}
.side{position:sticky;top:0;height:100vh;background:#fff;border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:20px 14px 16px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);padding:4px 8px 18px;
  font-family:Poppins;font-weight:700;font-size:18px;letter-spacing:-.01em}
.brand svg{width:32px;height:32px;flex:none}
.brand small{display:block;font-family:Inter;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.06em;
  text-transform:uppercase;margin-top:-2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:10px;color:var(--body);
  text-decoration:none;font-weight:500;font-size:14.5px}
.nav a svg{width:20px;height:20px;flex:none;opacity:.85}
.nav a:hover{background:var(--bg);color:var(--ink)}
.nav a.on{background:var(--blue-soft);color:var(--blue);font-weight:600}
.nav a.on svg{opacity:1}
.side .grow{flex:1}
.tired{border:1px solid var(--blue-line);background:linear-gradient(160deg,#f2f5ff,#fff);border-radius:14px;
  padding:14px;margin-bottom:10px}
.tired b{display:block;color:var(--ink);font-size:14px}
.tired p{font-size:12.5px;margin:4px 0 10px;line-height:1.45}
.tired button{width:100%;min-height:40px;border:0;border-radius:9px;background:var(--blue);color:#fff;font-weight:600;font-size:13.5px}
.side-foot a{display:flex;align-items:center;gap:10px;min-height:40px;padding:0 12px;color:var(--muted);
  text-decoration:none;font-size:13.5px;border-radius:9px}
.side-foot a:hover{background:var(--bg);color:var(--ink)}
.side-foot svg{width:18px;height:18px}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;height:64px;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 24px}
.top h1{font-family:Poppins;font-weight:600;font-size:17px;color:var(--ink);flex:1;min-width:0;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.top .m-brand{display:none}
.invite{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:10px;
  border:1px solid var(--blue-line);background:var(--blue-soft);color:var(--blue);font-weight:600;font-size:13.5px;white-space:nowrap}
.invite svg{width:17px;height:17px}
.who{display:flex;align-items:center;gap:10px}
.av{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:14px;
  color:#fff;background:var(--blue);overflow:hidden;border:0;text-decoration:none}
.av img{width:100%;height:100%;object-fit:cover}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:11px;
  border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:600;font-size:14px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:#cdd3e6}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 10px 22px -14px rgba(9,56,213,.8)}
.btn.pri:hover{background:var(--blue-d)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:9px}
.btn svg{width:17px;height:17px;flex:none}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.view{padding:24px;max-width:1180px;width:100%;margin:0 auto}

.demo{background:#fff8e6;border-bottom:1px solid #f3e0b0;color:#7a5200;font-size:13px;padding:8px 24px;text-align:center}

/* ---------- jobs ---------- */
.search{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--blue-line);border-radius:14px;
  padding:0 16px;min-height:52px;box-shadow:0 8px 24px -20px rgba(9,56,213,.6)}
.search svg{width:20px;height:20px;color:var(--blue);flex:none}
.search input{border:0;outline:0;flex:1;min-width:0;font-size:15px;background:none;min-height:48px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.sel{position:relative}
.sel select{appearance:none;-webkit-appearance:none;min-height:40px;padding:0 34px 0 13px;border-radius:10px;
  border:1px solid var(--line);background:#fff;font-size:13.5px;font-weight:500;color:var(--ink);max-width:100%}
.sel::after{content:"";position:absolute;right:13px;top:50%;width:7px;height:7px;border-right:2px solid var(--muted);
  border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.meta-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:18px 2px 10px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.meta-row b{color:var(--ink)}
.jlist{display:flex;flex-direction:column;gap:10px}
.job{display:flex;gap:14px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:14px;
  padding:16px 18px;text-align:left;width:100%;transition:border-color .15s,box-shadow .15s}
.job:hover{border-color:#cdd3e6;box-shadow:0 10px 26px -22px rgba(18,26,51,.5)}
.logo{position:relative;overflow:hidden;width:44px;height:44px;border-radius:11px;flex:none;display:grid;place-items:center;color:#fff;
  font-family:Poppins;font-weight:700;font-size:17px}
.job .body{flex:1;min-width:0}
.job .t{font-weight:600;color:var(--ink);font-size:15.5px;line-height:1.35}
.job .c{font-size:13.5px;color:var(--body);margin-top:1px}
.tags{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:9px;font-size:12.5px;color:var(--muted)}
.tags span{display:inline-flex;align-items:center;gap:5px}
.tags svg{width:14px;height:14px;opacity:.8}
.fresh{color:var(--ok)!important;font-weight:600}
.job .side-act{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:none}
.bm{width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--muted)}
.bm svg{width:18px;height:18px}
.bm.on{color:var(--blue);border-color:var(--blue-line);background:var(--blue-soft)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;
  background:var(--bg);color:var(--body);border:1px solid var(--line)}
.pill.remote{background:#eaf7f0;border-color:#c6e9d6;color:#08643a}
.empty{text-align:center;padding:56px 20px;background:#fff;border:1px dashed #d6dbea;border-radius:16px}
.empty svg{width:40px;height:40px;color:var(--blue);opacity:.7}
.empty h3{font-family:Poppins;color:var(--ink);font-size:18px;margin-top:12px}
.empty p{max-width:44ch;margin:6px auto 16px;font-size:14px}
.more{display:flex;justify-content:center;margin-top:16px}
.skel{height:92px;border-radius:14px;background:linear-gradient(90deg,#eef0f6 0%,#f7f8fc 50%,#eef0f6 100%);
  background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.loading-note{font-size:13px;color:var(--muted);margin:14px 2px}

.logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;padding:16%}
.logo.has-img{box-shadow:inset 0 0 0 1px var(--line)}
.logo.has-img img{border-radius:inherit}
/* ---------- drawer (job detail) ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,16,38,.42);z-index:60;opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);background:#fff;z-index:61;display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .25s cubic-bezier(.4,0,.2,1);box-shadow:-30px 0 60px -30px rgba(10,16,38,.45)}
.drawer.on{transform:none}
.drawer{transition:transform .25s cubic-bezier(.4,0,.2,1),width .35s cubic-bezier(.4,0,.2,1)}
.drawer.wide{width:min(1640px,100vw);display:grid;grid-template-columns:minmax(380px,520px) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
.drawer.wide .dr-top{grid-column:1;grid-row:1}
.drawer.wide .dr-body{grid-column:1;grid-row:2;padding:20px 22px 40px}
#ws{grid-column:2;grid-row:1/span 2;position:relative;display:flex;flex-direction:column;border-left:1px solid var(--line);background:#eef1f8;min-width:0;animation:wsIn .35s ease}
@keyframes wsIn{from{opacity:0;transform:translateX(24px)}}
.ws-bar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#fff;border-bottom:1px solid var(--line);min-height:59px}
.ws-bar b{flex:1;font-family:Poppins;font-size:15px;color:var(--ink);display:flex;align-items:center;gap:8px}
.ws-bar b svg{width:18px;height:18px;color:#6d28d9}
.ws-bar .x{width:38px;height:38px;border:0;background:none;border-radius:10px;display:grid;place-items:center;color:var(--body)}
.ws-bar .x:hover{background:var(--bg)}
.ws-bar .x svg{width:18px;height:18px}
.ws-bar a{font-size:13px;font-weight:600;text-decoration:none;white-space:nowrap}
.ws-bar .back{display:none}
#ws iframe{flex:1;width:100%;border:0;background:#eef1f8;min-height:0}
.ws-load{position:absolute;inset:59px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:#fff;z-index:2;transition:opacity .3s}
.ws-load.gone{opacity:0;pointer-events:none}
.ws-load b{color:var(--ink);font-size:16px;margin-top:8px}
.ws-load small{color:var(--muted);font-size:13px}
.ws-load .wspin{width:38px;height:38px;border-radius:50%;border:3.5px solid var(--blue-soft);border-top-color:var(--blue);animation:wsr .8s linear infinite}
@keyframes wsr{to{transform:rotate(360deg)}}
.ws-on #fab{display:none!important}
.opt-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.opt-row .btn{min-height:46px;font-size:14.5px}
.opt-row .btn svg{width:18px;height:18px}
.btn.optimize{background:linear-gradient(135deg,#6d28d9,#0938d5);border:0;color:#fff;box-shadow:0 10px 24px -14px rgba(76,29,149,.8)}
.btn.optimize:hover{filter:brightness(1.08);background:linear-gradient(135deg,#6d28d9,#0938d5)}
.btn.coverb{background:#f4efff;border-color:#e2d6ff;color:#5b21b6}
.btn.coverb:hover{background:#ece3ff;border-color:#cdb8ff}
.mup{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;color:var(--ok);background:var(--ok-soft);border-radius:999px;padding:2px 9px;margin-left:8px;vertical-align:middle;animation:wsIn .4s ease}
.ring circle:last-child{transition:stroke-dashoffset .8s cubic-bezier(.3,.9,.3,1)}
@media (max-width:900px){
  .drawer.wide{grid-template-columns:1fr}
  #ws{position:absolute;inset:0;grid-column:1;z-index:5;border-left:0}
  .ws-bar .back{display:inline-flex;align-items:center;gap:4px;border:0;background:none;font-weight:600;color:var(--blue);font-size:14px;padding:6px 4px}
  .ws-bar .x,.ws-bar a{display:none}
}
.dr-top{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dr-top .x{width:42px;height:42px;border:0;background:none;border-radius:10px;display:grid;place-items:center;color:var(--body)}
.dr-top .x:hover{background:var(--bg)}
.dr-top .x svg{width:20px;height:20px}
.dr-top span{font-weight:600;color:var(--ink);flex:1}
.dr-body{overflow-y:auto;flex:1;padding:22px 24px 40px}
.jd-head{display:flex;gap:16px;align-items:flex-start}
.jd-head .logo{width:56px;height:56px;font-size:22px;border-radius:13px}
.jd-head h2{font-family:Poppins;font-weight:700;color:var(--ink);font-size:21px;line-height:1.25;letter-spacing:-.01em}
.jd-head .co{font-weight:600;color:var(--body);margin-top:2px}
.jd-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 20px;margin-top:18px;font-size:13.5px}
.jd-grid div{display:flex;gap:8px;align-items:flex-start;min-width:0}
.jd-grid svg{width:16px;height:16px;flex:none;margin-top:2px;color:var(--muted)}
.jd-acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.card{border:1px solid var(--line);border-radius:16px;background:#fff;padding:20px}
.match{margin-top:22px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.ring{position:relative;width:104px;height:104px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;font-family:Poppins;font-weight:800;font-size:26px;color:var(--ink)}
.match .txt{flex:1;min-width:220px}
.match h3{font-family:Poppins;font-size:16.5px;color:var(--ink)}
.match p{font-size:13.5px;margin-top:4px}
.brk{margin-top:14px;display:grid;gap:8px;width:100%}
.brk .r{display:grid;grid-template-columns:130px 1fr 44px;gap:10px;align-items:center;font-size:13px}
.brk .tr{display:block;height:6px;border-radius:9px;background:#eef0f7;overflow:hidden}
.brk .fi{display:block;height:100%;border-radius:9px}
.skills{margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:16px;width:100%}
.skills h4{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;font-weight:500;padding:5px 10px;border-radius:7px}
.chip.h{background:var(--ok-soft);color:#065f3c}
.chip.m{background:var(--bad-soft);color:#9f1239}
.chip.n{background:var(--bg);color:var(--body);border:1px solid var(--line)}
.upsell{margin-top:16px;border-radius:16px;padding:20px;background:linear-gradient(135deg,#0a31bd,#0938d5);color:#fff;
  display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.upsell .tx{flex:1;min-width:220px}
.upsell b{font-family:Poppins;font-size:16px;display:block}
.upsell p{font-size:13.5px;color:rgba(255,255,255,.85);margin-top:4px}
.upsell .btn{background:#fff;color:var(--blue);border-color:#fff}
.desc{margin-top:26px;color:#33395a;font-size:14.5px;line-height:1.7}
.desc h3{font-family:Poppins;color:var(--ink);font-size:16px;margin-bottom:6px}
.desc h4{color:var(--ink);font-size:14.5px;margin:18px 0 6px}
.desc p{margin:0 0 10px}
.desc ul{margin:0 0 12px 20px}
.desc li{margin-bottom:5px}

/* ---------- dashboard ---------- */
.hello{font-family:Poppins;font-weight:700;color:var(--ink);font-size:22px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:14px;margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:20px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}
.stat .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue)}
.stat .ic svg{width:19px;height:19px}
.stat .n{font-family:Poppins;font-weight:800;font-size:28px;color:var(--ink);margin-top:10px;line-height:1}
.stat .l{font-size:13px;margin-top:4px}
.sec{margin-top:26px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.sec-h h2{font-family:Poppins;font-weight:600;color:var(--ink);font-size:17px}
.trk{display:flex;flex-direction:column;gap:8px}
.trow{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.trow .logo{width:38px;height:38px;font-size:15px;border-radius:9px}
.trow .i{flex:1;min-width:0}
.trow .i b{display:block;color:var(--ink);font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .i span{font-size:12.5px;color:var(--muted)}
.trow select{min-height:36px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:0 8px;font-size:13px}
.trow .rm{width:36px;height:36px;border:0;background:none;color:var(--muted);border-radius:8px;display:grid;place-items:center}
.trow .rm:hover{background:var(--bad-soft);color:var(--bad)}
.trow .rm svg{width:16px;height:16px}
.chart{display:flex;align-items:flex-end;gap:8px;height:120px;padding:10px 4px 0}
.chart .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.chart .bar{width:100%;max-width:34px;border-radius:6px 6px 2px 2px;background:var(--blue);min-height:2px}
.chart .b span{font-size:11px;color:var(--muted)}

/* ---------- resume ---------- */
.drop{border:2px dashed #cdd4ea;border-radius:16px;padding:36px 20px;text-align:center;background:#fbfcff;cursor:pointer}
.drop:hover,.drop.over{border-color:var(--blue);background:#f4f7ff}
.drop svg{width:34px;height:34px;color:var(--blue)}
.drop b{display:block;color:var(--ink);margin-top:10px;font-size:15px}
.drop span{font-size:13px;color:var(--muted)}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}
.kv div{background:var(--bg);border-radius:12px;padding:14px}
.kv b{display:block;font-family:Poppins;color:var(--ink);font-size:20px}
.kv span{font-size:12.5px;color:var(--muted)}
.toggle{display:flex;align-items:flex-start;gap:12px;cursor:pointer}
.toggle input{position:absolute;opacity:0;pointer-events:none}
.sw{width:42px;height:24px;border-radius:99px;background:#d6dbea;position:relative;flex:none;transition:.2s;margin-top:1px}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;
  transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle input:checked + .sw{background:var(--ok)}
.toggle input:checked + .sw::after{transform:translateX(18px)}
.toggle input:focus-visible + .sw{outline:2px solid var(--blue);outline-offset:2px}
.toggle b{display:block;color:var(--ink);font-size:14px}

function bindSwipe(el){
  if(!el) return;
  el.addEventListener('pointerdown', function(ev){
    if(ev.pointerType === 'mouse' && ev.button !== 0) return;
    if(ev.target.closest('a,button,select,input')) return;
    drag = {x:ev.clientX, y:ev.clientY, dx:0, id:ev.pointerId, moved:false};
  });
  el.addEventListener('pointermove', function(ev){
    if(!drag || ev.pointerId !== drag.id) return;
    var dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
    if(!drag.moved){
      if(Math.abs(dx) < 10) return;
      if(Math.abs(dy) > Math.abs(dx)){ drag = null; return; }
      drag.moved = true; el.classList.add('dragging');
      try{ el.setPointerCapture(ev.pointerId); }catch(_){}
    }
    drag.dx = dx;
    el.style.transform = 'translateX('+dx+'px) rotate('+(dx/22)+'deg)';
    el.querySelector('.stamp.st-pass').style.opacity = Math.min(1, Math.max(0, -dx/120));
    el.querySelector('.stamp.st-save').style.opacity = Math.min(1, Math.max(0, dx/120));
  });
  function end(ev, cancel){
    if(!drag || ev.pointerId !== drag.id) return;
    var dx = drag.dx, moved = drag.moved; drag = null;
    el.classList.remove('dragging');
    if(!moved) return;
    if(!cancel && dx > 120) return deckAct('save');
    if(!cancel && dx < -120) return deckAct('pass');
    resetCard(el);
  }
  el.addEventListener('pointerup', function(ev){ end(ev, false); });
  el.addEventListener('pointercancel', function(ev){ end(ev, true); });
}

function resumeProfile(rt){
  var lines = String(rt).split(/\n+/).map(function(l){ return l.replace(/\s+/g,' ').trim(); }).filter(Boolean);

    var tx = taxonomy(l);
    if(tx[0] !== 'Other'){ P.title = l.split(/\s[|•·]\s|\s[–—-]\s|,\s/)[0].replace(/\b(19|20)\d{2}\b.*$/,'').trim(); P.domain = tx[0]; P.sub = tx[1]; }
  }

    var m = RANGE_RX.exec(l); if(!m || P.experience.length >= 8) return;

    P.experience.push({title:r.title.slice(0, 90), company:r.company.slice(0, 90), dates:m[0].replace(/\s+/g, ' ').trim()});
  });
  // education: lines that name a degree
  P.education = [];
  B.education.forEach(function(l, i){
    if(!DEG_RX.test(l) || P.education.length >= 4) return;
    var y = RANGE_RX.exec(l) || /\b(19|20)\d{2}\b/.exec(l), dates = y ? y[0] : '';

    if(sp){ deg = sp[1]; school = sp[2]; }
    else { var nx = B.education[i + 1] || ''; if(nx && !DEG_RX.test(nx) && nx.length < 90) school = nx.replace(/\s*[–—-]\s*.*$/, '').trim(); if(!dates){ var y2 = /\b(19|20)\d{2}\b/.exec(nx); if(y2) dates = (RANGE_RX.exec(nx) || y2)[0]; } }
    P.education.push({degree:deg.slice(0, 90), school:school.slice(0, 90), dates:dates});
  });
  P.skills = skillsIn(text).sort(function(a, b){ return b.n - a.n; }).slice(0, 15).map(function(x){ return x.name; });
  // years of experience: earliest start to latest end across the roles (education years don't count)
  var now = new Date().getFullYear(), ys = [], ye = [];
  P.experience.forEach(function(x){ var y = (x.dates.match(/(19|20)\d{2}/g) || []).map(Number); if(y.length){ ys.push(y[0]); ye.push(/present|current|now|today|date/i.test(x.dates) ? now : y[y.length - 1]); } });

function textSig(t){ t = String(t || ''); var h = 0; for(var i = 0; i < t.length; i++) h = (h * 31 + t.charCodeAt(i)) | 0; return t.length + ':' + h; }
function saveQuiet(patch){

      return Object.keys(rest).length ? up(rest).then(function(r2){ return !r2.error; }) : false;

}

/* ---------- WhatsApp: asked once, with the number from their resume pre-filled; nothing is sent unless they say yes ---------- */
function phoneIn(text){
  var m = String(text||'').slice(0, 2500).match(/(\+?\d[\d ().-]{7,18}\d)/g) || [];
  for(var i = 0; i < m.length; i++){
    var d = m[i].replace(/[^\d+]/g, ''), n = d.replace(/\D/g, '');
    if(n.length < 10 || n.length > 13) continue;
    if(/^(19|20)\d{2}(19|20)\d{2}$/.test(n)) continue;   // a date range like 2019 2023
    return d.charAt(0) === '+' ? d : (n.length === 10 ? n : '+' + n);
  }
  return '';
}
function cleanPhone(v){
  var d = String(v||'').replace(/[^\d+]/g, ''), n = d.replace(/\D/g, '');
  if(n.length < 10 || n.length > 15) return '';
  return d.charAt(0) === '+' ? '+' + n : (n.length === 10 ? n : '+' + n);
}

function drawDemand(){

      var key = r.toLowerCase().replace(/\b(sr|senior|jr|junior)\b\.?/g, '').replace(/\s+/g, ' ').trim() + '|' + (PK_SPONSOR[pr.auth] ? 1 : 0);

    '<textarea id="adIn" rows="5" spellcheck="false" autocomplete="off" placeholder="https://job-boards.greenhouse.io/stripe/jobs/1234567&#10;https://jobs.lever.co/palantir/…&#10;https://jobs.ashbyhq.com/ramp&#10;https://www.linkedin.com/jobs/view/…"></textarea>'+
    '<p class="fine" style="margin-top:10px">Paste links and they’re read straight away — title, company, location, work mode, salary, description and logo. Greenhouse, Lever and Ashby always work; BambooHR, Workday, SmartRecruiters, Workable, Recruitee and most company career pages work once the <b>job-info</b> function is set up in Supabase. Anything we can’t read, you type in. A careers-board link with no job in it (like jobs.ashbyhq.com/ramp) adds every open role at that company and keeps them updated.</p>'+
    '<div class="jd-acts"><button class="btn pri" type="button" data-act="adcheck">'+I.search+'Check links</button></div></div>'+
    '<div id="adPrev" class="sec"></div>'+
    '<div class="card sec"><h3>Added by the team<span class="cnt" id="adCnt"></span></h3><div id="adList" class="alist"><div class="skel"></div></div></div></div>';
  drawAdminPrev();
  var pv = $('#adPrev');
  function sync(e){
    var el = e.target, i = +el.getAttribute('data-i'), k = el.getAttribute('data-k'); if(!k || !ADP[i]) return;
    var it = ADP[i];
    it[k] = el.type === 'checkbox' ? el.checked : el.value;
    if(k === 'on'){ var c = $('#adit'+i); if(c) c.classList.toggle('off', !el.checked); adSaveBtn(); }
    if(k === 'domain' || k === 'company'){
      if(k === 'domain'){ it.domainGuess = false; var g = el.parentNode.querySelector('.gss'); if(g) g.remove(); }
      clearTimeout(it._lt); it._lt = setTimeout(function(){ var lg = $('#adlogo'+i); if(lg) lg.innerHTML = logo(it.company || '?', '', cleanDomain(it.domain)); }, 250);   // logo updates as you type
    }
    // once the required details are there, tick "Add" for them
    if(it.kind === 'job' && k !== 'on' && !it.on && it.state !== 'bad' && it.state !== 'skip' && String(it.title||'').trim() && String(it.company||'').trim() && String(it.location||'').trim()){
      it.on = true; var cb = $('#adit'+i+' input[data-k=on]'); if(cb) cb.checked = true; var c2 = $('#adit'+i); if(c2) c2.classList.remove('off'); adSaveBtn();
    }
  }
  pv.addEventListener('input', sync); pv.addEventListener('change', sync);
  // paste links and they're checked straight away
  var ta0 = $('#adIn'), autoT;
  if(ta0) ta0.addEventListener('paste', function(){ clearTimeout(autoT); autoT = setTimeout(function(){ if(/https?:\/\//.test(ta0.value)) adminCheck(); }, 120); });
  if(ta0) ta0.addEventListener('input', function(){ clearTimeout(autoT); autoT = setTimeout(function(){ if(/https?:\/\/\S+\s*$/.test(ta0.value) && /\n\s*$|\s$/.test(ta0.value)) adminCheck(); }, 700); });
  adminList();

function teamErr(e){
  var m = JSON.stringify(e || '');
  if(/42P01|does not exist|PGRST20|schema cache/i.test(m)) return 'Supabase isn’t set up for team jobs yet — run supabase-team-jobs.sql once.';
  if(/42501|row-level security|permission/i.test(m)) return 'Your account isn’t on the team list (admins table in Supabase).';
  return 'Couldn’t save — check your connection and try again.';
}
function adminCheck(){
  var ta = $('#adIn'); if(!ta) return;
  var links = (ta.value.match(/https?:\/\/[^\s<>"'，、]+/gi) || []).map(function(l){ return l.replace(/[).,;]+$/,''); });
  var seen = {}; links = links.filter(function(l){ if(seen[l]) return false; seen[l] = 1; return true; }).slice(0, 30);
  if(!links.length){ toast('Paste at least one link that starts with https://'); ta.focus(); return; }
  ADP = links.map(function(l){ var it = parseLink(l); if(!it) return {raw:l, state:'bad', msg:'That isn’t a valid link'}; it.state = 'checking'; it.msg = 'Checking…'; return it; });
  drawAdminPrev();
  (TEAM.all ? Promise.resolve() : teamRows(true).then(function(r){ TEAM.all = r; }, function(){})).then(function(){
    ADP.forEach(function(it, i){
      if(it.state !== 'checking') return;
      resolveLink(it).then(function(){
        if(ADP[i] !== it) return;
        var c = $('#adit'+i); if(c) c.outerHTML = adItem(it, i);
        adSaveBtn();
      });
    });
  });
}
function adminSave(){
  var rows = [], missing = 0;
  ADP.forEach(function(it){
    if(!it.on) return;
    var title = String(it.title||'').trim(), company = String(it.company||'').trim(), loc = String(it.location||'').trim();
    if(it.kind === 'job' && (!title || !company)){ missing++; return; }
    if(it.kind === 'job' && !loc) loc = it.mode === 'Remote' ? 'Remote' : 'Location not listed';
    rows.push({kind:it.kind, url:it.url, src:it.src, board:it.board || null, ext_id:it.id || null,
      title:it.kind === 'job' ? title : null, company:company || slugName(it.board), location:it.kind === 'job' ? loc : null,
      work_mode:it.mode || null, salary:String(it.salary||'').trim() || null, domain:cleanDomain(it.domain) || null,
      description:String(it.description||'').trim() || null,
      sponsors:it.kind === 'job' ? (it.sponsors || null) : null,
      posted_at:new Date(it.posted || Date.now()).toISOString()});
  });
  if(missing){ toast('Add a job title and company for ' + missing + ' link' + (missing === 1 ? '' : 's')); return; }
  if(!rows.length){ toast('Tick at least one link to add'); return; }
  var b = $('#adSave'); if(b){ b.disabled = true; b.textContent = 'Adding…'; }
  var save = LIVE
    ? Promise.all(rows.map(function(r){
        var ins = function(row){ return sb.from('custom_jobs').insert(row); };
        return ins(r).then(function(x){ if(x.error && /sponsors/.test(x.error.message || '')){ var r2 = Object.assign({}, r); delete r2.sponsors; return ins(r2); } return x; })   // supabase-daily-picks.sql not run yet
          .then(function(x){ return x.error ? (x.error.code === '23505' ? 'dup' : x.error) : 'ok'; }, function(e){ return e; });
      }))
    : Promise.resolve(rows.map(function(r){
        var list = lsGet('tp_team_demo', []);
        if(list.some(function(x){ return x.url === r.url; })) return 'dup';
        list.unshift(Object.assign({id:'d' + Math.random().toString(36).slice(2, 10), active:true, created_at:new Date().toISOString(), added_by:state.user && state.user.email}, r));
        lsSet('tp_team_demo', list); return 'ok';
      }));
  save.then(function(res){
    var ok = res.filter(function(x){ return x === 'ok'; }).length, dup = res.filter(function(x){ return x === 'dup'; }).length;
    var err = res.filter(function(x){ return x !== 'ok' && x !== 'dup'; })[0];
    if(err && !ok){ toast(teamErr(err)); drawAdminPrev(); return; }
    toast((ok ? 'Added ' + ok + ' — live on the job board now' : 'Nothing new to add') + (dup ? ' · ' + dup + ' already there' : '') + (err ? ' · some failed, try them again' : ''));
    ADP = []; var ta = $('#adIn'); if(ta) ta.value = '';
    TEAM.all = null; drawAdminPrev(); refreshTeam();
  });
}
function refreshTeam(){
  return loadTeamJobs(true).then(function(){ mergeTeam(); adminList(); });
}
function adminList(){
  if(!$('#adList')) return;
  teamRows(true).then(function(rows){
    TEAM.all = rows;
    var b = $('#adList'); if(!b) return;
    $('#adCnt').textContent = rows.length ? ' · ' + rows.length : '';
    if(!rows.length){ b.innerHTML = '<p class="fine" style="margin-top:4px">Nothing added yet. Links you add show here, newest first.</p>'; return; }
    b.innerHTML = rows.map(function(r){
      var board = r.kind === 'board';
      var name = board ? (r.company || r.board) : (r.title || 'Job');
      var line = (board ? 'Whole careers board' : (r.company || '') + (r.location ? ' · ' + r.location : '')) + ' · added ' + fmtDate(r.created_at) + (r.added_by ? ' by ' + r.added_by : '');
      return '<div class="arow">'+logo(r.company || '?', '', r.domain)+'<div class="i"><b>'+esc(name)+'</b><span>'+esc(line)+'</span></div>'+
        '<a class="lk" href="'+esc(r.url)+'" target="_blank" rel="noopener">Open</a>'+
        '<button class="rm" type="button" data-adrm="'+esc(r.id)+'" aria-label="Remove '+esc(name)+' from the job board" title="Remove from the job board">'+I.trash+'</button></div>';
    }).join('');
  }).catch(function(e){ var b = $('#adList'); if(b) b.innerHTML = '<p class="fine" style="margin-top:4px">'+esc(teamErr(e))+'</p>'; });
}
function adminRemove(id, btn){
  if(!btn.getAttribute('data-sure')){
    btn.setAttribute('data-sure', '1'); btn.style.color = 'var(--bad)'; btn.style.background = 'var(--bad-soft)';
    toast('Tap the bin again to remove it');
    setTimeout(function(){ btn.removeAttribute('data-sure'); btn.style.color = ''; btn.style.background = ''; }, 3500);
    return;
  }
  btn.disabled = true;
  var del = LIVE ? sb.from('custom_jobs').delete().eq('id', id).then(function(r){ if(r.error) throw r.error; })
                 : Promise.resolve(lsSet('tp_team_demo', lsGet('tp_team_demo', []).filter(function(x){ return x.id !== id; })));
  del.then(function(){ toast('Removed from the job board'); return refreshTeam(); }, function(e){ btn.disabled = false; toast(teamErr(e)); });
}

/* ---------- first-visit tour: spotlight + card, skippable, keyboard friendly ---------- */
var TOUR = (function(){
  var css = '.tpt-block{position:fixed;inset:0;z-index:9998;background:transparent}'+
    '.tpt-spot{position:fixed;z-index:9999;border-radius:14px;box-shadow:0 0 0 9999px rgba(10,15,35,.58);pointer-events:none;transition:all .32s cubic-bezier(.3,.7,.3,1)}'+
    '.tpt-spot.none{left:50%!important;top:42%!important;width:0!important;height:0!important}'+
    '.tpt-spot:not(.none)::after{content:"";position:absolute;inset:-4px;border-radius:17px;border:2px solid #7c9bff;animation:tptp 1.8s ease-out infinite}'+
    '@keyframes tptp{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.06)}}'+
    '.tpt-card{position:fixed;z-index:10000;width:min(360px,calc(100vw - 32px));background:#fff;color:#4b5473;border-radius:16px;padding:20px 20px 16px;'+
      'box-shadow:0 24px 60px -18px rgba(10,15,35,.55);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:14.5px;line-height:1.55;'+
      'transition:top .32s cubic-bezier(.3,.7,.3,1),left .32s cubic-bezier(.3,.7,.3,1),opacity .2s;opacity:0}'+
    '.tpt-card.on{opacity:1}'+
    '.tpt-card .tpt-n{font-size:12px;font-weight:600;color:#0938d5;letter-spacing:.04em;text-transform:uppercase}'+
    '.tpt-card h3{font-family:Poppins,Inter,sans-serif;font-size:17px;color:#121a33;margin:4px 0 6px;line-height:1.3}'+
    '.tpt-card p{margin:0}'+
    '.tpt-dots{display:flex;gap:5px;margin:14px 0 0}'+
    '.tpt-dots i{width:6px;height:6px;border-radius:9px;background:#dfe3f0;transition:.25s}'+
    '.tpt-dots i.on{width:18px;background:#0938d5}'+
    '.tpt-row{display:flex;align-items:center;gap:8px;margin-top:14px}'+
    '.tpt-row .sp{flex:1}'+
    '.tpt-btn{font:inherit;font-size:14px;font-weight:600;border-radius:10px;min-height:40px;padding:0 16px;cursor:pointer;border:1px solid #e3e7f2;background:#fff;color:#121a33}'+
    '.tpt-btn.pri{background:#0938d5;border-color:#0938d5;color:#fff}'+
    '.tpt-btn.pri:hover{background:#072ca8}'+
    '.tpt-skip{font:inherit;font-size:13.5px;background:none;border:0;color:#737b9c;cursor:pointer;padding:8px 4px;min-height:40px}'+
    '.tpt-skip:hover{color:#121a33;text-decoration:underline}'+
    '.tpt-card.center{left:50%!important;top:50%!important;transform:translate(-50%,-50%)}'+
    '.tpt-card .tpt-hero{width:44px;height:44px;border-radius:12px;background:#eef2ff;color:#0938d5;display:grid;place-items:center;margin-bottom:10px}'+
    '.tpt-card .tpt-hero svg{width:24px;height:24px}'+
    '@media (prefers-reduced-motion:reduce){.tpt-spot,.tpt-card{transition:none}.tpt-spot::after{animation:none}}';
  var el = {}, steps = [], i = 0, opts = {}, waitT = null, alive = false;
  function q(sel){
    var list = [].concat(sel || []);
    for(var k = 0; k < list.length; k++){
      var all = document.querySelectorAll(list[k]);
      for(var m = 0; m < all.length; m++){ var r = all[m].getBoundingClientRect(); if(r.width > 0 && r.height > 0 && getComputedStyle(all[m]).visibility !== 'hidden') return all[m]; }
    }
    return null;
  }
  function mount(){
    if(!document.getElementById('tpt-css')){ var s = document.createElement('style'); s.id = 'tpt-css'; s.textContent = css; document.head.appendChild(s); }
    el.block = document.createElement('div'); el.block.className = 'tpt-block';
    el.spot = document.createElement('div'); el.spot.className = 'tpt-spot none';
    el.card = document.createElement('div'); el.card.className = 'tpt-card'; el.card.setAttribute('role', 'dialog'); el.card.setAttribute('aria-modal', 'true'); el.card.setAttribute('aria-labelledby', 'tpt-t');
    document.body.appendChild(el.block); document.body.appendChild(el.spot); document.body.appendChild(el.card);
    el.card.addEventListener('click', function(e){
      var b = e.target.closest('[data-t]'); if(!b) return;
      var a = b.getAttribute('data-t');
      if(a === 'next') go(i + 1); else if(a === 'back') go(i - 1); else end(a === 'done' ? 'done' : 'skip');
    });
    document.addEventListener('keydown', key, true);
    window.addEventListener('resize', place); window.addEventListener('scroll', place, true);
  }
  function key(e){
    if(!alive) return;
    if(e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); end('skip'); }
    else if(e.key === 'ArrowRight'){ e.preventDefault(); go(i + 1); }
    else if(e.key === 'ArrowLeft' && i > 0){ e.preventDefault(); go(i - 1); }
    else if(e.key === 'Tab'){ // keep focus inside the card
      var f = el.card.querySelectorAll('button'); if(!f.length) return;
      var first = f[0], last = f[f.length - 1];
      if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
      else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
    }
  }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function draw(target){
    var st = steps[i], n = steps.length, last = i === n - 1, first = i === 0;
    var dots = '<div class="tpt-dots" aria-hidden="true">' + steps.map(function(_, k){ return '<i class="' + (k === i ? 'on' : '') + '"></i>'; }).join('') + '</div>';
    el.card.innerHTML = (st.icon ? '<div class="tpt-hero">' + st.icon + '</div>' : '') +
      (first || last ? '' : '<div class="tpt-n">Step ' + i + ' of ' + (n - 2) + '</div>') +
      '<h3 id="tpt-t">' + esc(st.title) + '</h3><p>' + st.text + '</p>' + dots +
      '<div class="tpt-row">' +
        (last ? '' : '<button type="button" class="tpt-skip" data-t="skip">' + (first ? 'Skip tour' : 'Skip') + '</button>') +
        '<span class="sp"></span>' +
        (!first && !last ? '<button type="button" class="tpt-btn" data-t="back">Back</button>' : '') +
        '<button type="button" class="tpt-btn pri" data-t="' + (last ? 'done' : 'next') + '">' + esc(st.cta || (last ? 'Got it' : 'Next')) + '</button>' +
      '</div>';
    el.target = target;
    el.card.classList.toggle('center', !target);
    el.spot.classList.toggle('none', !target);
    place();
    requestAnimationFrame(function(){ el.card.classList.add('on'); var b = el.card.querySelector('.tpt-btn.pri'); if(b) b.focus({preventScroll:true}); });
  }
  function place(){
    if(!alive) return;
    var t = el.target, vw = window.innerWidth, vh = window.innerHeight;
    if(!t || !document.body.contains(t)){ el.card.style.left = ''; el.card.style.top = ''; return; }
    var r = t.getBoundingClientRect(), pad = 8;
    el.spot.style.left = (r.left - pad) + 'px'; el.spot.style.top = (r.top - pad) + 'px';
    el.spot.style.width = (r.width + pad*2) + 'px'; el.spot.style.height = (r.height + pad*2) + 'px';
    var cw = el.card.offsetWidth, ch = el.card.offsetHeight, gap = 16, x, y;
    if(vw < 640){   // phones: dock the card to whichever edge is away from the highlight
      x = 16; y = (r.top + r.height/2 > vh/2) ? Math.max(16, r.top - pad - gap - ch) : Math.min(vh - ch - 16, r.bottom + pad + gap);
      if(y < 16 || y + ch > vh - 16) y = (r.top > vh/2) ? 16 : vh - ch - 16;
    } else {
      var below = r.bottom + pad + gap, above = r.top - pad - gap - ch, right = r.right + pad + gap;
      if(below + ch <= vh - 12){ y = below; x = r.left + r.width/2 - cw/2; }
      else if(above >= 12){ y = above; x = r.left + r.width/2 - cw/2; }
      else if(right + cw <= vw - 12){ x = right; y = r.top + r.height/2 - ch/2; }
      else { x = r.left - pad - gap - cw; y = r.top + r.height/2 - ch/2; }
      x = Math.max(16, Math.min(x, vw - cw - 16)); y = Math.max(12, Math.min(y, vh - ch - 12));
    }
    el.card.style.left = x + 'px'; el.card.style.top = y + 'px';
  }
  function go(n){
    if(n < 0 || n >= steps.length) return;
    clearTimeout(waitT); i = n; el.card.classList.remove('on');
    var st = steps[i];
    if(st.before) try{ st.before(); }catch(e){}
    if(!st.sel){ draw(null); return; }
    var t0 = Date.now();
    (function look(){
      if(!alive || i !== n) return;
      var t = q(st.sel);
      if(t){
        var r = t.getBoundingClientRect();
        if(r.top < 70 || r.bottom > window.innerHeight - 90) t.scrollIntoView({block:'center'});
        setTimeout(function(){ if(alive && i === n) draw(t); }, 60);
      } else if(Date.now() - t0 < 2500) waitT = setTimeout(look, 120);
      else if(st.optional) go(n + (n >= i ? 1 : -1));   // not on this screen: move on
      else draw(null);
    })();
  }
  function end(how){
    if(!alive) return; alive = false; clearTimeout(waitT);
    document.removeEventListener('keydown', key, true);
    window.removeEventListener('resize', place); window.removeEventListener('scroll', place, true);
    [el.block, el.spot, el.card].forEach(function(x){ if(x && x.parentNode) x.parentNode.removeChild(x); });
    try{ localStorage.setItem(opts.key, JSON.stringify({at:Date.now(), how:how})); }catch(e){}
    if(opts.onEnd) opts.onEnd(how);
  }
  return {
    seen: function(k){ try{ return !!localStorage.getItem(k); }catch(e){ return true; } },
    running: function(){ return alive; },
    start: function(s, o){ if(alive) return; steps = s; opts = o || {}; alive = true; i = 0; mount(); go(0); },
    stop: function(){ end('skip'); }
  };
})();

  var rt = resumeText(), x = xrayInfo(), e = ENR[job.key];
  var m = rt && e && !e.failed ? match(job, e.text, rt, state.profile && state.profile.target_role) : null;
  var READY = CONFIG.ATS_READY, xs = x && !x.other ? x.score : null;
  var ready = rt && xs != null && xs >= READY && (!m || m.score == null || m.score >= 50);
  var row1 = '<div class="prer">'+preRing(m ? m.score : null, m ? scoreCol(m.score) : '', 'Match '+(m?m.score:'')+'%')+'<div class="pt"><b>Match to this role'+(m && m.score != null ? ' · '+m.score+'%' : '')+'</b><span>'+
    (!rt ? 'Add your resume to see how well you match.' : !e ? 'Reading the posting…' : !m || m.score == null ? 'Not enough detail in this posting to score.' :
     m.miss.length ? 'Not on your resume: ' + esc(m.miss.slice(0, 4).join(', ')) + (m.miss.length > 4 ? ' +' + (m.miss.length - 4) + ' more' : '') : 'Your resume covers the skills this posting asks for.')+'</span></div></div>';
  var row2 = '<div class="prer">'+preRing(xs, xs == null ? '' : xs >= READY ? '#0a7f46' : xs >= 55 ? '#b45309' : '#be123c', 'X-ray '+xs)+'<div class="pt"><b>Resume X-ray (ATS check)'+(xs != null ? ' · '+xs+'/100' : '')+'</b><span>'+
    (xs != null ? 'Checked ' + ago(x.at) + (xs >= READY ? ' — hiring software can read it cleanly.' : ' — there are fixes that could stop it coming through clearly.') :
     x && x.other ? 'Your last check was on a different file. Check the one you’re sending.' : 'Not checked yet. See what hiring software pulls out of your resume.')+'</span></div></div>';
  var verdict = !rt ? ['warn', 'Most companies run applications through hiring software first. Add your resume and check it — it’s free and takes under a minute.']
    : ready ? ['ok', 'Looks good — your resume reads cleanly. Go ahead and apply.']
    : ['warn', 'Most companies screen applications with hiring software first. If it can’t read your resume, or the key skills are missing, you can be passed over before a person sees it — and you rarely get a second try. Check first: free, under a minute.'];
  var co = esc(job.company);
  modal('<div class="pre"><h2>Before you apply to '+co+'</h2><p>'+esc(job.title)+'</p>'+
    '<div class="prerows">'+row1+row2+'</div>'+
    '<div class="prev '+verdict[0]+'">'+(verdict[0] === 'ok' ? I.check : I.warn)+'<span>'+verdict[1]+'</span></div>'+
    '<div class="stack">'+
      (!rt ? '<button class="btn pri" type="button" data-act="preupload">'+I.up+'Add my resume — free check</button><button class="btn" type="button" data-act="prego">'+I.ext+'Apply anyway</button>'
       : ready ? '<button class="btn pri" type="button" data-act="prego">'+I.ext+'Apply on '+co+'</button><button class="btn" type="button" data-act="precheck">Check it against this job first</button>'
       : '<button class="btn pri" type="button" data-act="precheck">Check my resume for this job — free</button><button class="btn" type="button" data-act="prego">'+I.ext+'Apply anyway</button>')+
    '</div>'+
    '<div class="human"><div class="hu-h"><span>Prefer a human?</span></div><div class="hu-g">'+
      '<a class="hu call" href="'+esc(bookUrl('before_apply'))+'" target="_blank" rel="noopener"><span class="hu-ic">'+I.phone+'</span><span class="hu-t"><b>Talk to a recruiter</b><small>Free 15-minute call — they’ll review your resume before you send it.</small></span><span class="hu-go">Book a call →</span></a>'+
      '<a class="hu done4u" href="#" data-act="upsell"><span class="hu-ic">'+I.send+'</span><span class="hu-t"><b>Let us apply for you</b><small>A recruiter tailors your resume and applies to 25–30 matched roles every business day.</small></span><span class="hu-go">See how it works →</span></a>'+
    '</div></div></div>');
  if(rt && !e) getEnr(job).then(function(){ if(APPLYING && APPLYING.job === job && $('#modalRoot .pre')) preApply(job, go); });
}
function preCheck(){
  if(!APPLYING) return;
  var job = APPLYING.job, e = ENR[job.key];
  lsSet('tp_ats_job', {key:job.key, title:job.title, company:job.company, text:e && !e.failed ? String(e.text).slice(0, 12000) : '', at:Date.now()});
  closeModal(); location.href = '/ats-check.html#mine';
}
function applyTo(key, after){
  var job = findJob(key); if(!job) return;
  var url = (DESC[key] && DESC[key].apply) || job.url;
  var go = function(){
    window.open(url, '_blank', 'noopener');
    var cur = state.tracked.filter(function(t){ return t.job_key === key; })[0];
    if(!cur || cur.status === 'saved') store.track(job, 'applied').then(function(){ toast('Marked as applied — update it from your dashboard'); });
    if(after) after();
  };
  if(state.user) return preApply(job, go);
  if(!CONFIG.REQUIRE_SIGNIN_TO_APPLY) return go();
  pendingSkip = null; ssSet('tp_intent', {act:'apply', key:key});
  requireSignIn('Sign in to apply and track this role', go);
}

/* =====================================================================
   boot
   ===================================================================== */
(function(){   // ?next=/ats-check.html — where to go once signed in
  var m = /[?&]next=([^&#]+)/.exec(location.search);
  if(m){ var n = decodeURIComponent(m[1]); if(/^\/(ats-check\.html|app\.html|editor\.html)(#[A-Za-z0-9_-]*)?$/.test(n)) ssSet('tp_next', n);
    history.replaceState(null, '', location.pathname + location.search.replace(/([?&])next=[^&#]*&?/, '$1').replace(/[?&]$/, '') + location.hash); }
})();
(function(){
  var m = /[?&]ref=([^&#]+)/.exec(location.search);
  if(m){ ssSet('tp_ref', decodeURIComponent(m[1])); history.replaceState(null, '', location.pathname + location.hash); }
})();
// trulyplaced.com/app.html#signin — the "Sign in" button on the main site
(function(){   // ?to=<hash>: arriving from an "open in Chrome" hand-off — restore the page they were on
  var m = /[?&]to=([^&#]+)/.exec(location.search);
  if(m){ var h = decodeURIComponent(m[1]); if(/^#?[A-Za-z0-9_=:%.\-]+$/.test(h)) history.replaceState(null, '', location.pathname + (h.charAt(0) === '#' ? h : '#' + h)); }
})();
function storedSession(){
  try{
    for(var i = 0; i < localStorage.length; i++){
      var k = localStorage.key(i);
      if(/^sb-.*-auth-token$/.test(k)){ var t = JSON.parse(localStorage.getItem(k) || 'null'); if(t && t.user && (t.refresh_token || t.access_token)) return t; }
    }
  }catch(e){}
  return null;
}
if(LIVE && !cameFromOAuth){
  var SS0 = storedSession();
  if(!SS0) state.ready = true;   // nobody signed in on this browser: show the sign-in card straight away
  else {
    var A0 = lsGet('tp_acct', null), U0 = SS0.user, M0 = U0.user_metadata || {};
    if(A0 && A0.id === U0.id && A0.user){   // returning member: open their app from the copy on this device, then refresh it
      state.user = A0.user; state.profile = A0.profile || {}; state.tracked = A0.tracked || []; state.isAdmin = !!A0.isAdmin;
    } else {                                // signed in, but no saved copy yet: open with what the sign-in itself knows
      state.user = {id:U0.id, email:U0.email, name:M0.full_name || M0.name || (U0.email || '').split('@')[0], avatar:M0.avatar_url || M0.picture || '', created:Date.parse(U0.created_at) || Date.now()};
      state.profile = {onboarded:true}; state.tracked = [];
    }
    state.ready = true;
  }
}
if(SIGNING){
  var to0 = ssGet('tp_after', null);
  if(!to0 || to0 === '#dashboard' || to0 === '#signin') to0 = '#jobs';
  try{ history.replaceState(null, '', location.pathname + location.search + to0); }catch(e){}
  state.ready = true;
  setTimeout(function(){ if(SIGNING) toast('Signing you in…'); }, 400);
}
var wantSignIn = location.hash === '#signin';
if(wantSignIn) history.replaceState(null, '', location.pathname + location.search + '#jobs');
render();
var INIT = store.init();
setTimeout(function(){
  if(state.ready && !SIGNING) return;
  SIGNING = false; state.ready = true; lastView = null; render();
  if(!state.user) toast('Sign-in is taking longer than usual — you can keep browsing');
}, 7000);
INIT.then(function(){
  state.ready = true; adoptAtsResume(); freshDetails(); render();
  if(state.user && !LIVE){ if(!goNext()) maybeTour(); }
  if(state.user) warmReaders();
  // #signin: the sign-in screen is already showing — no pop-up on top of it
});
loadJobs().then(function(){ updateGate(); if(state.user && route.name === 'jobs'){ drawList(); } if(route.job){ drawerKey = null; openJob(route.job); } });

})();
</script>
