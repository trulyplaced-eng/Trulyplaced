<script>
// The free job board that lived here was retired on 31 Oct 2026 (its code is in git before that day). Everyone signs in
// at login.html, which sends each person where they belong: clients to their workspace, the team to the team portal.
// Old links keep working: the query (?next= from the free tools, ?code= from a Google return) and a sign-in hash are
// passed on; a page hash like #jobs is dropped.
var APP_VERSION = '2026-10-31.1';   // also in /version.txt
(function(){
  var h = /access_token|refresh_token|error/.test(location.hash) ? location.hash : '';
  location.replace('/login.html' + location.search + h);
})();
</script>
